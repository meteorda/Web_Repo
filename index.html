    const toolsGrid = document.getElementById('toolsGrid');
    const searchInput = document.getElementById('searchInput');
    const categoryPills = document.getElementById('categoryPills');
    const emptyState = document.getElementById('emptyState');
    let currentCategory = 'all';

    function renderTools(tools) {
      // Remove all cards except emptyState
      const cards = toolsGrid.querySelectorAll('.tool-card');
      cards.forEach(c => c.remove());

      if (tools.length === 0) {
        emptyState.style.display = 'block';
        return;
      } else {
        emptyState.style.display = 'none';
      }

      tools.forEach(tool => {
        const isDoc = tool.file_name.endsWith('.md') || tool.title.includes('手冊') || tool.title.includes('報告');
        const launchLabel = isDoc ? '閱讀手冊/報告 ↗' : '啟動工具 ↗';
        const card = document.createElement('div');
        card.className = 'tool-card';
        card.setAttribute('data-category', tool.category);
        card.innerHTML = `
          <div class="card-top">
            <div class="card-header">
              <div class="card-icon">${tool.icon || '🔧'}</div>
              <span class="badge">${tool.category}</span>
            </div>
            <div class="card-title">${tool.title}</div>
            <div class="card-desc">${tool.desc || tool.path}</div>
          </div>
          <div class="card-actions">
            <a href="${tool.url}" target="_blank" class="btn-launch">
              ${launchLabel}
            </a>
          </div>
        `;
        toolsGrid.appendChild(card);
      });
    }

    function filterTools() {
      const query = searchInput.value.trim().toLowerCase();
      const filtered = toolsData.filter(tool => {
        const matchCategory = (currentCategory === 'all' || tool.category === currentCategory);
        const matchQuery = !query || 
          tool.title.toLowerCase().includes(query) || 
          tool.path.toLowerCase().includes(query) ||
          tool.category.toLowerCase().includes(query);
        return matchCategory && matchQuery;
      });
      renderTools(filtered);
    }

    // Event Listeners
    searchInput.addEventListener('input', filterTools);

    categoryPills.addEventListener('click', (e) => {
      const btn = e.target.closest('.pill-btn');
      if (!btn) return;
      categoryPills.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCategory = btn.getAttribute('data-cat');
      filterTools();
    });

    // Initial render
    renderTools(toolsData);
  </script>
