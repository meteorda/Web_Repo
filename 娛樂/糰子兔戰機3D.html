<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>糰子兔戰機 3D：雷光突擊</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#141627;font-family:"Fredoka","Zen Maru Gothic","Noto Sans TC","Microsoft JhengHei",sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#2b2f55,#141627 70%)}
#stage{position:relative;line-height:0;border-radius:20px;overflow:hidden;box-shadow:0 14px 50px rgba(0,0,0,.6),0 0 0 4px #2f3566}
canvas{display:block;touch-action:none;cursor:none}
#cv{position:absolute;left:0;top:0;cursor:none}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;line-height:1.5;text-align:center;padding:20px;background:rgba(6,8,24,.62);backdrop-filter:blur(3px)}
.ov.on{display:flex}
#ovMenu{background:none;backdrop-filter:none;padding:0;justify-content:flex-end}
#ovMenu>svg{position:absolute;inset:0;width:100%;height:100%}
.menuBox{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 14px 16px;background:linear-gradient(rgba(10,14,40,0),rgba(10,14,40,.82) 34%)}
.menuBox .tips{border:0;background:rgba(255,255,255,.1);font-size:clamp(11px,2.6vmin,14px);text-align:center}
h1{font-size:clamp(28px,7.5vmin,46px);font-weight:900;color:#ffd23f;text-shadow:0 3px 0 #b3541e,0 0 24px rgba(64,224,255,.6);letter-spacing:2px;line-height:1.2}
h1 small{display:block;font-size:.5em;color:#5fe6ff;text-shadow:0 2px 0 #14507a;letter-spacing:6px}
h2{font-size:clamp(22px,6vmin,34px);font-weight:900;color:#5fe6ff;text-shadow:0 3px 0 #14507a}
.sub{font-size:clamp(13px,3.2vmin,17px);font-weight:700;color:#c9d2ff}
.tips{font-size:clamp(12px,2.9vmin,15px);background:rgba(255,255,255,.08);border-radius:14px;padding:12px 16px;border:2px solid #3d4690;max-width:94%;font-weight:700;text-align:left}
.tips b{color:#ffd23f}
.btn{font:inherit;font-weight:900;font-size:clamp(17px,4.4vmin,24px);color:#3a2300;background:linear-gradient(#ffe36e,#ffb52e);border:3px solid #fff;border-radius:14px;padding:10px 34px;cursor:pointer;box-shadow:0 6px 0 #b3541e,0 10px 20px rgba(0,0,0,.4);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b3541e}
.btn.alt{color:#fff;background:linear-gradient(#6c79d9,#4a55b0);box-shadow:0 6px 0 #2f3777,0 10px 20px rgba(0,0,0,.4)}
.big{font-size:clamp(30px,9vmin,54px);font-weight:900;color:#ffd23f;text-shadow:0 3px 0 #b3541e}
#hudBtns{position:absolute;left:8px;top:8px;display:none;gap:6px;line-height:1}
#hudBtns.on{display:flex}
.rb{font:inherit;font-weight:900;border:2px solid #fff;border-radius:10px;width:36px;height:36px;font-size:15px;cursor:pointer;color:#fff;background:#3f6fe0;box-shadow:0 3px 0 #23408f}
#cards{display:flex;flex-direction:column;gap:10px;width:min(92%,360px)}
.card{font:inherit;color:#fff;display:flex;align-items:center;gap:12px;text-align:left;background:linear-gradient(#39428c,#262c63);border:3px solid #6f7be0;border-radius:16px;padding:10px 14px;cursor:pointer;box-shadow:0 5px 0 #171b40;line-height:1.35;transition:transform .08s,border-color .1s}
.card:hover{border-color:#ffd23f;transform:translateY(-2px)}
.card .ic{font-size:34px;width:48px;text-align:center;flex:none}
.card .nm{font-weight:900;font-size:17px;color:#ffd23f}
.card .lv{font-size:12px;font-weight:700;color:#5fe6ff;margin-left:6px}
.card .ds{font-size:13px;font-weight:700;color:#c9d2ff}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas><canvas id="cv"></canvas>
  <div id="hudBtns">
    <button class="rb" id="btnPause" title="暫停 (P)">Ⅱ</button>
    <button class="rb" id="btnMute" title="音效">♪</button>
  </div>
  <div class="ov on" id="ovMenu">

const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0],clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* ---------- 音效（合成：射擊／爆炸／雷射／雷擊 + 背景節奏） ---------- */
let ac=null,muted=false,master=null,noiseBuf=null,bgmT=0,bgmStep=0;const lastS={};
function initAudio(){try{
  if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();
    const comp=ac.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=8;comp.attack.value=.003;comp.release.value=.2;
    master=ac.createGain();master.gain.value=.9;master.connect(comp);comp.connect(ac.destination);
    noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    bgmInit();setInterval(bgmTick,60);}
  if(ac.state==='suspended')ac.resume();}catch(e){ac=null;}}
function tone(f,d,type,v,slide,t0){
  if(muted||!ac)return;
  try{const t=t0||ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02);}catch(e){}
}
function noise(d,v,f0,f1,type,t0){
  if(muted||!ac)return;
  try{const t=t0||ac.currentTime,s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();
    s.buffer=noiseBuf;s.loop=true;fl.type=type||'lowpass';fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(master);s.start(t,Math.random()*.5);s.stop(t+d+.02);}catch(e){}
}
function lim(k,ms){const n=performance.now();if(n-(lastS[k]||0)<ms)return true;lastS[k]=n;return false;}
const S={
  shoot:()=>{if(lim('shoot',55))return;tone(940+Math.random()*220,.07,'square',.03,-640);noise(.035,.035,7000,2500,'highpass');},
  pop:()=>{if(lim('pop',45))return;noise(.3,.34,2000,140);tone(170,.24,'sine',.32,-120);},
  big:()=>{noise(1.3,.6,1400,50);tone(120,1,'sine',.6,-90);tone(60,1.2,'triangle',.45,-25);
    for(let i=1;i<6;i++){const t=ac?ac.currentTime+i*.14:0;noise(.4,.3,1600,120,'lowpass',t);tone(150,.3,'sine',.28,-100,t);}},
  hurt:()=>{tone(230,.3,'sawtooth',.14,-160);noise(.16,.16,900,200);},
  gem:()=>{if(lim('gem',50))return;tone(1320,.05,'sine',.035,500);},
  item:()=>{tone(660,.09,'sine',.1);tone(990,.16,'sine',.1,0,ac?ac.currentTime+.08:0);},
  laser:()=>{tone(220,1,'sawtooth',.1,1200);tone(440,1,'square',.04,1700);noise(1,.08,2500,7000,'bandpass');},
  zap:()=>{if(lim('zap',60))return;noise(.2,.16,5200,1400,'bandpass');tone(1900,.1,'square',.045,-1600);tone(90,.16,'sine',.16,-40);},
  boom:()=>{if(lim('boom',50))return;noise(.38,.32,1500,110);tone(125,.32,'sine',.3,-85);},
  shield:()=>{tone(900,.28,'sine',.1,-620);noise(.2,.08,4000,1000,'bandpass');},
  boss:()=>{for(let i=0;i<3;i++){const t=ac?ac.currentTime+i*.36:0;tone(150,.3,'sawtooth',.13,-50,t);tone(300,.3,'square',.05,-100,t);}},
  lvl:()=>[523,659,784,1047,1319].forEach((f,i)=>{const t=ac?ac.currentTime+i*.08:0;tone(f,.2,'triangle',.11,0,t);tone(f*2,.15,'sine',.04,0,t);})
};
// ---------- 背景音樂：管弦 × 電子混合編曲（150 BPM，32 小節循環，即時合成） ----------
let mBus=null,mRev=null,mDly=null;
function bgmInit(){
  mBus=ac.createGain();mBus.gain.value=.45;mBus.connect(master);
  const cv=ac.createConvolver(),len=Math.floor(ac.sampleRate*2.6),ir=ac.createBuffer(2,len,ac.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}
  cv.buffer=ir;mRev=ac.createGain();mRev.gain.value=.9;mRev.connect(cv);cv.connect(mBus);
  const dl=ac.createDelay(1),fb=ac.createGain(),lp=ac.createBiquadFilter();dl.delayTime.value=.3;fb.gain.value=.36;lp.type='lowpass';lp.frequency.value=3200;
  mDly=ac.createGain();mDly.gain.value=1;mDly.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(mBus);
}
const mf=m=>440*Math.pow(2,(m-69)/12);
function voice(type,m,t,d,v,o){o=o||{};
  const g=ac.createGain(),a=o.a||.006,rel=o.rel||.09,n=o.n||1;let out=g;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.linearRampToValueAtTime(v*(o.s==null?.7:o.s),t+Math.max(a+.01,d));g.gain.linearRampToValueAtTime(0,t+d+rel);
  if(o.c0){const f=ac.createBiquadFilter();f.type='lowpass';f.Q.value=o.q||1;f.frequency.setValueAtTime(o.c0,t);f.frequency.linearRampToValueAtTime(o.c1||o.c0,t+(o.ct||d));g.connect(f);out=f;}
  out.connect(mBus);if(o.rev){const r=ac.createGain();r.gain.value=o.rev;out.connect(r);r.connect(mRev);}if(o.dly){const r=ac.createGain();r.gain.value=o.dly;out.connect(r);r.connect(mDly);}
  for(let i=0;i<n;i++){const os=ac.createOscillator();os.type=type;os.frequency.value=mf(m);os.detune.value=n>1?(i-(n-1)/2)*(o.det||14):0;
    if(o.vib){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=5.6;lg.gain.value=o.vib;l.connect(lg);lg.connect(os.detune);l.start(t);l.stop(t+d+rel+.05);}
    os.connect(g);os.start(t);os.stop(t+d+rel+.05);}
}
function mNoise(t,d,v,f0,f1,type,rev){const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();s.buffer=noiseBuf;s.loop=true;fl.type=type;fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(mBus);if(rev){const r=ac.createGain();r.gain.value=rev;g.connect(r);r.connect(mRev);}s.start(t,Math.random()*.5);s.stop(t+d+.02);}

function bgmStepAt(step,t){

  if(last&&si===1&&q>=8)mSnare(t,.14+(q-8)*.035);                    // B 段尾：小鼓滾奏
  if(last&&si!==1&&q>=12)mTom(t,.4,[190,160,130,105][q-12]);          // 過門
  if(q===0&&bar===0){mNoise(t,1.8,lv>=3?.3:.18,9000,3500,'highpass',.6);} // 銅鈸

  if(lv>0?q%2===0:q%4===0)voice('sawtooth',c[0]-(q%8===6&&lv>=2?-12:0),t,lv>0?st*1.7:st*3.5,.22,{c0:900,c1:260,q:3,s:.6});
  if(q%4===0)voice('sine',c[0]-12,t,st*3.4,.26,{s:.8});

  // 旋律
  if(q===0)for(const [o,m,l] of MEL[si][bar]){const tt=t+o*st,d=l*st*.92;

    else if(si===2){voice('sawtooth',m-12,tt,d,.07,{n:5,det:11,a:.012,c0:5200,s:.8,rev:.5,dly:.35,vib:5});voice('sawtooth',m-24,tt,d,.05,{n:2,det:8,a:.03,c0:900,c1:2800,ct:.1,s:.7,rev:.4});
      voice('sine',m+12,tt,Math.min(d,.25),.03,{s:.1,rev:.6,dly:.3});}
    else{voice('sine',m,tt,.5,.07,{s:.05,rel:.5,rev:.8,dly:.5});voice('sine',m+12,tt,.3,.02,{s:.05,rel:.4,rev:.8});}}
  // 副歌銅管重音
  if(si===2&&(q===0||q===6||q===12))for(let i=1;i<4;i++)voice('sawtooth',c[i],t,st*1.6,.045,{n:2,det:9,a:.015,c0:600,c1:2600,ct:.08,s:.5,rev:.4});
}

function buildWave(){
  const q=[];
  if(wv===15){q.push({t:1.2,type:'boss'});for(let i=0;i<8;i++)q.push({t:6+i*2.2,type:i%2?'bat':'drone'});return q;}
  if(wv===8){q.push({t:1,type:'elite'});for(let i=0;i<10;i++)q.push({t:2+i*.9,type:i%2?'bat':'drone'});return q;}
  const pool=['drone','drone','drone','bat','bat'];
  if(wv>=3||stage>1)pool.push('crab');
  if(wv>=6||stage>1)pool.push('mech');
  if(wv>=11)pool.push('crab','mech');
  const count=9+wv+stage*2,gap=Math.max(.3,.85-wv*.025-stage*.03);let t=.4;
  for(let i=0;i<count;i++){
    const type=pick(pool);
    if(type==='bat'&&Math.random()<.45){const x=rnd(80,W-80);for(let k=0;k<4;k++)q.push({t:t+k*.2,type:'bat',x});t+=.5;}
    else if(type==='drone'&&Math.random()<.4){const x0=rnd(70,W-70-240);for(let k=0;k<4;k++)q.push({t:t+k*.05,type:'drone',x:x0+k*80});t+=.6;}
    else q.push({t,type});
    t+=gap*rnd(.6,1.4);
  }
  return q;
}

function update(dt){
  time+=dt;scrollY=(scrollY+110*dt)%80;if(comboT>0){comboT-=dt;if(comboT<=0)combo=0;}if(comboPop>0)comboPop-=dt*4;
  for(const d of deco){d.y+=110*dt;if(d.y>H+90)Object.assign(d,mkDeco(-90));}
  if(state!=='play')return;

  // 玩家

  const ox=p.x;
  if(kx||ky){const l=Math.hypot(kx,ky);p.x+=kx/l*400*dt;p.y+=ky/l*400*dt;target.x=p.x;target.y=p.y;}
  else{const k=Math.min(1,dt*16);p.x+=(target.x-p.x)*k;p.y+=(target.y-p.y)*k;}
  p.x=clamp(p.x,46,W-46);p.y=clamp(p.y,110,H-60);
  p.tilt+=(clamp((p.x-ox)/Math.max(dt,.001)*.0012,-.4,.4)-p.tilt)*Math.min(1,dt*10);
  if(p.inv>0)p.inv-=dt;
  p.cd-=dt;if(p.cd<=0){fire();p.cd=.17*Math.pow(.86,lv('rate'))/lv('gun')*rnd(.6,1.4);}
  // 護盾
  if(lv('shield')&&!p.shOn){p.shT+=dt;if(p.shT>=11-lv('shield')*1.8){p.shOn=true;S.shield();}}
  // 雷射
  const L=lv('laser');
  if(L){
    if(p.laserOn>0){p.laserOn-=dt;
      const n=LASER.n[L],w=LASER.w[L],dps=520*(1+.3*L)*dt,oy=p.y-24;
      for(let i=0;i<n;i++){const a=(i-(n-1)/2)*.3,dx=Math.sin(a),dy=-Math.cos(a);
        for(const e of enemies){if(e.dead)continue;const rx=e.x-p.x,ry=e.y-oy,al=rx*dx+ry*dy;
          if(al>0&&Math.abs(rx*dy-ry*dx)<w/2+e.r){hitE(e,dps);if(Math.random()<.35)burst(e.x+rnd(-e.r,e.r)*.5,e.y+e.r*.6,1,['#40e0ff','#ff7ae0','#7a9cff'],1.6);}}}
      if(p.laserOn<=0)p.laserT=4.2;
    }else{p.laserT-=dt;if(p.laserT<=0&&enemies.length){p.laserOn=LASER.dur[L];S.laser();rings.push({k:'flash',x:p.x,y:p.y-44,t:0,life:.35,r:50,c:0x40c8ff},{x:p.x,y:p.y-36,t:0,life:.4,r:120,c:0x40e0ff});}}
  }
  // 雷雲
  const T=lv('storm');
  if(T){p.stormT-=dt;if(p.stormT<=0&&enemies.length){p.stormT=3.2;
    const rows=2+Math.ceil(T/2),per=Math.min(5,1+T);
    for(let r=0;r<rows;r++)for(let i=0;i<per;i++)puffs.push({x:clamp(p.x+(i-(per-1)/2)*74+rnd(-12,12),30,W-30),y:p.y-130-r*135+rnd(-14,14),t:-r*.13-rnd(0,.05),life:.65,r:50,dmg:150*(1+.3*T),hit:false,seed:rnd(0,9)});
    for(const d of[-1,1])rings.push({k:'bolt',x:p.x,y:p.y-30,dx:d*rnd(150,230),dy:-rnd(80,260),t:0,life:.3});}}
  for(const q of puffs){q.t+=dt;if(q.t>=0&&!q.hit){q.hit=true;S.zap();rings.push({k:'flash',x:q.x,y:q.y,t:0,life:.25,r:40,c:0x5a8cff});burst(q.x,q.y,6,['#7fc8ff','#8a7cff','#40e0ff'],1.2);
    for(const e of enemies)if(!e.dead&&Math.hypot(e.x-q.x,e.y-q.y)<q.r+e.r)hitE(e,q.dmg);}}
  // 飛劍
  const B=lv('blade');
  if(B){p.bladeT-=dt;if(p.bladeT<=0&&enemies.length){p.bladeT=1.1;
    for(let i=0;i<B;i++){const s=bladePos(i);bullets.push({k:'blade',x:s.x,y:s.y,vx:0,vy:-500,r:9,dmg:95*(1+.2*B),pierce:3,hit:new Set(),sp:560});}}}
  // 飛彈
  const M=lv('missile');
  if(M){p.misT-=dt;if(p.misT<=0&&enemies.length){p.misT=1.5;
    for(let i=0;i<M;i++){const a=-Math.PI/2+(i-(M-1)/2)*.7;bullets.push({k:'missile',x:p.x,y:p.y,vx:Math.cos(a)*260,vy:Math.sin(a)*260,r:7,dmg:150*(1+.25*M),sp:430});}}}

  // 波次
  if(queue.length){waveT+=dt;while(queue.length&&queue[0].t<=waveT){const q=queue.shift();spawn(q.type,q.x);}}
  else if(!enemies.length){waveDelay-=dt;if(waveDelay<=0){nextWave();waveDelay=1.4;}}
  if(banner){banner.t+=dt;if(banner.t>2.2)banner=null;}

  // 我方子彈
  for(const b of bullets){
    if(b.k!=='shot'){const e=nearest(b.x,b.y,b.hit);
      if(e){const a=Math.atan2(e.y-b.y,e.x-b.x),ca=Math.atan2(b.vy,b.vx);let da=a-ca;while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;
        const na=ca+clamp(da,-7*dt,7*dt);b.vx=Math.cos(na)*b.sp;b.vy=Math.sin(na)*b.sp;}
      if(Math.random()<.6)parts.push({x:b.x,y:b.y,vx:0,vy:60,r:b.k==='missile'?5:3.5,life:.3,t:0,c:b.k==='missile'?'#ffb060':'#8ff6ff'});}
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.y<-30||b.y>H+30||b.x<-30||b.x>W+30)b.dead=true;
  }
  // 敵人
  for(const e of enemies){
    e.t+=dt;e.life+=dt;if(e.flash>0)e.flash-=dt*6;if(e.accT>0)e.accT-=dt;
    const aim=()=>Math.atan2(p.y-e.y,p.x-e.x),bs=1+(stage-1)*.12;
    if(e.type==='drone'){e.y+=78*bs*dt;e.x=e.bx+Math.sin(e.t*2)*40;}
    else if(e.type==='bat'){e.y+=170*bs*dt;e.x=e.bx+Math.sin(e.t*3.6)*70;}
    else if(e.type==='crab'){e.y+=46*dt;e.cd-=dt;if(e.cd<=0&&e.y>30&&e.y<H*.7){e.cd=2.1;eShot(e.x,e.y+20,aim(),190*bs);}}
    else if(e.type==='mech'||e.type==='elite'){
      const el=e.type==='elite';
      if(el||e.life<14){e.y+=(e.ty-e.y)*Math.min(1,dt*2);e.x+=e.vx*dt;if(e.x<60||e.x>W-60)e.vx*=-1;
        e.cd-=dt;if(e.cd<=0&&e.y>60){
          if(el&&e.burst===0&&Math.random()<.5){const a=aim();for(let i=-3;i<=3;i++)eShot(e.x,e.y+20,a+i*.22,200*bs);e.cd=1.4;}
          else{eShot(e.x-e.r*.75,e.y+e.r*.5,Math.PI/2,230*bs);eShot(e.x+e.r*.75,e.y+e.r*.5,Math.PI/2,230*bs);
            e.burst++;if(e.burst>=3){e.burst=0;e.cd=el?1.3:2.4;}else e.cd=.22;}
        }}
      else e.y+=130*dt;
    }
    else if(e.type==='boss'){
      if(e.y<160)e.y+=70*dt;
      else{e.x=W/2+Math.sin(e.t*.7)*140;e.pt+=dt;e.cd-=dt;
        const rage=e.hp<e.max*.4?1.35:1;
        if(e.pt>5){e.pt=0;e.ph=(e.ph+1)%3;e.cd=.8;}
        if(e.cd<=0){
          if(e.ph===0){const n=14,o=rnd(0,TAU);for(let i=0;i<n;i++)eShot(e.x,e.y,o+i/n*TAU,150*rage);e.cd=1.2/rage;}
          else if(e.ph===1){const a=aim();for(let i=-2;i<=2;i++)eShot(e.x,e.y+30,a+i*.2,220*rage);e.cd=.9/rage;}
          else{e.spin+=.45;for(let i=0;i<3;i++)eShot(e.x,e.y,e.spin+i/3*TAU,175*rage);e.cd=.13/rage;}
        }}
    }
    if(e.y>H+70)e.gone=true;
    for(const b of bullets){
      if(b.dead||e.dead)continue;
      if(b.hit&&b.hit.has(e))continue;
      if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+b.r){
        if(b.k==='missile'){b.dead=true;S.boom();boom(b.x,b.y,22,false,0);
          for(const o of enemies)if(!o.dead&&Math.hypot(o.x-b.x,o.y-b.y)<55+o.r)hitE(o,b.dmg);}
        else if(b.k==='blade'){b.hit.add(e);hitE(e,b.dmg);if(--b.pierce<=0)b.dead=true;}
        else{b.dead=true;hitE(e,b.dmg);parts.push({x:b.x,y:b.y,vx:rnd(-160,160),vy:rnd(-60,160),r:5,life:.22,t:0,c:'#fff3a0',s:1});if(rings.length<170)rings.push({k:'flash',x:b.x,y:b.y,t:0,life:.1,r:10,c:0xffe070});}
      }
    }
    if(!e.dead&&Math.hypot(p.x-e.x,p.y-e.y)<e.r+p.r+4)hurt(eDmg()*1.6);
  }
  for(const b of ebul){b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x<-20||b.x>W+20||b.y<-20||b.y>H+20)b.dead=true;
    else if(Math.hypot(b.x-p.x,b.y-p.y)<b.r+p.r-3){b.dead=true;hurt(eDmg());}}
  // 能量 / 補給
  const mr=85+lv('magnet')*70;
  for(const g of gems){g.t+=dt;g.vx*=.94;g.vy=Math.min(g.vy+420*dt,150);g.x+=g.vx*dt;g.y+=g.vy*dt;
    const d=Math.hypot(g.x-p.x,g.y-p.y);
    if(d<mr||g.pull){g.pull=true;const k=Math.min(1,dt*10);g.x+=(p.x-g.x)*k;g.y+=(p.y-g.y)*k;}
    if(d<26){g.dead=true;S.gem();gainXp(1);}
    if(g.y>H+20)g.dead=true;}
  for(const it of items){it.t+=dt;it.y+=70*dt;
    if(Math.hypot(it.x-p.x,it.y-p.y)<38){it.dead=true;S.item();const h=Math.round(p.max*.25);p.hp=Math.min(p.max,p.hp+h);addText(p.x,p.y-44,'+'+h,'#5dff9b',20);burst(it.x,it.y,10,['#5dff9b','#fff']);}
    if(it.y>H+30)it.dead=true;}
  for(const q of parts){q.t+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.95;q.vy*=.95;}
  for(const t of texts){t.t+=dt;}
  for(const q of rings)q.t+=dt;rings=rings.filter(q=>q.t<q.life);
  bullets=bullets.filter(b=>!b.dead);enemies=enemies.filter(e=>!e.dead&&!e.gone);
  ebul=ebul.filter(b=>!b.dead);gems=gems.filter(g=>!g.dead);items=items.filter(i=>!i.dead);
  parts=parts.filter(q=>q.t<q.life);texts=texts.filter(t=>t.t<.8);puffs=puffs.filter(q=>q.t<q.life);
  if(boss&&(boss.dead||boss.gone))boss=null;
  if(shake>0)shake-=dt;if(flash>0)flash-=dt;
}

    ctx.save();ctx.translate(x0,y);ctx.rotate(Math.PI/4);const s=sp?9:cur?8:4.5;
    ctx.fillStyle='#0c1030';ctx.fillRect(-s-2,-s-2,s*2+4,s*2+4);
    ctx.fillStyle=sp?(done?'#8a2233':'#ff4a5a'):cur?'#fff':done?'#ffb52e':'#4a5490';ctx.fillRect(-s,-s,s*2,s*2);ctx.restore();
    if(sp)txt(i===15?'♛':'★',x0,y+1,11,'#fff');else if(cur)txt(i,x0,y+1,10,'#0c1030');}
  txt(stage+'-'+Math.max(wv,1),x0+2,yt-22,13,'#fff','#0c1030','left',4);
  if(boss){const bw=W-150,kk=clamp(boss.hp/boss.max,0,1);rr(75,56,bw,14,5,'rgba(8,12,34,.85)');
    ctx.save();ctx.shadowColor='#ff5a3c';ctx.shadowBlur=10;rr(77,58,Math.max(6,(bw-4)*kk),10,4,kk<.4?'#ff3d5a':'#ff8a3c');ctx.restore();
    txt(boss.type==='boss'?'章魚砲艦':'菁英機甲',W/2,80,12,'#fff','#0c1030','center',3);}
  if(banner){const a=banner.t<.3?banner.t/.3:banner.t>1.8?(2.2-banner.t)/.4:1;ctx.globalAlpha=clamp(a,0,1);{const bw=W*Math.min(1,banner.t/.25),g=ctx.createLinearGradient(W/2-bw/2,0,W/2+bw/2,0),c=banner.boss?'255,40,80':'60,200,255';g.addColorStop(0,'rgba('+c+',0)');g.addColorStop(.5,'rgba('+c+',.55)');g.addColorStop(1,'rgba('+c+',0)');
      ctx.fillStyle=g;ctx.fillRect(W/2-bw/2,H*.36-34,bw,68);ctx.fillStyle='rgba(255,255,255,.8)';ctx.fillRect(W/2-bw/2,H*.36-36,bw,2);ctx.fillRect(W/2-bw/2,H*.36+34,bw,2);}
    ctx.save();ctx.shadowColor=banner.boss?'#ff3030':'#40e0ff';ctx.shadowBlur=24;
    txt(banner.txt,W/2,H*.36,banner.boss?32:40,banner.boss?'#ff7a7a':'#ffffff','#0c1030','center',8);ctx.restore();ctx.globalAlpha=1;}
}

/* ---------- 主迴圈 ---------- */
let last=0;
function loop(ts){const dt=Math.min(.033,(ts-last)/1000||0);last=ts;update(dt);render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);

/* ---------- 介面 ---------- */
function show(id){for(const o of document.querySelectorAll('.ov'))o.classList.toggle('on',o.id===id);
  $('hudBtns').classList.toggle('on',state==='play');}
function start(){initAudio();reset();combo=0;state='play';show(null);}
function pause(){if(state==='play'){state='pause';show('ovPause');}else if(state==='pause'){state='play';show(null);}}
function bestTxt(){$('bestMenu').textContent=best?'最高擊墜　'+best:'';}
function menu(){state='menu';reset();bestTxt();show('ovMenu');}
$('btnStart').onclick=start;$('btnAgain').onclick=start;$('btnResume').onclick=pause;$('btnQuit').onclick=menu;$('btnPause').onclick=pause;
$('btnMute').onclick=()=>{muted=!muted;$('btnMute').style.opacity=muted?.45:1;};
bestTxt();
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function ptr(e){const r=cv.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,1-(e.clientY-r.top)/r.height*2);ray.setFromCamera(ndc,cam);
  const o=ray.ray.origin,d=ray.ray.direction,t=(FH-o.y)/d.y;
  target.x=clamp(o.x+d.x*t+W/2,0,W);target.y=clamp(o.z+d.z*t+H/2-(e.pointerType==='touch'?60:0),0,H);}
cv.addEventListener('pointerdown',e=>{initAudio();ptr(e);});
cv.addEventListener('pointermove',ptr);
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{
  const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=true;
  if(state==='lvl'&&'123'.includes(k)&&k.length===1)pickSkill(+k-1);
  if((k===' '||k==='Enter')&&(state==='menu'||state==='over')){e.preventDefault();start();}
  if(k==='p'||k==='Escape')pause();
  if(k.startsWith('Arrow')||k===' ')e.preventDefault();
});
addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(state==='play')pause();});
</script>
