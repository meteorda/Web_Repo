<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>布袋戲象棋</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@400;700;900&family=Ma+Shan+Zheng&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{--s:74px;--ps:60px;--cap-w:160px;--gap:20px;--red:#c41e1e;--black:#1a1a2e;--gold:#ffd700;}
body{min-height:100vh;display:flex;align-items:safe center;justify-content:safe center;padding:16px 0;font-family:'Noto Serif TC',serif;overflow:auto;
  background:radial-gradient(ellipse at 30% 20%,rgba(180,120,60,.3),transparent 50%),radial-gradient(ellipse at 70% 80%,rgba(160,100,40,.2),transparent 50%),linear-gradient(135deg,#2c1810,#4a2c17 30%,#3d2212 60%,#2c1810);}

/* LOBBY */
#lobby{display:flex;flex-direction:column;align-items:center;gap:18px;padding:40px 40px;max-width:480px;width:92%;background:linear-gradient(145deg,rgba(60,30,15,.92),rgba(80,40,20,.92));border:2px solid rgba(212,169,106,.3);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
#lobby h1{font-family:'Ma Shan Zheng',cursive;font-size:54px;letter-spacing:12px;background:linear-gradient(180deg,#ffd700,#d4881e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
#lobby .sub{color:#c8a870;font-size:13px;}
.sep{width:100%;border:none;border-top:1px solid rgba(212,169,106,.2);margin:4px 0;}
.section-title{font-family:'Ma Shan Zheng',cursive;font-size:20px;color:#f0d9a0;letter-spacing:4px;}
.diff-row{display:flex;gap:8px;}
.diff-btn{padding:8px 20px;border-radius:10px;border:2px solid rgba(212,169,106,.3);background:rgba(0,0,0,.2);color:#c8a870;font-family:'Noto Serif TC',serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:2px;}
.diff-btn:hover,.diff-btn.active{background:rgba(212,169,106,.2);border-color:var(--gold);color:var(--gold);}
.btn{padding:11px 28px;font-family:'Noto Serif TC',serif;font-size:15px;font-weight:700;border:none;border-radius:10px;cursor:pointer;transition:all .2s;letter-spacing:3px;}
.btn-gold{background:linear-gradient(145deg,#d4881e,#b8700a);color:#fff;box-shadow:0 4px 16px rgba(180,112,10,.5);border:1px solid rgba(255,215,0,.3);width:100%;}
.btn-gold:hover{transform:translateY(-2px);}
.btn-green{background:linear-gradient(145deg,#3a6a3a,#2a5a2a);color:#c0e0c0;border:1px solid rgba(100,200,100,.2);}
.btn-red{background:linear-gradient(145deg,#8b2020,#6b1515);color:#f0d0d0;border:1px solid rgba(255,100,100,.2);}
.btn-blue{background:linear-gradient(145deg,#1a4a8a,#0a3060);color:#c0d8ff;border:1px solid rgba(100,160,255,.2);width:100%;}
.p2p-row{display:flex;gap:8px;width:100%;}
.p2p-row .btn{flex:1;}
.join-row{display:flex;gap:8px;width:100%;}
.join-row input{flex:1;padding:10px;border-radius:10px;border:2px solid rgba(212,169,106,.3);background:rgba(0,0,0,.3);color:#f0d9a0;font-family:'Noto Serif TC',serif;font-size:15px;text-align:center;letter-spacing:3px;outline:none;}
.join-row input::placeholder{color:rgba(200,168,112,.4);}
.join-row input:focus{border-color:var(--gold);}
#st{color:#e8c080;font-size:13px;text-align:center;min-height:18px;transition:all .3s;opacity:0;}
#st.show{opacity:1;}
#st.err{color:#ff8888;}
#waitArea{display:none;text-align:center;padding:12px;background:rgba(0,0,0,.2);border-radius:10px;width:100%;}
#waitArea .code{font-family:'Ma Shan Zheng',cursive;font-size:32px;color:var(--gold);letter-spacing:6px;cursor:pointer;}
#waitArea .hint{font-size:11px;color:#b89860;margin-top:4px;}

/* GAME */
#game{display:none;flex-direction:column;align-items:center;gap:12px;padding:16px;}
#game.show{display:flex;}
.g-title{font-family:'Ma Shan Zheng',cursive;font-size:42px;letter-spacing:10px;background:linear-gradient(180deg,#ffd700,#d4881e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.mode-tag{font-size:12px;letter-spacing:2px;text-align:center;}
.mode-tag.ai-c{color:#d0a0ff;}.mode-tag.p2p-c{color:#80d0ff;}
.mode-tag b{font-size:13px;}
.info-bar{display:flex;align-items:center;justify-content:space-between;width:calc(8*var(--s) + 24px + 2*var(--gap) + 2*var(--cap-w));max-width:96vw;padding:12px 22px;background:linear-gradient(135deg,rgba(60,30,15,.85),rgba(80,40,20,.85));border:1px solid rgba(212,169,106,.3);border-radius:12px;color:#f0d9a0;font-size:16px;}
.pi{display:flex;align-items:center;gap:7px;padding:6px 14px;border-radius:9px;border:2px solid transparent;transition:all .3s;}
.pi.act-r{background:rgba(196,30,30,.2);border-color:rgba(196,30,30,.5);}
.pi.act-b{background:rgba(80,80,160,.15);border-color:rgba(130,130,200,.4);}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.3);}
.dot.red{background:var(--red);}.dot.black{background:var(--black);}
.ti{font-family:'Ma Shan Zheng',cursive;font-size:21px;color:var(--gold);}
.mc{font-size:12px;color:#b89860;margin-top:2px;}
.play-row{display:flex;align-items:stretch;justify-content:center;gap:var(--gap);max-width:97vw;}
.side-cap{width:var(--cap-w);flex:0 0 var(--cap-w);padding:12px 12px;background:rgba(40,20,10,.6);border-radius:12px;border:1px solid rgba(212,169,106,.18);display:flex;flex-direction:column;}
.side-cap h3{font-size:14px;color:#e8c888;margin-bottom:10px;letter-spacing:2px;text-align:center;padding-bottom:8px;border-bottom:1px solid rgba(212,169,106,.2);}
.cps{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;}
.cm2{width:38px;height:38px;border-radius:50%;background:linear-gradient(145deg,#fff8e8,#e8d4a8);border:2px solid #b8960a;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;font-family:'Noto Serif TC',serif;}
.cm2.rp{color:var(--red);}.cm2.bp{color:var(--black);}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}

/* BOARD */
.bw{padding:12px;background:linear-gradient(145deg,#6b4c1e,#4a3010,#6b4c1e);border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.6),inset 0 1px 0 rgba(212,169,106,.3);}
.board{position:relative;background:#d4a96a;border:2px solid #4a3010;border-radius:6px;overflow:visible;}
.board svg.lines{position:absolute;top:0;left:0;pointer-events:none;}
.grid{position:absolute;display:grid;}
.cell{display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;border-radius:4px;z-index:2;}
.cell:hover{background:rgba(255,215,0,.08);}
.cell.sel{background:rgba(255,215,0,.35);box-shadow:inset 0 0 10px rgba(255,215,0,.3);}
.cell.can-move::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:rgba(0,200,100,.5);border:2px solid rgba(0,200,100,.7);pointer-events:none;z-index:3;}
.cell.can-cap{background:rgba(255,60,60,.15);}.cell.can-cap::after{content:'';position:absolute;inset:5px;border-radius:50%;border:3px solid rgba(255,60,60,.6);pointer-events:none;z-index:3;}
.cell.last-from{background:rgba(180,120,255,.1);}
.cell.last-to{background:rgba(180,120,255,.18);box-shadow:inset 0 0 8px rgba(180,120,255,.25);}
.cell.in-check{animation:chkP 1s ease-in-out infinite;}
.cell.off{pointer-events:none;}
.cell.cap-flash{animation:capF .5s ease-out;}
@keyframes capF{0%{background:rgba(255,60,60,.5);}100%{background:transparent;}}
/* 吃子爆破動畫 */
.cap-ghost{position:absolute;transform:translate(-50%,-50%);border-radius:50%;z-index:20;pointer-events:none;display:flex;align-items:center;justify-content:center;font-weight:900;font-family:'Noto Serif TC',serif;
  background:linear-gradient(145deg,#fff8e8,#f5e6c8,#e8d4a8);border:3px solid #b8960a;background-size:cover;background-position:center 16%;animation:capSmash .6s cubic-bezier(.4,0,.6,1) forwards;}
.cap-ghost.rp{color:var(--red);border-color:#c41e1e;}.cap-ghost.bp{color:var(--black);border-color:#2a2a4a;}
@keyframes capSmash{0%{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:1;filter:brightness(1);}
  22%{transform:translate(-50%,-50%) scale(1.28) rotate(-10deg);filter:brightness(2.4) saturate(.2);}
  100%{transform:translate(-50%,-50%) scale(.15) rotate(95deg);opacity:0;filter:brightness(.4);}}
.cap-ring{position:absolute;transform:translate(-50%,-50%);border-radius:50%;border:3px solid rgba(255,210,80,.95);z-index:19;pointer-events:none;animation:capRing .6s ease-out forwards;}
@keyframes capRing{0%{opacity:.95;transform:translate(-50%,-50%) scale(.4);}100%{opacity:0;transform:translate(-50%,-50%) scale(2.8);}}
.cap-flash2{position:absolute;transform:translate(-50%,-50%);border-radius:50%;z-index:18;pointer-events:none;background:radial-gradient(circle,rgba(255,240,180,.95),rgba(255,120,40,.5) 45%,transparent 70%);animation:capFl .5s ease-out forwards;}
@keyframes capFl{0%{opacity:1;transform:translate(-50%,-50%) scale(.3);}100%{opacity:0;transform:translate(-50%,-50%) scale(2.2);}}
.cap-shard{position:absolute;width:7px;height:7px;border-radius:2px;background:#ffcf57;z-index:21;pointer-events:none;transform:translate(-50%,-50%);animation:capShard .62s ease-out forwards;box-shadow:0 0 7px rgba(255,200,60,.9);}
@keyframes capShard{0%{opacity:1;transform:translate(-50%,-50%) translate(0,0) scale(1.1) rotate(0);}100%{opacity:0;transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(.2) rotate(180deg);}}
@keyframes chkP{0%,100%{box-shadow:inset 0 0 10px rgba(255,40,40,.3);}50%{box-shadow:inset 0 0 18px rgba(255,40,40,.6);}}

.pc{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-family:'Noto Serif TC',serif;cursor:pointer;user-select:none;transition:transform .15s;position:relative;z-index:4;
  background:linear-gradient(145deg,#fff8e8,#f5e6c8,#e8d4a8);border:3px solid #b8960a;box-shadow:0 2px 6px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.8);}
.pc::after{content:'';position:absolute;inset:3px;border-radius:50%;border:1.5px solid rgba(184,150,10,.35);pointer-events:none;}
.pc:hover{transform:scale(1.1);}
.pc.rp{color:var(--red);text-shadow:0 1px 1px rgba(196,30,30,.3);}
.pc.bp{color:var(--black);text-shadow:0 1px 1px rgba(0,0,0,.2);}
/* 人物頭像棋子 */
.pc.hasface{background-image:none;background-size:cover;background-position:center 18%;background-repeat:no-repeat;overflow:hidden;}
.pc.hasface.rp{border-color:#c41e1e;box-shadow:0 2px 6px rgba(0,0,0,.4),0 0 0 1px rgba(255,90,90,.4),inset 0 0 0 2px rgba(196,30,30,.55);}
.pc.hasface.bp{border-color:#2a2a4a;box-shadow:0 2px 6px rgba(0,0,0,.4),0 0 0 1px rgba(120,120,200,.4),inset 0 0 0 2px rgba(26,26,46,.55);}
.pc.hasface::after{border-color:rgba(255,255,255,.25);}
.pc .pn{position:absolute;bottom:0;left:50%;transform:translateX(-50%);padding:0 4px;border-radius:7px 7px 4px 4px;font-weight:900;line-height:1.35;z-index:6;background:rgba(255,248,232,.94);border:1px solid #b8960a;white-space:nowrap;}
.pc.rp .pn{color:var(--red);}
.pc.bp .pn{color:var(--black);}
.cm2.hasface{background-size:cover;background-position:center 16%;color:transparent!important;border-width:2px;overflow:hidden;}
.cm2.hasface.rp{border-color:#c41e1e;}.cm2.hasface.bp{border-color:#2a2a4a;}

/* BANNER */
#banner{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:200;pointer-events:none;opacity:0;transition:opacity .15s;}
#banner.show{opacity:1;}
#bannerInner{padding:16px 50px;border-radius:14px;font-family:'Ma Shan Zheng',cursive;font-size:38px;letter-spacing:8px;text-shadow:0 2px 8px rgba(0,0,0,.5);border:3px solid;}
.bt-red{background:linear-gradient(135deg,rgba(160,20,20,.94),rgba(120,10,10,.94));color:#ffd700;border-color:rgba(255,215,0,.5);}
.bt-green{background:linear-gradient(135deg,rgba(20,100,20,.94),rgba(10,80,10,.94));color:#80ff80;border-color:rgba(100,255,100,.4);}
.bt-blue{background:linear-gradient(135deg,rgba(20,40,100,.94),rgba(10,20,70,.94));color:#80c0ff;border-color:rgba(100,160,255,.4);}
@keyframes bpop{0%{transform:scale(.5);opacity:0;}60%{transform:scale(1.05);}100%{transform:scale(1);opacity:1;}}

/* ===== VS 對戰畫面 ===== */
#vsScreen{position:fixed;inset:0;z-index:250;display:none;align-items:stretch;justify-content:center;
  background:radial-gradient(ellipse at 50% 40%,rgba(40,20,10,.92),rgba(10,5,2,.97));backdrop-filter:blur(6px);overflow:hidden;}
#vsScreen.show{display:flex;}
.vs-team{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 10px;position:relative;opacity:0;}
#vsScreen.show .vs-red{animation:vsInL .6s cubic-bezier(.2,.8,.3,1) forwards;}
#vsScreen.show .vs-black{animation:vsInR .6s cubic-bezier(.2,.8,.3,1) forwards;}
@keyframes vsInL{0%{opacity:0;transform:translateX(-60px);}100%{opacity:1;transform:none;}}
@keyframes vsInR{0%{opacity:0;transform:translateX(60px);}100%{opacity:1;transform:none;}}
.vs-red{background:linear-gradient(120deg,rgba(140,20,20,.35),transparent 70%);}
.vs-black{background:linear-gradient(240deg,rgba(40,40,90,.35),transparent 70%);}
.vs-head{font-family:'Ma Shan Zheng',cursive;font-size:40px;letter-spacing:8px;}
.vs-red .vs-head{color:#ff6a6a;text-shadow:0 0 16px rgba(255,60,60,.6);}
.vs-black .vs-head{color:#9aa6ff;text-shadow:0 0 16px rgba(110,110,255,.6);}
.vs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 10px;width:100%;max-width:200px;justify-items:center;}
.vs-card{display:flex;flex-direction:column;align-items:center;gap:3px;}
.vs-face{width:52px;height:52px;border-radius:50%;background-size:cover;background-position:center 16%;border:3px solid;box-shadow:0 3px 10px rgba(0,0,0,.5);position:relative;}
.vs-red .vs-face{border-color:#c41e1e;box-shadow:0 0 12px rgba(196,30,30,.5);}
.vs-black .vs-face{border-color:#3a3a66;box-shadow:0 0 12px rgba(60,60,160,.5);}
.vs-name{font-family:'Noto Serif TC',serif;font-weight:900;font-size:14px;}
.vs-red .vs-name{color:#ffd0d0;}.vs-black .vs-name{color:#d0d6ff;}
.vs-center{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:0 6px;z-index:2;}
.vs-badge{font-family:'Ma Shan Zheng',cursive;font-size:88px;font-weight:900;line-height:1;
  background:linear-gradient(180deg,#ffe680,#d4881e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 18px rgba(255,180,40,.6));opacity:0;}
#vsScreen.show .vs-badge{animation:vsPop .5s .35s cubic-bezier(.2,1.4,.4,1) forwards;}
@keyframes vsPop{0%{opacity:0;transform:scale(2.2) rotate(-12deg);}100%{opacity:1;transform:none;}}
.vs-sub{font-family:'Ma Shan Zheng',cursive;color:#e8c080;font-size:16px;letter-spacing:3px;text-align:center;opacity:0;}
#vsScreen.show .vs-sub{animation:vsFade .5s .7s forwards;}
.vs-go{opacity:0;min-width:130px;}
#vsScreen.show .vs-go{animation:vsFade .5s .95s forwards;}
@keyframes vsFade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
@media(max-width:560px){.vs-head{font-size:24px;letter-spacing:3px;}.vs-badge{font-size:44px;}.vs-face{width:38px;height:38px;border-width:2px;}.vs-name{font-size:10px;}.vs-grid{gap:6px;max-width:126px;}.vs-sub{font-size:12px;letter-spacing:1px;}.vs-team{padding:10px 2px;gap:8px;}.vs-center{gap:10px;padding:0 2px;}.vs-go{min-width:96px;padding:9px 14px;font-size:13px;}}


.mo{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:300;backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s;}
.mo.show{opacity:1;pointer-events:auto;}
.md{background:linear-gradient(145deg,#4a3010,#3d2510);border:2px solid rgba(212,169,106,.4);border-radius:16px;padding:30px 40px;text-align:center;color:#f0d9a0;box-shadow:0 20px 60px rgba(0,0,0,.6);transform:scale(.9);transition:transform .3s;}
.mo.show .md{transform:scale(1);}
.md h2{font-family:'Ma Shan Zheng',cursive;font-size:32px;margin-bottom:8px;background:linear-gradient(180deg,#ffd700,#d4881e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.md p{font-size:15px;margin-bottom:18px;color:#c8a870;}.md .btn{min-width:100px;margin:0 6px;}
.btn-ghost{background:rgba(212,169,106,.12);color:#e8c888;border:1px solid rgba(212,169,106,.4);}
.btn-ghost:hover{background:rgba(212,169,106,.22);}
/* 自選人物 */
.fp-md{padding:24px 26px;max-width:540px;width:94vw;max-height:90vh;overflow-y:auto;}
.fp-side{margin-bottom:12px;}
.fp-side-t{font-family:'Ma Shan Zheng',cursive;font-size:20px;letter-spacing:3px;margin-bottom:8px;text-align:left;}
.fp-side-t.red{color:#ff6a6a;}.fp-side-t.black{color:#9aa6ff;}
.fp-slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.fp-slot{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:3px;border-radius:10px;border:2px solid transparent;transition:.15s;}
.fp-slot:hover{background:rgba(255,255,255,.06);}
.fp-slot.sel{border-color:var(--gold);background:rgba(255,215,0,.12);}
.fp-face{width:46px;height:46px;border-radius:50%;background-size:cover;background-position:center 16%;border:2px solid;box-shadow:0 2px 6px rgba(0,0,0,.4);}
.fp-slot.red .fp-face{border-color:#c41e1e;}.fp-slot.black .fp-face{border-color:#3a3a66;}
.fp-role{font-size:11px;color:#d8c090;font-weight:700;}
.fp-divider{margin:14px 0 10px;font-size:13px;color:#b89860;letter-spacing:2px;border-top:1px solid rgba(212,169,106,.25);padding-top:12px;}
.fp-divrow{display:flex;align-items:center;justify-content:space-between;}
.fp-up{cursor:pointer;font-size:12px;color:#e8c888;background:rgba(212,169,106,.15);border:1px solid rgba(212,169,106,.4);padding:5px 12px;border-radius:8px;letter-spacing:1px;}
.fp-up:hover{background:rgba(212,169,106,.28);}
.fp-pool{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:18px;}
.fp-pool .fp-p{position:relative;width:100%;aspect-ratio:1/1;border-radius:10px;background-size:cover;background-position:center 16%;border:2px solid rgba(212,169,106,.25);cursor:pointer;transition:.15s;}
.fp-pool .fp-p:hover{border-color:var(--gold);transform:scale(1.06);}
.fp-pool .fp-p.used{outline:2px solid rgba(120,200,120,.6);}
.fp-pool .fp-p.custom{border-color:rgba(120,200,120,.55);}
.fp-del{position:absolute;top:-7px;right:-7px;width:19px;height:19px;border-radius:50%;background:#c0392b;color:#fff;border:1px solid #fff;font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;z-index:2;}
.fp-del:hover{background:#e04b3a;}
@media(max-width:480px){.fp-pool{grid-template-columns:repeat(5,1fr);}.fp-face{width:40px;height:40px;}.fp-side-t{font-size:17px;}}

@media(max-width:1040px){:root{--s:60px;--ps:48px;--cap-w:150px;}.g-title{font-size:34px;}}
@media(max-width:900px){.play-row{flex-direction:column;align-items:center;}.side-cap{width:calc(8*var(--s) + 24px);max-width:96vw;flex:none;flex-direction:row;align-items:center;min-height:54px;}.side-cap h3{margin:0 12px 0 0;padding:0 12px 0 0;border-bottom:none;border-right:1px solid rgba(212,169,106,.25);white-space:nowrap;}.cps{flex:1;}}
@media(max-width:560px){:root{--s:40px;--ps:32px;--gap:10px;}.pc{font-size:16px;border-width:2px;}.pc::after{inset:2px;}#lobby h1{font-size:34px;}#bannerInner{font-size:28px;padding:12px 28px;}.cm2{width:28px;height:28px;font-size:12px;}.g-title{font-size:28px;letter-spacing:6px;}.info-bar{font-size:13px;padding:8px 12px;}.ti{font-size:17px;}.side-cap h3{font-size:12px;}}
@media(max-width:400px){:root{--s:34px;--ps:27px;}.pc{font-size:13px;}.info-bar{font-size:12px;padding:6px 8px;}#lobby{padding:24px 12px;}#lobby h1{font-size:28px;letter-spacing:4px;}.btn{padding:10px 20px;font-size:14px;}.cm2{width:24px;height:24px;font-size:10px;}}
/* ===== 頭像 + 深色金質色調（與跳棋同系列） ===== */
.avatar-picker{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:4px 0;}
.avatar-opt{width:50px;height:50px;border-radius:50%;border:3px solid rgba(200,165,100,.3);cursor:pointer;overflow:hidden;background:#14161d;transition:all .2s;}
.avatar-opt:hover{border-color:rgba(140,220,80,.6);transform:scale(1.1);}
.avatar-opt.active{border-color:#e8c47a;box-shadow:0 0 12px rgba(120,170,255,.4);transform:scale(1.1);}
.avatar-opt img{width:100%;height:100%;object-fit:cover;display:block;}
.pi-av{width:30px;height:30px;border-radius:50%;overflow:hidden;border:2px solid rgba(232,196,122,.5);background:#14161d;flex:0 0 auto;}
.pi-av img{width:100%;height:100%;object-fit:cover;display:block;}
@media(max-width:560px){.avatar-opt{width:42px;height:42px;}.pi-av{width:24px;height:24px;}}

/* dark-slate premium retheme */
:root{--gold:#e8c47a;}
body{background:
  radial-gradient(ellipse at 50% -10%,rgba(232,196,122,.10),transparent 55%),
  radial-gradient(ellipse at 18% 22%,rgba(196,142,72,.12),transparent 50%),
  radial-gradient(ellipse at 82% 85%,rgba(80,110,170,.10),transparent 50%),
  radial-gradient(ellipse at 50% 60%,rgba(0,0,0,.35),transparent 70%),
  linear-gradient(135deg,#14161d,#1d2030 30%,#16181f 60%,#0d0e13) !important;
  color:#e0d8c0;}
#lobby{background:linear-gradient(180deg,rgba(28,31,42,.96),rgba(18,20,28,.96)) !important;border:2px solid rgba(200,165,100,.28) !important;box-shadow:0 24px 70px rgba(0,0,0,.6) !important;}
#lobby h1,.g-title{background:linear-gradient(180deg,#e8c47a,#9c6f24) !important;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
#lobby .sub,.section-title{color:#e6d6ad !important;}
.info-bar{background:linear-gradient(135deg,rgba(28,31,42,.9),rgba(18,20,28,.9)) !important;border:1px solid rgba(200,165,100,.3) !important;color:#e6d6ad !important;}
.btn-gold{background:linear-gradient(145deg,#c79a44,#8a5e1e) !important;border:1px solid rgba(120,170,255,.3) !important;color:#fff !important;}
.btn-gold:hover{background:linear-gradient(145deg,#d4a84e,#9a6e24) !important;}
.btn-blue{background:linear-gradient(145deg,#2a4a7a,#1a3a6a) !important;border:1px solid rgba(100,150,255,.2) !important;color:#c0d0f0 !important;}
.btn-green{background:linear-gradient(145deg,#33415e,#232d44) !important;border:1px solid rgba(120,165,235,.2) !important;color:#d8e2f2 !important;}
.diff-btn{border:2px solid rgba(200,165,100,.3) !important;color:#c8a870 !important;background:rgba(0,0,0,.22) !important;}
.diff-btn:hover,.diff-btn.active{background:rgba(200,165,100,.2) !important;border-color:#e8c47a !important;color:#e8c47a !important;}
.join-row input,#joinIn{background:rgba(0,0,0,.3) !important;border:2px solid rgba(200,165,100,.3) !important;color:#e6d6ad !important;}
#waitArea{background:rgba(0,0,0,.25) !important;}
#waitArea .code{color:#e8c47a !important;text-shadow:0 0 20px rgba(232,196,122,.4);
  font-family:ui-monospace,'SF Mono','Roboto Mono','Courier New',monospace !important;font-weight:700 !important;letter-spacing:8px !important;}
.mode-tag b{font-family:ui-monospace,'SF Mono','Roboto Mono','Courier New',monospace !important;letter-spacing:2px;}
/* 自選人物 / 結果視窗：深板岩色，與主題一致 */
.md{background:linear-gradient(180deg,rgba(28,31,42,.97),rgba(16,18,26,.97)) !important;border:2px solid rgba(200,165,100,.3) !important;color:#e6d6ad !important;box-shadow:0 24px 70px rgba(0,0,0,.65) !important;}
.md h2{font-family:'Noto Sans TC',sans-serif !important;font-weight:900 !important;letter-spacing:4px !important;background:linear-gradient(180deg,#e8c47a,#9c6f24) !important;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.fp-side-t{font-family:'Noto Sans TC',sans-serif !important;font-weight:900 !important;}
.fp-side-t.red{color:#ff8a8a !important;}.fp-side-t.black{color:#9ab0ff !important;}
.fp-divider{color:#a89a72 !important;border-top-color:rgba(200,165,100,.22) !important;}
.fp-up{color:#e8c47a !important;background:rgba(200,165,100,.14) !important;border:1px solid rgba(200,165,100,.4) !important;}
.fp-up:hover{background:rgba(200,165,100,.26) !important;}
.fp-pool .fp-p{border:2px solid rgba(200,165,100,.25) !important;}
#fpHint,.fp-role{color:#c8bd9a !important;}
.btn-ghost{background:rgba(200,165,100,.12) !important;color:#e6d6ad !important;border:1px solid rgba(200,165,100,.4) !important;}
.btn-ghost:hover{background:rgba(200,165,100,.22) !important;}

/* ===== logo image + 字型與跳棋一致 ===== */
.logo-img{width:min(330px,82%);height:auto;display:block;margin:2px auto 0;border-radius:16px;
  box-shadow:0 10px 34px rgba(0,0,0,.55),0 0 26px rgba(232,196,122,.18);}
.logo-img-sm{width:min(150px,46%);height:auto;display:block;margin:0 auto 2px;border-radius:12px;
  box-shadow:0 6px 20px rgba(0,0,0,.5),0 0 16px rgba(232,196,122,.16);}
body,.btn,.diff-btn,.section-title,#st,.join-row input,.info-bar,.mode-tag,.ti,.sub,.pi span,.side-cap h3,#waitArea,.g-title{font-family:'Noto Sans TC',sans-serif !important;}
.g-title{font-weight:900 !important;letter-spacing:6px !important;}
.section-title{letter-spacing:3px !important;}
</style>

<script>
/* ===== CHESS ENGINE ===== */
var Ro=10,Co=9,DIRS=[[0,1],[0,-1],[1,0],[-1,0]];
/* guest (黑方) sees the board rotated 180° so their own pieces face them at the bottom.
   Board frame (lines/palace/river) is symmetric under 180°, so only piece placement,
   clicks and capture-anim coords are flipped; all game logic stays in logical coords. */

];
function cloneB(b){return b.map(function(row){return row.map(function(p){return p?{n:p.n,c:p.c}:null;});});}
function makeBoard(){return cloneB(INIT);}
function pType(n){if(n==='帥'||n==='將')return'k';if(n==='仕'||n==='士')return'a';if(n==='相'||n==='象')return'b';if(n==='俥'||n==='車')return'r';if(n==='傌'||n==='馬')return'n';if(n==='炮'||n==='砲'||n==='包')return'c';if(n==='兵'||n==='卒')return'p';}
var VAL={帥:10000,將:10000,俥:600,車:600,炮:285,砲:285,包:285,傌:270,馬:270,相:120,象:120,仕:120,士:120,兵:30,卒:30};

function pseudoMoves(b,r,c){
  var p=b[r][c];if(!p)return[];var t=pType(p.n),col=p.c,mv=[];
  if(t==='k'){var rMin=col==='r'?7:0,rMax=col==='r'?9:2;for(var i=0;i<4;i++){var nr=r+DIRS[i][0],nc=c+DIRS[i][1];if(nr>=rMin&&nr<=rMax&&nc>=3&&nc<=5){var x=b[nr][nc];if(!x||x.c!==col)mv.push({r:nr,c:nc});}}}
  else if(t==='a'){var rMin=col==='r'?7:0,rMax=col==='r'?9:2;var dd=[[1,1],[1,-1],[-1,1],[-1,-1]];for(var i=0;i<4;i++){var nr=r+dd[i][0],nc=c+dd[i][1];if(nr>=rMin&&nr<=rMax&&nc>=3&&nc<=5){var x=b[nr][nc];if(!x||x.c!==col)mv.push({r:nr,c:nc});}}}
  else if(t==='b'){var rMin=col==='r'?5:0,rMax=col==='r'?9:4;var dd=[[2,2],[2,-2],[-2,2],[-2,-2]];for(var i=0;i<4;i++){var dr=dd[i][0],dc=dd[i][1],nr=r+dr,nc=c+dc;if(nr>=rMin&&nr<=rMax&&nc>=0&&nc<Co&&!b[r+dr/2][c+dc/2]){var x=b[nr][nc];if(!x||x.c!==col)mv.push({r:nr,c:nc});}}}
  else if(t==='r'){for(var i=0;i<4;i++){var dr=DIRS[i][0],dc=DIRS[i][1],nr=r+dr,nc=c+dc;while(nr>=0&&nr<Ro&&nc>=0&&nc<Co){var x=b[nr][nc];if(!x)mv.push({r:nr,c:nc});else{if(x.c!==col)mv.push({r:nr,c:nc});break;}nr+=dr;nc+=dc;}}}
  else if(t==='n'){var steps=[[-2,-1,-1,0],[-2,1,-1,0],[2,-1,1,0],[2,1,1,0],[-1,-2,0,-1],[-1,2,0,1],[1,-2,0,-1],[1,2,0,1]];for(var i=0;i<8;i++){var s=steps[i],nr=r+s[0],nc=c+s[1];if(nr<0||nr>=Ro||nc<0||nc>=Co)continue;if(b[r+s[2]][c+s[3]])continue;var x=b[nr][nc];if(!x||x.c!==col)mv.push({r:nr,c:nc});}}
  else if(t==='c'){for(var i=0;i<4;i++){var dr=DIRS[i][0],dc=DIRS[i][1],nr=r+dr,nc=c+dc,jumped=false;while(nr>=0&&nr<Ro&&nc>=0&&nc<Co){var x=b[nr][nc];if(!jumped){if(!x)mv.push({r:nr,c:nc});else jumped=true;}else{if(x){if(x.c!==col)mv.push({r:nr,c:nc});break;}}nr+=dr;nc+=dc;}}}
  else if(t==='p'){if(col==='r'){if(r-1>=0){var x=b[r-1][c];if(!x||x.c!==col)mv.push({r:r-1,c:c});}if(r<=4){if(c-1>=0){var x=b[r][c-1];if(!x||x.c!==col)mv.push({r:r,c:c-1});}if(c+1<Co){var x=b[r][c+1];if(!x||x.c!==col)mv.push({r:r,c:c+1});}}}
  else{if(r+1<Ro){var x=b[r+1][c];if(!x||x.c!==col)mv.push({r:r+1,c:c});}if(r>=5){if(c-1>=0){var x=b[r][c-1];if(!x||x.c!==col)mv.push({r:r,c:c-1});}if(c+1<Co){var x=b[r][c+1];if(!x||x.c!==col)mv.push({r:r,c:c+1});}}}}
  return mv;}
function findKing(b,col){var kn=col==='r'?'帥':'將';for(var r=0;r<Ro;r++)for(var c=0;c<Co;c++)if(b[r][c]&&b[r][c].n===kn)return{r:r,c:c};return null;}
function flyingGen(b){var rk=findKing(b,'r'),bk=findKing(b,'b');if(!rk||!bk||rk.c!==bk.c)return false;for(var r=bk.r+1;r<rk.r;r++)if(b[r][rk.c])return false;return true;}
function isCheck(b,col){var k=findKing(b,col);if(!k)return true;var en=col==='r'?'b':'r';for(var r=0;r<Ro;r++)for(var c=0;c<Co;c++){if(!b[r][c]||b[r][c].c!==en)continue;var mv=pseudoMoves(b,r,c);for(var i=0;i<mv.length;i++)if(mv[i].r===k.r&&mv[i].c===k.c)return true;}return flyingGen(b);}
function legalMoves(b,r,c){var p=b[r][c];if(!p)return[];var pm=pseudoMoves(b,r,c),res=[];for(var i=0;i<pm.length;i++){var m=pm[i],cp=cloneB(b);cp[m.r][m.c]=cp[r][c];cp[r][c]=null;if(!isCheck(cp,p.c))res.push(m);}return res;}
function hasAnyLegal(b,col){for(var r=0;r<Ro;r++)for(var c=0;c<Co;c++){if(!b[r][c]||b[r][c].c!==col)continue;if(legalMoves(b,r,c).length>0)return true;}return false;}
function allLegal(b,col){var moves=[];for(var r=0;r<Ro;r++)for(var c=0;c<Co;c++){if(!b[r][c]||b[r][c].c!==col)continue;var lm=legalMoves(b,r,c);for(var i=0;i<lm.length;i++)moves.push({fr:r,fc:c,tr:lm[i].r,tc:lm[i].c,cap:b[lm[i].r][lm[i].c]});}return moves;}

function evaluate(b){var sc=0;for(var r=0;r<Ro;r++)for(var c=0;c<Co;c++){var p=b[r][c];if(!p)continue;var v=VAL[p.n]||0;var t=pType(p.n);if(t==='p'){if(p.c==='r'&&r<=4)v=80;if(p.c==='b'&&r>=5)v=80;}if(t==='r')v+=(p.c==='r'?(r<5?30:10):(r>4?30:10));if(t==='n')v+=(r>=2&&r<=7&&c>=2&&c<=6?15:0);if(t==='c')v+=(r>=2&&r<=7?10:0);sc+=(p.c==='r'?1:-1)*v;}return sc;}
function aiThink(g){var moves=allLegal(g.board,'b');if(!moves.length)return null;if(aiDiff==='easy')return moves[Math.random()*moves.length|0];if(aiDiff==='normal')return aiNorm(g.board,moves);return aiHard(g.board,moves);}
function aiNorm(b,moves){var best=null,bestSc=Infinity;for(var i=0;i<moves.length;i++){var m=moves[i],cp=cloneB(b);cp[m.tr][m.tc]=cp[m.fr][m.fc];cp[m.fr][m.fc]=null;var sc=evaluate(cp);if(isCheck(cp,'r'))sc-=50;sc+=Math.random()*20-10;if(sc<bestSc){bestSc=sc;best=m;}}return best;}
function aiHard(b,moves){var best=null,bestSc=Infinity;moves.sort(function(a,b2){return(b2.cap?VAL[b2.cap.n]:0)-(a.cap?VAL[a.cap.n]:0);});for(var i=0;i<moves.length;i++){var m=moves[i],cp=cloneB(b);cp[m.tr][m.tc]=cp[m.fr][m.fc];cp[m.fr][m.fc]=null;var sc=minimax(cp,2,true,-Infinity,Infinity);if(sc<bestSc){bestSc=sc;best=m;}}return best;}
function minimax(b,depth,isMax,alpha,beta){if(depth===0)return evaluate(b);var col=isMax?'r':'b';var moves=allLegal(b,col);if(!moves.length)return isMax?-99999:99999;
  if(isMax){var v=-Infinity;for(var i=0;i<moves.length;i++){var m=moves[i],cp=cloneB(b);cp[m.tr][m.tc]=cp[m.fr][m.fc];cp[m.fr][m.fc]=null;v=Math.max(v,minimax(cp,depth-1,false,alpha,beta));alpha=Math.max(alpha,v);if(beta<=alpha)break;}return v;}
  else{var v=Infinity;for(var i=0;i<moves.length;i++){var m=moves[i],cp=cloneB(b);cp[m.tr][m.tc]=cp[m.fr][m.fc];cp[m.fr][m.fc]=null;v=Math.min(v,minimax(cp,depth-1,true,alpha,beta));beta=Math.min(beta,v);if(beta<=alpha)break;}return v;}}

var myAvatar=0, opAvatar=1, opAvatarSrc=null, BUILTIN_N=AVATARS.length;
function avSrc(i){return (AVATARS[i]||AVATARS[0]).src;}
function onTap(el,fn){var touched=false;
  el.addEventListener('touchend',function(e){touched=true;e.preventDefault();fn(e);setTimeout(function(){touched=false;},500);},{passive:false});
  el.addEventListener('click',function(e){if(touched){touched=false;return;}fn(e);});}
function initAvatarPicker(){
  var c=document.getElementById('avatarPicker');if(!c)return;c.innerHTML='';
  AVATARS.forEach(function(a,i){
    var d=document.createElement('div');d.className='avatar-opt'+(i===myAvatar?' active':'');
    d.innerHTML='<img src="'+a.src+'" alt="'+a.name+'" draggable="false">';d.title=a.name;
    onTap(d,function(){myAvatar=i;var all=document.querySelectorAll('.avatar-opt');for(var j=0;j<all.length;j++)all[j].classList.remove('active');d.classList.add('active');});
    c.appendChild(d);
  });
  var up=document.createElement('div');up.className='avatar-opt avatar-up';up.title='上傳自己的頭像';
  up.style.cssText='display:flex;align-items:center;justify-content:center;font-size:24px;color:#e8c47a;background:rgba(0,0,0,.25);';
  up.textContent='＋';
  var fileEl=document.getElementById('avatarFile');
  onTap(up,function(){if(fileEl){fileEl.value='';fileEl.click();}});
  c.appendChild(up);
  if(fileEl&&!fileEl._wired){fileEl._wired=1;fileEl.addEventListener('change',handleAvatarFile);}
}
function handleAvatarFile(e){var f=e.target.files&&e.target.files[0];if(!f)return;
  if(!/^image\//.test(f.type)){showSt('請選擇圖片檔',true);return;}
  var rd=new FileReader();
  rd.onload=function(ev){var img=new Image();
    img.onload=function(){
      var S=128,cv=document.createElement('canvas');cv.width=S;cv.height=S;var cx=cv.getContext('2d');
      var side=Math.min(img.width,img.height),sx=(img.width-side)/2,sy=(img.height-side)/2;
      cx.drawImage(img,sx,sy,side,side,0,0,S,S);
      var url;try{url=cv.toDataURL('image/webp',0.85);}catch(_){url=cv.toDataURL('image/jpeg',0.85);}
      if(!url||url.length<50){showSt('圖片讀取失敗',true);return;}
      AVATARS.push({name:'自訂頭像',src:url});myAvatar=AVATARS.length-1;
      initAvatarPicker();showSt('已套用自訂頭像');
    };
    img.onerror=function(){showSt('圖片載入失敗',true);};
    img.src=ev.target.result;};
  rd.onerror=function(){showSt('檔案讀取失敗',true);};
  rd.readAsDataURL(f);}
function avatarImgFor(which){if(which==='me')return avSrc(myAvatar);return opAvatarSrc||avSrc(opAvatar%AVATARS.length);}
function renderAvatars(){
  var meIsRed=(mode!=='guest');
  var s1=meIsRed?avatarImgFor('me'):avatarImgFor('op');
  var s2=meIsRed?avatarImgFor('op'):avatarImgFor('me');
  var a1=document.getElementById('av1'),a2=document.getElementById('av2');
  if(a1)a1.innerHTML='<img src="'+s1+'">';
  if(a2)a2.innerHTML='<img src="'+s2+'">';}

var peerLoaded=false,peerLoading=false;
var PEER_CDNS=['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js','https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js','https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js'];
/* STUN 找出對外 IP；TURN 在無法直連（嚴格 NAT / 行動網路 / 防火牆）時中繼流量，達成跨網域對戰 */
var ICE_SERVERS=[
  {urls:'stun:stun.l.google.com:19302'},
  {urls:'stun:stun1.l.google.com:19302'},
  {urls:'stun:stun.relay.metered.ca:80'},
  {urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},
  {urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},
  {urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}
];
var PEER_OPTS={debug:0,config:{iceServers:ICE_SERVERS,sdpSemantics:'unified-plan'}};
function loadPeerJS(cb){if(peerLoaded){cb();return;}if(peerLoading)return;peerLoading=true;var idx=0;
  function tryNext(){if(idx>=PEER_CDNS.length){peerLoading=false;showSt('PeerJS 載入失敗，請檢查網路',true);return;}
    var s=document.createElement('script');s.src=PEER_CDNS[idx];s.onload=function(){peerLoaded=true;peerLoading=false;cb();};s.onerror=function(){idx++;tryNext();};document.head.appendChild(s);}
  tryNext();}
function genCode(){var ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return'cchess-'+Array.from({length:6},function(){return ch[Math.random()*ch.length|0];}).join('');}
function makePeer(customId,cb,onErr){
  try{peer=customId?new Peer(customId,PEER_OPTS):new Peer(undefined,PEER_OPTS);}catch(e){showSt('連線初始化失敗：'+e.message,true);return;}
  peer.on('open',function(id){cb(id);});
  peer.on('disconnected',function(){try{peer.reconnect();}catch(e){}});   // 房主等待時保持在信令伺服器上線
  peer.on('error',function(e){console.error(e);
    if(e.type==='unavailable-id'){peer.destroy();makePeer(genCode(),cb,onErr);return;}
    if(onErr&&onErr(e))return;
    showSt(e.type==='peer-unavailable'?'找不到該房間':'連線錯誤：'+e.type,true);});}
function peerSend(d){if(conn&&conn.open)conn.send(JSON.stringify(d));}
function peerOnData(raw){try{return typeof raw==='string'?JSON.parse(raw):raw;}catch(e){return raw;}}

function doCreate(){showSt('正在載入連線模組...');loadPeerJS(function(){showSt('正在建立房間...');var cid=genCode();
  makePeer(cid,function(id){var dc=id.replace('cchess-','');document.getElementById('showCode').textContent=dc;document.getElementById('waitArea').style.display='block';showSt('房主等待中…（可跨網域）');
    mode='host';G=initState();
    peer.on('connection',function(c){conn=c;
      conn.on('open',function(){enterP2P(dc);peerSend({t:'start',state:G,code:dc,avatar:myAvatar,avatarSrc:avSrc(myAvatar)});});
      conn.on('data',function(raw){hostHandle(peerOnData(raw));});
      conn.on('close',function(){showBanner('對手已離線','bt-red');});
    });
  });});}

function doJoinUI(){var jr=document.getElementById('joinRow');jr.style.display=jr.style.display==='none'?'flex':'none';}
var _jTries=0,_jTimer=null,_jDone=false,_jMax=5,_jPid=null;
function doJoin(){var code=document.getElementById('joinIn').value.trim().toUpperCase();if(!code){showSt('請輸入房間代碼',true);return;}
  _jPid='cchess-'+code.replace(/^CCHESS-/i,'');showSt('正在載入連線模組...');
  loadPeerJS(function(){showSt('跨網域連線中…');
    makePeer(undefined,function(){mode='guest';_jTries=0;_jDone=false;jAttempt();},function(e){
      if(e.type==='peer-unavailable'){jRetry('找不到房主');return true;}return false;});});}
function jAttempt(){if(_jDone)return;_jTries++;
  try{conn=peer.connect(_jPid,{reliable:true});}catch(e){jRetry('連線失敗');return;}
  if(_jTimer)clearTimeout(_jTimer);
  _jTimer=setTimeout(function(){if(!_jDone&&(!conn||!conn.open)){try{conn&&conn.close();}catch(e){}jRetry('連線逾時');}},9000);
  conn.on('open',function(){_jDone=true;if(_jTimer)clearTimeout(_jTimer);showSt('已連線，等待遊戲資料...');peerSend({t:'hello',avatar:myAvatar,avatarSrc:avSrc(myAvatar)});});
  conn.on('data',function(raw){guestHandle(peerOnData(raw));});
  conn.on('close',function(){if(_jDone)showBanner('對手已離線','bt-red');});
  conn.on('error',function(){});}
function jRetry(why){if(_jDone)return;if(_jTimer)clearTimeout(_jTimer);
  if(_jTries<_jMax){showSt(why+'，重試中… ('+_jTries+'/'+_jMax+')');setTimeout(function(){if(!_jDone)jAttempt();},1600);}
  else{showSt('找不到房間（請確認房主仍在等待、代碼正確、雙方都已連網）',true);}}

function copyCode(){var code=document.getElementById('showCode').textContent;navigator.clipboard&&navigator.clipboard.writeText(code).then(function(){showSt('已複製代碼 '+code);});}

/* Host handles guest actions */
function hostHandle(d){if(!d||!d.t)return;
  if(d.t==='hello'){if(typeof d.avatar==='number')opAvatar=d.avatar;if(d.avatarSrc)opAvatarSrc=d.avatarSrc;renderAvatars();return;}
  if(d.t==='move'&&G&&!G.over&&G.turn==='b'){
    var pc=G.board[d.fr][d.fc];if(!pc||pc.c!=='b')return;
    var vm=legalMoves(G.board,d.fr,d.fc);var ok=false;for(var i=0;i<vm.length;i++){if(vm[i].r===d.tr&&vm[i].c===d.tc){ok=true;break;}}
    if(!ok)return;
    var cap=G.board[d.tr][d.tc];if(cap)G.cap2.push({n:cap.n,c:cap.c});
    G.board[d.tr][d.tc]=G.board[d.fr][d.fc];G.board[d.fr][d.fc]=null;G.mv++;G.turn='r';
    lastMove={fr:d.fr,fc:d.fc,tr:d.tr,tc:d.tc};sel=null;
    peerSend({t:'state',state:G,lm:lastMove,hasCap:!!cap});render();if(cap){animCF(d.tr,d.tc);animCapture(d.tr,d.tc,cap);}
    checkEnd('r');if(G.over)setTimeout(showResult,400);
  }else if(d.t==='surrender'&&G&&!G.over){
    G.over=true;G.winner='r';G.msg='黑方投降認輸！';peerSend({t:'state',state:G,lm:lastMove});render();showResult();
  }else if(d.t==='rematch'){
    G=initState();sel=null;lastMove=null;peerSend({t:'state',state:G,lm:null,rematch:true});buildBoard();render();showBanner('新局開始','bt-blue');closeMo();
  }
}

/* Guest handles host state */
function guestHandle(d){if(!d||!d.t)return;
  if(d.t==='start'){G=d.state;if(typeof d.avatar==='number')opAvatar=d.avatar;if(d.avatarSrc)opAvatarSrc=d.avatarSrc;enterP2P(d.code||'');}
  else if(d.t==='state'){G=d.state;lastMove=d.lm||null;sel=null;render();
    if(d.hasCap&&lastMove){animCF(lastMove.tr,lastMove.tc);animCapture(lastMove.tr,lastMove.tc,null);}
    if(d.rematch){buildBoard();render();closeMo();showBanner('新局開始','bt-blue');}
    if(!G.over&&G.turn==='b'&&isCheck(G.board,'b'))showBanner('將軍！','bt-red');
    if(G.over)setTimeout(showResult,400);
  }
}

/* ===== BOARD BUILD ===== */
function buildBoard(){
  var el=document.getElementById('boardEl');el.innerHTML='';
  var cs=getComputedStyle(document.documentElement);var s=parseFloat(cs.getPropertyValue('--s'));
  var W=8*s,H=9*s;el.style.width=W+'px';el.style.height=H+'px';
  var ns='http://www.w3.org/2000/svg';var svg=document.createElementNS(ns,'svg');svg.setAttribute('class','lines');svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.setAttribute('width',W);svg.setAttribute('height',H);svg.style.width=W+'px';svg.style.height=H+'px';
  var lc='#4a3010';
  function ln(x1,y1,x2,y2){var l=document.createElementNS(ns,'line');l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);l.setAttribute('stroke',lc);l.setAttribute('stroke-width','1.2');svg.appendChild(l);}
  function tx(x,y,t,sz){var te=document.createElementNS(ns,'text');te.setAttribute('x',x);te.setAttribute('y',y);te.setAttribute('text-anchor','middle');te.setAttribute('dominant-baseline','middle');te.setAttribute('fill','rgba(74,48,16,.45)');te.setAttribute('font-size',sz);te.setAttribute('font-family','"Ma Shan Zheng",cursive');te.textContent=t;svg.appendChild(te);}
  for(var r=0;r<10;r++)ln(0,r*s,W,r*s);
  for(var c=0;c<9;c++){if(c===0||c===8){ln(c*s,0,c*s,H);}else{ln(c*s,0,c*s,4*s);ln(c*s,5*s,c*s,9*s);}}
  ln(3*s,0,5*s,2*s);ln(5*s,0,3*s,2*s);ln(3*s,7*s,5*s,9*s);ln(5*s,7*s,3*s,9*s);
  tx(2*s,4.5*s,'楚 河',s*.42);tx(6*s,4.5*s,'漢 界',s*.42);
  el.appendChild(svg);
  var grid=document.createElement('div');grid.className='grid';grid.id='bd';
  grid.style.gridTemplateColumns='repeat(9,'+s+'px)';grid.style.gridTemplateRows='repeat(10,'+s+'px)';
  grid.style.top=(-s/2)+'px';grid.style.left=(-s/2)+'px';grid.style.width=(9*s)+'px';grid.style.height=(10*s)+'px';
  el.appendChild(grid);}

/* ===== RENDER ===== */
function render(){if(!G)return;renderPieces();renderInfo();renderCap();}
function renderPieces(){
  var el=document.getElementById('bd');if(!el)return;el.innerHTML='';
  var cs=getComputedStyle(document.documentElement);var s=parseFloat(cs.getPropertyValue('--s'));var ps=parseFloat(cs.getPropertyValue('--ps'));
  var myTurn=isMyTurn();var mc=myColor();var flip=viewFlipped();
  var vm=sel?legalMoves(G.board,sel.r,sel.c):[];
  var inChk=!G.over&&isCheck(G.board,G.turn);var chkK=inChk?findKing(G.board,G.turn):null;
  for(var dr=0;dr<Ro;dr++)for(var dc=0;dc<Co;dc++){
    var r=flip?Ro-1-dr:dr,c=flip?Co-1-dc:dc;       // display (dr,dc) -> logical (r,c)
    var cl=document.createElement('div');cl.className='cell';cl.style.width=s+'px';cl.style.height=s+'px';
    if(!myTurn)cl.classList.add('off');
    if(sel&&sel.r===r&&sel.c===c)cl.classList.add('sel');
    for(var i=0;i<vm.length;i++){if(vm[i].r===r&&vm[i].c===c){cl.classList.add(G.board[r][c]?'can-cap':'can-move');break;}}
    if(lastMove){if(lastMove.fr===r&&lastMove.fc===c)cl.classList.add('last-from');if(lastMove.tr===r&&lastMove.tc===c)cl.classList.add('last-to');}
    if(chkK&&chkK.r===r&&chkK.c===c)cl.classList.add('in-check');
    var p=G.board[r][c];
    if(p){var pe=document.createElement('div');pe.className='pc '+(p.c==='r'?'rp':'bp');pe.style.width=ps+'px';pe.style.height=ps+'px';
      var fimg=FACE[p.n];
      if(fimg){pe.classList.add('hasface');pe.style.backgroundImage='url('+fimg+')';
        var lb=document.createElement('span');lb.className='pn';lb.style.fontSize=Math.max(9,ps*0.28)+'px';lb.textContent=p.n;pe.appendChild(lb);}
      else{pe.style.fontSize=(ps*0.5)+'px';pe.textContent=p.n;}
      cl.appendChild(pe);}
    (function(rr,cc){cl.addEventListener('click',function(){onClick(rr,cc);});})(r,c);
    el.appendChild(cl);}}
function renderInfo(){var p1=document.getElementById('pi1'),p2=document.getElementById('pi2');p1.className='pi';p2.className='pi';
  if(!G.over){if(G.turn==='r')p1.classList.add('act-r');else p2.classList.add('act-b');}
  var tt=document.getElementById('tt');
  if(G.over)tt.textContent='遊戲結束';
  else if(isMyTurn())tt.textContent='▶ 輪到你了';
  else tt.textContent=mode==='ai'?'▶ 電腦思考中...':'▶ 等待對手...';
  document.getElementById('mc').textContent='步數：'+G.mv;}
function renderCap(){[['cap1',G.cap1],['cap2',G.cap2]].forEach(function(x){var el=document.getElementById(x[0]);el.innerHTML='';
  x[1].forEach(function(p){var d=document.createElement('div');d.className='cm2 '+(p.c==='r'?'rp':'bp');var fimg=FACE[p.n];if(fimg){d.classList.add('hasface');d.style.backgroundImage='url('+fimg+')';d.title=p.n;}else{d.textContent=p.n;}el.appendChild(d);});});}

/* ===== CLICK ===== */
function onClick(r,c){if(!G||G.over||!isMyTurn())return;var mc2=myColor();var p=G.board[r][c];
  if(sel){var vm=legalMoves(G.board,sel.r,sel.c);var found=false;for(var i=0;i<vm.length;i++){if(vm[i].r===r&&vm[i].c===c){found=true;break;}}
    if(found){doPlayerMove(sel.r,sel.c,r,c);sel=null;return;}if(sel.r===r&&sel.c===c){sel=null;renderPieces();return;}
    if(p&&p.c===mc2){sel={r:r,c:c};renderPieces();return;}sel=null;renderPieces();return;}
  if(!p)return;if(p.c===mc2){sel={r:r,c:c};renderPieces();}}

function doPlayerMove(fr,fc,tr,tc){
  if(mode==='ai'){
    var cap=G.board[tr][tc];if(cap)G.cap1.push({n:cap.n,c:cap.c});G.board[tr][tc]=G.board[fr][fc];G.board[fr][fc]=null;G.mv++;G.turn='b';lastMove={fr:fr,fc:fc,tr:tr,tc:tc};render();if(cap){animCF(tr,tc);animCapture(tr,tc,cap);}checkEnd('b');if(!G.over)schedAI();
  }else if(mode==='host'){
    var cap=G.board[tr][tc];if(cap)G.cap1.push({n:cap.n,c:cap.c});G.board[tr][tc]=G.board[fr][fc];G.board[fr][fc]=null;G.mv++;G.turn='b';lastMove={fr:fr,fc:fc,tr:tr,tc:tc};
    peerSend({t:'state',state:G,lm:lastMove,hasCap:!!cap});render();if(cap){animCF(tr,tc);animCapture(tr,tc,cap);}
    if(isCheck(G.board,'b'))showBanner('將軍！','bt-red');checkEnd('b');if(G.over)setTimeout(showResult,400);
  }else{
    peerSend({t:'move',fr:fr,fc:fc,tr:tr,tc:tc});
  }
}

function schedAI(){if(aiTimer)clearTimeout(aiTimer);aiTimer=setTimeout(aiTurn,400+Math.random()*500);}
function aiTurn(){if(!G||G.over||G.turn!=='b')return;var m=aiThink(G);
  if(!m){G.over=true;G.winner='r';G.msg='黑方無子可動！';render();showResult();return;}
  var cap=G.board[m.tr][m.tc];if(cap)G.cap2.push({n:cap.n,c:cap.c});G.board[m.tr][m.tc]=G.board[m.fr][m.fc];G.board[m.fr][m.fc]=null;G.mv++;G.turn='r';lastMove={fr:m.fr,fc:m.fc,tr:m.tr,tc:m.tc};render();
  if(cap){animCF(m.tr,m.tc);animCapture(m.tr,m.tc,cap);}if(isCheck(G.board,'r'))showBanner('將軍！','bt-red');checkEnd('r');if(G.over)setTimeout(showResult,600);}
function checkEnd(nextTurn){if(!hasAnyLegal(G.board,nextTurn)){G.over=true;
  if(isCheck(G.board,nextTurn)){G.winner=nextTurn==='r'?'b':'r';G.msg=nextTurn==='r'?'紅方被將死！':'黑方被將死！';}
  else{G.winner=nextTurn==='r'?'b':'r';G.msg=nextTurn==='r'?'紅方無子可動！':'黑方無子可動！';}render();setTimeout(showResult,400);}}

function doSurrender(){if(!G||G.over)return;
  if(mode==='ai'){if(G.turn!=='r')return;if(!confirm('確定要投降嗎？'))return;G.over=true;G.winner='b';G.msg='你投降認輸！';render();showResult();}
  else if(mode==='host'){if(!confirm('確定要投降嗎？'))return;G.over=true;G.winner='b';G.msg='紅方投降認輸！';peerSend({t:'state',state:G,lm:lastMove});render();showResult();}
  else{if(!confirm('確定要投降嗎？'))return;peerSend({t:'surrender'});}}

function doRematch(){closeMo();
  if(mode==='ai'){if(aiTimer)clearTimeout(aiTimer);G=initState();sel=null;lastMove=null;buildBoard();render();showBanner('新局開始','bt-red');}
  else if(mode==='host'){G=initState();sel=null;lastMove=null;peerSend({t:'state',state:G,lm:null,rematch:true});buildBoard();render();showBanner('新局開始','bt-blue');}
  else{peerSend({t:'rematch'});}}

function animCF(r,c){var d=dispRC(r,c);var cells=document.querySelectorAll('.cell');var i=d[0]*Co+d[1];if(cells[i]){cells[i].classList.add('cap-flash');setTimeout(function(){cells[i].classList.remove('cap-flash');},500);}}
function animCapture(r,c,cap){var board=document.getElementById('boardEl');if(!board)return;
  var cs=getComputedStyle(document.documentElement);var s=parseFloat(cs.getPropertyValue('--s'));var ps=parseFloat(cs.getPropertyValue('--ps'));
  var d=dispRC(r,c);var x=d[1]*s,y=d[0]*s;var made=[];
  var fl=document.createElement('div');fl.className='cap-flash2';fl.style.left=x+'px';fl.style.top=y+'px';fl.style.width=(ps*1.1)+'px';fl.style.height=(ps*1.1)+'px';board.appendChild(fl);made.push(fl);
  if(cap){var g=document.createElement('div');g.className='cap-ghost '+(cap.c==='r'?'rp':'bp');g.style.left=x+'px';g.style.top=y+'px';g.style.width=ps+'px';g.style.height=ps+'px';
    if(FACE[cap.n]){g.classList.add('hasface');g.style.backgroundImage='url('+FACE[cap.n]+')';}else{g.style.fontSize=(ps*0.5)+'px';g.textContent=cap.n;}board.appendChild(g);made.push(g);}
  var ring=document.createElement('div');ring.className='cap-ring';ring.style.left=x+'px';ring.style.top=y+'px';ring.style.width=ps+'px';ring.style.height=ps+'px';board.appendChild(ring);made.push(ring);
  for(var i=0;i<9;i++){var ang=Math.PI*2*i/9;var d=ps*(0.75+Math.random()*0.4);var sh=document.createElement('div');sh.className='cap-shard';sh.style.left=x+'px';sh.style.top=y+'px';sh.style.setProperty('--dx',(Math.cos(ang)*d)+'px');sh.style.setProperty('--dy',(Math.sin(ang)*d)+'px');board.appendChild(sh);made.push(sh);}
  setTimeout(function(){made.forEach(function(e){if(e.parentNode)e.parentNode.removeChild(e);});},700);}
function showBanner(text,cls){var b=document.getElementById('banner'),inner=document.getElementById('bannerInner');if(bannerTO)clearTimeout(bannerTO);inner.textContent=text;inner.className=cls;inner.style.animation='none';void inner.offsetHeight;inner.style.animation='bpop .6s ease-out';b.classList.add('show');bannerTO=setTimeout(function(){b.classList.remove('show');},1200);}
function showResult(){if(!G)return;var t,m;
  if(G.winner===myColor()){t='你贏了！🎉';m=G.msg;}else if(G.winner===oppColor()){t=mode==='ai'?'電腦贏了！':'對手贏了！';m=G.msg;}else{t='和局！';m=G.msg;}
  document.getElementById('mT').textContent=t;document.getElementById('mM').textContent=m;document.getElementById('modal').classList.add('show');}
function closeMo(){document.getElementById('modal').classList.remove('show');}

/* ===== 自選人物 ===== */
var FP_RED=[['帥','帥'],['俥','俥'],['傌','傌'],['炮','炮'],['相','相'],['仕','仕'],['兵','兵']];
var FP_BLACK=[['將','將'],['車','車'],['馬','馬'],['包','包'],['象','象'],['士','士'],['卒','卒']];
var fpPick=null;var uCounter=0;var CUSTOM={};
function gameShown(){return document.getElementById('game').classList.contains('show');}
function openFacePicker(){if(!fpPick)fpPick='帥';renderPicker();document.getElementById('faceMo').classList.add('show');}
function closeFacePicker(){document.getElementById('faceMo').classList.remove('show');}
function pickSlot(n){fpPick=n;renderPicker();}
function assignFace(pid){if(!fpPick)return;faceSel[fpPick]=pid;buildFACE();renderPicker();if(document.getElementById('game').classList.contains('show'))render();}
function renderPicker(){
  function slots(elId,list,side){var el=document.getElementById(elId);el.innerHTML='';
    list.forEach(function(it){var n=it[0];var s=document.createElement('div');s.className='fp-slot '+side+(fpPick===n?' sel':'');s.onclick=function(){pickSlot(n);};
      var f=document.createElement('div');f.className='fp-face';if(FACE[n])f.style.backgroundImage='url('+FACE[n]+')';
      var r=document.createElement('div');r.className='fp-role';r.textContent=n;
      s.appendChild(f);s.appendChild(r);el.appendChild(s);});}
  slots('fpRed',FP_RED,'red');slots('fpBlack',FP_BLACK,'black');
  var pool=document.getElementById('fpPool');pool.innerHTML='';
  var curId=fpPick?faceSel[fpPick]:null;
  Object.keys(POOL).forEach(function(pid){var d=document.createElement('div');d.className='fp-p'+(pid===curId?' used':'')+(CUSTOM[pid]?' custom':'');d.style.backgroundImage='url('+POOL[pid]+')';d.onclick=function(){assignFace(pid);};
    if(CUSTOM[pid]){var x=document.createElement('button');x.className='fp-del';x.innerHTML='&times;';x.title='刪除';x.onclick=function(e){e.stopPropagation();delFace(pid);};d.appendChild(x);}
    pool.appendChild(d);});
  var hint=document.getElementById('fpHint');if(hint)hint.textContent=fpPick?('正在更換：'+fpPick+'　點人物庫挑選'):'先點下方棋子，再從人物庫挑選頭像';
}
function resetFaces(){faceSel=Object.assign({},DEFAULT_SEL);buildFACE();renderPicker();if(document.getElementById('game').classList.contains('show'))render();}
function randomFaces(){var ids=Object.keys(POOL);function rnd(){return ids[Math.floor(Math.random()*ids.length)];}
  FP_RED.concat(FP_BLACK).forEach(function(it){faceSel[it[0]]=rnd();});buildFACE();renderPicker();if(document.getElementById('game').classList.contains('show'))render();}
function addUploadedImage(dataURL,cb){var img=new Image();img.onload=function(){
    var sz=96;var c=document.createElement('canvas');c.width=sz;c.height=sz;var ctx=c.getContext('2d');
    var s=Math.min(img.width,img.height);var sx=(img.width-s)/2;var sy=(img.height-s)*0.18;if(sy<0)sy=0;if(sy+s>img.height)sy=img.height-s;
    try{ctx.filter='contrast(1.08) saturate(1.18)';}catch(e){}
    ctx.drawImage(img,sx,sy,s,s,0,0,sz,sz);
    var id='u'+(uCounter++);POOL[id]=c.toDataURL('image/jpeg',0.82);CUSTOM[id]=1;if(cb)cb(id);};
  img.onerror=function(){alert('圖片讀取失敗');};img.src=dataURL;}
function handleFaceUpload(input){var files=input.files;if(!files||!files.length)return;var first=true;
  Array.prototype.forEach.call(files,function(f){if(!/^image\//.test(f.type))return;var rd=new FileReader();
    rd.onload=function(){addUploadedImage(rd.result,function(id){if(first&&fpPick){faceSel[fpPick]=id;buildFACE();first=false;}renderPicker();if(gameShown())render();});};
    rd.readAsDataURL(f);});
  input.value='';}
function delFace(pid){delete POOL[pid];delete CUSTOM[pid];
  for(var n in faceSel){if(faceSel[n]===pid)faceSel[n]=DEFAULT_SEL[n]||Object.keys(POOL)[0];}
  buildFACE();renderPicker();if(gameShown())render();}
try{initAvatarPicker();}catch(e){console.error('avatar init',e);}
try{var _lg=document.getElementById('logoLobby'),_gg=document.getElementById('logoGame');if(_lg&&_gg)_gg.src=_lg.src;}catch(e){}
</script>
