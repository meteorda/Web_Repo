<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Agent 完整架構 · 流光互動圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{
  --bg:#0f1a36;--bg2:#15234a;--ink:#e8eefc;--mute:#97a6c8;--line:#2a3b6b;--panel:#121f42;
  --goal:#5fd08a;--planner:#5b9dff;--reason:#f5b73b;--memory:#a98bff;--tool:#ff9a4d;--mcp:#7c8cff;
  --reflect:#ff6b7a;--func:#46c6f0;--final:#5fd08a;--task:#35c7b4;--display:#f5b73b;--loop:#9fb3df;
  --flow:1;
}
body.light{--bg:#f3f6fb;--bg2:#e8eef8;--ink:#1d2742;--mute:#5d6b8a;--line:#c9d4e8;--panel:#ffffff}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
button,select,input,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--func);outline-offset:2px}
/* 同色系卷軸 */
:root{--sb-track:var(--bg);--sb-thumb:color-mix(in srgb,var(--planner) 45%,var(--line));--sb-hover:var(--planner)}
*{scrollbar-width:thin;scrollbar-color:var(--sb-thumb) var(--sb-track)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--sb-track)}
::-webkit-scrollbar-thumb{background:var(--sb-thumb);border-radius:10px;border:2px solid var(--sb-track)}
::-webkit-scrollbar-thumb:hover{background:var(--sb-hover)}
::-webkit-scrollbar-corner{background:var(--sb-track)}
aside ::-webkit-scrollbar-track,aside{--sb-track:var(--bg2)}
textarea::-webkit-scrollbar-track,pre::-webkit-scrollbar-track{background:transparent}
pre{--sb-track:#0a1228}

/* header */
header{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--bg2);flex-wrap:wrap}
header h1{margin:0;font-size:20px;font-weight:900;letter-spacing:.02em}
header h1 span{font-weight:400;color:var(--mute);font-size:13px;margin-left:8px}
.hgap{flex:1}
.btn{border:1px solid var(--line);background:transparent;color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--func)}
.btn.pri{background:var(--planner);border-color:var(--planner);color:#fff}
.btn.on{background:var(--reflect);border-color:var(--reflect);color:#fff}
.spd{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--reflect)}
.dot.ok{background:var(--goal)}

main{flex:1;display:flex;min-height:0}
/* 圖上文字一律單行，超出時自動縮字 */
.node .tt,.node .sb,.node.loopi .r{white-space:nowrap;overflow:hidden;text-overflow:clip}
.node.chip .tt{flex:1;min-width:0}
.node.box .txt,.node.sub,.node.cont{min-width:0}
#stageWrap{flex:1;overflow:auto;position:relative;
  background:radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0) 0 0/24px 24px}
#stage{position:relative;width:1110px;height:1160px;transform-origin:0 0;margin:0 auto}
#edges{position:absolute;inset:0;width:1110px;height:1160px;pointer-events:none;overflow:visible}
.e-base{fill:none;stroke:var(--line);stroke-width:2}
.e-flow{fill:none;stroke-width:2.5;stroke-dasharray:6 14;stroke-linecap:round;
  animation:dash calc(1.2s / var(--flow)) linear infinite;opacity:.75;filter:drop-shadow(0 0 3px currentColor)}
@keyframes dash{to{stroke-dashoffset:-20}}
.e-lbl{font-size:11px;fill:var(--mute)}
.edge.hot .e-flow{opacity:1;stroke-width:3.5}
.edge.hot .e-lbl{fill:var(--ink);font-weight:700}
.dim .edge:not(.hot){opacity:.18}
.dim .node:not(.rel):not(.sel){opacity:.35}

/* nodes */
.node{position:absolute;border-radius:12px;cursor:pointer;color:var(--ink);
  border:1.5px solid color-mix(in srgb,var(--c) 70%,transparent);
  background:color-mix(in srgb,var(--c) 14%,var(--panel));transition:opacity .25s,transform .2s,box-shadow .25s}
.node:hover{transform:translateY(-2px);box-shadow:0 6px 18px color-mix(in srgb,var(--c) 30%,transparent)}
.node.box{display:flex;align-items:center;gap:12px;padding:8px 16px}
.node .ic{font-size:24px;flex:none}
.node .tt{font-weight:700;font-size:16px;color:var(--c)}
.node .sb{font-size:12px;color:var(--mute);margin-top:2px;line-height:1.35}
.node.box .txt{flex:1;text-align:center}
.node.cont{background:color-mix(in srgb,var(--c) 7%,transparent);border-style:dashed;padding:10px;text-align:center}
.node.cont .tt{font-size:15px}
.node.chip{display:flex;align-items:center;gap:6px;padding:0 10px;font-size:13px;border-radius:8px;background:var(--panel)}
.node.chip .tt{font-size:13px;font-weight:500;color:var(--ink)}
.node.chip .ic{font-size:14px}
.node.sub{display:flex;flex-direction:column;justify-content:center;padding:6px 12px;background:var(--panel)}
.node.sub .tt{font-size:14px;color:var(--ink)}
.node.loopi{display:grid;grid-template-columns:96px 1fr;align-items:stretch;padding:0;overflow:hidden;background:var(--panel)}
.node.loopi .l{display:flex;flex-direction:column;justify-content:center;align-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);font-weight:700;font-size:13px;color:var(--c)}
.node.loopi .l small{font-weight:400;color:var(--mute)}
.node.loopi .r{display:flex;align-items:center;justify-content:center;font-size:13px;padding:0 10px;text-align:center}
.node.steps{padding:8px 12px;background:var(--panel)}
.node.steps div{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
.node.steps div b{color:var(--c);font-weight:500}
.node.steps div.act{background:color-mix(in srgb,var(--reason) 30%,transparent);border-radius:4px;padding:2px 4px}
.node.sel{z-index:5;box-shadow:0 0 0 2px var(--c),0 0 28px color-mix(in srgb,var(--c) 60%,transparent)}
.node.sel::before{content:"";position:absolute;inset:-4px;border-radius:15px;padding:2px;
  background:conic-gradient(from var(--a),transparent 0 60%,var(--c) 80%,#fff 88%,transparent 92%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  animation:spin 2.4s linear infinite;pointer-events:none}
@keyframes spin{to{--a:360deg}}
#narr{position:sticky;bottom:12px;margin:0 auto;width:min(680px,92%);background:var(--panel);border:1px solid var(--line);
  border-left:4px solid var(--reason);padding:10px 14px;border-radius:10px;font-size:14px;line-height:1.6;display:none;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#narr b{color:var(--reason)}

/* right panel */
.zoom{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.zoom .btn{padding:5px 10px}
.zoom input{width:110px;accent-color:var(--planner)}
#zVal{min-width:40px;text-align:right;color:var(--ink)}
#split{width:6px;flex:none;cursor:col-resize;background:var(--line);transition:background .2s;position:relative}
#split:hover,#split.drag,#split:focus-visible{background:var(--planner)}
#split::after{content:"⋮";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--mute);font-size:14px}
body.resizing{cursor:col-resize;user-select:none}
.ptool{display:flex;align-items:center;gap:6px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mute)}
.ptool .btn{padding:3px 9px;font-size:12px}
.pane{zoom:var(--pz,1)}
aside{width:440px;flex:none;border-left:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:none;color:var(--mute);padding:12px 0;font-size:14px;cursor:pointer;border-bottom:2px solid transparent}
.tabs button.act{color:var(--ink);border-bottom-color:var(--planner);font-weight:700}
.pane{flex:1;overflow:auto;padding:18px 20px;display:none;min-height:0}
.pane.act{display:flex;flex-direction:column}
#info h2{margin:4px 0 4px;font-size:22px;line-height:1.3;color:var(--c,var(--ink))}
#info .sub2{color:var(--mute);font-size:13px;margin-bottom:14px}
#info p{line-height:1.8;font-size:14.5px;margin:0 0 14px}
#info h3{font-size:14px;margin:18px 0 8px;color:var(--ink);border-left:3px solid var(--c,var(--planner));padding-left:8px}
#info ul{margin:0;padding-left:20px;line-height:1.8;font-size:14px}
.scene{background:color-mix(in srgb,var(--reason) 12%,transparent);border:1px solid color-mix(in srgb,var(--reason) 40%,transparent);border-radius:8px;padding:10px 12px;font-size:13.5px;line-height:1.7}
pre{background:#0a1228;color:#d6e2ff;padding:14px 16px;border-radius:8px;font-size:13.5px;overflow:auto;line-height:1.6;white-space:pre-wrap;flex:none;min-height:3em;max-height:none;margin:0}
#info.act,#org.act{display:block}
#info>*{flex-shrink:0}
.rels{display:flex;flex-wrap:wrap;gap:6px}
.rels button{font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.rels button:hover{border-color:var(--func)}
.askbar{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap}

/* 名詞 */
.g{border-bottom:1.5px dotted var(--reason);cursor:help}
.g:hover,.g:focus{background:color-mix(in srgb,var(--reason) 20%,transparent);outline:none}
#gpop{position:fixed;display:none;z-index:80;background:var(--panel);color:var(--ink);border:1px solid var(--reason);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.7;box-shadow:0 10px 30px rgba(0,0,0,.35);pointer-events:none}
#gpop b{font-size:15px;color:var(--reason)}
.gc{float:right;font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:10px;padding:0 6px}
.gf{display:block;color:var(--mute);font-size:12.5px;margin:2px 0 4px}
.glist .gi,#glist .gi{padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px;line-height:1.7}
.gi b{color:var(--reason);font-size:14.5px;margin-right:6px}
.ga{font-size:12px;color:var(--mute)}
/* 匯出 */
#expMenu{position:fixed;display:none;z-index:60;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px;width:270px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#expMenu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--ink);padding:9px 12px;border-radius:6px;font-size:13.5px;cursor:pointer}
#expMenu button:hover{background:color-mix(in srgb,var(--planner) 20%,transparent)}
#expMenu .eh{font-size:12px;color:var(--mute);padding:6px 12px 2px}
#recBar{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:90;display:none;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--reflect);border-radius:30px;padding:6px 8px 6px 16px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#recBar .rdot{width:10px;height:10px;border-radius:50%;background:var(--reflect);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
/* chat */
#chatLog{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
.msg{padding:10px 12px;border-radius:10px;font-size:14px;line-height:1.75;max-width:100%}
.msg.u{background:color-mix(in srgb,var(--planner) 22%,transparent);align-self:flex-end;max-width:88%}
.msg.a{background:var(--panel);border:1px solid var(--line)}
.msg table{border-collapse:collapse;font-size:12.5px;margin:6px 0;width:100%}
.msg td,.msg th{border:1px solid var(--line);padding:4px 6px;text-align:left}
.msg h4{margin:10px 0 4px;font-size:15px}
.msg code{background:color-mix(in srgb,var(--func) 15%,transparent);padding:1px 4px;border-radius:4px}
.msg pre code{background:none;padding:0}
.ctx{font-size:12px;color:var(--mute);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chips button{font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer}
.chips button:hover{border-color:var(--reason)}
.inrow{display:flex;gap:8px}
select option,select optgroup{color:#000;background:#fff}
select option:checked{color:#000;background:#dbe6ff}
textarea,input[type=text],input[type=password],select{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px}
textarea{resize:vertical}
label.f{font-size:13px;color:var(--mute);display:block;margin:12px 0 6px}
#orgOut{margin-top:12px}

/* modal */
#modal{position:fixed;inset:0;background:rgba(5,10,25,.6);display:none;align-items:center;justify-content:center;z-index:50}
#modal .box{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:22px;width:min(460px,92%)}
#modal h3{margin:0 0 6px}
.note{font-size:12px;color:var(--mute);line-height:1.6}

@media (max-width:900px){#split{display:none}main{flex-direction:column}aside{width:100% !important;height:55%;border-left:none;border-top:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){.e-flow,.node.sel::before{animation:none}}
</style>
</head>
<body>
<header>
  <h1>AI Agent 完整架構<span>點選任一元件，右側即時說明</span></h1>
  <div class="hgap"></div>
  <select id="caseSel" class="btn" title="切換產業案例或作業流程" style="width:auto;max-width:210px"></select>
  <button class="btn" id="genCase" title="輸入任一產業，由 Groq 生成案例">＋ AI 生成案例</button>
  <button class="btn pri" id="playBtn">▶ 流程演示</button>
  <label class="spd">流光速度 <input type="range" id="spd" min="0.3" max="3" step="0.1" value="1"></label>
  <div class="zoom" title="圖表比例（Ctrl + 滾輪也可縮放）">
    <button class="btn" id="zOut" aria-label="縮小">−</button>
    <input type="range" id="zRange" min="40" max="200" step="5" value="100" aria-label="圖表比例">
    <button class="btn" id="zIn" aria-label="放大">＋</button>
    <span id="zVal">100%</span>
    <button class="btn" id="fitBtn" title="縮放至畫面寬度">⤢ 符合寬度</button>
  </div>
  <button class="btn" id="themeBtn">☀ 淺色</button>
  <button class="btn" id="expBtn" title="輸出圖像或影片">⬇ 匯出</button>
  <button class="btn" id="keyBtn"><span class="dot" id="keyDot"></span>Groq 設定</button>
</header>
<main>
  <div id="stageWrap">
    <div id="stage">
      <svg id="edges" viewBox="0 0 1110 1160"></svg>
    </div>
    <div id="narr"></div>
  </div>
  <div id="split" title="拖曳調整左右比例（雙擊還原）" role="separator" aria-orientation="vertical" tabindex="0"></div>
  <aside>
    <div class="ptool"><span>說明字級</span><button class="btn" id="fOut">A−</button><span id="fVal">100%</span><button class="btn" id="fIn">A＋</button><span class="note" style="margin-left:auto">寬度 <b id="wVal">440</b>px</span></div>
    <div class="tabs">
      <button class="act" data-t="info">元件說明</button>
      <button data-t="chat">AI 問答</button>
      <button data-t="org">資料整理</button>
      <button data-t="gloss">名詞庫</button>
    </div>
    <div class="pane act" id="info"></div>
    <div class="pane" id="chat">
      <div class="ctx" id="chatCtx"></div>
      <div class="chips" id="chatChips"></div>
      <div id="chatLog"></div>
      <div class="inrow">
        <textarea id="chatIn" rows="2" placeholder="針對 AI Agent 架構提問…（Enter 送出，Shift+Enter 換行）"></textarea>
        <button class="btn pri" id="chatSend">送出</button>
      </div>
      <button class="btn" id="chatClear" style="margin-top:8px;align-self:flex-start">清除對話</button>
    </div>
    <div class="pane" id="gloss">
      <div class="inrow"><input type="text" id="gq" placeholder="搜尋名詞，例如 ECO、slack、MCP"><select id="gcat" style="width:auto;max-width:60%"></select></div>
      <div id="glist" style="margin-top:6px"></div>
    </div>
    <div class="pane" id="org">
      <div class="note">貼上文字或上傳檔案（TXT／MD／PDF／DOCX），由 Groq 依 AI Agent 架構整理。</div>
      <label class="f">整理方式</label>
      <select id="orgMode">
        <option value="map">對應到 Agent 七大元件（表格）</option>
        <option value="design">設計成一個可執行的 Agent 方案</option>
        <option value="sum">重點摘要（條列）</option>
        <option value="lesson">轉成教學講義</option>
        <option value="quiz">出 5 題選擇題（附解析）</option>
      </select>
      <label class="f">資料內容</label>
      <textarea id="orgIn" rows="8" placeholder="例：我想做一個每天早上自動整理產業新聞，寄到 Email 的助理…"></textarea>
      <div class="inrow" style="margin-top:8px">
        <label class="btn" style="flex:none">📎 上傳檔案<input type="file" id="orgFile" accept=".txt,.md,.csv,.json,.pdf,.docx" hidden></label>
        <button class="btn pri" id="orgRun" style="flex:1;justify-content:center">開始整理</button>
      </div>
      <div id="orgOut"></div>
      <div class="inrow" id="orgAct" style="margin-top:8px;display:none">
        <button class="btn" id="orgCopy">複製</button>
        <button class="btn" id="orgDl">下載 .md</button>
      </div>
    </div>
  </aside>
</main>

<div id="expMenu" role="menu">
  <div class="eh">圖像</div>
  <button data-exp="png">🖼️ PNG 架構圖（2 倍高解析）</button>
  <button data-exp="jpg">🖼️ JPG 架構圖</button>
  <button data-exp="frame">🧾 PNG 架構圖＋說明（1920×1080）</button>
  <div class="eh">影片</div>
  <button data-exp="play">🎬 MP4 流程演示（完整 20 步）</button>
  <button data-exp="loop">🎞️ MP4 目前畫面流光（10 秒）</button>
  <div class="note" style="padding:6px 12px 2px">影片含架構圖與右側說明，依目前產業、主題與流光速度錄製。</div>
</div>
<div id="modal">
  <div class="box">
    <h3>Groq API 設定</h3>
    <div class="note">金鑰只存在這台電腦的瀏覽器（localStorage），直接送往 api.groq.com。到 console.groq.com 申請。</div>
    <label class="f">API Key</label>
    <input type="password" id="keyIn" placeholder="gsk_...">
    <label class="f">模型</label>
    <div class="inrow"><select id="modelIn">
      <option value="openai/gpt-oss-120b">openai/gpt-oss-120b（推薦）</option>
      <option value="qwen/qwen3.6-27b">qwen/qwen3.6-27b（預覽版）</option>
      <option value="openai/gpt-oss-20b">openai/gpt-oss-20b（快速）</option>
    </select><button class="btn" id="modelLoad" style="flex:none" title="用金鑰向 Groq 取得目前可用模型">↻ 載入可用模型</button></div>
    <label class="f">或自訂模型名稱（選填）</label>
    <input type="text" id="modelCustom" placeholder="留空則用上方選單">
    <div class="inrow" style="margin-top:16px;justify-content:flex-end">
      <button class="btn" id="keyTest">測試連線</button>
      <button class="btn" id="keyCancel">取消</button>
      <button class="btn pri" id="keySave">儲存</button>
    </div>
    <div class="note" id="keyMsg" style="margin-top:8px"></div>
  </div>
</div>

<script>
/* ============ 元件資料 ============ */
const SCENE_GOAL = '幫我做一份競爭對手分析並發到 Slack';
const N = {
goal:{x:300,y:20,w:400,h:70,k:'box',c:'goal',ic:'👤',t:'使用者目標（User Goal）',s:'例：'+SCENE_GOAL,
 d:'使用者目標是整個 Agent 運作的起點。和一般聊天不同，Agent 接收的是「要完成的任務」，而不只是一個問題。目標越明確（產出形式、對象、期限），後面的規劃就越準確。',

  if(C!==CASES.general&&id==='actionInput'){const s=(C.sc||{}).actionInput||'',i=s.indexOf('{');
    if(i>=0){const j=s.slice(i);try{return JSON.stringify({name:(s.match(/Action：(\w+)/)||[])[1]||((C.sc||{}).action||'').replace(/^Action：\s*/,'').split(/[（(\s]/)[0]||'tool',arguments:JSON.parse(j)},null,2)}catch(e){return j}}}
  if(C!==CASES.general&&id==='mcp'){const m=C.chips.find(c=>c[0].startsWith('m_'));if(m)return `// ${N[m[0]].t}\n{\n  "method": "tools/call",\n  "params": {"name": "${m[0].slice(2)}_query", "arguments": {...}}\n}`}
  return n.ex||'';
}

/* ============ IC 設計：每個元件的完整說明 ============ */
CASES.icd.desc={
goal:'IC 設計在 tape-out 前最耗時的階段之一是 timing closure（時序收斂）。PD（Physical Design，後段實體設計）工程師每跑完一次 STA（Static Timing Analysis，靜態時序分析），就會得到數萬條路徑的報告，必須找出時序違例、判斷原因、提出 ECO（Engineering Change Order，設計變更）。這個目標交給 Agent：輸入是 STA 報告，產出是分類好的違例清單、修正建議與追蹤工單，讓工程師把時間花在判斷，而不是整理報告。',
planner:'Planner 把「時序收斂」這個大目標拆成可檢核的步驟，並依 sign-off 條件決定範圍：要看哪些 PVT corner（製程、電壓、溫度組合）、哪些 MCMM 情境（多模式多角落）、先處理 setup 還是 hold。實務上通常先處理最差 corner 的 setup 違例，因為它影響晶片能跑的最高頻率；hold 違例則多半在後段修。',
steps:'IC 設計的五個步驟：① 擷取 STA 報告：讀取 PrimeTime 等工具輸出的時序報告，取得 WNS（最差負 slack）、TNS（總負 slack）與違例路徑。② 歸類違例路徑：依 clock domain、startpoint／endpoint、路徑類型（reg-to-reg、input-to-reg、跨時脈域）分群。③ 比對歷史修正：查詢過去相似路徑用過的 ECO 手法與效果。④ 產出 ECO 建議：針對每一群提出修正方式並預估改善幅度。⑤ 開 Jira 通知：把建議與負責人綁成工單追蹤。',
loop:'推理循環在 IC 設計中，就是工程師平常「看報告 → 猜原因 → 查資料 → 驗證」的過程自動化。每一輪 Agent 會判斷下一步要解析哪個報告、查哪段歷史紀錄或規範，拿到結果後再判斷原因是否成立。例如：第 1 輪解析 setup 報告 → 第 2 輪發現違例集中在某個 clock domain → 第 3 輪查該區的 floorplan 與歷史 ECO → 第 4 輪確認是跨區繞線過長造成。',
thinking:'Thought 是 Agent 對違例原因的推理。IC 時序違例常見的原因包括：組合邏輯層數太多（logic depth）、驅動能力不足（cell 太小）、繞線過長或壅塞、時脈偏移（clock skew）過大、跨時脈域路徑未設定正確約束（應為 false path 或 multicycle path）。推理時會參考 slack 大小、路徑分布位置與歷史經驗，判斷屬於哪一類。',
action:'Action 決定這一輪要用哪個工具：要解析新的報告就選 Python／Tcl 腳本；要找過去的解法就查歷史 ECO 資料庫；要確認規範就透過 MCP 查 Confluence；要取得約束檔就從 Git／Perforce 拉。如果判斷這一步已有足夠資訊，Action 會選「finish」結束這一步。',
actionInput:'Action Input 是呼叫工具的參數。在 IC 設計中通常要明確指定：報告檔路徑、block 名稱、PVT corner、分析類型（setup／hold）、要取前幾條最差路徑（top N）、以及 slack 門檻。參數錯了（例如 corner 名稱拼錯）工具會回傳錯誤，Agent 要依錯誤訊息修正後重試。',
obs:'Observation 是工具回傳的結果，例如：「解析出 512 條 setup 違例，WNS -85ps、TNS -12.4ns，前 3 個 clock domain 佔 85%」。這些數字會寫進工作記憶，成為下一輪推理的依據。若回傳的是錯誤（找不到檔案、license 不足），Agent 會據此改變做法。',
memory:'IC 設計的記憶分三層。長期記憶保存公司累積的設計知識：製程設計規範、各 block 負責人、歷次 tape-out 的時序收斂紀錄與 ECO 慣例。短期記憶保存這次對話的指示，例如「先處理 setup」。工作記憶保存本次分析的進度與中間結果。設計資料屬高度機密，記憶庫應放在公司內部。',
longMem:'長期記憶就是公司的「設計經驗庫」：製程節點的設計規則與 sign-off 準則、每個 block 的負責人與介面、上一版 tape-out 哪些路徑難收斂、當時用了什麼 ECO 手法。新進工程師最缺的就是這些經驗，Agent 把它變成可檢索的知識。',
shortMem:'短期記憶記住本次對話中工程師給的限制與偏好，例如「先處理 setup，hold 下一輪再看」「這個 block 不准再加 buffer，面積已經滿了」「只看 SS corner」。這些指示會影響後續每一步的判斷。',
workMem:'工作記憶是本次分析的進度板：已解析多少條路徑、分成幾類、哪幾類已找到歷史解法、哪幾類還需要人工判斷。長時間的分析中斷後，也能從工作記憶接續，不用重跑。',
tool:'工具讓 Agent 能實際操作 IC 設計資料。原則是「讀取與分析可以自動，修改設計要人工」：解析報告、統計分群、查歷史資料都可自動執行；ECO 指令只產生草稿，不直接套用到設計資料庫。工具通常在公司內部的運算環境執行，資料不離開內網。',
t_web:'查詢 IP 供應商的文件與介面規格，例如 DDR PHY、SerDes、PCIe 等 IP 的時序要求與約束建議。這類資料決定介面路徑的正確約束方式，是判斷違例是否「真的違例」的依據。',
t_code:'用 Python 或 Tcl 解析 PrimeTime 等 STA 工具的文字報告，抽出每條路徑的 startpoint、endpoint、slack、clock、經過的 cell 與延遲。數萬行報告人工看不完，腳本可以在幾秒內整理成表格。',
t_ana:'對違例路徑做統計分群：依 clock domain、block、路徑類型、slack 區間分類，找出違例集中在哪裡。通常 80% 的違例集中在少數幾個群組，先處理這些群組最有效率。',
t_db:'查詢公司過去的 ECO 紀錄：相似路徑（同一 IP 介面、同類型 cell、同一區域）當時用了什麼修正手法、改善了多少 slack、有沒有副作用。這是把資深工程師經驗傳承下來的關鍵。',
t_mail:'分析完成後，以 Email 或 Teams 通知 PD 與前段設計團隊，附上違例摘要、ECO 建議與 Jira 單號。前段團隊需要知道是否要修改 RTL 或約束。',
t_slk:'依建議產生 ECO 指令草稿，例如 cell 放大（upsizing）、插入 buffer、Vt 置換（把 HVT 換成 LVT 以加速）。草稿只供工程師參考與審核，不會自動執行到設計資料庫。',
mcp:'MCP 讓 Agent 用統一方式連接公司內部系統，不用為每個系統各寫一套整合。IC 設計常見的連接對象：版本控管（Git／Perforce）取得約束檔與網表、Confluence 查設計規範、Jira 開單追蹤、運算叢集排程送出重跑 STA 的工作。每個系統只要提供一個 MCP Server，所有 Agent 都能共用。',
m_gg:'透過 MCP 查詢 Confluence 上的設計規範、sign-off checklist 與過往 tape-out 的檢討文件。',
m_gh:'透過 MCP 從 Git 或 Perforce 取得對應版本的 SDC 時序約束檔、網表與設定檔，確保分析用的是正確版本，避免拿舊約束判斷新設計。',
m_no:'透過 MCP 在 Jira 建立 ECO 工單，填入違例群組、建議手法、負責人與期限，並追蹤後續狀態。',
m_mdb:'透過 MCP 讀取設計資料庫中的 block 資訊、floorplan 與 placement 位置，用來判斷違例是否與繞線距離或壅塞區域有關。',
m_ms:'透過 MCP 把重跑 STA 或驗證 ECO 效果的運算工作送到公司運算叢集（如 LSF），完成後取回結果。這類工作通常需要數小時，Agent 會在等待期間處理其他步驟。',
m_ot:'其他實作了 MCP Server 的內部系統，例如 EDA license 管理、IP 資料庫、設計審查系統，都能以同樣方式接入。',
human:'ECO 會改動網表，可能影響功能正確性與其他路徑的時序，因此必須由工程師確認。Agent 的權限設計通常是：讀取報告與資料庫可自動；開 Jira 單前請工程師確認內容；任何修改設計資料庫的指令只產生草稿，由工程師在 EDA 工具中審核後執行。',
reflection:'Reflection 檢查 ECO 建議有沒有副作用，這是 IC 設計最需要經驗的地方：cell 放大會增加功耗與面積；插入 buffer 可能造成 hold 違例或繞線壅塞；Vt 置換（換成低 Vt）會增加漏電流；任何修改都要符合 DRC（設計規則檢查）與 IR drop 限制。檢查不通過時，Agent 會改提其他手法，例如 useful skew（調整時脈到達時間）或請前段修改約束。',
stop:'終止條件：所有違例群組都有對策，或標記為「需人工判斷」；達到最大分析輪數；或缺少必要資料（例如缺某個 corner 的報告）時反問工程師。結束後彙整違例分類表、ECO 建議清單（含預估改善的 slack）與 Jira 單號。',
final:'給工程師的回答要直接講結論：違例總數、WNS／TNS、集中在哪幾個群組、各群組建議的修正方向、哪些需要人工判斷、工單已開給誰。例如：「共 512 條 setup 違例，85% 集中在 3 個群組，已提出 ECO 建議並開單給 PD 團隊，其中 DDR 介面那群建議先確認約束是否正確。」',
task:'實際產出的檔案與連結：ECO 建議表（每條路徑的原因、建議手法、預估改善）、違例分類報告、ECO 指令草稿、Jira 工單連結。這些產出會留存在專案目錄，成為下一次 tape-out 的長期記憶。',
display:'結果以兩種方式呈現：智慧卡片呈現違例分佈圖、ECO 清單與工單按鈕，工程師可直接點開；自然語言說明重點結論與需要注意的地方。',
card:'卡片內容：各 clock domain 違例數長條圖、slack 分布圖、ECO 建議表（可排序、可下載）、Jira 工單按鈕。工程師一眼就能看出問題集中在哪。',
nl:'以對話方式說明重點，工程師可以接著追問，例如「DDR 那群為什麼不建議加 buffer？」「如果改用 useful skew 預估能改善多少？」。',

function glossify(root,addList){
  const seen=new Map(),walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('pre,code,button,.g,.glist,h2,summary')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(tn=>{
    const txt=tn.nodeValue;GL_RE.lastIndex=0;let m,last=0,frag=null;
    while(m=GL_RE.exec(txt)){
      const g=GL[m[0]];if(seen.has(g[0]))continue;seen.set(g[0],g);
      frag=frag||document.createDocumentFragment();
      frag.appendChild(document.createTextNode(txt.slice(last,m.index)));
      const s=document.createElement('span');s.className='g';s.dataset.g=m[0];s.textContent=m[0];s.tabIndex=0;frag.appendChild(s);
      last=m.index+m[0].length;
    }
    if(frag){frag.appendChild(document.createTextNode(txt.slice(last)));tn.parentNode.replaceChild(frag,tn)}
  });
  if(addList&&seen.size){
    const box=document.createElement('div');box.className='glist';
    box.innerHTML=`<h3>📖 本頁名詞解釋（${seen.size}）</h3>`+[...seen.values()].map(g=>`<div class="gi"><b>${esc(g[0])}</b><span class="gf">${esc(g[1])}</span><div>${esc(g[2])}</div></div>`).join('');
    const ask=root.querySelector('.askbar');ask?root.insertBefore(box,ask):root.appendChild(box);
  }
}
/* 名詞浮動說明 */
const gpop=document.createElement('div');gpop.id='gpop';document.body.appendChild(gpop);
function showG(el){
  const g=GL[el.dataset.g];if(!g)return;
  gpop.innerHTML=`<b>${esc(g[0])}</b><span class="gc">${esc(catsOf(g).join('、'))}</span><div class="gf">${esc(g[1])}</div><div>${esc(g[2])}</div>`;
  gpop.style.display='block';const r=el.getBoundingClientRect(),w=Math.min(320,window.innerWidth-20);
  gpop.style.width=w+'px';gpop.style.left=Math.max(10,Math.min(r.left,window.innerWidth-w-10))+'px';
  const h=gpop.offsetHeight;gpop.style.top=(r.bottom+8+h>window.innerHeight?r.top-h-8:r.bottom+8)+'px';
}
document.addEventListener('mouseover',e=>{const el=e.target.closest&&e.target.closest('.g');if(el)showG(el)});
document.addEventListener('mouseout',e=>{if(e.target.closest&&e.target.closest('.g'))gpop.style.display='none'});
document.addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('g'))showG(e.target)});
document.addEventListener('focusout',()=>gpop.style.display='none');
document.addEventListener('click',e=>{const el=e.target.closest&&e.target.closest('.g');if(el){e.stopPropagation();showG(el)}});

function curCat(){const k=Object.keys(CASES).find(k=>CASES[k]===C);return CASE_CAT[k]||C.glossCat||C.name}
function fillGcat(){
  const sel=document.getElementById('gcat'),v=sel.value||'case';
  const cats=[...new Set(GLOSS.flatMap(catsOf))];
  sel.innerHTML=`<option value="case">${C.icon} 目前產業：${esc(curCat())}＋AI Agent</option><option value="all">全部（${GLOSS.length}）</option>`+cats.map(c=>`<option value="${esc(c)}">${esc(c)}（${GLOSS.filter(g=>catsOf(g).includes(c)).length}）</option>`).join('');
  sel.value=[...sel.options].some(o=>o.value===v)?v:'case';
}
function renderGlossary(){
  const q=(document.getElementById('gq').value||'').trim().toLowerCase(),sv=document.getElementById('gcat').value||'case';
  const want=sv==='case'?[curCat(),'AI Agent']:sv==='all'?null:[sv];
  const list=GLOSS.filter(g=>(!want||catsOf(g).some(c=>want.includes(c)))&&(!q||(g[0]+g[1]+g[2]+(g[4]||[]).join('')).toLowerCase().includes(q)));
  const order=want||[...new Set(GLOSS.flatMap(catsOf))];
  const groups=order.map(c=>[c,list.filter(g=>catsOf(g).includes(c)&&(!want||catsOf(g).find(x=>want.includes(x))===c))]).filter(x=>x[1].length);
  document.getElementById('glist').innerHTML=list.length?groups.map(([c,arr])=>`<h3>${esc(c)}（${arr.length}）</h3>`+arr.map(g=>`<div class="gi"><b>${esc(g[0])}</b>${g[4]?`<span class="ga">又稱：${esc(g[4].join('、'))}</span>`:''}<span class="gf">${esc(g[1])}</span><div>${esc(g[2])}</div></div>`).join('')).join(''):'<div class="note">找不到符合的名詞，換個關鍵字或切到「全部」試試。</div>';
}

const SYS='你是 AI Agent 架構的講師。一律使用繁體中文（台灣用語）回答，條理清楚，適度使用標題、條列與表格。本工具採修正後的架構：使用者目標 → 檢索長期記憶 → Planner 規劃步驟 → 每個步驟進入 Reasoning 推理循環（ReAct：Thought → Action → Action Input → 工具執行（原生工具或經 MCP）→ Observation → 再 Thought，每輪讀寫工作記憶；高風險動作需人工確認）→ Reflection 檢查（通過／修正重試／重新規劃）→ 完成判斷（全部完成、達上限或需補資訊）→ 彙整 Final Answer 與 Task 產物 → 互動展示；Reflection 並將經驗寫回長期記憶。';
/* ---- Groq：依 TPM 上限自動控管長度、429 自動等待重試 ---- */
const TPM_LIMIT=8000;
const estTok=s=>{let n=0;for(const ch of String(s))n+=ch.charCodeAt(0)>255?1.05:0.3;return Math.ceil(n)+4};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function fitMessages(messages,max){
  const budget=TPM_LIMIT-max-400,m=messages.map(x=>({...x}));
  const tot=()=>m.reduce((a,x)=>a+estTok(x.content),0);
  while(tot()>budget&&m.length>2){const i=m.findIndex((x,k)=>x.role!=='system'&&k<m.length-1);if(i<0)break;m.splice(i,1)}
  if(tot()>budget){const last=m[m.length-1],over=tot()-budget;last.content=String(last.content).slice(0,Math.max(200,String(last.content).length-Math.ceil(over*1.1)))+'\n…（內容過長已截斷）'}
  return m;
}
async function groq(messages,onTok,max=2500,onWait){
  if(!cfg.key){modal.style.display='flex';throw new Error('請先設定 Groq API Key')}
  const body={model:cfg.model,messages:fitMessages(messages,max),stream:true,temperature:.5,max_tokens:max};
  if(/gpt-oss/.test(cfg.model))body.reasoning_effort='low';
  let r;
  for(let tries=0;;tries++){
    r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+cfg.key},body:JSON.stringify(body)});
    if(r.status!==429||tries>=4)break;
    const t=await r.text(),m=t.match(/try again in ([\d.]+)\s*(ms|s|m)/i);
    let wait=+(r.headers.get('retry-after')||0)*1000;
    if(m)wait=Math.max(wait,+m[1]*(m[2]==='ms'?1:m[2]==='m'?60000:1000));
    wait=Math.min(Math.max(wait,3000)+500,65000);
    onWait&&onWait(Math.ceil(wait/1000));await sleep(wait);
  }
  if(!r.ok){const t=await r.text();
    if(/decommissioned|does not exist|model_not_found/i.test(t))throw new Error(`模型 ${cfg.model} 已停用，請到 Groq 設定按「載入可用模型」重新選擇。`);
    if(r.status===401)throw new Error('API Key 無效，請到 Groq 設定重新輸入。');
    if(r.status===413||/Request too large|tokens per minute/i.test(t))throw new Error('內容超過 Groq 免費方案每分鐘 Token 上限，請縮短內容或稍候一分鐘再試。');
    if(r.status===429)throw new Error('Groq 呼叫次數已達上限，請稍候一分鐘再試。');
    throw new Error('HTTP '+r.status+'：'+t.slice(0,160))}
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='',all='';
  while(true){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop();
    for(const l of lines){if(!l.startsWith('data:'))continue;const s=l.slice(5).trim();if(s==='[DONE]')continue;try{const tk=JSON.parse(s).choices?.[0]?.delta?.content||'';if(tk){all+=tk;onTok(all)}}catch(e){}}}
  return all;
}
/* 長文先分段摘要（map-reduce），避免超過每分鐘 Token 上限 */
async function digestLong(src,status,limit=2600){
  if(estTok(src)<=limit)return src;
  const chunks=[];let cur='',n=0;
  for(const para of String(src).split(/\n/)){const t=estTok(para);
    if(n+t>2400&&cur){chunks.push(cur);cur='';n=0}
    if(t>2400){for(let i=0;i<para.length;i+=2200)chunks.push(para.slice(i,i+2200));continue}
    cur+=para+'\n';n+=t}
  if(cur.trim())chunks.push(cur);
  const parts=[];
  for(let i=0;i<chunks.length;i++){
    status(`長文分段摘要 ${i+1}/${chunks.length}…`);
    const s=await groq([{role:'system',content:'你是資料整理助手，一律使用繁體中文（台灣用語）。'},{role:'user',content:'請把以下內容整理成重點條列，保留關鍵數據、專有名詞與結論，不超過 350 字：\n\n'+chunks[i]}],()=>{},900,w=>status(`已達每分鐘上限，等待 ${w} 秒後繼續（${i+1}/${chunks.length}）…`));
    parts.push(`【第 ${i+1} 段】\n`+s.replace(/<think>[\s\S]*?<\/think>/g,''));

function md(src){
  const blocks=[];src=src.replace(/<think>[\s\S]*?<\/think>/g,'');
  let s=esc(src).replace(/```(\w*)\n?([\s\S]*?)```/g,(m,l,c)=>{blocks.push(`<pre><code>${c}</code></pre>`);return `\u0000${blocks.length-1}\u0000`});
  const lines=s.split('\n'),out=[];let list=null,tbl=[];
  const flushT=()=>{if(!tbl.length)return;const rows=tbl.filter(r=>!/^\s*\|?\s*:?-{2,}/.test(r));
    out.push('<table>'+rows.map((r,i)=>'<tr>'+r.replace(/^\||\|$/g,'').split('|').map(c=>i?`<td>${c.trim()}</td>`:`<th>${c.trim()}</th>`).join('')+'</tr>').join('')+'</table>');tbl=[]};
  const flushL=()=>{if(list){out.push(`</${list}>`);list=null}};
  for(const l of lines){
    if(/^\s*\|.*\|\s*$/.test(l)){flushL();tbl.push(l.trim());continue}else flushT();
    let m;
    if(m=l.match(/^#{1,6}\s+(.*)/)){flushL();out.push(`<h4>${m[1]}</h4>`)}
    else if(m=l.match(/^\s*[-*•]\s+(.*)/)){if(list!=='ul'){flushL();out.push('<ul>');list='ul'}out.push(`<li>${m[1]}</li>`)}
    else if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){if(list!=='ol'){flushL();out.push('<ol>');list='ol'}out.push(`<li>${m[1]}</li>`)}
    else if(!l.trim()){flushL()}
    else{flushL();out.push(`<p style="margin:4px 0">${l}</p>`)}
  }
  flushL();flushT();
  return out.join('').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\u0000(\d+)\u0000/g,(m,i)=>blocks[i]);
}

/* 穩健的 JSON 呼叫：低推理成本、失敗時修復 failed_generation、再退回純文字擷取 */
function repairJSON(t){
  if(!t)return null;t=String(t).replace(/<think>[\s\S]*?<\/think>/g,'').replace(/```json|```/g,'').trim();
  const a=t.indexOf('{');if(a<0)return null;t=t.slice(a);
  const b=t.lastIndexOf('}');
  const tryP=x=>{try{return JSON.parse(x)}catch(e){return null}};
  let j=b>0&&tryP(t.slice(0,b+1));if(j)return j;
  let x=(b>0?t.slice(0,b+1):t).replace(/,\s*([}\]])/g,'$1');j=tryP(x);if(j)return j;
  // 補齊被截斷的括號
  x=t.replace(/,\s*$/,'');let st=[],inS=false,esc=false;
  for(const ch of x){if(inS){if(esc)esc=false;else if(ch==='\\')esc=true;else if(ch==='"')inS=false;continue}
    if(ch==='"')inS=true;else if(ch==='{'||ch==='[')st.push(ch==='{'?'}':']');else if(ch==='}'||ch===']')st.pop()}
  if(inS)x+='"';x=x.replace(/,\s*$/,'').replace(/:\s*$/,':null');
  return tryP((x+st.reverse().join('')).replace(/,\s*([}\]])/g,'$1'));
}
async function groqJSON(user,maxTokens=6000){
  const isOss=/gpt-oss/.test(cfg.model);
  const base={model:cfg.model,temperature:.4,max_tokens:maxTokens,
    messages:[{role:'system',content:'你只輸出一個合法的 JSON 物件，不要任何說明文字。字串內不可出現未跳脫的雙引號，需要引號時用「」。內容使用繁體中文（台灣用語）。'},{role:'user',content:user}]};
  if(isOss)base.reasoning_effort='low';
  const call=async body=>{const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',
    headers:{'Content-Type':'application/json',Authorization:'Bearer '+cfg.key},body:JSON.stringify(body)});
    const txt=await r.text();let data=null;try{data=JSON.parse(txt)}catch(e){}
    return{ok:r.ok,status:r.status,txt,data}};
  let res=await call({...base,response_format:{type:'json_object'}});
  if(res.ok){const j=repairJSON(res.data?.choices?.[0]?.message?.content);if(j)return j}
  else{const fg=res.data?.error?.failed_generation;const j=repairJSON(fg);if(j)return j;
    if(/decommissioned|does not exist|not found/i.test(res.txt))throw new Error(`模型 ${cfg.model} 已停用，請到「Groq 設定」載入可用模型。`);
    if(res.status===401)throw new Error('API Key 無效，請到「Groq 設定」重新輸入。');
    if(res.status===429)throw new Error('Groq 呼叫次數已達上限，請稍候再試或改用其他模型。');}
  res=await call(base); // 不強制 JSON 模式，再從文字擷取
  if(!res.ok)throw new Error('HTTP '+res.status+'：'+(res.data?.error?.message||res.txt).slice(0,160));
  const j=repairJSON(res.data?.choices?.[0]?.message?.content);
  if(!j)throw new Error('模型回傳的內容不是有效 JSON，請再試一次或換一個模型。');
  return j;
}

    const a=g.pts[g.pts.length-2],b=g.pts[g.pts.length-1],ang=Math.atan2(b[1]-a[1],b[0]-a[0]);
    ctx.fillStyle='#7c8cb8';ctx.beginPath();ctx.moveTo(b[0],b[1]);ctx.lineTo(b[0]-9*Math.cos(ang-.45),b[1]-9*Math.sin(ang-.45));ctx.lineTo(b[0]-9*Math.cos(ang+.45),b[1]-9*Math.sin(ang+.45));ctx.fill();
    const dur=(2.2+i%3*.4)/spd*1000,pt=pointAt(g,(time%dur)/dur);
    ctx.fillStyle='#fff';ctx.shadowColor=col;ctx.shadowBlur=10;ctx.beginPath();ctx.arc(pt[0],pt[1],4.5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    if(e.lb){ctx.font=`${hot?700:400} 11px ${FONT}`;ctx.fillStyle=hot?ink:mute;ctx.textBaseline='alphabetic';ctx.fillText(e.lb,e.lx,e.ly)}
    ctx.restore();
  });
  // 節點
  ids.forEach(id=>{
    const n=N[id],el=document.getElementById('n_'+id),c=cv('--'+n.c),sel=el.classList.contains('sel'),rel=el.classList.contains('rel');
    ctx.save();ctx.globalAlpha=dim&&!sel&&!rel?.35:1;ctx.textBaseline='middle';
    const {x,y,w,h}=n,r=n.k==='chip'?8:12;
    if(sel){ctx.shadowColor=c;ctx.shadowBlur=28}
    rr(ctx,x,y,w,h,r);
    ctx.fillStyle=n.k==='cont'?rgba(c,.07):(n.k==='box'?mix(c,panel,.14):panel);ctx.fill();ctx.shadowBlur=0;
    ctx.strokeStyle=rgba(c,.75);ctx.lineWidth=sel?2.5:1.5;ctx.setLineDash(n.k==='cont'?[6,4]:[]);ctx.stroke();ctx.setLineDash([]);
    if(sel){const per=2*(w+h);ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.setLineDash([per*.12,per]);ctx.lineDashOffset=-(time/2400)*per;rr(ctx,x-3,y-3,w+6,h+6,r+3);ctx.stroke();ctx.setLineDash([])}
    ctx.textAlign='left';
    if(n.k==='box'){
      ctx.font=`24px ${FONT}`;ctx.fillText(n.ic,x+14,y+h/2);
      const cx=x+52+(w-62)/2;ctx.textAlign='center';
      fitText(ctx,n.t,w-70,16,'700');ctx.fillStyle=c;ctx.fillText(n.t,cx,y+h/2-9);
      fitText(ctx,n.s||'',w-70,12);ctx.fillStyle=mute;ctx.fillText(n.s||'',cx,y+h/2+12);
    }else if(n.k==='cont'){
      ctx.textAlign='center';fitText(ctx,n.ic+' '+n.t,w-16,15,'700');ctx.fillStyle=c;ctx.fillText(n.ic+' '+n.t,x+w/2,y+20);
      fitText(ctx,n.s||'',w-16,12);ctx.fillStyle=mute;ctx.fillText(n.s||'',x+w/2,y+40);
    }else if(n.k==='chip'){
      ctx.font=`14px ${FONT}`;ctx.fillStyle=ink;ctx.fillText(n.ic,x+10,y+h/2);
      fitText(ctx,n.t,w-42,13,'500');ctx.fillText(n.t,x+32,y+h/2);
    }else if(n.k==='sub'){
      fitText(ctx,n.t,w-24,14,'700');ctx.fillStyle=ink;ctx.fillText(n.t,x+12,y+h/2-10);
      fitText(ctx,n.s||'',w-24,12);ctx.fillStyle=mute;ctx.fillText(n.s||'',x+12,y+h/2+12);
    }else if(n.k==='loopi'){
      ctx.save();rr(ctx,x,y,w,h,r);ctx.clip();ctx.fillStyle=rgba(c,.18);ctx.fillRect(x,y,96,h);ctx.restore();
      ctx.textAlign='center';fitText(ctx,n.l,88,13,'700');ctx.fillStyle=c;ctx.fillText(n.l,x+48,y+h/2-8);
      fitText(ctx,n.ls,88,11);ctx.fillStyle=mute;ctx.fillText(n.ls,x+48,y+h/2+11);
      fitText(ctx,n.r,w-116,13);ctx.fillStyle=ink;ctx.fillText(n.r,x+96+(w-96)/2,y+h/2);
    }else if(n.k==='steps'){
      C.steps.forEach((t,i)=>{const yy=y+12+i*22,act=document.querySelector(`[data-s="${i}"]`)?.classList.contains('act');
        if(act){ctx.fillStyle=rgba(cv('--reason'),.3);rr(ctx,x+8,yy-1,w-16,20,4);ctx.fill()}
        ctx.textAlign='left';ctx.font=`500 12px ${FONT}`;ctx.fillStyle=c;ctx.fillText('Step '+(i+1),x+12,yy+9);
        ctx.textAlign='right';fitText(ctx,t,w-74,12);ctx.fillStyle=ink;ctx.fillText(t,x+w-12,yy+9)});
    }
    ctx.restore();
  });
}
function panelInfo(){
  if(playing&&pi>0){const [id,txt]=PLAY[pi-1];return{id,step:pi,total:PLAY.length,text:txt}}
  if(cur)return{id:cur,text:caseScene(cur)||N[cur].d};
  return{id:null,text:`以「${C.goal}」為例，拆解 AI Agent 從接到目標到交付成果的每一步。`};
}
function drawFrame(ctx,W,H,time){
  const bg=cv('--bg'),bg2=cv('--bg2'),ink=cv('--ink'),mute=cv('--mute'),line=cv('--line');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  const s=(H-40)/SH;ctx.save();ctx.translate(20,20);ctx.scale(s,s);rr(ctx,0,0,SW,SH,16);ctx.clip();drawDiagram(ctx,time);ctx.restore();
  const px=40+SW*s,pw=W-px-30;
  ctx.fillStyle=bg2;rr(ctx,px,20,pw,H-40,18);ctx.fill();ctx.strokeStyle=line;ctx.lineWidth=1;ctx.stroke();
  const L=px+36,TW=pw-72;let y=70;ctx.textBaseline='alphabetic';ctx.textAlign='left';
  ctx.font=`700 30px ${FONT}`;ctx.fillStyle=ink;ctx.fillText('AI Agent 完整架構',L,y);
  y+=40;fitText(ctx,`${C.icon} ${C.name}`,TW,22,'500');ctx.fillStyle=mute;ctx.fillText(`${C.icon} ${C.name}`,L,y);
  y+=18;ctx.font=`20px ${FONT}`;const gl=wrapText(ctx,'任務：'+C.goal,TW).slice(0,3);gl.forEach(l=>{y+=30;ctx.fillText(l,L,y)});
  y+=26;ctx.fillStyle=line;ctx.fillRect(L,y,TW,1);
  const info=panelInfo();
  if(info.id){const n=N[info.id],c=cv('--'+n.c);
    y+=70;ctx.font=`50px ${FONT}`;ctx.fillText(n.ic||'◆',L,y);
    fitText(ctx,n.t,TW-80,38,'900');ctx.fillStyle=c;ctx.fillText(n.t,L+76,y-6);
    y+=40;fitText(ctx,n.s||n.r||'',TW,22);ctx.fillStyle=mute;ctx.fillText(n.s||n.r||'',L,y);
  }else{y+=60;ctx.font=`900 36px ${FONT}`;ctx.fillStyle=ink;ctx.fillText('🧭 架構總覽',L,y)}
  y+=30;ctx.font=`26px ${FONT}`;const lines=wrapText(ctx,info.text,TW-40).slice(0,9);
  const bh=lines.length*42+36;ctx.fillStyle=rgba(cv('--reason'),.12);rr(ctx,L,y,TW,bh,12);ctx.fill();ctx.strokeStyle=rgba(cv('--reason'),.45);ctx.stroke();
  ctx.fillStyle=ink;lines.forEach((l,i)=>ctx.fillText(l,L+20,y+46+i*42));y+=bh;
  if(info.id&&C.desc&&C.desc[info.id]&&y<H-200){ctx.font=`20px ${FONT}`;ctx.fillStyle=mute;wrapText(ctx,C.desc[info.id],TW).slice(0,Math.floor((H-150-y)/32)).forEach(l=>{y+=32;ctx.fillText(l,L,y)})}
  if(info.total){const by=H-70;ctx.fillStyle=line;rr(ctx,L,by,TW,10,5);ctx.fill();ctx.fillStyle=cv('--planner');rr(ctx,L,by,TW*info.step/info.total,10,5);ctx.fill();
    ctx.font=`18px ${FONT}`;ctx.fillStyle=mute;ctx.textAlign='right';ctx.fillText(`${info.step} / ${info.total}`,L+TW,by-12);ctx.textAlign='left'}
}
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
const fname=ext=>`AI_Agent_${C.name.replace(/[\\/:*?"<>|（）()\s]/g,'')}_${stamp()}.${ext}`;
async function exportImage(kind){
  await document.fonts.ready;const t=performance.now(),c=document.createElement('canvas'),ctx=c.getContext('2d');
  if(kind==='frame'){c.width=1920;c.height=1080;drawFrame(ctx,1920,1080,t);c.toBlob(b=>dl(b,fname('png')),'image/png');return}
  c.width=SW*2;c.height=SH*2;ctx.scale(2,2);drawDiagram(ctx,t);
  if(kind==='jpg')c.toBlob(b=>dl(b,fname('jpg')),'image/jpeg',.93);else c.toBlob(b=>dl(b,fname('png')),'image/png');
}
/* MP4 錄影 */
let rec=null;
function pickMime(){return['video/mp4;codecs=avc1.640028','video/mp4;codecs=avc1.42E01E','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))}
async function startRecord(mode){
  if(rec)return;const mime=pickMime();if(!mime){alert('此瀏覽器不支援錄影，請改用新版 Chrome 或 Edge。');return}
  await document.fonts.ready;
  const c=document.createElement('canvas');c.width=1920;c.height=1080;const ctx=c.getContext('2d');
  const stream=c.captureStream(30),mr=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8e6}),chunks=[];
  mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  const isMp4=mime.startsWith('video/mp4');
  mr.onstop=()=>{dl(new Blob(chunks,{type:mime.split(';')[0]}),fname(isMp4?'mp4':'webm'));recBar.style.display='none';rec=null;
    if(!isMp4)alert('此瀏覽器無法直接錄成 MP4，已輸出 WebM 格式。新版 Chrome／Edge／Safari 可直接輸出 MP4。')};
  const t0=performance.now();let endAt=mode==='loop'?t0+10000:0,started=false;
  rec={mr,stop:()=>{if(mr.state!=='inactive')mr.stop();cancelAnimationFrame(rec.raf)}};
  const loop=()=>{const now=performance.now();drawFrame(ctx,1920,1080,now);
    recTime.textContent=((now-t0)/1000).toFixed(0)+' 秒';
    if(mode==='play'){if(playing)started=true;if(started&&!playing&&!endAt)endAt=now+1500}
    if(endAt&&now>=endAt){rec.stop();return}
    rec.raf=requestAnimationFrame(loop)};
  mr.start(500);recBar.style.display='flex';recFmt.textContent=isMp4?'MP4':'WebM';loop();
  if(mode==='play'){tab('info');if(playing)stopPlay();setTimeout(()=>playBtn.click(),300)}
}
const recBar=document.createElement('div');recBar.id='recBar';recBar.innerHTML='<span class="rdot"></span>錄製中（<b id="recFmt"></b>）<span id="recTime">0 秒</span><button class="btn" id="recStop">■ 停止並下載</button>';
document.body.appendChild(recBar);
const recTime=document.getElementById('recTime'),recFmt=document.getElementById('recFmt');
document.getElementById('recStop').onclick=()=>{if(playing)stopPlay();rec&&rec.stop()};
/* 匯出選單 */
const expBtn=document.getElementById('expBtn'),expMenu=document.getElementById('expMenu');
expBtn.onclick=e=>{e.stopPropagation();const r=expBtn.getBoundingClientRect();expMenu.style.left=Math.min(r.left,window.innerWidth-280)+'px';expMenu.style.top=(r.bottom+6)+'px';expMenu.style.display=expMenu.style.display==='block'?'none':'block'};
document.addEventListener('click',()=>expMenu.style.display='none');
expMenu.addEventListener('click',e=>{const b=e.target.closest('[data-exp]');if(!b)return;expMenu.style.display='none';
  const k=b.dataset.exp;if(k==='png'||k==='jpg'||k==='frame')exportImage(k);else startRecord(k)});

/* ============ 啟動 ============ */
showIntro();fit();
</script>
