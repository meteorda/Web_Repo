<script type="module">
// ---- load three.js + official addons (import map first, CDN ESM bundles as fallback) ----
const ADDONS = [
  'geometries/RoundedBoxGeometry.js', 'utils/BufferGeometryUtils.js', 'environments/RoomEnvironment.js',
  'postprocessing/EffectComposer.js', 'postprocessing/RenderPass.js', 'postprocessing/UnrealBloomPass.js', 'postprocessing/OutputPass.js',
  'controls/OrbitControls.js',
];
async function loadThree() {
  const tries = [
    () => ['three', (p) => 'three/addons/' + p],
    () => ['https://cdn.jsdelivr.net/npm/three@0.170.0/+esm', (p) => 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/' + p + '/+esm'],
    () => ['https://unpkg.com/three@0.170.0/build/three.module.js?module', (p) => 'https://unpkg.com/three@0.170.0/examples/jsm/' + p + '?module'],
  ];
  let err;
  for (const t of tries) {
    try {
      const [core, addon] = t();
      const THREE = await import(core);
      const mods = await Promise.all(ADDONS.map((p) => import(addon(p))));
      return [THREE, ...mods];
    } catch (e) { err = e; console.warn('three.js load attempt failed', e); }
  }
  throw err;
}
const [THREE, mRB, mBGU, mRE, mEC, mRP, mUB, mOP, mOC] = await loadThree();
const { RoundedBoxGeometry } = mRB, { mergeGeometries } = mBGU, { RoomEnvironment } = mRE;
const { EffectComposer } = mEC, { RenderPass } = mRP, { UnrealBloomPass } = mUB, { OutputPass } = mOP, { OrbitControls } = mOC;

// ================= textures =================
const TX = (() => {

function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function tex(w, h, draw, opts = {}) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = opts.data ? THREE.NoColorSpace : THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = opts.clamp ? THREE.ClampToEdgeWrapping : THREE.RepeatWrapping;
  t.anisotropy = 8;
  return t;
}

function speckle(g, w, h, n, r, colors, amax, size = 2) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = colors[(r() * colors.length) | 0];
    g.globalAlpha = r() * amax;
    const s = 1 + r() * size;
    g.fillRect(r() * w, r() * h, s, s);
  }
  g.globalAlpha = 1;
}

function hazardBand(g, x, y, w, h, stripe = 22) {
  g.save();
  g.beginPath(); g.rect(x, y, w, h); g.clip();
  g.fillStyle = '#e8b414'; g.fillRect(x, y, w, h);
  g.fillStyle = '#17181a';
  const L = w + h + stripe * 2;
  for (let d = -h - stripe; d < L; d += stripe * 2) {
    g.beginPath();
    g.moveTo(x + d, y); g.lineTo(x + d + stripe, y);
    g.lineTo(x + d + stripe + h, y + h); g.lineTo(x + d + h, y + h);
    g.closePath(); g.fill();
  }
  g.restore();
}

// Floor: whole floor in one texture. world x in [-fx, fx], z in [-fz, fz]
function floorTexture(fx, fz, info, pal = {}) {
  const W = 2048, H = Math.round(W * fz / fx);
  const dirt = pal.clean ? 0.3 : 1;
  return tex(W, H, (g) => {
    const r = rng(11);
    const X = (x) => (x + fx) / (2 * fx) * W;
    const Z = (z) => (z + fz) / (2 * fz) * H;
    const S = W / (2 * fx);
    g.fillStyle = pal.base || '#5c6268'; g.fillRect(0, 0, W, H);
    // large tonal blotches
    for (let i = 0; i < 260 * dirt; i++) {
      const x = r() * W, y = r() * H, rad = 60 + r() * 260;
      const gr = g.createRadialGradient(x, y, 0, x, y, rad);
      const dark = r() < 0.55;
      gr.addColorStop(0, dark ? 'rgba(30,34,40,0.16)' : 'rgba(150,156,160,0.10)');
      gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
    }
    speckle(g, W, H, 60000, r, ['#2c3036', '#8a9096', '#444a50', '#757b80'], 0.28 * (pal.clean ? 0.5 : 1), 2);
    // slab joints
    g.strokeStyle = 'rgba(20,22,26,0.55)'; g.lineWidth = 2.5;
    for (let x = -fx; x <= fx; x += 4) { g.beginPath(); g.moveTo(X(x), 0); g.lineTo(X(x), H); g.stroke(); }
    for (let z = -fz + 1; z <= fz; z += 4) { g.beginPath(); g.moveTo(0, Z(z)); g.lineTo(W, Z(z)); g.stroke(); }
    // cracks
    g.strokeStyle = 'rgba(18,20,22,0.35)'; g.lineWidth = 1.2;
    for (let i = 0; i < 26 * dirt; i++) {
      let x = r() * W, y = r() * H; g.beginPath(); g.moveTo(x, y);
      for (let k = 0; k < 14; k++) { x += (r() - 0.5) * 60; y += (r() - 0.5) * 60; g.lineTo(x, y); }
      g.stroke();
    }
    // --- markings layer ---
    const m = document.createElement('canvas'); m.width = W; m.height = H;
    const q = m.getContext('2d');
    // work cell tinted floor
    const c = info.cell;
    q.fillStyle = pal.cell || 'rgba(52,84,92,0.55)';
    q.fillRect(X(c.x0), Z(c.z0), (c.x1 - c.x0) * S, (c.z1 - c.z0) * S);
    // hazard border
    const bw = 0.34 * S;
    hazardBand(q, X(c.x0), Z(c.z0), (c.x1 - c.x0) * S, bw);
    hazardBand(q, X(c.x0), Z(c.z1) - bw, (c.x1 - c.x0) * S, bw);
    hazardBand(q, X(c.x0), Z(c.z0), bw, (c.z1 - c.z0) * S);
    hazardBand(q, X(c.x1) - bw, Z(c.z0), bw, (c.z1 - c.z0) * S);
    if (info.exit) {
    // exit lane
    const e = info.exit;
    q.fillStyle = pal.lane || 'rgba(40,120,70,0.75)';
    q.fillRect(X(e.x0), Z(-e.hw), (e.x1 - e.x0) * S, 2 * e.hw * S);
    q.fillStyle = '#e8b414';
    q.fillRect(X(e.x0), Z(-e.hw) - 5, (e.x1 - e.x0) * S, 10);
    q.fillRect(X(e.x0), Z(e.hw) - 5, (e.x1 - e.x0) * S, 10);
    // chevrons in lane
    q.strokeStyle = 'rgba(235,240,235,0.85)'; q.lineWidth = 9; q.lineJoin = 'miter';
    for (let x = e.x0 + 0.8; x < e.x1 - 0.5; x += 1.1) {
      q.beginPath();
      q.moveTo(X(x), Z(-0.55)); q.lineTo(X(x + 0.45), Z(0)); q.lineTo(X(x), Z(0.55)); q.stroke();
    }
    }
    // arm safety rings
    for (const a of info.rings) {
      q.strokeStyle = '#e8b414'; q.lineWidth = 9;
      q.beginPath(); q.arc(X(a[0]), Z(a[1]), a[2] * S, 0, Math.PI * 2); q.stroke();
      q.strokeStyle = 'rgba(200,40,30,0.9)'; q.lineWidth = 4;
      q.beginPath(); q.arc(X(a[0]), Z(a[1]), (a[2] - 0.14) * S, 0, Math.PI * 2); q.stroke();
    }
    // walkways along long sides
    for (const s of [-1, 1]) {
      const z0 = s * (c.z1 + 1.0), z1 = s * (c.z1 + 2.7);
      q.fillStyle = '#e8b414';
      q.fillRect(X(-fx + 1.5), Z(z0) - 5, (2 * fx - 3) * S, 10);
      q.fillRect(X(-fx + 1.5), Z(z1) - 5, (2 * fx - 3) * S, 10);
      // zebra crossing
      q.fillStyle = 'rgba(236,238,232,0.9)';
      for (let k = 0; k < 7; k++) {
        const x = -3 + k * 0.9;
        q.fillRect(X(x), Z(Math.min(z0, z1)) + 12, 0.45 * S, Math.abs(z1 - z0) * S - 24);
      }
      // dashes
      q.fillStyle = 'rgba(236,238,232,0.8)';
      for (let x = -fx + 2; x < fx - 2; x += 2) {
        if (x > -4 && x < 4) continue;
        q.fillRect(X(x), Z((z0 + z1) / 2) - 3, 0.9 * S, 6);
      }
    }
    // storage bays near back wall
    q.strokeStyle = 'rgba(236,238,232,0.8)'; q.lineWidth = 7;
    for (const b of info.bays) q.strokeRect(X(b[0]), Z(b[1]), b[2] * S, b[3] * S);
    // wear the paint
    q.globalCompositeOperation = 'destination-out';
    const r2 = rng(5);
    for (let i = 0; i < 20000 * dirt; i++) {
      q.globalAlpha = r2() * 0.7;
      const s = 1 + r2() * 5;
      q.fillRect(r2() * W, r2() * H, s, 1 + r2() * 3);
    }
    for (let i = 0; i < 160 * dirt; i++) {
      q.globalAlpha = 0.25 + r2() * 0.3;
      const x = r2() * W, y = r2() * H;
      q.beginPath(); q.ellipse(x, y, 8 + r2() * 50, 3 + r2() * 12, r2() * 3, 0, 7); q.fill();
    }
    q.globalAlpha = 1;
    g.drawImage(m, 0, 0);
    // tyre marks and oil stains over everything
    for (let i = 0; i < 40 * dirt; i++) {
      const x = r() * W, y = r() * H, rad = 20 + r() * 70;
      const gr = g.createRadialGradient(x, y, 0, x, y, rad);
      gr.addColorStop(0, 'rgba(10,12,14,0.35)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
    }
  }, { clamp: true });
}

function floorRoughness(fx, fz) {
  const W = 1024, H = Math.round(W * fz / fx);
  return tex(W, H, (g) => {
    const r = rng(77);
    g.fillStyle = '#8a8a8a'; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 500; i++) {
      const x = r() * W, y = r() * H, rad = 20 + r() * 120;
      const gr = g.createRadialGradient(x, y, 0, x, y, rad);
      const v = r() < 0.5 ? '70,70,70' : '190,190,190';
      gr.addColorStop(0, `rgba(${v},0.35)`); gr.addColorStop(1, `rgba(${v},0)`);
      g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
    }
  }, { data: true, clamp: true });
}

function beltTexture() {
  return tex(256, 256, (g, w, h) => {
    const r = rng(3);
    g.fillStyle = '#1b1d20'; g.fillRect(0, 0, w, h);
    speckle(g, w, h, 5000, r, ['#0c0d0f', '#34373c', '#26292d'], 0.5, 2);
    // transverse cleats
    for (let i = 0; i < 4; i++) {
      const x = i * 64;
      const gr = g.createLinearGradient(x, 0, x + 12, 0);
      gr.addColorStop(0, '#07080a'); gr.addColorStop(0.5, '#4a4e55'); gr.addColorStop(1, '#101114');
      g.fillStyle = gr; g.fillRect(x, 0, 12, h);
    }
    // chevrons
    g.strokeStyle = 'rgba(90,95,102,0.55)'; g.lineWidth = 5;
    for (let i = 0; i < 4; i++) {
      const x = i * 64 + 24;
      g.beginPath(); g.moveTo(x, 40); g.lineTo(x + 22, 128); g.lineTo(x, 216); g.stroke();
    }
    // edge stripes
    g.fillStyle = 'rgba(210,170,30,0.55)'; g.fillRect(0, 8, w, 6); g.fillRect(0, h - 14, w, 6);
  });
}

function hazardTexture() {
  return tex(128, 128, (g, w, h) => {
    g.fillStyle = '#e8b414'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#16171a';
    for (let d = -128; d < 256; d += 64) {
      g.beginPath(); g.moveTo(d, 0); g.lineTo(d + 32, 0); g.lineTo(d + 32 + 128, 128); g.lineTo(d + 128, 128); g.closePath(); g.fill();
    }
    const r = rng(9);
    speckle(g, w, h, 900, r, ['#3a3a3a', '#fff2b0'], 0.25, 3);
  });
}

function wallTexture() {
  return tex(512, 1024, (g, w, h) => {
    const r = rng(21);
    const gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, '#787878'); gr.addColorStop(0.75, '#d0d0d0'); gr.addColorStop(1, '#a8a8a8');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    // corrugation
    for (let x = 0; x < w; x += 32) {
      const c = g.createLinearGradient(x, 0, x + 32, 0);
      c.addColorStop(0, 'rgba(0,0,0,0.30)'); c.addColorStop(0.3, 'rgba(255,255,255,0.07)');
      c.addColorStop(0.7, 'rgba(255,255,255,0.03)'); c.addColorStop(1, 'rgba(0,0,0,0.30)');
      g.fillStyle = c; g.fillRect(x, 0, 32, h);
    }
    // seams and rivets
    g.fillStyle = 'rgba(0,0,0,0.45)';
    for (const y of [h * 0.3, h * 0.62]) g.fillRect(0, y, w, 4);
    g.fillRect(0, 0, 4, h);
    g.fillStyle = 'rgba(190,200,210,0.5)';
    for (const y of [h * 0.3 + 12, h * 0.62 + 12]) for (let x = 16; x < w; x += 64) { g.beginPath(); g.arc(x, y, 3, 0, 7); g.fill(); }
    // lower painted band
    g.fillStyle = 'rgba(40,52,64,0.5)'; g.fillRect(0, h * 0.86, w, h * 0.14);
    g.fillStyle = '#d8a814'; g.fillRect(0, h * 0.855, w, 9);
    // grime streaks
    for (let i = 0; i < 90; i++) {
      const x = r() * w, y = r() * h * 0.8, len = 40 + r() * 260;
      const s = g.createLinearGradient(0, y, 0, y + len);
      s.addColorStop(0, 'rgba(10,12,14,0.16)'); s.addColorStop(1, 'rgba(10,12,14,0)');
      g.fillStyle = s; g.fillRect(x, y, 2 + r() * 7, len);
    }
    speckle(g, w, h, 6000, r, ['#30343a', '#e8eef2'], 0.12, 2);
  });
}

function crateTexture() {
  return tex(256, 256, (g, w, h) => {
    const r = rng(31);
    g.fillStyle = '#a57a48'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 6; i++) {
      const y = i * (h / 6);
      g.fillStyle = `rgba(${60 + r() * 50},${35 + r() * 25},10,${0.12 + r() * 0.2})`;
      g.fillRect(0, y, w, h / 6);
      g.fillStyle = 'rgba(40,24,8,0.7)'; g.fillRect(0, y, w, 3);
    }
    for (let i = 0; i < 500; i++) {
      g.fillStyle = `rgba(60,36,12,${r() * 0.25})`;
      g.fillRect(r() * w, r() * h, 20 + r() * 80, 1);
    }
    g.strokeStyle = '#7d5a30'; g.lineWidth = 30; g.strokeRect(15, 15, w - 30, h - 30);
    g.beginPath(); g.moveTo(22, 22); g.lineTo(w - 22, h - 22); g.stroke();
    g.strokeStyle = 'rgba(40,24,8,0.6)'; g.lineWidth = 2;
    g.strokeRect(30, 30, w - 60, h - 60); g.strokeRect(1, 1, w - 2, h - 2);
    g.fillStyle = '#3a3a3a';
    for (const p of [[15, 15], [w - 15, 15], [15, h - 15], [w - 15, h - 15]]) { g.beginPath(); g.arc(p[0], p[1], 4, 0, 7); g.fill(); }
  });
}

function cardboardTexture() {
  return tex(128, 128, (g, w, h) => {
    const r = rng(41);
    g.fillStyle = '#b18c5e'; g.fillRect(0, 0, w, h);
    speckle(g, w, h, 2500, r, ['#8f6d43', '#caa678'], 0.3, 2);
    g.fillStyle = 'rgba(214,190,150,0.8)'; g.fillRect(0, h / 2 - 7, w, 14);
    g.strokeStyle = 'rgba(60,40,20,0.6)'; g.lineWidth = 2; g.strokeRect(1, 1, w - 2, h - 2);
  });
}

function rollerTexture() {
  return tex(64, 64, (g, w, h) => {
    g.fillStyle = '#9aa2aa'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#4c535a';
    for (let i = 0; i < 4; i++) g.fillRect(i * 16, 0, 5, h);
    g.fillStyle = 'rgba(255,255,255,0.25)';
    for (let i = 0; i < 4; i++) g.fillRect(i * 16 + 9, 0, 2, h);
  });
}

function glowTexture() {
  return tex(128, 128, (g, w, h) => {
    const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, 'rgba(255,255,255,1)');
    gr.addColorStop(0.15, 'rgba(255,255,255,0.75)');
    gr.addColorStop(0.45, 'rgba(255,255,255,0.18)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  }, { clamp: true });
}

function smokeTexture() {
  return tex(128, 128, (g, w, h) => {
    const r = rng(51);
    for (let i = 0; i < 26; i++) {
      const x = 64 + (r() - 0.5) * 56, y = 64 + (r() - 0.5) * 56, rad = 14 + r() * 22;
      const gr = g.createRadialGradient(x, y, 0, x, y, rad);
      gr.addColorStop(0, 'rgba(255,255,255,0.16)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr; g.fillRect(0, 0, w, h);
    }
  }, { clamp: true });
}

function beamTexture() {
  return tex(32, 256, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, 'rgba(255,255,255,1)');
    gr.addColorStop(0.25, 'rgba(255,255,255,0.45)');
    gr.addColorStop(1, 'rgba(0,0,0,1)');
    g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  }, { clamp: true });
}

function screenTexture() {
  return tex(256, 160, (g, w, h) => {
    const r = rng(61);
    g.fillStyle = '#04141c'; g.fillRect(0, 0, w, h);
    g.strokeStyle = 'rgba(40,120,140,0.5)'; g.lineWidth = 1;
    for (let x = 0; x < w; x += 16) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
    for (let y = 0; y < h; y += 16) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
    for (const [col, base] of [['#37e6ff', 50], ['#7dff6a', 95]]) {
      g.strokeStyle = col; g.lineWidth = 2.5; g.beginPath();
      for (let x = 0; x <= 150; x += 6) g.lineTo(8 + x, base + Math.sin(x * 0.09 + base) * 14 + (r() - 0.5) * 10);
      g.stroke();
    }
    for (let i = 0; i < 6; i++) {
      g.fillStyle = ['#ff9a2a', '#37e6ff', '#7dff6a'][i % 3];
      const bh = 20 + r() * 70; g.fillRect(172 + i * 13, 140 - bh, 9, bh);
    }
  }, { clamp: true });
}

function treadTexture() {
  return tex(64, 32, (g, w, h) => {
    g.fillStyle = '#141518'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#34373c';
    for (let i = 0; i < 4; i++) g.fillRect(i * 16, 0, 7, h);
  });
}

function labelTexture() {
  return tex(128, 96, (g, w, h) => {
    const r = rng(71);
    g.fillStyle = '#f4f4ee'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#111';
    let x = 10; while (x < w - 12) { const bw = 1 + ((r() * 4) | 0); g.fillRect(x, 10, bw, 44); x += bw + 1 + ((r() * 3) | 0); }
    g.fillRect(10, 62, 46, 6); g.fillRect(10, 74, 70, 6); g.fillRect(92, 62, 24, 24);
    g.fillStyle = '#f4f4ee'; g.fillRect(98, 68, 12, 12);
  }, { clamp: true });
}

function pcbTexture() {
  return tex(256, 192, (g, w, h) => {
    const r = rng(81);
    g.fillStyle = '#0f6a3c'; g.fillRect(0, 0, w, h);
    g.strokeStyle = 'rgba(120,220,150,0.55)'; g.lineWidth = 1.5;
    for (let i = 0; i < 70; i++) {
      let x = r() * w, y = r() * h; g.beginPath(); g.moveTo(x, y);
      for (let k = 0; k < 3; k++) { if (r() < 0.5) x += (r() - 0.5) * 90; else y += (r() - 0.5) * 70; g.lineTo(x, y); }
      g.stroke();
    }
    g.fillStyle = '#d8b24a';
    for (let i = 0; i < 160; i++) { g.beginPath(); g.arc(r() * w, r() * h, 1.6, 0, 7); g.fill(); }
    g.fillStyle = 'rgba(235,240,235,0.8)';
    for (let i = 0; i < 26; i++) g.fillRect(r() * w, r() * h, 10 + r() * 14, 2);
    g.strokeStyle = 'rgba(235,240,235,0.7)'; g.lineWidth = 2; g.strokeRect(5, 5, w - 10, h - 10);
    g.fillStyle = '#d8b24a';

function keyAt(keys, t, out) {
  for (let i = 0; i < keys.length - 1; i++) {
    if (t <= keys[i + 1][0]) {
      const u = smooth((t - keys[i][0]) / (keys[i + 1][0] - keys[i][0]));
      return out.lerpVectors(keys[i][1], keys[i + 1][1], u);
    }
  }
  return out.copy(keys[keys.length - 1][1]);
}

// ------------------------------------------------------------------ sparks
class Sparks {
  constructor(scene, n, glowTex) {
    this.n = n; this.i = 0;
    this.pos = new Float32Array(n * 3); this.vel = new Float32Array(n * 3);
    this.life = new Float32Array(n); this.max = new Float32Array(n).fill(1);
    this.lp = new Float32Array(n * 6); this.lc = new Float32Array(n * 6);
    this.pp = new Float32Array(n * 3); this.pc = new Float32Array(n * 3);
    const lg = this.lg = new THREE.BufferGeometry();
    lg.setAttribute('position', new THREE.BufferAttribute(this.lp, 3));
    lg.setAttribute('color', new THREE.BufferAttribute(this.lc, 3));
    const pg = this.pg = new THREE.BufferGeometry();
    pg.setAttribute('position', new THREE.BufferAttribute(this.pp, 3));
    pg.setAttribute('color', new THREE.BufferAttribute(this.pc, 3));
    const lines = new THREE.LineSegments(lg, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
    const pts = new THREE.Points(pg, new THREE.PointsMaterial({ map: glowTex, size: 0.13, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
    lines.frustumCulled = pts.frustumCulled = false;
    scene.add(lines, pts);
  }
  emit(p, side) {
    const i = this.i; this.i = (i + 1) % this.n;
    this.pos[i * 3] = p.x; this.pos[i * 3 + 1] = p.y; this.pos[i * 3 + 2] = p.z;
    const a = Math.random() * Math.PI * 2, s = 0.6 + Math.random() * 2.6;
    this.vel[i * 3] = Math.cos(a) * s;
    this.vel[i * 3 + 1] = 0.6 + Math.random() * 3.4;
    this.vel[i * 3 + 2] = Math.sin(a) * s * 0.8 + side * (0.8 + Math.random() * 1.8);
    this.life[i] = this.max[i] = 0.35 + Math.random() * 0.75;
  }
  update(dt) {
    const { pos, vel, life, max, lp, lc, pp, pc } = this;
    for (let i = 0; i < this.n; i++) {
      const a = i * 3, b = i * 6;
      if (life[i] <= 0) { lp[b + 1] = lp[b + 4] = pp[a + 1] = -50; continue; }
      life[i] -= dt;
      vel[a + 1] -= 9.5 * dt;
      pos[a] += vel[a] * dt; pos[a + 1] += vel[a + 1] * dt; pos[a + 2] += vel[a + 2] * dt;
      const surf = Math.abs(Math.abs(pos[a + 2]) - ZL) < 0.85 ? BY : 0;
      if (pos[a + 1] < surf + 0.01 && vel[a + 1] < 0) {
        pos[a + 1] = surf + 0.01; vel[a + 1] *= -0.35; vel[a] *= 0.6; vel[a + 2] *= 0.6;
      }
      const k = Math.max(0, life[i] / max[i]);
      const tr = 0.045;
      lp[b] = pos[a]; lp[b + 1] = pos[a + 1]; lp[b + 2] = pos[a + 2];
      lp[b + 3] = pos[a] - vel[a] * tr; lp[b + 4] = pos[a + 1] - vel[a + 1] * tr; lp[b + 5] = pos[a + 2] - vel[a + 2] * tr;
      const rr = 2.2 * k + 0.3, gg = 1.6 * k * k + 0.05, bb = 1.0 * k * k * k;
      lc[b] = rr; lc[b + 1] = gg; lc[b + 2] = bb; lc[b + 3] = rr * 0.25; lc[b + 4] = gg * 0.2; lc[b + 5] = bb * 0.1;
      pp[a] = pos[a]; pp[a + 1] = pos[a + 1]; pp[a + 2] = pos[a + 2];
      pc[a] = rr; pc[a + 1] = gg; pc[a + 2] = bb;
    }
    this.lg.attributes.position.needsUpdate = this.lg.attributes.color.needsUpdate = true;
    this.pg.attributes.position.needsUpdate = this.pg.attributes.color.needsUpdate = true;
  }
}

// ------------------------------------------------------------------ steam / smoke
class Smoke {
  constructor(scene, n, tex, emitters) {
    this.em = emitters; this.ps = [];
    for (let i = 0; i < n; i++) {
      const m = new THREE.SpriteMaterial({ map: tex, color: 0xcfd8e2, transparent: true, opacity: 0, depthWrite: false });
      const s = new THREE.Sprite(m); s.visible = false; s.renderOrder = 6; scene.add(s);
      this.ps.push({ s, m, age: Math.random() * 3, life: 0, e: null, v: new V3(), rot: 0 });
    }
  }
  spawn(p) {
    let tot = 0; for (const e of this.em) tot += e.active === false ? 0 : e.w;
    let x = Math.random() * tot, e = null;
    for (const c of this.em) { if (c.active === false) continue; x -= c.w; if (x <= 0) { e = c; break; } }
    if (!e) { p.life = 0; p.age = -Math.random() * 0.3; p.s.visible = false; return; }
    p.e = e; p.age = 0; p.life = e.life * (0.7 + Math.random() * 0.6);
    p.s.position.copy(e.p).add(new V3((Math.random() - 0.5) * 0.15, 0, (Math.random() - 0.5) * 0.15));
    p.v.copy(e.v).multiplyScalar(0.7 + Math.random() * 0.6);
    p.v.x += (Math.random() - 0.5) * 0.25; p.v.z += (Math.random() - 0.5) * 0.25;
    p.m.rotation = Math.random() * 6.28; p.rot = (Math.random() - 0.5) * 0.6;
    p.s.visible = true;
  }
  update(dt) {
    for (const p of this.ps) {
      p.age += dt;
      if (p.life <= 0 || p.age >= p.life) { if (p.age >= 0) this.spawn(p); if (p.life <= 0) continue; }
      const k = p.age / p.life;
      p.s.position.addScaledVector(p.v, dt);
      p.v.multiplyScalar(1 - 0.35 * dt); p.v.y += 0.12 * dt;
      const sc = p.e.size * (0.35 + 1.9 * k);
      p.s.scale.set(sc, sc, 1);
      p.m.rotation += p.rot * dt;
      p.m.opacity = (p.e.op || 0.5) * Math.sin(Math.PI * Math.min(1, k * 1.15)) * (1 - k * 0.5);
    }
  }
}

#ui i{width:1px;background:rgba(255,255,255,.16);margin:4px 3px}
`;
document.head.appendChild(css);
const ui = document.createElement('div'); ui.id = 'ui';
let row = null;
const newRow = (label) => { row = document.createElement('div'); row.className = 'row'; ui.appendChild(row); if (label) { const s = document.createElement('span'); s.textContent = label; row.appendChild(s); } };
const sep = () => row.appendChild(document.createElement('i'));
const mk = (fn, text) => { const b = document.createElement('button'); b.type = 'button'; b.addEventListener('click', fn); if (text) b.textContent = text; row.appendChild(b); return b; };
newRow('站點');
const bOrbit = mk(() => setOrbit(!orbiting));
const bViews = VIEWS.map((n, i) => mk(() => setView(i), n));
newRow('速度');
const bSpeeds = SPEEDS.map((v) => mk(() => setSpeed(v), v + '×'));
const bStep = mk(() => stepOnce(), '⏭ 下一步');
sep();
const bPause = mk(() => setPaused(!paused));
const bRec = mk(() => toggleRec());
newRow('場景');
const bScenes = SCENES.map((n, i) => mk(() => setScene(i), n));
// process captions: station list (top-left) + large subtitle for the station in close-up
const cap = document.createElement('div'); cap.id = 'cap';
const capRows = STINFO.map(() => { const b = document.createElement('b'), s = document.createElement('span'); cap.append(b, s); return [b, s]; });
const sub = document.createElement('div'); sub.id = 'sub';
const subT = document.createElement('small'), subX = document.createElement('div'); sub.append(subT, subX);
const dock = document.createElement('div'); dock.id = 'dock'; dock.append(sub, ui);
document.body.append(cap, dock);
const overlays = [ui, cap, sub];
if (q.get('ui') === '0') overlays.forEach((e) => e.classList.add('hide'));
let capLast = '';
function updateCaptions() {
  const st = line.status(), key = view + '#' + st.map((s) => s.title + s.text).join('|');
  if (key === capLast) return; capLast = key;
  st.forEach((s, i) => {
    capRows[i][0].textContent = `${i + 1} ${s.title}`; capRows[i][1].textContent = s.text;
    capRows[i][0].parentNode && (capRows[i][0].className = capRows[i][1].className = '');
    const on = view === i; capRows[i][0].classList.toggle('act', false);
    capRows[i][0].style.color = on ? '#f08a12' : ''; capRows[i][1].style.color = on ? '#fff' : '';
  });
  const show = view >= 0;
  sub.style.display = show ? '' : 'none';
  if (show) { subT.textContent = `第 ${view + 1} 站 · ${st[view].title}`; subX.textContent = st[view].text; }
}
// ---------- video recording (MP4 where the browser supports it, otherwise WebM) ----------
let rec = null, recChunks = [], recStart = 0, recTimer = 0;
const REC_MAX = 60;
function pickMime() {
  const c = ['video/mp4;codecs=avc1.640028', 'video/mp4;codecs=avc1.42E01E', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  return c.find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
}
function toggleRec() {
  if (rec) { rec.stop(); return; }
  const mime = pickMime();
  if (!mime) { bRec.textContent = '此瀏覽器不支援錄影'; return; }
  const stream = renderer.domElement.captureStream(60);
  rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12e6 });
  recChunks = [];
  rec.ondataavailable = (e) => { if (e.data.size) recChunks.push(e.data); };
  rec.onstop = () => {
    clearInterval(recTimer);
    const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
    const url = URL.createObjectURL(new Blob(recChunks, { type: mime.split(';')[0] }));
    const a = document.createElement('a'); a.href = url; a.download = `factory_${SCENES_EN[line.scene]}.${ext}`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 10000);
    rec = null; syncUI();
  };
  rec.start(500); recStart = performance.now();
  recTimer = setInterval(() => { if ((performance.now() - recStart) / 1000 >= REC_MAX) rec.stop(); else syncUI(); }, 500);
  syncUI();
}
const SCENES_EN = ['robot', 'ic_insertion', 'pc_assembly', 'packing'];

function syncUI() {
  bRec.textContent = rec ? `■ 停止並下載 ${Math.floor((performance.now() - recStart) / 1000)}s` : '⏺ 錄製 MP4';
  bRec.classList.toggle('rec', !!rec); bRec.title = `錄製畫面並下載影片（最長 ${REC_MAX} 秒）`;
  bPause.textContent = paused ? '▶ 播放' : '⏸ 停止'; bPause.classList.toggle('on', paused);
  bOrbit.textContent = '⟳ 環繞全景'; bOrbit.classList.toggle('on', orbiting);
  bOrbit.title = orbiting ? '關閉後可用滑鼠拖曳、滾輪縮放自由觀看' : '開啟自動環繞';
  bViews.forEach((b, i) => b.classList.toggle('on', i === view));
  bSpeeds.forEach((b, i) => b.classList.toggle('on', SPEEDS[i] === speed));
  bStep.title = '播放到下一個動作後自動停止';
  bScenes.forEach((b, i) => b.classList.toggle('on', i === line.scene));
}
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); setPaused(!paused); }
  else if (e.key === 'o' || e.key === 'O') setOrbit(!orbiting);
  else if (e.key === 'h' || e.key === 'H') overlays.forEach((el) => el.classList.toggle('hide'));
  else if (e.key === '0') setOrbit(true);
  else if (e.key === 'n' || e.key === 'N') stepOnce();
  else if (e.key === '[' || e.key === ']') setSpeed(SPEEDS[(SPEEDS.indexOf(speed) + (e.key === ']' ? 1 : 3)) % 4]);
  else if (e.key === 'r' || e.key === 'R') toggleRec();
  else if (e.key >= '1' && e.key <= String(SCENES.length)) setScene(+e.key - 1);
});


setScene(+(q.get('s') || 0));
if (q.get('v')) { setView(+q.get('v')); blend = 1; }
if (q.get('x')) setSpeed(+q.get('x'));

// pre-roll so steam is already present on first frame
for (let i = 0; i < 90; i++) { line.update(simT - (90 - i) / 30, 1 / 30); }
window.__time = () => simT;

// adaptive quality: step down if the machine cannot hold a smooth frame rate
let tier = 0, accT = 0, accN = 0, warm = 0;
function setTier(n) {
  tier = n;
  const sm = [4096, 2048, 1024, 1024][n];
  sun.shadow.mapSize.set(sm, sm);
  if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
  renderer.shadowMap.type = n >= 2 ? THREE.PCFShadowMap : THREE.PCFSoftShadowMap;
  scene.traverse((o) => { if (o.material) o.material.needsUpdate = true; });
  const pr = [Math.min(window.devicePixelRatio || 1, 1.5), 1, 0.8, 0.6][n];
  renderer.setPixelRatio(pr); composer.setPixelRatio(pr);
  for (const r of [composer.renderTarget1, composer.renderTarget2]) { r.samples = n === 0 ? 4 : 0; r.dispose(); }
  bloom.enabled = n < 3;
  for (const l of factory.fillLights) l.visible = n < 2;
  resize();
}
const q0 = parseInt(q.get('q') || '0'); if (q0) setTier(q0);
window.__meshes = () => { let n = 0; scene.traverse((o) => { if (o.isMesh && o.visible) n++; }); return n; };

function frame(now) {
  const raw = (now - last) / 1000;
  const real = Math.min(0.05, Math.max(0, raw)); last = now;
  const dt = paused ? 0 : real * speed;
  if (++warm > 20 && tier < 3 && raw < 1) {
    accT += raw; accN++;
    if (accN >= 45) { if (accT / accN > 1 / 27) { setTier(tier + 1); warm = 0; } accT = 0; accN = 0; }
  }
  simT += dt;
  factory.update(simT);
  line.update(simT, dt);
  if (stepKey !== null && capKey() !== stepKey) { stepKey = null; setPaused(true); }
  updateCaptions();
  if (view >= 0 || orbiting) {
    if (view >= 0) viewPose(view, simT); else { orbT += paused ? 0 : real; orbitPose(orbT); }
    if (blend < 1) {
      blend = Math.min(1, blend + real / 1.4);
      const e = blend * blend * (3 - 2 * blend);
      camera.position.lerpVectors(blendFrom, camGoal, e); lookNow.lerpVectors(lookFrom, look, e);
    } else { camera.position.copy(camGoal); lookNow.copy(look); }
    camera.lookAt(lookNow);
  } else { controls.update(); lookNow.copy(controls.target); }
  composer.render();
  requestAnimationFrame(frame);
}
// offline frame capture hook (used to render video files frame by frame)
if (q.get('cap')) {
  overlays.forEach((el) => el.classList.add('hide'));
  window.__step = (dt, sc) => {
    if (sc !== undefined && sc !== line.scene) setScene(sc);
    simT += dt; orbT += dt;
    factory.update(simT); line.update(simT, dt);
    orbitPose(orbT); camera.position.copy(camGoal); camera.lookAt(look);
    composer.render();
    return renderer.domElement.toDataURL('image/jpeg', 0.92);
  };
  window.__seek = (t) => { simT = t; };
} else requestAnimationFrame(frame);

</script>
