<script>
'use strict';
const isN = Number.isFinite;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pct = (v, d = 1) => isN(v) ? (v >= 0 ? '+' : '') + (v * 100).toFixed(d) + '%' : '--';
const pctU = (v, d = 1) => isN(v) ? (v * 100).toFixed(d) + '%' : '--';
const num = (v, d = 2) => isN(v) ? v.toFixed(d) : (v === Infinity ? '∞' : '--');
const col = v => !isN(v) ? 'mut' : v >= 0 ? 'up' : 'dn';
const money = v => isN(v) ? Math.round(v).toLocaleString('zh-TW') : '--';
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const status = (m, busy) => { $('status').innerHTML = m ? (busy ? '<span class="spin"></span>' : '') + m : ''; };

// ══════════════ 設定 ══════════════
const CFG_DEF = { cash: 1000000, pct: 100, unit: 'mixed', limit: true, tick: true, div: true, nhi: true, disc: 1, minFee: 20, taxMode: 'auto', tax: 0.3, slip: 0.1, fill: 'open', rf: 1.5, split: 30, src: 'auto' };
const CFG = Object.assign({}, CFG_DEF, (() => { try { return JSON.parse(LS.get('qlab_cfg', '{}')); } catch (e) { return {}; } })());
// 台股規則：ETF（00 開頭）證交稅 0.1%、債券 ETF（B 結尾）免徵、一般股票 0.3%；升降單位與漲跌停 10%；除權息入帳
const isETF = code => /^00\d{2,4}[A-Z]?$/.test(code || '');
const isBondETF = code => /^00\d{2,4}B$/.test(code || '');
function taxRate(code) { return CFG.taxMode === 'auto' ? (isBondETF(code) ? 0 : isETF(code) ? 0.001 : 0.003) : CFG.tax / 100; }
function engineCfg(code, divs) {
    return { cash: +CFG.cash, pct: Math.min(1, Math.max(0.01, CFG.pct / 100)), unit: CFG.unit, fee: 0.001425 * CFG.disc, minFee: +CFG.minFee, tax: taxRate(code), slip: CFG.slip / 100, fill: CFG.fill,
             limit: !!CFG.limit, tick: !!CFG.tick, etf: isETF(code), divs: CFG.div ? divs || null : null, nhi: !!CFG.nhi };
}
const UNIT_TXT = { lot: '整張', odd: '零股', mixed: '整張＋零股' };

// ══════════════ 資料來源 ══════════════
const NAMES = { '2330': '台積電', '2317': '鴻海', '2454': '聯發科', '2308': '台達電', '2382': '廣達', '2412': '中華電', '2881': '富邦金', '2882': '國泰金', '2891': '中信金', '2303': '聯電', '2603': '長榮', '2609': '陽明', '3711': '日月光投控', '2002': '中鋼', '1301': '台塑', '2357': '華碩', '3231': '緯創', '2345': '智邦', '3008': '大立光', '6505': '台塑化', '0050': '元大台灣50', '0056': '元大高股息', '00878': '國泰永續高股息', '006208': '富邦台50', '00919': '群益台灣精選高息', 'TAIEX': '加權指數' };
const fmTok = () => encodeURIComponent(LS.get('finmindToken', ''));
async function fmData(ds, id, start) {
    const u = `https://api.finmindtrade.com/api/v4/data?dataset=${ds}${id ? '&data_id=' + encodeURIComponent(id) : ''}${start ? '&start_date=' + start : ''}&token=${fmTok()}`;
    const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), 20000);
    try {
        const r = await fetch(u, { signal: ctrl.signal }); clearTimeout(t);
        if (r.status === 402 || r.status === 429) return { err: 'FinMind 已達使用上限（填 Token 可提高額度）' };
        if (!r.ok) return { err: 'HTTP ' + r.status };
        const j = await r.json();
        if (j.status !== 200) return { err: j.msg || ('status ' + j.status) };
        return { data: j.data || [] };
    } catch (e) { clearTimeout(t); return { err: e.name === 'AbortError' ? '逾時' : e.message }; }
}
async function fetchWithProxy(url) {
    const PROX = [
        ['https://api.allorigins.win/raw?url=' + encodeURIComponent(url), false],
        ['https://corsproxy.io/?' + encodeURIComponent(url), false],
        ['https://api.allorigins.win/get?url=' + encodeURIComponent(url), true],
        ['https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url), false],
    ];
    const one = async ([u, wrap]) => {
        const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), 15000);
        try {
            const r = await fetch(u, { signal: ctrl.signal }); clearTimeout(t);
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const tx = await r.text(); if (!tx.trim()) throw new Error('empty');
            if (wrap) { const w = JSON.parse(tx); return JSON.parse(w.contents); }
            return JSON.parse(tx);
        } catch (e) { clearTimeout(t); throw e; }
    };
    try { return await Promise.any(PROX.map(one)); } catch (e) { return null; }
}
const ago = y => { const d = new Date(); d.setFullYear(d.getFullYear() - y); d.setDate(d.getDate() - 10); return d.toISOString().slice(0, 10); };
async function yahoo(sym, years, adjust) {
    const range = years <= 1 ? '1y' : years <= 2 ? '2y' : years <= 5 ? '5y' : '10y';
    const j = await fetchWithProxy(`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?interval=1d&range=${range}`);
    const r = j && j.chart && j.chart.result && j.chart.result[0];
    if (!r || !r.timestamp) return null;
    const q = r.indicators.quote[0], adj = r.indicators.adjclose && r.indicators.adjclose[0] && r.indicators.adjclose[0].adjclose;
    const rows = [];
    r.timestamp.forEach((ts, i) => {
        const c = q.close[i]; if (!(c > 0)) return;
        const k = adjust && adj && adj[i] > 0 ? adj[i] / c : 1;
        const d = new Date((ts + 8 * 3600) * 1000).toISOString().slice(0, 10);
        rows.push({ d, o: (q.open[i] || c) * k, h: (q.high[i] || c) * k, l: (q.low[i] || c) * k, c: c * k, v: q.volume[i] || 0 });
    });
    return { rows, name: (r.meta && (r.meta.longName || r.meta.shortName)) || '' };
}
function clean(rows, years) {
    const from = ago(years), map = new Map();
    rows.forEach(x => {
        if (!(x.c > 0) || !x.d || x.d < from) return;
        const o = x.o > 0 ? x.o : x.c; const h = Math.max(x.h > 0 ? x.h : x.c, o, x.c), l = Math.min(x.l > 0 ? x.l : x.c, o, x.c);
        map.set(x.d, { d: x.d, o, h, l, c: x.c, v: x.v || 0 });
    });
    const arr = [...map.values()].sort((a, b) => a.d < b.d ? -1 : 1);
    return { d: arr.map(x => x.d), o: arr.map(x => x.o), h: arr.map(x => x.h), l: arr.map(x => x.l), c: arr.map(x => x.c), v: arr.map(x => x.v) };
}
async function loadPrice(code, years) {
    const errs = [];
    if (CFG.src !== 'yahoo') {
        const r = await fmData('TaiwanStockPrice', code, ago(years));
        if (r.data && r.data.length > 30) return { rows: r.data.map(x => ({ d: x.date, o: +x.open, h: +x.max, l: +x.min, c: +x.close, v: +x.Trading_Volume || 0 })), src: 'FinMind TaiwanStockPrice（未還原權息）' };
        errs.push('FinMind：' + (r.err || '無資料'));
    }
    if (CFG.src !== 'finmind') {
        const syms = code === 'TAIEX' ? ['^TWII'] : [code + '.TW', code + '.TWO'];
        for (const s of syms) {
            const y = await yahoo(s, years, true);
            if (y && y.rows.length > 30) return { rows: y.rows, src: `Yahoo ${s}（還原權息）`, name: y.name };
        }
        errs.push('Yahoo（經公開代理）：失敗');
    }
    return { err: errs.join('；') };
}
async function loadDivs(code, years) {
    if (code === 'TAIEX') return null;
    const r = await fmData('TaiwanStockDividendResult', code, ago(years));
    if (!r.data || !r.data.length) return r.err ? null : new Map();
    const m = new Map();
    r.data.forEach(x => { const a = (+x.before_price) - (+x.after_price); if (a > 0 && x.date) m.set(x.date, (m.get(x.date) || 0) + a); });
    return m;
}
async function nameOf(code) {
    if (NAMES[code]) return NAMES[code];
    let dict = {}; try { dict = JSON.parse(LS.get('qlab_names', '{}')); } catch (e) {}
    if (dict[code]) return dict[code];
    if (!dict.__t) {
        const r = await fmData('TaiwanStockInfo');
        if (r.data && r.data.length) { dict = { __t: Date.now() }; r.data.forEach(x => { dict[x.stock_id] = x.stock_name; }); LS.set('qlab_names', JSON.stringify(dict)); }
    }
    return dict[code] || '';
}

// ══════════════ 主流程 ══════════════
const APP = {
    D: null, bench: null, code: '', name: '', src: '', years: 5, results: [], bh: null,
    params: (() => { try { return JSON.parse(LS.get('qlab_params', '{}')); } catch (e) { return {}; } })(),
    sel: QCORE.STRATS[0].id, sortKey: 'sharpe', sortDir: -1, cat: 'all', tab: 'rank',
    pOf(id) { return Object.assign(QCORE.defaults(QCORE.STRATS.find(s => s.id === id)), this.params[id] || {}); },
    async load() {
        const code = $('code').value.trim().toUpperCase();
        if (!/^[0-9A-Z^]{2,8}$/.test(code)) { status('⚠️ 代號格式不正確'); return; }
        const years = +$('years').value;
        status(`📡 抓取 ${code} 近 ${years} 年日線與加權指數…`, true);
        const [p, b, nm] = await Promise.all([loadPrice(code, years), loadPrice('TAIEX', years), nameOf(code).catch(() => '')]);
        if (p.err) { status(''); UI.loadError(code, p.err); return; }
        const D = clean(p.rows, years);
        if (D.c.length < 60) { status('⚠️ 資料筆數不足（' + D.c.length + ' 根），至少需要 60 個交易日'); return; }
        const bench = b.err ? null : clean(b.rows, years);
        let divs = null, dtxt = ' · 價格已還原權息';
        if (/^FinMind/.test(p.src)) { status('📡 抓取除權息資料…', true); divs = await loadDivs(code, years); dtxt = divs ? ` · 除權息 ${divs.size} 次（持有者入帳）` : ' · 除權息資料取不到（未計股利）'; }
        this.setData(D, bench, code, nm || p.name || '', p.src + dtxt + (bench ? ' · 基準：加權指數' : ' · 加權指數取不到，Beta 不計'), years, divs);
    },
    loadCSV(file) {
        if (!file) return;
        const rd = new FileReader();
        rd.onload = () => {
            try {
                const rows = parseCSV(String(rd.result));
                const D = clean(rows, 100);
                if (D.c.length < 60) throw new Error('有效資料只有 ' + D.c.length + ' 列（至少 60）');
                const code = (file.name.match(/\d{4,6}[A-Z]?/) || ['CSV'])[0];
                this.setData(D, null, code, file.name.replace(/\.[^.]+$/, ''), 'CSV 上傳：' + file.name + '（無基準指數，Beta 不計；未計除權息，建議上傳還原權息價）', 0, null);
            } catch (e) { status('⚠️ CSV 解析失敗：' + e.message + '。需要欄位：日期、開盤、最高、最低、收盤（成交量可省略）'); }
        };
        rd.readAsText(file, 'utf-8');
    },
    loadDemo() {
        const { D, bench } = demoData(+$('years').value || 5);
        this.setData(D, bench, 'DEMO', '示範資料（合成走勢）', '🧪 合成資料：隨機產生的多空循環走勢，僅供操作示範，不是真實股價', +$('years').value, null);
    },
    setData(D, bench, code, name, src, years, divs) {
        this.D = D; this.divs = divs || null; this.bench = bench ? bench.d.map((d, i) => ({ d, c: bench.c[i] })) : null;
        this.code = code; this.name = name; this.src = src; this.years = years;
        $('code').value = code === 'DEMO' || code === 'CSV' ? $('code').value : code;
        $('dsrc').innerHTML = `<b>${esc(name || code)}</b>（${esc(code)}）· ${D.d[0]} ～ ${D.d[D.d.length - 1]} · ${D.c.length} 根<br>${esc(src)}`;
        this.runAll();
    },
    runAll() {
        if (!this.D) return;
        const t0 = performance.now(), cfg = engineCfg(this.code, this.divs), rf = CFG.rf / 100, split = 1 - CFG.split / 100;
        const bhRes = QCORE.buyHold(this.D, cfg);
        this.bh = { s: { id: 'bh', name: '買進持有（基準）', cat: 'bh' }, res: bhRes, ev: QCORE.evaluate(this.D, bhRes, this.bench, rf, split) };
        this.results = QCORE.STRATS.map(s => {
            const res = QCORE.backtest(this.D, s, this.pOf(s.id), cfg);
            return { s, res, ev: QCORE.evaluate(this.D, res, this.bench, rf, split) };
        });
        status(`✅ 30 支策略回測完成（${Math.round(performance.now() - t0)} ms）· 成交：${CFG.fill === 'open' ? '訊號後次根開盤' : '訊號當根收盤'} · ${UNIT_TXT[CFG.unit]} · 手續費 ${(0.1425 * CFG.disc).toFixed(4)}%（最低 ${CFG.minFee} 元）、證交稅 ${(cfg.tax * 100).toFixed(1)}%${isBondETF(this.code) ? '（債券 ETF 免徵）' : isETF(this.code) ? '（ETF）' : ''}、滑價 ${CFG.slip}%${CFG.limit ? ' · 漲跌停 10%' : ''}${CFG.tick ? ' · 升降單位' : ''}${cfg.divs ? ' · 除權息入帳' : ''}`);
        UI.renderAll();
    },
    rerunOne(id) {
        const s = QCORE.STRATS.find(x => x.id === id), cfg = engineCfg(this.code, this.divs);

        const bh = APP.bh.ev.m;
        try {
            const t = await this.groq(`標的：${APP.name}（${APP.code}），${APP.D.d[0]}～${APP.D.d[APP.D.d.length - 1]}，${APP.src}。\n買進持有：年化 ${f(bh.annRet)}、夏普 ${f(bh.sharpe)}、最大回撤 ${f(bh.mdd)}、年化波動 ${f(bh.annVol)}、Beta ${f(bh.beta)}。\n成本：手續費 ${(0.1425 * CFG.disc).toFixed(4)}%、證交稅、滑價 ${CFG.slip}%，${CFG.fill === 'open' ? '次根開盤成交' : '當根收盤成交'}。\n30 支策略回測（小數，0.1=10%）：${JSON.stringify(L)}\n\n請：1) 這檔股票適合哪類策略（趨勢/動能/均值回歸）與原因；2) 點名 3 支值得進一步研究的策略，說明風險報酬特性與樣本外是否撐得住；3) 指出看起來好但可疑的結果（交易太少、樣本外崩落等）；4) 下一步驗證建議（參數掃描、多股批次）。`);
            box.querySelector('.ai').innerHTML = this.md(t);
        } catch (e) { box.querySelector('.ai').innerHTML = '⚠️ ' + esc(e.message); }
    },
    async aiDetail() {
        const box = $('aiBox'); box.style.display = 'block'; box.innerHTML = '<h3>🤖 AI 策略診斷</h3><div class="ai"><span class="spin"></span>分析中…</div>'; box.scrollIntoView({ behavior: 'smooth' });
        const r = APP.results.find(x => x.s.id === APP.sel), m = r.ev.m, f = v => isN(v) ? +v.toFixed(3) : null;
        const slim = x => x ? Object.fromEntries(Object.entries(x).filter(([k]) => !['uw'].includes(k)).map(([k, v]) => [k, typeof v === 'number' ? f(v) : v])) : null;
        try {
            const t = await this.groq(`標的：${APP.name}（${APP.code}），${APP.src}。\n策略：${r.s.name}（${QCORE.CATS[r.s.cat][0]}）— ${r.s.desc}\n參數：${JSON.stringify(r.res.params)}\n全期指標：${JSON.stringify(slim(m))}\n交易統計：${JSON.stringify(Object.fromEntries(Object.entries(r.ev.t).map(([k, v]) => [k, typeof v === 'number' ? f(v) : v])))}\n樣本內：${JSON.stringify(slim(r.ev.is))}\n樣本外：${JSON.stringify(slim(r.ev.oos))}\n買進持有：${JSON.stringify(slim(APP.bh.ev.m))}\n最近 8 筆交易：${JSON.stringify(r.res.trades.slice(-8).map(x => ({ 進: x.din, 出: x.dout, 報酬: f(x.ret), 根: x.bars, 原因: x.why })))}\n目前持倉：${JSON.stringify(r.res.open && { 進場日: r.res.open.din, 報酬: f(r.res.open.ret) })}\n\n請診斷：1) 這套策略在這檔股票的獲利來源（勝率型或賺賠比型）；2) 風險面（回撤、水下期、VaR）是否可接受；3) 與買進持有比較的取捨；4) 參數調整方向與需要驗證的地方；5) 若要實際使用的部位與停損建議。`);
            box.innerHTML = '<h3>🤖 AI 策略診斷</h3><div class="ai">' + this.md(t) + '</div>';
        } catch (e) { box.innerHTML = '<h3>🤖 AI 策略診斷</h3><div class="ai">⚠️ ' + esc(e.message) + '</div>'; }
    },
};
document.querySelectorAll('.tab').forEach(b => b.onclick = () => UI.tab(b.dataset.v));
let _rz; window.addEventListener('resize', () => { clearTimeout(_rz); _rz = setTimeout(() => { UI.drawRank(); UI.drawDetail(); UI.drawRisk(); }, 200); });
UI.renderLib(); UI.renderBatch();
const _q = new URLSearchParams(location.search);
if (_q.get('demo') != null) APP.loadDemo(); else APP.load();
</script>
