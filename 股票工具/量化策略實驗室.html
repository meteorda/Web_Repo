<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050a14">
<title>量化策略實驗室</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050a14; --bg2:#0a1424; --panel:#0d1a2e; --panel2:#11223b; --line:rgba(148,178,220,.14); --line2:rgba(148,178,220,.26);
  --tx:#e2e8f0; --tx2:#93a4c0; --tx3:#64748b; --acc:#22d3ee; --acc2:#fbbf24; --up:#ef4444; --dn:#10b981; --warn:#f59e0b; --vio:#a78bfa;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:'Noto Sans TC',system-ui,sans-serif;font-size:14px;line-height:1.55}
body{min-height:100vh;background:radial-gradient(1200px 600px at 85% -10%,rgba(34,211,238,.08),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(251,191,36,.06),transparent 60%),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1360px;margin:0 auto;padding:0 18px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0 12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,#a16207,#f59e0b);box-shadow:0 6px 24px rgba(245,158,11,.25)}
.brand h1{font-size:1.25rem;font-weight:900;letter-spacing:.02em}
.brand h1 span{background:linear-gradient(135deg,#fbbf24,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{font-size:.78rem;color:var(--tx2)}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:var(--panel2);border-radius:9px;padding:7px 13px;cursor:pointer;font-size:.82rem;white-space:nowrap;transition:.15s}
.btn:hover{border-color:var(--acc);color:#fff}
.btn.pri{background:linear-gradient(135deg,#0e7490,#22d3ee);border-color:transparent;color:#03141c;font-weight:700}
.btn.pri:hover{filter:brightness(1.1)}
.btn.gold{background:linear-gradient(135deg,#a16207,#f59e0b);border-color:transparent;color:#1a1003;font-weight:700}
.btn.sm{padding:4px 9px;font-size:.74rem;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-size:.68rem;color:var(--tx3);letter-spacing:.04em}
.in,.sel{background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font-size:.85rem;outline:none;min-width:0}
.in:focus,.sel:focus{border-color:var(--acc)}
#code{width:120px;font-family:var(--mono);font-weight:600;letter-spacing:.04em}
.dsrc{margin-left:auto;font-size:.75rem;color:var(--tx2);text-align:right;max-width:460px}
.dsrc b{color:var(--tx)}
.tabs{display:flex;gap:4px;margin:16px 0 12px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:9px 14px;cursor:pointer;color:var(--tx2);font-size:.88rem;white-space:nowrap}
.tab.on{color:#fff;border-bottom-color:var(--acc2);font-weight:700}
.view{display:none}.view.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h3{font-size:.82rem;color:var(--tx2);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.kpi .t{font-size:.7rem;color:var(--tx3)}
.kpi .v{font-size:1.32rem;font-weight:800;font-family:var(--mono);margin-top:2px;line-height:1.2}
.kpi .s{font-size:.7rem;color:var(--tx2);margin-top:3px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:none}
.row .k{color:var(--tx2);font-size:.8rem}.row .v{font-family:var(--mono);font-weight:600;font-size:.88rem}
.hint{font-size:.7rem;color:var(--tx3);margin:-2px 0 4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);border-radius:999px;padding:3px 11px;font-size:.74rem;cursor:pointer;background:transparent;color:var(--tx2)}
.chip.on{background:rgba(251,191,36,.14);border-color:var(--acc2);color:#fde68a}
.tag{display:inline-block;font-size:.66rem;padding:1px 7px;border-radius:999px;border:1px solid currentColor;line-height:1.5;white-space:nowrap}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:.8rem}
table.t th{position:sticky;top:0;background:var(--panel2);color:var(--tx2);font-weight:600;text-align:right;padding:7px 8px;border-bottom:1px solid var(--line2);white-space:nowrap;cursor:pointer;user-select:none}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th.on{color:var(--acc2)}
table.t td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.t td.l{text-align:left;font-family:inherit}
table.t tr.clk{cursor:pointer}
table.t tr.clk:hover td{background:rgba(34,211,238,.06)}
table.t tr.bh td{background:rgba(251,191,36,.06)}
table.t tr.sel td{background:rgba(34,211,238,.12)}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--tx3)}.gold{color:var(--acc2)}.cy{color:var(--acc)}
canvas{display:block;width:100%}
.cv{position:relative}
.tip{position:absolute;pointer-events:none;background:rgba(5,10,20,.94);border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:.72rem;white-space:nowrap;z-index:5;display:none;font-family:var(--mono)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.72rem;color:var(--tx2);margin-top:6px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.sbar{height:9px;border-radius:5px;background:rgba(255,255,255,.05);overflow:hidden;position:relative}
.sbar>div{height:100%;border-radius:5px}
.status{font-size:.78rem;color:var(--tx2);min-height:1.4em;margin:6px 0}
.banner{border-radius:12px;padding:12px 14px;border:1px solid var(--line2);background:var(--panel);margin-bottom:12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.banner .big{font-size:1.4rem;font-weight:900}
.params{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.params .in{width:100%}
pre.code{background:#030711;border:1px solid var(--line);border-radius:10px;padding:12px;font-family:var(--mono);font-size:.72rem;line-height:1.55;max-height:420px;overflow:auto;white-space:pre;color:#cbd5e1}
.hm td{padding:0;text-align:center}
.hm td div{padding:5px 2px;font-size:.68rem;font-family:var(--mono);cursor:pointer}
.hm th{font-size:.66rem;padding:4px;color:var(--tx2);font-weight:600;font-family:var(--mono)}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.lib .card{display:flex;flex-direction:column;gap:6px}
.lib .card p{font-size:.78rem;color:var(--tx2)}
.drawer{position:fixed;inset:0;background:rgba(2,6,14,.6);backdrop-filter:blur(3px);display:none;z-index:50}
.drawer.on{display:block}
.drawer .box{position:absolute;right:0;top:0;bottom:0;width:min(420px,100%);background:var(--bg2);border-left:1px solid var(--line2);padding:18px;overflow-y:auto}
.drawer h2{font-size:1rem;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.drawer .fld{margin-bottom:10px}
.drawer .fld .in,.drawer .fld .sel{width:100%}
.drawer .sec{font-size:.72rem;color:var(--acc2);margin:16px 0 8px;font-weight:700;letter-spacing:.06em}
.ai{font-size:.84rem;line-height:1.8;color:#dbe4f0}
.ai h4{color:var(--acc2);margin:10px 0 4px;font-size:.88rem}
.ai ul{padding-left:1.2em}
.empty{text-align:center;padding:50px 20px;color:var(--tx2)}
.empty .big{font-size:2.4rem;margin-bottom:8px}
.disc{font-size:.7rem;color:var(--tx3);margin-top:22px;text-align:center}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line2);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}.dsrc{margin-left:0;text-align:left}}
@media (max-width:560px){.wrap{padding:0 12px 40px}.brand h1{font-size:1.05rem}#code{width:96px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand"><div class="logo">📐</div>
    <div><h1><span>量化策略實驗室</span></h1>
    <p>Alorse PineScript 策略庫 30 支 × 台股日線回測 × 風險指標卡</p></div></div>
  <div class="hbtns">
    <button class="btn" onclick="UI.openCfg()">⚙️ 回測設定</button>
    <button class="btn" onclick="UI.exportAll()">⬇️ 匯出報告</button>
  </div>
</header>

<div class="bar">
  <div class="fld"><label>股票代號</label><input id="code" class="in" value="2330" placeholder="2330" onkeydown="if(event.key==='Enter')APP.load()"></div>
  <div class="fld"><label>回測期間</label><select id="years" class="sel">
    <option value="1">近 1 年</option><option value="2">近 2 年</option><option value="3">近 3 年</option><option value="5" selected>近 5 年</option><option value="10">近 10 年</option></select></div>
  <div class="fld"><label>&nbsp;</label><button class="btn pri" onclick="APP.load()">🔍 載入並回測全部策略</button></div>
  <div class="fld"><label>&nbsp;</label><label class="btn" style="display:inline-block">📄 上傳 CSV<input type="file" accept=".csv,.txt" hidden onchange="APP.loadCSV(this.files[0]);this.value=''"></label></div>
  <div class="fld"><label>&nbsp;</label><button class="btn" onclick="APP.loadDemo()">🧪 示範資料</button></div>
  <div class="dsrc" id="dsrc">尚未載入資料</div>
</div>

<div class="tabs" id="tabs">
  <button class="tab on" data-v="rank">🏆 策略排行</button>
  <button class="tab" data-v="detail">🔬 策略詳情</button>
  <button class="tab" data-v="opt">🎛️ 參數最佳化</button>
  <button class="tab" data-v="batch">🧺 多股批次</button>
  <button class="tab" data-v="risk">⚖️ 標的風險卡</button>
  <button class="tab" data-v="lib">📚 策略庫</button>
</div>
<div class="status" id="status"></div>

<section class="view on" id="v-rank"><div class="empty"><div class="big">📐</div>輸入台股代號後按「載入並回測全部策略」，或先用示範資料試跑。</div></section>
<section class="view" id="v-detail"></section>
<section class="view" id="v-opt"></section>
<section class="view" id="v-batch"></section>
<section class="view" id="v-risk"></section>
<section class="view" id="v-lib"></section>

<p class="disc">策略原始碼：<a href="https://github.com/Alorse/pinescript-strategies" target="_blank" rel="noopener">github.com/Alorse/pinescript-strategies</a>（Pine v4/v5，本工具以 JavaScript 重新實作為台股現股只做多版本）。回測為歷史模擬，不代表未來績效，亦非投資建議。</p>
</div>

<div class="drawer" id="drawer" onclick="if(event.target===this)UI.closeCfg()"><div class="box" id="cfgBox"></div></div>

<script>
// ══════════════════════════════════════════════════════════════
// QCORE：指標庫（Pine 語意）＋ 30 支 Alorse 策略移植 ＋ 回測引擎 ＋ 風險指標
// ══════════════════════════════════════════════════════════════
const QCORE = (function () {
'use strict';
const isN = Number.isFinite;
const nan = n => new Array(n).fill(NaN);

// ── 指標（對齊 Pine：ema/rma 以 SMA 起算、stdev 為母體標準差）──
function sma(a, n) {
    const o = nan(a.length); let s = 0, bad = 0;
    for (let i = 0; i < a.length; i++) {
        const v = a[i]; if (isN(v)) s += v; else bad++;
        if (i >= n) { const u = a[i - n]; if (isN(u)) s -= u; else bad--; }
        if (i >= n - 1 && bad === 0) o[i] = s / n;
    }
    return o;
}
function smooth(a, n, alpha) {
    const o = nan(a.length), s = sma(a, n); let prev = NaN;
    for (let i = 0; i < a.length; i++) {
        if (!isN(prev)) { if (isN(s[i])) { prev = s[i]; o[i] = prev; } }
        else { const v = a[i]; if (isN(v)) prev = alpha * v + (1 - alpha) * prev; o[i] = prev; }
    }
    return o;
}
const ema = (a, n) => smooth(a, n, 2 / (n + 1));
const rma = (a, n) => smooth(a, n, 1 / n);
function roll(a, n, f) {
    const o = nan(a.length);
    for (let i = n - 1; i < a.length; i++) {
        let ok = true; const w = new Array(n);
        for (let j = 0; j < n; j++) { const v = a[i - n + 1 + j]; if (!isN(v)) { ok = false; break; } w[j] = v; }
        if (ok) o[i] = f(w);
    }
    return o;
}
const stdev = (a, n) => roll(a, n, w => { let m = 0; for (const v of w) m += v; m /= w.length; let s = 0; for (const v of w) s += (v - m) ** 2; return Math.sqrt(s / w.length); });
const highest = (a, n) => roll(a, n, w => Math.max(...w));
const lowest = (a, n) => roll(a, n, w => Math.min(...w));
const linreg = (a, n) => roll(a, n, w => {
    let sx = 0, sy = 0, sxy = 0, sxx = 0;
    for (let j = 0; j < n; j++) { sx += j; sy += w[j]; sxy += j * w[j]; sxx += j * j; }
    const slope = (n * sxy - sx * sy) / (n * sxx - sx * sx || 1), icp = (sy - slope * sx) / n;
    return icp + slope * (n - 1);
});
const barsAgoMax = (a, n) => roll(a, n, w => { let k = 0; for (let j = 1; j < w.length; j++) if (w[j] >= w[k]) k = j; return w.length - 1 - k; });
const change = a => a.map((v, i) => i ? v - a[i - 1] : NaN);
const sub = (a, b) => a.map((v, i) => v - (Array.isArray(b) ? b[i] : b));
const add = (a, b) => a.map((v, i) => v + (Array.isArray(b) ? b[i] : b));
const mul = (a, k) => a.map(v => v * k);
function trArr(D) { return D.c.map((_, i) => i ? Math.max(D.h[i] - D.l[i], Math.abs(D.h[i] - D.c[i - 1]), Math.abs(D.l[i] - D.c[i - 1])) : D.h[i] - D.l[i]); }
const atr = (D, n) => rma(trArr(D), n);
function rsi(a, n) {
    const ch = change(a);
    const up = rma(ch.map(v => isN(v) ? Math.max(v, 0) : NaN), n), dn = rma(ch.map(v => isN(v) ? -Math.min(v, 0) : NaN), n);
    return up.map((u, i) => !isN(u) || !isN(dn[i]) ? NaN : dn[i] === 0 ? 100 : u === 0 ? 0 : 100 - 100 / (1 + u / dn[i]));
}
function macd(a, f, s, g) { const m = sub(ema(a, f), ema(a, s)); const sg = ema(m, g); return { m, s: sg, h: sub(m, sg) }; }
function bb(a, n, k) { const b = sma(a, n), d = stdev(a, n); return { b, u: b.map((v, i) => v + k * d[i]), l: b.map((v, i) => v - k * d[i]) }; }
function supertrend(D, factor, len) {
    const n = D.c.length, A = atr(D, len), st = nan(n), dir = nan(n);
    let pL = NaN, pU = NaN, pST = NaN;
    for (let i = 0; i < n; i++) {
        const src = (D.h[i] + D.l[i]) / 2;
        if (!isN(A[i])) continue;
        let L = src - factor * A[i], U = src + factor * A[i];
        if (isN(pL)) L = (L > pL || D.c[i - 1] < pL) ? L : pL;
        if (isN(pU)) U = (U < pU || D.c[i - 1] > pU) ? U : pU;
        let d;
        if (!isN(A[i - 1])) d = 1;
        else if (pST === pU) d = D.c[i] > U ? -1 : 1;
        else d = D.c[i] < L ? 1 : -1;
        st[i] = d === -1 ? L : U; dir[i] = d;
        pL = L; pU = U; pST = st[i];
    }
    return { st, dir };
}
function dmi(D, len, lensig) {
    const n = D.c.length, pdm = nan(n), mdm = nan(n);
    for (let i = 1; i < n; i++) {
        const up = D.h[i] - D.h[i - 1], dn = D.l[i - 1] - D.l[i];
        pdm[i] = up > dn && up > 0 ? up : 0; mdm[i] = dn > up && dn > 0 ? dn : 0;
    }
    const T = rma(trArr(D).map((v, i) => i ? v : NaN), len);
    const plus = rma(pdm, len).map((v, i) => 100 * v / T[i]), minus = rma(mdm, len).map((v, i) => 100 * v / T[i]);
    const adx = mul(rma(plus.map((p, i) => { const s = p + minus[i]; return Math.abs(p - minus[i]) / (s === 0 ? 1 : s); }), lensig), 100);
    return { plus, minus, adx };
}
function stoch(src, h, l, n) { const H = highest(h, n), L = lowest(l, n); return src.map((v, i) => 100 * (v - L[i]) / (H[i] - L[i])); }
function heikin(D) {
    const n = D.c.length, C = nan(n), O = nan(n), H = nan(n), L = nan(n);
    for (let i = 0; i < n; i++) {
        C[i] = (D.o[i] + D.h[i] + D.l[i] + D.c[i]) / 4;
        O[i] = i ? (O[i - 1] + C[i - 1]) / 2 : (D.o[i] + D.c[i]) / 2;
        H[i] = Math.max(D.h[i], O[i], C[i]); L[i] = Math.min(D.l[i], O[i], C[i]);
    }
    return { o: O, h: H, l: L, c: C };
}
function barssince(cond) { const o = nan(cond.length); let last = -1; cond.forEach((v, i) => { if (v) last = i; o[i] = last < 0 ? NaN : i - last; }); return o; }
const xo = (a, b, i) => { const b0 = Array.isArray(b) ? b[i] : b, b1 = Array.isArray(b) ? b[i - 1] : b; return i > 0 && a[i] > b0 && a[i - 1] <= b1; };
const xu = (a, b, i) => { const b0 = Array.isArray(b) ? b[i] : b, b1 = Array.isArray(b) ? b[i - 1] : b; return i > 0 && a[i] < b0 && a[i - 1] >= b1; };
const cross = (a, b, i) => xo(a, b, i) || xu(a, b, i);
const lag = (a, k = 1) => a.map((_, i) => i >= k ? a[i - k] : NaN);

// 高時間框架（週線）：取「上一根已完成週 K」的值，不偷看未來
function weekKey(ds) { const d = new Date(ds + 'T00:00:00Z'); const w = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - w); return d.toISOString().slice(0, 10); }
function htf(D, fn) {
    const W = { d: [], o: [], h: [], l: [], c: [], v: [] }, wi = [];
    D.d.forEach((ds, i) => {
        const k = weekKey(ds), j = W.d.length - 1;
        if (j < 0 || W.d[j] !== k) { W.d.push(k); W.o.push(D.o[i]); W.h.push(D.h[i]); W.l.push(D.l[i]); W.c.push(D.c[i]); W.v.push(D.v[i]); }
        else { W.h[j] = Math.max(W.h[j], D.h[i]); W.l[j] = Math.min(W.l[j], D.l[i]); W.c[j] = D.c[i]; W.v[j] += D.v[i]; }
        wi.push(W.d.length - 1);
    });
    const ws = fn(W);
    return wi.map(k => k > 0 ? ws[k - 1] : NaN);

(inLong and close[1] < out_a and close > out_a and close < lastEntry)\nexitLong = ta.change(direction) > 0\n\nentryShort = ta.change(direction) > 0\nentryShort := entryShort or (inShort and close[1] > out_a and close < out_a and close > lastEntry)\nexitShort = ta.change(direction) < 0\n\ntpGroup = 'Take Profit'\nuseTP = input.string(title='Type', defval='Supertrend', options=['Supertrend', '%'], group=tpGroup, tooltip='Supertrend: \\nPercent (%): \\nRatio:')\nTPPercent = input.float(1.5, step=0.1, title='Percent/Ratio', group=tpGroup)\n\nlongTP = 99999999999.9\nshortTP = 0.0\n\nbought = strategy.opentrades[0] == 1 and strategy.position_size[0] > strategy.position_size[1]\nentry_price = ta.valuewhen(bought, open, 0)\n\nif useTP == '%'\n    longTP := strategy.position_avg_price * (1 + (TPPercent * 0.01))\n    shortTP := strategy.position_avg_price * (1 - (TPPercent * 0.01))\nelse\n    longTP := na\n    shortTP := na\n\nif showLong and inDateRange\n    strategy.entry(\"Long\", strategy.long, when=entryLong)\n    strategy.close(\"Long\", when=exitLong)\n    strategy.exit(\"Exit\", \"Long\", limit=longTP)\n\nif showShort and inDateRange\n    strategy.entry(\"Short\", strategy.short, when=entryShort)\n    strategy.close(\"Short\", when=exitShort)\n    strategy.exit(\"Exit\", \"Short\", limit=shortTP)\n    ","strategies/trend/EMA Moving away Strategy [Alorse].pine":"//@version=5\nstrategy(\"EMA Moving away Strategy [Alorse]\", overlay=true, pyramiding=0, currency=currency.USD, default_qty_type=strategy.percent_of_equity, initial_capital=1000, default_qty_value=10, commission_type=strategy.commission.percent, commission_value=0.01)\n\n// Setup EMA && stop loss\nsrc = input.source(title=\"Source\", defval=close, group=\"Moving Average\")\nlength = input.int(55, minval=1, title=\"Periods\", group=\"Moving Average\")\nmoving_away = input.float(2, \"Moving away (%)\", group=\"Strategy\", tooltip=\"The required percentage that the price moves away from the EMA to open a position.\")\nstop_loss_pct = input.float(2, \"Stop Loss (%)\", group=\"Stop Loss\")\n\n// Get EMA\nema = ta.ema(src, length)\n\nlc_pct = math.abs((close - open) / open * 100)\nlast4CandlesGreen =  ta.highest(close > open, 4) == 4\n\n// Entry and exit conditions for Long position\nlong_entry_condition = close <= ema * (1 - moving_away/100) and lc_pct < stop_loss_pct\n\n// Entry and exit conditions for Short position\nshort_entry_condition = close >= ema * (1 + moving_away/100) and lc_pct < stop_loss_pct and not last4CandlesGreen\n\n// Entry for Long position\nif long_entry_condition\n    strategy.entry(\"Long\", strategy.long)\n\n// Exit for Long position\nif close >= ema\n    strategy.close(\"Long\")\n\n// Entry for Short position\nif short_entry_condition\n    strategy.entry(\"Short\", strategy.short)\n\n// Exit for Short position\nif close <= ema\n    strategy.close(\"Short\")\n\n// Set Stop Loss\nif strategy.position_size > 0\n    strategy.exit(\"Long SL\", \"Long\", stop = strategy.position_avg_price * (1 - stop_loss_pct/100))\nif strategy.position_size < 0\n    strategy.exit(\"Short SL\", \"Short\", stop = strategy.position_avg_price * (1 + stop_loss_pct/100))\n\n// Visualize EMA\nplot(ema, title='EMA Color', color=color.orange)","strategies/trend/MA Cross + DMI.pine":"//@version=4\nstrategy(\"MA Cross + DMI [Alorse]\", shorttitle=\"MA Cross + DMI [Alorse]\", overlay=true, pyramiding=0, currency=currency.USD, default_qty_type=strategy.percent_of_equity, initial_capital=1000, default_qty_value=20, commission_type=strategy.commission.percent, commission_value=0.01) \n\ntxtVer = \"0.0.1\"\nversion = input(title=\"Version\", type=input.string, defval=txtVer, options=[txtVer], tooltip=\"This is informational only, nothing will change.\\n\\nEntry conditions:\\n\")\nsrc = input(title=\"Source\", type=input.source, defval=close)\n\n// DMI\ndmiGroup = \"Directional Movement Index\"\nlen = input(14, minval=1, title=\"DI Length\", group=dmiGroup)\nlensig = input(13, title=\"ADX Smoothing\", minval=1, maxval=50, group=dmiGroup)\nkeyLevel = input(23, title=\"key level\", group=dmiGroup)\n[diplus,diminus,adx] = dmi(len, lensig)\n\n// Moving Average\nmaGroup = \"Moving Average\"\nma1Type = input(title=\"Type\", type=input.string, defval=\"EMA\", options=[\"EMA\", \"SMA\"], group=maGroup, inline=\"ma1\")\nma1Len = input(10, minval=1, title=\"Length\", group=maGroup, inline=\"ma1\")\nma1 = ma1Type == \"EMA\" ? ema(src, ma1Len) : sma(src, ma1Len)\nplot(ma1, title=\"Moving Average 1\", linewidth=1, color=color.new(color.blue, 10))\n\nma2Type = input(title=\"Type\", type=input.string, defval=\"EMA\", options=[\"EMA\", \"SMA\"], group=maGroup, inline=\"ma2\")\nma2Len = input(20, minval=1, title=\"Length\", group=maGroup, inline=\"ma2\")\nma2 = ma2Type == \"EMA\" ? ema(src, ma2Len) : sma(src, ma2Len)\nplot(ma2, title=\"Moving Average 2\", linewidth=1, color=color.new(color.orange, 10))\n\n\n// Strategy\nstratGroup = \"Strategy\"\nshowLong = input(true, title=\"Long entries\", group=stratGroup)\nshowShort = input(false, title=\"Short entries\", group=stratGroup)\n\nlongCond = diplus < diminus and diplus[1] < diminus[1] //and diplus[2] < diminus[2]\nshortCond = diplus > diminus and diplus[1] > diminus[1] //and diplus[2] > diminus[2]\nlongEntry = crossover(ma1, ma2)\nshortEntry = crossunder(ma1, ma2)\n\nif showLong and not showShort\n    strategy.entry(\"Long\", true, when=longEntry)\n    strategy.close(\"Long\", when=shortEntry)\nif not showLong and showShort\n    strategy.entry(\"Short\", false, when=shortEntry)\n    strategy.close(\"Short\", when=longEntry)\nif showLong and showShort\n    strategy.entry(\"Long\", true, when=longEntry)\n    strategy.entry(\"Short\", false, when=shortEntry)\n\n// Stop Loss\nslGroup = \"Stop Loss\"\nuseSL = input(false, title=\"╔══════   Enable   ══════╗\", group=slGroup)\nSLPercent = input(10, title=\"Percent\", type=input.float, group=slGroup) * 0.01\n\nlongStop  = strategy.position_avg_price * (1 - SLPercent)\nshortStop = strategy.position_avg_price * (1 + SLPercent)\n\nif useSL\n    strategy.exit(\"Stop Loss\", \"Long\", stop=longStop)","strategies/trend/Tendency EMA + RSI.pine":"// This source code is subject to the terms of the Mozilla Public License 2.0 at https://mozilla.org/MPL/2.0/\n//@author Alorse\n\n//@version=5\nstrategy(title='Trend EMA + RSI [Alorse]', shorttitle='Trend EMA + RSI [Alorse]', overlay=true, pyramiding=0, currency=currency.USD, default_qty_type=strategy.percent_of_equity, initial_capital=1000, default_qty_value=10, commission_type=strategy.commission.percent, commission_value=0.1)\n\n// Bollinger Bands\nlen = input.int(14, minval=1, title='Length', group='RSI')\nsrc = input.source(close, 'Source', group='RSI')\nrsi = ta.rsi(src, len)\n\n// Moving Averages\nlen_a = input.int(10, minval=1, title='EMA A Length', group='Moving Averages')\nout_a = ta.ema(close, len_a)\nplot(out_a, title='EMA A', color=color.purple)\n\nlen_b = input.int(20, minval=1, title='EMA B Length', group='Moving Averages')\nout_b = ta.ema(close, len_b)\nplot(out_b, title='EMA B', color=color.orange)\n\nlen_c = input.int(100, minval=1, title='EMA C Length', group='Moving Averages')\nout_c = ta.ema(close, len_c)\nplot(out_c, title='EMA C', color=color.green)\n\n// Strategy Conditions\nstratGroup = 'Strategy'\nshowLong = input.bool(true, title='Long entries', group=stratGroup)\nshowShort = input.bool(false, title='Short entries', group=stratGroup)\ncloseAfterXBars = input.bool(true, title='Close after X # bars', tooltip='If trade is in profit', group=stratGroup)\nxBars = input.int(24, title='# bars')\n\nentryLong = ta.crossover(out_a, out_b) and out_a > out_c and close > open\nexitLong = rsi > 70\n\nentryShort = ta.crossunder(out_a, out_b) and out_a < out_c and close < open\nexitShort = rsi < 30\n\n\nbought = strategy.opentrades[0] == 1 and strategy.position_size[0] > strategy.position_size[1]\nentry_price = ta.valuewhen(bought, open, 0)\nvar int nPastBars = 0\nif strategy.position_size > 0 or strategy.position_size < 0\n    nPastBars := nPastBars + 1\nif strategy.position_size == 0\n    nPastBars := 0\nif closeAfterXBars\n    exitLong := nPastBars >= xBars and close > entry_price ? true : exitLong\n    exitShort := nPastBars >= xBars and close < entry_price ? true : exitShort\n\n// Long Entry\nstrategy.entry('Long', strategy.long, when=entryLong and showLong)\nstrategy.close('Long', when=exitLong)\n\n// Short Entry\nstrategy.entry('Short', strategy.short, when=entryShort and showShort)\nstrategy.close('Short', when=exitShort)\n","strategies/trend/3 EMA:SMA + Cross.pine":"//@version=4\nstrategy(title=\"3 EMA/SMA + Cross Strategy [Alorse]\", overlay=true, pyramiding=0, currency=currency.USD, default_qty_type=strategy.percent_of_equity, default_qty_value=100)\n\n// Set stop loss level with input options (optional)\nsrc = input(title=\"Source\", type=input.source, defval=close)\nma_type1 = input(title=\"Type\", type=input.string, defval=\"EMA\", options=[\"EMA\", \"SMA\"], group=\"Moving Average 1 (Fast)\")\nlenFast = input(10, minval=1, title=\"Periods\", group=\"Moving Average 1 (Fast)\")\nma_type2 = input(title=\"Type\", type=input.string, defval=\"EMA\", options=[\"EMA\", \"SMA\"], group=\"Moving Average 2 (Slow)\")\nlenSlow = input(20, minval=1, title=\"Periods\", group=\"Moving Average 2 (Slow)\")\nma_type3 = input(title=\"Type\", type=input.string, defval=\"EMA\", options=[\"EMA\", \"SMA\"], group=\"Moving Average 3 (Tendence)\")\nlenTend = input(100, minval=1, title=\"Periods\", group=\"Moving Average 3 (Tendence)\")\n\n// Calculate moving averages\nmaFast = ma_type1 == \"EMA\" ? ema(src, lenFast) : sma(src, lenFast)\nmaSlow = ma_type2 == \"EMA\" ? ema(src, lenSlow) : sma(src, lenSlow)\nmaTend = ma_type3 == \"EMA\" ? ema(src, lenTend) : sma(src, lenTend)\navg = round((lenFast+lenSlow)/2.4)\nmaAvg = ma_type1 == \"EMA\" ? ema(src, avg) : sma(src, avg) // With Moving Average Type 1\n\n// Plot moving averages\nplot(maFast, color=color.purple, title=\"Fast MA\")\nplot(maSlow, color=color.orange, title=\"Slow MA\")\n//plot(maTend, color=color.white, title=\"Tendence MA\", linewidth=2)\nplot(maAvg, color=color.new(color.silver, 75), title=\"Average MA\")\n\n// Calculate trading conditions\ncrossover  = crossover(maFast, maSlow)\ncrossunder = crossunder(maFast, maAvg)\nlastCross = cross(maFast, maSlow)\nplot(crossover ? maFast : na, style=plot.style_cross, title=\"Entry cross\", linewidth=2, color=color.white)\nplot(crossunder ? maAvg : na, style=plot.style_cross, title=\"Exit cross\", linewidth=2, color=color.silver)\n\nshowLong = input(true, title=\"Show Long entries\", group=\"Strategy\")\nshowShort = input(false, title=\"Show Short entries\", group=\"Strategy\")\ncrossBack = input(title=\"Check Cross in the last # candles\", type=input.integer, defval=12, minval=4, group=\"Strategy\")\nSP = input(title=\"Short Stop Loss (%)\", type=input.float, minval=0.0, step=0.1, defval=3, group=\"Strategy\") * 0.01\n\nwasCrossLong = false\nenterLong = false\nwasCrossShort = false\nenterShort = false\nfor i = 1 to crossBack\n    if crossover(maFast[i], maSlow[i])\n        wasCrossLong := true\n    if crossunder(maFast[i], maSlow[i])\n        wasCrossShort := true\nfor i = 1 to 4\n    if crossover(maFast[i], maSlow[i])\n        wasCrossLong := false\n    if crossunder(maFast[i], maSlow[i])\n        wasCrossShort := false\nif barssince(lastCross) <= 4\n    wasCrossLong := false\n    wasCrossShort := false\n\n// LONG\nisLong = strategy.position_size > 0\nif maFast >= maSlow and close[0] >= maFast and maFast >= low[1] and close[0] >= maTend and close[0] > open[0]\n    enterLong := true\n// Determine stop loss price\nlongStopPrice = lowest(low, crossBack*2)\n//longStopPrice  = strategy.position_avg_price * (1 - SP)\n// Submit entry orders\nstrategy.entry(\"Long\", true, when=showLong and wasCrossLong and enterLong, alert_message='{\"text\": \"{{ticker}}: EMA 10/20 Cross on {{interval}} minutes 🟢\"}')\nstrategy.close(\"Long\", when=crossunder, comment = \"Close\")\n// Submit exit orders based on calculated stop loss price\nif isLong\n    strategy.exit(id=\"Exit SL\", stop=longStopPrice)\n// Plot stop loss values for confirmation\n// plot(showLong and isLong ? longStopPrice[1] : na, color=color.new(color.red, 30), style=plot.style_linebr, title=\"Long SL\")\n\n// SHORT\nisShort = strategy.position_size < 0\nif maFast <= maSlow and close[0] <= maFast and maFast <= high[1] and close[0] <= maTend and close[0] < open[0]\n    enterShort := true\n// Determine stop loss price\nshortStopPrice = highest(high, crossBack*2)\n// shortStopPrice = strategy.position_avg_price * (1 + SP)\n// Submit entry orders\nstrategy.entry(\"Short\", false, when=showShort and wasCrossShort and enterShort, alert_message='{\"text\": \"{{ticker}}: EMA 10/20 Cross on {{interval}} minutes 🔴\"}')\nstrategy.close(\"Short\", when=crossover(maFast, maSlow))\n\n// Submit exit orders based on calculated stop loss price\nif isShort\n    strategy.exit(id=\"Exit\", stop=shortStopPrice)\n// Plot stop loss values for confirmation\nplot(showShort and isShort ? shortStopPrice[1] : na, color=color.new(color.red, 30), style=plot.style_linebr, title=\"Short SL\")\n","strategies/trend/HA UnivLong&Short Futures.pine":"//@version=5\nstrategy('HA UnivLong&Short Futures', overlay=false)\n\n// Calculation HA Values\n[haopen, haclose, hahigh, halow] = request.security(ticker.heikinashi(syminfo.tickerid), timeframe.period, [open, close, high, low])\n// HA colors\nhacolor = haclose > haopen ? #26a69a : #ef5350\n\nlen = input(title='Period', defval=3)\nsmaHigh = ta.sma(hahigh, len)\nsmaLow = ta.sma(halow, len)\nHlv = int(na)\nHlv := haclose > smaHigh ? 1 : haclose < smaLow ? -1 : Hlv[1]\nsslDown = Hlv < 0 ? smaHigh : smaLow\nsslUp = Hlv < 0 ? smaLow : smaHigh\n\n// Strategy\nsl_inp = input(1.0, title='Stop Loss %')/100\ntp_inp = input(0.3, title='Take Profit %')/100\n \nstop_level = strategy.position_avg_price * (1 - sl_inp)\ntake_level = strategy.position_avg_price * (1 + tp_inp)\n\nstop_level_short = strategy.position_avg_price * (1 + sl_inp)\ntake_level_short = strategy.position_avg_price * (1 - tp_inp)\n\n// Backtesting\nbtGroup = \"Backtesting\"\nstartTime = input.time(title=\"Start time\", defval=timestamp(\"Dec 01 2021 19:45:00\"), group=btGroup)\nendTime = input.time(title=\"End time\", defval=timestamp(\"Feb 01 2099 23:59:59\"), group=btGroup)\ninDateRange = time >= startTime and time <= endTime\n\nstrategy.entry('long', strategy.long, when=ta.crossover(sslUp, sslDown) and inDateRange)\nstrategy.entry('short', strategy.short, when=ta.crossover(sslDown, sslUp) and inDateRange)\nstrategy.exit('CLOSE_L\", \"long',  stop=stop_level, limit=take_level)\nstrategy.exit('CLOSE_S\", \"short', stop=stop_level_short, limit=take_level_short)\n\nplotcandle(haopen, hahigh, halow, haclose, title='HA', color=hacolor, wickcolor=hacolor, bordercolor=hacolor)\nplot(sslDown, linewidth=1, color=color.new(color.red, 0))\nplot(sslUp, linewidth=1, color=color.new(color.lime, 0))","strategies/momentum/2 EMA:SMA + RSI.pine":"// This source code is subject to the terms of the Mozilla Public License 2.0 at https://mozilla.org/MPL/2.0/\n// © alorse\n\n//@version=4\nstrategy(\"2 EMA/SMA + RSI Strategy [Alorse]\", shorttitle=\"2 SMA + RSI STRTG [Alorse]\", overlay=true, pyramiding=0, currency=currency.USD, default_qty_type=strategy.percent_of_equity, default_qty_value=100)\n\nsrc = input(title=\"Source\", type=input.source, defval=close)\nma_type1 = input(title=\"Type\", type=input.string, defval=\"SMA\", options=[\"EMA\", \"SMA\"], group=\"Moving Average 1 (Fast)\")\nlenFast = input(10, minval=1, title=\"Periods\", group=\"Moving Average 1 (Fast)\")\nma_type2 = input(title=\"Type\", type=input.string, defval=\"SMA\", options=[\"EMA\", \"SMA\"], group=\"Moving Average 2 (Slow)\")\nlenSlow = input(30, minval=1, title=\"Periods\", group=\"Moving Average 2 (Slow)\")\nma_type3 = input(title=\"Type\", type=input.string, defval=\"EMA\", options=[\"EMA\", \"SMA\"], group=\"Moving Average 3 (Tendence)\")\nlenTend = input(200, minval=1, title=\"Periods\", group=\"Moving Average 3 (Tendence)\")\nshowCross = input(title=\"Show MA Cross\", defval=true, group=\"Moving Averages\")\n\n// Calculate moving averages\nmaFast = ma_type1 == \"EMA\" ? ema(src, lenFast) : sma(src, lenFast)\nmaSlow = ma_type2 == \"EMA\" ? ema(src, lenSlow) : sma(src, lenSlow)\nmaTend = ma_type3 == \"EMA\" ? ema(src, lenTend) : sma(src, lenTend)\n\n// Plot moving averages\nplot(maFast, color=color.purple, title=\"Fast MA\")\nplot(maSlow, color=color.blue, title=\"Slow MA\")\nplot(maTend, color=color.yellow, title=\"Tendence MA\", linewidth=2)\n\n// Cross detect\ncross_up = crossover(maFast , maSlow)\ncross_down = crossunder(maFast , maSlow)\nplot(showCross and cross_up or showCross and cross_down ? maFast : na, style=plot.style_cross, title=\"Cross\", linewidth=2, color=color.white)\n\n// RSI\nlen = input(8, minval=1, title=\"Length\", group=\"RSI\")\nup = rma(max(change(src), 0), len)\ndown = rma(-min(change(src), 0), len)\nrsi = rsi(src, len)\n\n\n//Strategy Conditions\nshowShort = input(false, title=\"Show Short entries\", group=\"Strategy\")\n\nlong = maFast[1] > maSlow[1] and rsi[1] > 25 and rsi[1] < 40 and close[1] > open[1]\nshort = maFast[1] < maSlow[1] and rsi[1] < 75 and rsi[1] > 60 and close[1] < open[1]\nstrategy.entry(\"Long\", true, when=long)\nstrategy.entry(\"Short\", false, when=short)\n","strategies/momentum/DMI Winner.pine":"//@version=5\nstrategy('Directional Movement Index Winner [Alorse]', shorttitle='DMI Winner [Alorse]', overlay=true, pyramiding=0, currency=currency.USD, default_qty_type=strategy.percent_of_equity, initial_capital=1000, default_qty_value=20, commission_type=strategy.commission.percent, commission_value=0.01)\n\ntxtVer = '0.0.9'\nversion = input.string(title='Version', defval=txtVer, options=[txtVer], tooltip='This is informational only, nothing will change.\\n\\nEntry conditions:\\n')\nsrc = input(title='Source', defval=close)\n\n// DMI\ndmiGroup = 'Directional Movement Index'\nlen = input.int(14, minval=1, title='DI Length', group=dmiGroup)\nlensig = input.int(13, title='ADX Smoothing', minval=1, maxval=50, group=dmiGroup)\nkeyLevel = input.int(23, title='key level', group=dmiGroup)\n[diplus, diminus, adx] = ta.dmi(len, lensig)\n\n// Moving Average\nmaGroup = 'Moving Average'\nhasMa = input.bool(true, title='╔══════   Use MA   ══════╗', group=maGroup)\nmaType = input.string(title='Type', defval='EMA', options=['EMA', 'SMA'], group=maGroup, inline='ma')\nmaLen = input.int(55, minval=1, title='Length', group=maGroup, inline='ma')\nma = maType == 'EMA' ? ta.ema(src, maLen) : ta.sma(src, maLen)\nplot(hasMa ? ma : na, title='Moving Average', linewidth=1, color=color.new(color.blue, 10))\nbuyMaFilter = hasMa ? close > ma : true\nsellMaFilter = hasMa ? close < ma : true\n\n// Strategy\nstratGroup = 'Strategy'\nshowLong = input.bool(true, title='Long entries', group=stratGroup)\nshowShort = input.bool(false, title='Short entries', group=stratGroup)\n\nlongCond = diplus > diminus and diplus[1] > diminus[1] and diplus[2] > diminus[2]\nshortCond = diplus < diminus and diplus[1] < diminus[1] and diplus[2] < diminus[2]\nlongEntry = longCond and adx > keyLevel and buyMaFilter and close > open\nshortEntry = shortCond and adx > keyLevel and sellMaFilter and close < open\n\n// Backtesting\nbtGroup = \"Backtesting\"\nstartTime = input.time(title=\"Start time\", defval=timestamp(\"Feb 01 2021 23:59:59\"), group=btGroup)\nendTime = input.time(title=\"End time\", defval=timestamp(\"Feb 01 2099 23:59:59\"), group=btGroup)\n\ninDateRange = time >= startTime and time <= endTime\n\nif showLong and not showShort and inDateRange\n    strategy.entry('Long', strategy.long, when=longEntry)\n    strategy.close('Long', when=shortEntry)\nif not showLong and showShort and inDateRange\n    strategy.entry('Short', strategy.short, when=shortEntry)\n    strategy.close('Short', when=longEntry)\nif showLong and showShort and inDateRange\n    strategy.entry('Long', strategy.long, when=longEntry)\n    strategy.entry('Short', strategy.short, when=shortEntry)\n\n// Stop Loss\nslGroup = 'Stop Loss'\nuseSL = input.bool(false, title='╔══════   Enable   ══════╗', group=slGroup)\nSLPercent = input.float(10, title='Percent', group=slGroup) * 0.01\n\nlongStop = strategy.position_avg_price * (1 - SLPercent)\nshortStop = strategy.position_avg_price * (1 + SLPercent)\n\nif useSL\n    strategy.exit('Stop Loss', 'Long', stop=longStop)","strategies/momentum/Double RSI.pine":"// This source code is subject to the terms of the Mozilla Public License 2.0 at https://mozilla.org/MPL/2.0/\n// © alorse\n\n//@version=5\nstrategy(title='Double RSI [Alorse]', overlay=true, pyramiding=0, currency=currency.USD, default_qty_type=strategy.percent_of_equity, initial_capital=1000, default_qty_value=10, commission_type=strategy.commission.percent, commission_value=0.01)\n\nrsiGroup = 'RSI'\nlen = input.int(14, minval=1, title='Length', group=rsiGroup)\nsrc = input.source(close, 'Source', group=rsiGroup)\nrsi = ta.rsi(src, len)\n\nmultiGroup = 'Multi Timeframe RSI'\nresA = input.timeframe(title='Timeframe', defval='15', group=multiGroup)\nmRsi = request.security(syminfo.tickerid, resA, ta.rsi(src, len))\n\ntpGroup = 'Take Profit'\nuseTP = input.bool(false, title='╔══════   Enable   ══════╗', group=tpGroup)\nTPPercent = input.float(1.2, step=0.1, title='Percent', group=tpGroup) * 0.01\n\nlongTP = strategy.position_avg_price * (1 + TPPercent)\nshortTP = strategy.position_avg_price * (1 - TPPercent)\n\n// Strategy\nbuy = ta.crossover(rsi, 30) and mRsi < 35\nsell = ta.crossunder(rsi, 70) and mRsi > 65\nstrategy.entry('Long', strategy.long, when=buy)\nstrategy.exit('Exit', 'Long', stop=na, limit=longTP)\n\nstrategy.entry('Short', strategy.short, when=sell)\nstrategy.exit('Exit', 'Short', stop=na, limit=shortTP)\n\n","strategies/momentum/MACD + DMI.pine":"// This source code is subject to the terms of the Mozilla Public License 2.0 at https://mozilla.org/MPL/2.0/\n//@version=4\nstrategy(shorttitle='MACD + DMI [Alorse]',title='MACD + DMI [Alorse]', overlay=true, pyramiding=0, currency=currency.USD, default_qty_type=strategy.percent_of_equity, initial_capital=1000, default_qty_value=10, commission_type=strategy.commission.percent, commission_value=0.01)\n\n// Works better on 3h, 1h, 2h, 4h\n// DMI and MACD inputs and calculations\n\n[pos_dm, neg_dm, avg_dm] = dmi(14, 14)\n[macd, macd_signal, macd_histogram] = macd(close, 12, 26, 9)\n\n\nlength = input(20, \"Length\", minval = 2)\nsrc = input(close, \"Source\")\nfactor = input(2.0, \"vStop Multiplier\", minval = 0.25, step = 0.25)\nvolStop(src, atrlen, atrfactor) =>\n    var max     = src\n    var min     = src\n    var uptrend = true\n    var stop    = 0.0\n    atrM        = nz(atr(atrlen) * atrfactor, tr)\n    max         := max(max, src)\n    min         := min(min, src)\n    stop        := nz(uptrend ? max(stop, max - atrM) : min(stop, min + atrM), src)\n    uptrend     := src - stop >= 0.0\n    if uptrend != nz(uptrend[1], true)\n        max    := src\n        min    := src\n        stop   := uptrend ? max - atrM : min + atrM\n    [stop, uptrend]\n\n[vStop, uptrend] = volStop(src, length, factor)\n\ntales = crossunder(macd, macd_signal) and pos_dm > neg_dm ? false : crossunder(macd, macd_signal) and pos_dm < neg_dm ? true : false\ncloseLong = tales or crossunder(close, vStop)\n\n//Entry \nstrategy.entry(\"long\",true, when=crossover(macd, macd_signal) and pos_dm > neg_dm)\n//Exit\nstrategy.close(\"long\", when=closeLong)\n","strategies/momentum/MACD Long Strategy [Bunghole].pine":"//@version=5\n// This source code is subject to the terms of the Mozilla Public License 2.0 at https://mozilla.org/MPL/2.0/\n// © Bunghole 2021\nstrategy(title='MACD Long Strategy [Alorse]', overlay=true, pyramiding=0, currency=currency.USD, default_qty_type=strategy.percent_of_equity, initial_capital=1000, default_qty_value=20, commission_type=strategy.commission.percent, commission_value=0.1)\n\n\n//// Stoploss and Take Profit Parameters\n// Enable Long Strategy\nenable_long_strategy = input.bool(true, title='Enable Long Strategy', group='SL/TP For Long Strategy', inline='1')\nlong_stoploss_value = input.float(defval=50, title='Stoploss %', minval=0.1, group='SL/TP For Long Strategy', inline='2')\nlong_stoploss_percentage = close * (long_stoploss_value / 100) / syminfo.mintick\nlong_takeprofit_value = input.float(defval=50, title='Take Profit %', minval=0.1, group='SL/TP For Long Strategy', inline='2')\nlong_takeprofit_percentage = close * (long_takeprofit_value / 100) / syminfo.mintick\n\n// Enable Short Strategy\nenable_short_strategy = input.bool(true, title='Enable Short Strategy', group='SL/TP For Short Strategy', inline='3')\nshort_stoploss_value = input.float(defval=50, title='Stoploss %', minval=0.1, group='SL/TP For Short Strategy', inline='4')\nshort_stoploss_percentage = close * (short_stoploss_value / 100) / syminfo.mintick\nshort_takeprofit_value = input.float(defval=50, title='Take Profit %', minval=0.1, group='SL/TP For Short Strategy', inline='4')\nshort_takeprofit_percentage = close * (short_takeprofit_value / 100) / syminfo.mintick\n\n\n//// Indicator Inputs\n// RSI\nrsi_over_sold = input.int(defval=30, minval=1, title='Over Sold Level', group='RSI')\nrsi_over_bought = input.int(defval=70, minval=1, title='Over Bought Level', group='RSI')\nrsi_length = input.int(defval=14, minval=1, title='RSI Length', group='RSI')\nrsi = ta.rsi(close, rsi_length)\n\n// MACD\nfast_ma = input.int(defval=12, minval=1, title='FastMA Length', group='MACD')\nslow_ma = input.int(defval=26, minval=1, title='SlowMA Length', group='MACD')\nsignal_length = input.int(defval=9, minval=1, title='Signal Length', group='MACD')\n[macd_line, signal_line, hist_line] = ta.macd(close, fast_ma, slow_ma, signal_length)\n\n\n//// Strategy\n// Creating Long and Short Strategy\nwas_over_sold = ta.barssince(rsi <= rsi_over_sold) <= 10\nwas_over_bought = ta.barssince(rsi >= rsi_over_bought) <= 10\ncrossover_bull = ta.crossover(macd_line, signal_line)\ncrossover_bear = ta.crossunder(macd_line, signal_line)\nbuy_signal = was_over_sold and crossover_bull\nsell_signal = was_over_bought and crossover_bear\n\n// Long Strategy\nif buy_signal and enable_long_strategy\n    strategy.entry('Long', strategy.long, when=buy_signal, alert_message='Open Long Position')\n    strategy.exit('Long  SL/TP', from_entry='Long', loss=long_stoploss_percentage, profit=long_takeprofit_percentage, alert_message='Your Long SL/TP Limit As Been Triggered.')\n    strategy.close('Long', when=sell_signal, alert_message='Close Long Position')\n\n// Short Strategy\nif sell_signal and enable_short_strategy\n    strategy.entry('Short', strategy.short, when=sell_signal, alert_message='Open Short Position')\n    strategy.exit('Short SL/TP', from_entry='Short', loss=short_stoploss_percentage, profit=short_takeprofit_percentage, alert_message='Your Short SL/TP Limit As Been Triggered.')\n    strategy.close('Short', when=buy_signal, alert_message='Close Short Position')\n","strategies/momentum/MACD+RSI.pine":"// This source code is subject to the terms of the Mozilla Public License 2.0 at https://mozilla.org/MPL/2.0/\n// © fredoorse\n\n//@version=4\nstrategy(title=\"MACD + RSI Strategy [Alorse]\", overlay=true, shorttitle=\"MACD+RSI STRTG\", pyramiding=0, currency=currency.USD, default_qty_type=strategy.percent_of_equity, default_qty_value=100)\n\nsrc = input(title=\"Source\", type=input.source, defval=close)\n// MACD\n// Getting inputs\nfast_length = input(title=\"Fast Length\", type=input.integer, defval=12, group=\"MACD\")\nslow_length = input(title=\"Slow Length\", type=input.integer, defval=26, group=\"MACD\")\nsignal_length = input(title=\"Signal Smoothing\", type=input.integer, minval = 1, maxval = 50, defval = 9, group=\"MACD\")\nsma_source = input(title=\"Oscillator MA Type\", type=input.string, defval=\"EMA\", options=[\"SMA\", \"EMA\"], group=\"MACD\")\nsma_signal = input(title=\"Signal Line MA Type\", type=input.string, defval=\"EMA\", options=[\"SMA\", \"EMA\"], group=\"MACD\")\n// Calculating\nfast_ma = sma_source == \"SMA\" ? sma(src, fast_length) : ema(src, fast_length)\nslow_ma = sma_source == \"SMA\" ? sma(src, slow_length) : ema(src, slow_length)\nmacd = fast_ma - slow_ma\nsignal = sma_signal == \"SMA\" ? sma(macd, signal_length) : ema(macd, signal_length)\n\n// RSI\nlen = input(14, minval=1, title=\"Length\", group=\"RSI\")\nrsi = rsi(src, len)\n\n// Strategy\nSL = input(title=\"Stop Loss %\", type=input.integer, defval=99, group=\"Strategy\") * 0.01\nTP = input(title=\"Take Profit %\", type=input.integer, defval=10, group=\"Strategy\")\nrsiBack = input(title=\"Check RSI last # candles\", type=input.integer, defval=5, group=\"Strategy\")\nrsiDown = input(title=\"RSI over sold level\", type=input.integer, defval=30, group=\"Strategy\")\nrsiUp = input(title=\"RSI over bought level\", type=input.integer, defval=70, group=\"Strategy\")\n\nwasRsiDown = false\nfor i = 1 to rsiBack\n    if rsi[i] <= rsiDown\n        wasRsiDown := true\n        break\n\nwasRsiUp = false\nfor i = 1 to rsiBack\n    if rsi[i] >= rsiUp\n        wasRsiUp := true\n        break\n\nbull_cross = crossover(macd, signal) and wasRsiDown\nbear_cross = crossunder(macd, signal) and wasRsiUp\nstrategy.entry(\"Long\", strategy.long, when=bull_cross)\n// strategy.entry(\"Sell\", strategy.short, when=bear_cross)\nstrategy.close(\"Long\", when=bear_cross)\n\nStopPrice  = strategy.position_avg_price * (1 - SL)\n\nif (strategy.position_size > 0)\n    strategy.exit(id=\"Exit\", stop=StopPrice)\n","strategies/momentum/QQE signals.pine":"//@version=4\n// This source code is subject to the terms of the Mozilla Public License 2.0 at https://mozilla.org/MPL/2.0/\n// © colinmck\n\nstrategy(\"QQE signals [Alorse]\", shorttitle=\"QQE signals [Alorse]\", overlay=true, pyramiding=0, currency=currency.USD, default_qty_type=strategy.percent_of_equity, initial_capital=1000, default_qty_value=10, commission_type=strategy.commission.percent, commission_value=0.01) \n\nRSI_Period = input(14, title='RSI Length')\nSF = input(5, title='RSI Smoothing')\nQQE = input(4.238, title='Fast QQE Factor')\nThreshHold = input(10, title=\"Thresh-hold\")\n\nsrc = close\nWilders_Period = RSI_Period * 2 - 1\n\nRsi = rsi(src, RSI_Period)\nRsiMa = ema(Rsi, SF)\nAtrRsi = abs(RsiMa[1] - RsiMa)\nMaAtrRsi = ema(AtrRsi, Wilders_Period)\ndar = ema(MaAtrRsi, Wilders_Period) * QQE\n\nlongband = 0.0\nshortband = 0.0\ntrend = 0\n\nDeltaFastAtrRsi = dar\nRSIndex = RsiMa\nnewshortband = RSIndex + DeltaFastAtrRsi\nnewlongband = RSIndex - DeltaFastAtrRsi\nlongband := RSIndex[1] > longband[1] and RSIndex > longband[1] ? max(longband[1], newlongband) : newlongband\nshortband := RSIndex[1] < shortband[1] and RSIndex < shortband[1] ? min(shortband[1], newshortband) : newshortband\ncross_1 = cross(longband[1], RSIndex)\ntrend := cross(RSIndex, shortband[1]) ? 1 : cross_1 ? -1 : nz(trend[1], 1)\nFastAtrRsiTL = trend == 1 ? longband : shortband\n\n// Find all the QQE Crosses\n\nQQExlong = 0\nQQExlong := nz(QQExlong[1])\nQQExshort = 0\nQQExshort := nz(QQExshort[1])\nQQExlong := FastAtrRsiTL < RSIndex ? QQExlong + 1 : 0\nQQExshort := FastAtrRsiTL > RSIndex ? QQExshort + 1 : 0\n\n//Conditions\n\nqqeLong = QQExlong == 1 ? FastAtrRsiTL[1] - 50 : na\nqqeShort = QQExshort == 1 ? FastAtrRsiTL[1] - 50 : na\n\n// Plotting\n\n// plotshape(qqeLong, title=\"QQE long\", text=\"Long\", textcolor=color.white, style=shape.labelup, location=location.belowbar, color=color.green, transp=0, size=size.tiny)\n// plotshape(qqeShort, title=\"QQE short\", text=\"Short\", textcolor=color.white, style=shape.labeldown, location=location.abovebar, color=color.red, transp=0, size=size.tiny)\n\n// Alerts\nstrategy.entry(\"Long\", true, when=qqeLong)\n// strategy.entry(\"Short\", false, when=qqeShort)\nstrategy.close(\"Long\", when=qqeShort)\n","strategies/momentum/RSI + 1200.pine":"// This source code is subject to the terms of the Mozilla Public License 2.0 at https://mozilla.org/MPL/2.0/\n// © alorse\n\n//@version=5\nstrategy(\"RSI + 1200 Strategy [Alose]\", overlay=true, pyramiding=0, currency=currency.USD, default_qty_type=strategy.percent_of_equity, initial_capital=100000, default_qty_value=100, commission_type=strategy.commission.percent, commission_value=0.01)\n\n// RSI\nrsiGroup = 'RSI'\nsrc = input(title='Source', defval=close, group=rsiGroup)\nlenRSI = input.int(14, title='Length', minval=1, group=rsiGroup)\nRSI = ta.rsi(src, lenRSI)\nRSIoverbought = input.int(72, title='Overbought', minval=1, group=rsiGroup, tooltip='The trade will close when the RSI crosses up this point.')\nRSIoversold = input.int(28, title='Oversold', minval=1, group=rsiGroup, tooltip='The trade will close when the RSI crosses below this point.')\n\n// MTF EMA\nmaGroup = \"MTF Moving Average\"\nemaLen = input(title='MA Periods', defval=150, group=maGroup)\nres = input.timeframe(title=\"Multi Timeframe\", defval=\"120\")\nema = request.security(syminfo.tickerid, res, ta.ema(close, emaLen))\nplot(ema, title=\"Moving Average\", linewidth=1, color=color.yellow)\n\n// Strategy Conditions\nstratGroup = 'Strategy'\nshowLong = input.bool(true, title='Long entries', group=stratGroup)\nshowShort = input.bool(true, title='Short entries', group=stratGroup)\nSL = input.int(title=\"Stop Loss %\", defval=10, group=stratGroup) * 0.01\n\nsecureLong = strategy.position_avg_price * (1 + 0.002)\nsecureShort = strategy.position_avg_price * (1 - 0.002)\n\n// Determine trail stop loss prices\nlongStopPrice = strategy.position_avg_price * (1 - SL)\nshortStopPrice = strategy.position_avg_price * (1 + SL)\n\nslackLongPercent = close > ema * 1.01 // +1%\nslackShortPercent = close < ema * 0.99 // -1%\n\nfiveLong = close > ema and close < ema * 1.02 and close < open and close[1] < open[1] and close[2] < open[2] //and close[3] < open[3] and close[4] < open[4]\nfiveShort = close < ema and close > ema * 0.99 and close > open and close[1] > open[1] and close[2] > open[2] //and close[3] > open[3] and close[4] > open[4]\n\nentryLong = close > ema and ta.crossover(RSI, RSIoversold) and slackLongPercent\nexitLong = RSI > RSIoverbought or fiveLong\n\nentryShort = close < ema and ta.crossunder(RSI, RSIoverbought) and slackShortPercent\nexitShort = RSI < RSIoversold or fiveShort\n\nif showLong\n    strategy.entry(\"Long\", strategy.long, when=entryLong)\n    strategy.exit(\"Exit\", \"Long\", stop=longStopPrice)\n    strategy.close(\"Long\", when=exitLong)\n\nif showShort\n    strategy.entry(\"Short\", strategy.short, when=entryShort)\n    strategy.exit(\"Exit\", \"Short\", stop=shortStopPrice)\n    strategy.close(\"Short\", when=exitShort)\n","strategies/momentum/RSI + EMA.pine":"// This source code is subject to the terms of the Mozilla Public License 2.0 at https://mozilla.org/MPL/2.0/\n// alorse\n\n//@version=5\nstrategy(title='RSI + EMA [Alorse]', shorttitle='RSI + EMA [Alorse]', overlay=true, pyramiding=0, currency=currency.USD, default_qty_type=strategy.percent_of_equity, initial_capital=1000, default_qty_value=20, commission_type=strategy.commission.percent, commission_value=0.01)\n\nsrc = input(close, 'Source')\nrsi_length = input(14, title='RSI Length')\nrsi_overbought = input(70, title='RSI Overbought Level')\nrsi_oversold = input(30, title='RSI Overbought Level')\nup = ta.rma(math.max(ta.change(src), 0), rsi_length)\ndown = ta.rma(-math.min(ta.change(src), 0), rsi_length)\nrsi = down == 0 ? 100 : up == 0 ? 0 : 100 - 100 / (1 + up / down)\n\nmaGroup = \"Moving Average 1\"\nma_type = input.string(title='Type', defval='EMA', options=['SMA', 'EMA'], group=maGroup, inline='ma')\nma_length = input.int(title='Length', defval=150, group=maGroup, inline='ma')\nma = ma_type == 'SMA' ? ta.sma(src, ma_length) : ta.ema(src, ma_length)\nplot(ma, title=maGroup, color=color.purple)\n\nma2Group = \"Moving Average 2\"\nma2_type = input.string(title='Type', defval='EMA', options=['SMA', 'EMA'], group=ma2Group, inline='ma')\nma2_length = input.int(title='Length', defval=600, group=ma2Group, inline='ma')\nma2 = ma2_type == 'SMA' ? ta.sma(src, ma2_length) : ta.ema(src, ma2_length)\nplot(ma2, title=ma2Group, color=color.orange)\n\n\nlongEntry = rsi < rsi_oversold and ma > ma2\nshortEntry = rsi > rsi_overbought and ma > ma2\n\n\nstrategy.entry('Long', strategy.long, when=longEntry)\nstrategy.close('Long', when=rsi > rsi_overbought)\n\n\nstrategy.entry('Short', strategy.short, when=shortEntry)\nstrategy.close('Short', when=rsi < rsi_oversold)\n","strategies/MTF RSI.pine":"// This source code is subject to the terms of the Mozilla Public License 2.0 at https://mozilla.org/MPL/2.0/\n// © alorse\n\n//@version=5\nstrategy(\"MTF RSI\", overlay=true, overlay=true, pyramiding=0, currency=currency.USD, default_qty_type=strategy.percent_of_equity, initial_capital=1000, default_qty_value=20, commission_type=strategy.commission.percent, commission_value=0.01)\n\n// RSI\nrsiGroup = 'RSI'\nlenRSI = input.int(14, title='Length', minval=1, group=rsiGroup)\nrsi_overbought = input(70, title='RSI Overbought Level', group=rsiGroup)\nrsi_oversold = input(30, title='RSI Overbought Level', group=rsiGroup)\nRSI = ta.rsi(close, lenRSI)\n\nmaGroup = \"Moving Average\"\nma_type = input.string(title='Type', defval='EMA', options=['SMA', 'EMA'], group=maGroup, inline='ma')\nma_length = input.int(title='Length', defval=900, group=maGroup, inline='ma')\nma = ma_type == 'SMA' ? ta.sma(close, ma_length) : ta.ema(close, ma_length)\n\nlongEntry = close > ma and RSI < rsi_oversold\nlongExit = RSI > rsi_overbought or close < ma\n\nstrategy.entry('Long', strategy.long, when=longEntry)\nstrategy.close('Long', when=longExit)\n","strategies/momentum/StochRSI + Supertrend Strategy.pine":"//\n//@author Alorse\n//@version=4\nstrategy(\"StochRSI + Supertrend Strategy [Alorse]\", shorttitle=\"StochRSI+ST STRTG [Alorse]\", overlay=true, pyramiding=0, initial_capital=1000, currency=currency.USD, default_qty_type=strategy.percent_of_equity, default_qty_value=10, commission_type=strategy.commission.percent, commission_value=0.01) \nsmoothK = input(3, \"K\", minval=1)\nsmoothD = input(3, \"D\", minval=1)\nlengthRSI = input(14, \"RSI Length\", minval=1)\nlengthStoch = input(14, \"Stochastic Length\", minval=1)\nsrc = input(close, title=\"RSI Source\")\nrsi1 = rsi(src, lengthRSI)\nk = sma(stoch(rsi1, rsi1, rsi1, lengthStoch), smoothK)\nd = sma(k, smoothD)\n\n// MA\nma_type = input(title=\"Type\", type=input.string, defval=\"EMA\", options=[\"EMA\", \"SMA\"], group=\"Tendence Moving Average\")\nlenTend = input(200, minval=1, title=\"Periods\", group=\"Tendence Moving Average\")\nmaTend = ma_type == \"EMA\" ? ema(src, lenTend) : sma(src, lenTend)\nplot(maTend, color=color.white, title=\"Tendence MA\", linewidth=2)\n\n// SUPERTREND\natrPeriod2 = input(11, \"ATR Length\", group=\"SUPERTREND 2\")\nfactor2 = input(2, \"Factor\", group=\"SUPERTREND 2\")\n[supertrend2, direction2] = supertrend(factor2, atrPeriod2)\nplot(direction2 < 0 ? supertrend2 : na, \"Up Trend 2\", color = color.green, style=plot.style_linebr)\nplot(direction2 < 0 ? na : supertrend2, \"Down Trend 2\", color = color.red, style=plot.style_linebr)\n\n// STRATEGY\nshowShort = input(false, title=\"Show Short entries\", group=\"Strategy\")\n\nbuy = close > maTend and k < 20 and crossover(k, d) and direction2 < 0\nsell = close < maTend and k > 80 and crossunder(k, d) and direction2 > 0\ncloseBuy = k > 80 and crossunder(k, d)\ncloseSell = k < 20 and crossover(k, d)\n\n// LONG\nstrategy.entry(\"Long\", true, when=buy)\nstrategy.close(\"Long\", when=closeBuy)\n\n// SHORT\nif showShort\n    strategy.entry(\"Short\", false, when=sell)\n    strategy.close(\"Short\", when=closeSell)","strategies/momentum/TTM Squeeze.pine":"//@version=5\nstrategy(title='TTM Squeeze [Alorse]', overlay=false, pyramiding=0, currency=currency.USD, default_qty_type=strategy.percent_of_equity, initial_capital=1000, default_qty_value=10, commission_type=strategy.commission.percent, commission_value=0.01)\nlength = input.int(title='Length', defval=20, minval=0)\nbband(length, mult) =>\n    ta.sma(close, length) + mult * ta.stdev(close, length)\nkeltner(length, mult) =>\n    ta.ema(close, length) + mult * ta.ema(ta.tr, length)\n\ne1 = (ta.highest(high, length) + ta.lowest(low, length)) / 2 + ta.sma(close, length)\nosc = ta.linreg(close - e1 / 2, length, 0)\ndiff = bband(length, 2) - keltner(length, 1)\n\nosc_color = osc[1] < osc[0] ? osc[0] >= 0 ? color.lime : color.maroon : osc[0] >= 0 ? color.green : color.red\nmid_color = diff >= 0 ? color.white : color.black\n\nlen = input.int(14, minval=1, title='Length', group='RSI')\nsrc = input.source(close, 'Source', group='RSI')\nrsi = ta.rsi(src, len)\n\ntpGroup = 'Take Profit'\nuseTP = input.bool(false, title='╔══════   Enable   ══════╗', group=tpGroup)\nTPPercent = input.float(1.2, step=0.1, title='Percent', group=tpGroup) * 0.01\n\nlongTP = strategy.position_avg_price * (1 + TPPercent)\nshortTP = strategy.position_avg_price * (1 - TPPercent)\n\n// Strategy\nbuy = osc < 0 and osc[1] < osc[0] and osc[2] < osc[0] and ta.crossover(rsi, 30)\nsell = osc > 0 and osc[1] > osc[0] and osc[2] > osc[0] and ta.crossunder(rsi, 70)\nstrategy.entry('Long', strategy.long, when=buy)\nstrategy.exit('Exit', 'Long', stop=na, limit=longTP)\n\nstrategy.entry('Short', strategy.short, when=sell)\nstrategy.exit('Exit', 'Short', stop=na, limit=shortTP)\n\nplot(osc, color=osc_color, style=plot.style_area, linewidth=1)\nplot(0, color=mid_color, style=plot.style_circles, linewidth=1)\n","strategies/momentum/Williams Vix Fix.pine":"//@version=4\nstrategy(\"Williams Vix Fix Strategy [Alorse]\", shorttitle=\"WVF STRTG [Alorse]\", overlay=false, pyramiding=0, currency=currency.USD, default_qty_type=strategy.percent_of_equity, initial_capital=1000, default_qty_value=10, commission_type=strategy.commission.percent, commission_value=0.01) \n\n// Bollinger Bands\nbbGroup = \"Bollindger Bands\"\nsrc = input(title=\"Source\", type=input.source, defval=close, group=bbGroup)\nbbl = input(20, title=\"Length\", group=bbGroup)\nmult = input(2.0, minval=1, maxval=5, title=\"Standard Deviation\", group=bbGroup)\n\nbasis = sma(src, bbl)\ndev = mult * stdev(src, bbl)\nupper = basis + dev\nlower = basis - dev\n\n// Williams Vix Fix\nwvfGroup = \"Williams Vix Fix\"\npd = input(20, title=\"LookBack Period StdDev\", tooltip=\"LookBack Period Standard Deviation\", group=wvfGroup)\nlb = input(50, title=\"LookBack Period Percentile\", group=wvfGroup)\nph = input(85, title=\"Highest Percentile\", group=wvfGroup) * 0.01\npl = input(99, title=\"Lowest Percentile\", group=wvfGroup)*0.01\n\nwvf = ((highest(close, pd)-low)/(highest(close, pd)))*100\nsDev = mult * stdev(wvf, bbl)\nmidLine = sma(wvf, bbl)\nupperBand = midLine + sDev\nrangeHigh = highest(wvf, lb) * ph\ncolNormal = wvf >= upperBand or wvf >= rangeHigh ? color.lime : color.new(color.silver, 20)\n\n\nwvfInv = ((high-lowest(close, pd))/lowest(close, pd))*100\nsDevInv = mult * stdev(wvfInv, bbl)\nmidLineInv = sma(wvfInv, bbl)\nupperBandInv = midLineInv + sDevInv\nrangeHighInv = lowest(wvfInv, lb) * pl\ncolInv = wvfInv <= upperBandInv or wvfInv <= rangeHighInv ? color.new(color.silver, 20) : color.orange\n\nsellCond = (wvfInv <= upperBandInv or wvfInv <= rangeHighInv) and (wvfInv[1] <= upperBandInv[1] or wvfInv[1] <= rangeHighInv[1]) and close < upper ? false : true\n\nbuy = (wvf >= upperBand or wvf >= rangeHigh) and (wvf[1] >= upperBand[1] or wvf[1] >= rangeHigh[1]) and close < lower\nsell = sellCond and close > upper\n\nstrategy.entry(\"Long\", true, when=buy)\nstrategy.close(\"Long\", when=sell)\n\nplot(wvf, title=\"Williams Vix Fix\", style=plot.style_columns, color=colNormal)\nplot(upperBand, title=\"Normal StdDev line\", style=plot.style_line, linewidth=1,color=color.blue)\n\nplot(0, title=\"Cero line\", color=color.white, style=plot.style_line)\n\nplot(wvfInv*-1, title=\"Williams Vix Fix Inverted\", style=plot.style_columns, color=colInv)\nplot(upperBandInv*-1, title=\"Inverted StdDev line\", style=plot.style_line, linewidth=1,color=color.blue)","strategies/mean-reversion/BB + Aroon.pine":"// This source code is subject to the terms of the Mozilla Public License 2.0 at https://mozilla.org/MPL/2.0/\n// © relevantLeader16058\n\n//@version=5\nstrategy(title='Bollinger bands + Aroon [Alorse]', shorttitle='BB + Aroon [Alorse]', overlay=true, pyramiding=0, currency=currency.USD, default_qty_type=strategy.percent_of_equity, default_qty_value=100, commission_type=strategy.commission.percent, commission_value=0.1)\n\n// BB inputs and calculations\nlengthBB = input.int(20, minval=1)\nsrc = input(close, title='Source')\nmult = input.float(2.0, minval=0.001, maxval=50, title='StdDev')\nbasis = ta.sma(src, lengthBB)\ndev = mult * ta.stdev(src, lengthBB)\nupper = basis + dev\nlower = basis - dev\n\n\nlengthAr = input.int(288, minval=1)\nAroonUP = 100 * (ta.highestbars(high, lengthAr + 1) + lengthAr) / lengthAr\nAroonDown = 100 * (ta.lowestbars(low, lengthAr + 1) + lengthAr) / lengthAr\n\n\nConfirmation = input(90, 'Aroon Confirmation')\nStop = input(70, 'Aroon Stop')\n\nBullish = ta.crossunder(close, lower)\nBearish = ta.crossunder(close, upper)\n\n//Entry \nstrategy.entry('Long', strategy.long, when=Bullish and AroonUP > Confirmation)\nstrategy.close('Long', when=Bearish or AroonUP < Stop)\n\n","strategies/mean-reversion/BB Winner LITE.pine":"//\n//@author Alorse\n//@version=4\nstrategy(\"Bollinger Bands Winner LITE [Alorse]\", shorttitle=\"BB Winner LITE [Alorse]\", overlay=true, pyramiding=0, currency=currency.USD, default_qty_type=strategy.percent_of_equity, initial_capital=1000, default_qty_value=10, commission_type=strategy.commission.percent, commission_value=0.01)\n\nverTxt = \"1.0.4\"\nversion = input(title=\"Version\", type=input.string, defval=verTxt, options=[verTxt], tooltip=\"This is informational only, nothing will change.\")\n\n// Bollinger Bands\nbbGroup = \"Bollindger Bands\"\nisBB = input(true, title=\"╔═════ Show Bollinger Bands ═════╗\", group=bbGroup, tooltip=\"If you don't want to see Bollinger Bands\")\nsrc = input(title=\"Source\", type=input.source, defval=close, group=bbGroup)\nlength = input(20, title=\"Length\", group=bbGroup)\nmult = input(2.0, title=\"StdDev\", minval=0.001, maxval=5, group=bbGroup)\noffset = input(0, \"Offset\", type = input.integer, minval = -500, maxval = 500, group=bbGroup)\n\nbasis = sma(src, length)\ndev = mult * stdev(src, length)\nupper = basis + dev\nlower = basis - dev\n\nplot(isBB ? basis : na, \"Basis\", color=color.new(color.orange, 75), offset = offset)\npb1 = plot(isBB ? upper : na, color=color.new(color.lime, 75), title=\"Upper\")\npb2 = plot(isBB ? lower : na, color=color.new(color.lime, 75), title=\"Lower\")\nfill(pb1, pb2, color=color.new(color.lime, 99), title=\"Background\")\n\n//Strategy Conditions\nshowShort = input(false, title=\"Show Short entries\", group=\"Strategy\")\ncandleper = input(title=\"Candle % below/above the BB\", type=input.float, minval=1, maxval=100, defval=30, group=\"Strategy\")* 0.01\ncandle_size = high-low\nbuyzone = (candle_size*candleper) + low\nsellzone = high - (candle_size*candleper)\n\nbody_size = close > open ? close - open : open - close\nbs60 = body_size*0.6\nbsBuy = low + bs60\nbsSell = high - bs60\n\nbuy = buyzone < lower and not (bsBuy < lower)\n\nstrategy.entry(\"Long\", true, when=buy)\nif showShort\n    strategy.entry(\"Short\", false, when=sellzone > upper)\nelse \n    strategy.close(\"Long\", when=sellzone > upper)","strategies/mean-reversion/Bollinger Breakout [kodify].pine":"//\n//@author KODIFY.NET https://kodify.net/tradingview/strategies/bollinger-breakout/\n//@version=4\n// 1. Define strategy settings\nstrategy(title=\"Bollinger Breakout [kodify]\", overlay=true, pyramiding=0, currency=currency.USD, default_qty_type=strategy.percent_of_equity, initial_capital=1000, default_qty_value=10, commission_type=strategy.commission.percent, commission_value=0.01) \n\nbbGroup = \"Bollindger Bands\"\nsmaLength = input(title=\"SMA Length\", type=input.integer, defval=350, group=bbGroup)\nstdLength = input(title=\"StdDev Length\", type=input.integer, defval=350, group=bbGroup)\nubOffset = input(title=\"Upper Band Offset\", type=input.float, defval=2.5, step=0.5, group=bbGroup)\nlbOffset = input(title=\"Lower Band Offset\", type=input.float, defval=2.5, step=0.5, group=bbGroup)\n\nstratGroup = \"Strategy\"\nshowLong = input(true, title=\"Long entries\", group=stratGroup)\nshowShort = input(false, title=\"Short entries\", group=stratGroup)\n\n// 2. Calculate strategy values\nsmaValue = sma(close, smaLength)\nstdDev   = stdev(close, stdLength)\n\nupperBand = smaValue + (stdDev * ubOffset)\nlowerBand = smaValue - (stdDev * lbOffset)\n\n// 3. Output strategy data\nplot(series=smaValue, title=\"SMA\", color=color.blue)\nplot(series=upperBand, title=\"UB\", color=color.new(color.teal, 50))\nplot(series=lowerBand, title=\"LB\", color=color.new(color.teal, 50))\n\n// 4. Determine long trading conditions\nenterLong = crossover(close, upperBand)\nexitLong  = crossunder(close, smaValue)\n\n// 5. Code short trading conditions\nenterShort = crossunder(close, lowerBand)\nexitShort  = crossover(close, smaValue)\n\n// 6. Submit entry orders\nif showLong\n    strategy.entry(id=\"EL\", long=true, when=enterLong)\n    strategy.close(id=\"EL\", when=exitLong)\n\nif showShort\n    strategy.entry(id=\"ES\", long=false, when=enterShort)\n    strategy.close(id=\"ES\", when=exitShort)\n\n// 7. Submit exit orders","strategies/mean-reversion/Exceeded candle.pine":"//\n//@author Alorse\n//@version=4\n// study(\"Surpasses candle [Alorse]\", overlay=true)\nstrategy(\"Exceeded candle [Alorse]\", overlay=true, pyramiding=0, currency=currency.USD, default_qty_type=strategy.percent_of_equity, initial_capital=1000, default_qty_value=10, commission_type=strategy.commission.percent, commission_value=0.01)\n\ntxtVer = \"0.0.1\"\nversion = input(title=\"Version\", type=input.string, defval=txtVer, options=[txtVer], tooltip=\"This is informational only, nothing will change.\")\n\n// Green candle surpasses the red one\ngreenLastCandle = close[1] < open[1] and close > open and close > open[1]\n// Red candle surpasses the green one\nredLastCandle = close[1] > open[1] and close < open and close < open[1]\n\nplotshape(greenLastCandle ? greenLastCandle: na, location=location.belowbar, color=color.green, style=shape.arrowup)\nplotshape(redLastCandle ? redLastCandle: na, location=location.abovebar, color=color.fuchsia, style=shape.arrowdown)\n\n// Bollinger Bands\nbbGroup = \"Bollindger Bands\"\nsrc = input(title=\"Source\", type=input.source, defval=close, group=bbGroup)\nlength = input(20, title=\"Length\", group=bbGroup)\nmult = input(2.0, title=\"StdDev\", minval=0.001, maxval=5, group=bbGroup)\n\nbasis = sma(src, length)\ndev = mult * stdev(src, length)\nupper = basis + dev\nlower = basis - dev\n\npb1 = plot(upper, color=color.new(color.teal, 50), title=\"Upper\")\npb2 = plot(lower, color=color.new(color.teal, 50), title=\"Lower\")\nfill(pb1, pb2, color=color.new(color.teal, 98), title=\"Background\")\nplot(basis, \"Basis\", color=color.new(color.orange, 50))\n\nlast3red = close[2] < open[2] and close[3] < open[3]\nbuyEntry = greenLastCandle and close < basis and not last3red\nbuyExit = close > upper\n\nstrategy.entry(\"Long\", true, when=buyEntry)\nstrategy.close(\"Long\", when=buyExit, comment=\"Exit\")\n\n// strategy.entry(\"Short\", false, when=redLastCandle and close > basis)\n// strategy.close(\"Short\", when=close < lower, comment=\"Exit\")","strategies/mean-reversion/BB Divergence.pine":"//\n//@author Alorse\n//@version=4\nstrategy(\"Bollinger Bands Divergence [Alorse]\", shorttitle=\"BB Divergence [Alorse]\", overlay=true, pyramiding=1, currency=currency.USD, default_qty_type=strategy.percent_of_equity, default_qty_value=100) \n\n// Bollinger Bands\nlength = input(20, title=\"Period Bollindger Bands\")\nmult = input(2.0, minval=0.001, maxval=5)\nsrc = input(title=\"Source\", type=input.source, defval=close)\ntimeStop = input(20, title=\"Time-based stop length\")\n\nbasis = sma(src, length)\ndev = mult * stdev(src, length)\nupper = basis + dev\nlower = basis - dev\noffset = input(0, \"Offset\", type = input.integer, minval = -500, maxval = 500)\n\nbuy = close > upper and upper[0] > upper[1] and lower[0] < lower[1] and close > open\nsell = close < lower and lower[0] < lower[1] and upper[0] > upper[1] and close < open\n\npb1 = plot(upper, color=buy ? color.green : sell ? color.red : color.blue, title=\"Upper\")\npb2 = plot(lower, color=buy ? color.green :  sell ? color.red : color.blue, title=\"Lower\")\nplot(buy ? upper : na, color.green, linewith=3)\nplot(sell ? lower : na, color.red, linewith=3)\nplot(basis, \"Basis\", color=color.new(color.orange, 75), offset=offset)\nfill(pb1, pb2, color=color.new(color.blue, 98), title=\"Background\")\n\n//Strategy Conditions\ncandleper = input(title=\"Candle % below the lower BB\", type=input.float, minval=1, maxval=100, defval=30)\ntp = input(title=\"Take profit after (%)\", type=input.float, minval=0, maxval=100, defval=5)\n//Strategy Condition\ncandle_size = (high-low)\nbuyzone = high - (candle_size*((100-candleper)/100))\nsellzone = low - (candle_size*((100-candleper)/100))\n\n// LONG\nisLong = strategy.position_size > 0\nstrategy.entry(\"Long\", true, when=buy and buyzone > upper)\nif isLong\n    strategy.close(\"Long\", when=close < basis)\n\n// SHORT\nisShort = strategy.position_size < 0\nstrategy.entry(\"Short\", false, when=sell and sellzone < lower)\nif isShort\n    strategy.close(\"Short\", when=close > basis)","strategies/mean-reversion/Multi BB.pine":"// This source code is subject to the terms of the Mozilla Public License 2.0 at https://mozilla.org/MPL/2.0/\n// © alorse\n\n//@version=4\nstrategy(title=\"Multi Bollinger Bands [Alorse]\", shorttitle=\"Multi BB [Alorse]\", overlay=true, pyramiding=0, currency=currency.USD, default_qty_type=strategy.percent_of_equity, initial_capital=1000, default_qty_value=10, commission_type=strategy.commission.percent, commission_value=0.01) \n\ntxtVer = \"0.0.2\"\nversion = input(title=\"Version\", type=input.string, defval=txtVer, options=[txtVer], tooltip=\"This is informational only, nothing will change.\")\n\n// Bollinger Bands\nbbGroup = \"Bollindger Bands\"\nsrc = input(title=\"Source\", type=input.source, defval=close, group=bbGroup)\nlength = input(20, title=\"Length\", group=bbGroup)\nmult = input(2.0, title=\"StdDev\", minval=0.001, maxval=5, group=bbGroup)\n\nbasis = sma(src, length)\ndev = mult * stdev(src, length)\nupper = basis + dev\nlower = basis - dev\n\npb1 = plot(upper, color=color.new(color.teal, 100), title=\"Upper\")\npb2 = plot(lower, color=color.new(color.teal, 100), title=\"Lower\")\n\n// MTF Bollinger Bands\nres = input(title=\"Multi Timeframe\", type=input.resolution, defval=\"15\", tooltip=\"5 minutes => 15 minutes\\n15 minutes => 45 minutes\")\nmtfUpper = security(syminfo.tickerid, res, upper)\nmtfLower = security(syminfo.tickerid, res, lower)\n\nmpb1 = plot(mtfUpper, color=color.new(color.teal, 100), title=\"Upper\")\nmpb2 = plot(mtfLower, color=color.new(color.teal, 100), title=\"Lower\")\n\navgUpper = avg(upper, mtfUpper)\navgLower = avg(lower, mtfLower)\n\nplot(avgUpper, \"Upper Basis\", color=color.new(color.orange, 60))\nplot(avgLower, \"Lower Basis\", color=color.new(color.orange, 60))\n\nfill(pb1, mpb1, color=color.new(color.red, 95), title=\"Background\")\nfill(pb2, mpb2, color=color.new(color.teal, 95), title=\"Background\")\n\nstrategy.entry(\"Long\", true, when=close < avgLower)\nstrategy.close(\"Long\", when=close > upper)\n\n//strategy.entry(\"Short\", false, when=close > avgUpper)","strategies/other/Full Candle.pine":"// This source code is subject to the terms of the Mozilla Public License 2.0 at https://mozilla.org/MPL/2.0/\n// © alorse\n\n//@version=5\nstrategy('Full Candle [Alorse]', overlay=true, pyramiding=0, currency=currency.USD, default_qty_type=strategy.percent_of_equity, initial_capital=1000, default_qty_value=10, commission_type=strategy.commission.percent, commission_value=0.1)\n\ntxtVer = '0.0.1'\nversion = input.string(title='Version', defval=txtVer, options=[txtVer], tooltip='This is informational only, nothing will change.\\n\\nEntry conditions:\\n')\nsrc = input(title='Source', defval=close)\n\n\n// Moving Averages\nlenA = input.int(10, minval=1, title='EMA A Length', group='Moving Averages')\noutA = ta.ema(close, lenA)\nplot(outA, title='EMA A', color=color.purple)\n\n// Strategy\nstratGroup = 'Strategy'\nshowLong = input.bool(true, title='Long entries', group=stratGroup)\nshowShort = input.bool(true, title='Short entries', group=stratGroup)\nshadowPercent = input.float(5, step=1, title='Shadow Percent', group=stratGroup)\n\ntpGroup = 'Take Profit'\nuseTP = input.bool(false, title='╔══════   Enable   ══════╗', group=tpGroup)\nTPPercent = input.float(1.2, step=0.1, title='Percent', group=tpGroup) * 0.01\n\nlongTP = useTP ? strategy.position_avg_price * (1 + TPPercent) : na\nshortTP = useTP ? strategy.position_avg_price * (1 - TPPercent) : na\n\n// Stop Loss\nslGroup = 'Stop Loss'\nuseSL = input.bool(false, title='╔══════   Enable   ══════╗', group=slGroup)\nSLPercent = input.float(1.8, title='Percent', group=slGroup) * 0.01\n\nlongStop = useSL ? strategy.position_avg_price * (1 - SLPercent) : na\nshortStop = useSL ? strategy.position_avg_price * (1 + SLPercent) : na\n\nbought = strategy.opentrades[0] == 1 and strategy.position_size[0] > strategy.position_size[1]\nentry_price = ta.valuewhen(bought, open, 0)\n\ncandleSize = high - low\nshadowSize = close > open ? high - close : close - low\nsPer = (shadowSize * 100)/candleSize\n\n\nentryLong = close > open and close > outA and sPer <= shadowPercent\nentryShort = close < open and close < outA and sPer <= shadowPercent\nexitLong = close > (entry_price + entry_price*0.002) and close > open\nexitShort = close < (strategy.position_avg_price - strategy.position_avg_price*0.002) and close < open\n\nif showLong\n    strategy.entry('Long', strategy.long, when=entryLong)\n    strategy.close('Long', when=exitLong)\n    strategy.exit('TP', 'Long', limit=longTP, stop=longStop)\nif showShort\n    strategy.entry('Short', strategy.short, when=entryShort)\n    strategy.close('Short', when=exitShort)\n    strategy.exit('TP', 'Short', limit=shortTP, stop=shortStop)","strategies/other/Improvising [Alorse].pine":"//@version=5\nstrategy('Improvising [Alorse]', overlay=true, pyramiding=0, currency=currency.USD, default_qty_type=strategy.percent_of_equity, initial_capital=1000, default_qty_value=10, commission_type=strategy.commission.percent, commission_value=0.1)\n\ntxtVer = '0.0.1'\nversion = input.string(title='Version', defval=txtVer, options=[txtVer], tooltip='This is informational only, nothing will change.\\n\\nEntry conditions:\\n')\nsrc = input(title='Source', defval=close)\n\n\n// Strategy\nstratGroup = 'Strategy'\nshowLong = input.bool(true, title='Long entries', group=stratGroup)\nshowShort = input.bool(false, title='Short entries', group=stratGroup)\n\n// Moving Averages\nlen_a = input.int(10, minval=1, title='EMA A Length', group='Moving Averages')\nout_a = ta.ema(close, len_a)\nplot(out_a, title='EMA A', color=color.purple)\n\n// RSI\nlen = input.int(14, minval=1, title='Length', group='RSI')\nrsi = ta.rsi(close, len)\n\n// MACD\nfast_length = 12\nslow_length = 26\nfast_ma = ta.ema(src, fast_length)\nslow_ma = ta.ema(src, slow_length)\nmacd = fast_ma - slow_ma\n\nbuy = close[1] < open[1] and close > open[1]\nsell = close[1] > open[1] and close < open[1]\n\nentryLong = buy and close > out_a and close[1] > out_a and rsi < 65 and macd[0] > macd[1] \nentryShort = sell and close < out_a and close[1] < out_a and rsi > 35 and macd[0] < macd[1] \n\ntpGroup = 'Take Profit'\n// useTP = input.bool(false, title='╔══════   Enable   ══════╗', group=tpGroup)\nTPPercent = input.float(1.2, step=0.1, title='Percent', group=tpGroup) * 0.01\n\nlongTP = strategy.position_avg_price * (1 + TPPercent)\nshortTP = strategy.position_avg_price * (1 - TPPercent)\n\n// Stop Loss\nslGroup = 'Stop Loss'\n// useSL = input.bool(false, title='╔══════   Enable   ══════╗', group=slGroup)\nSLPercent = input.float(1.8, title='Percent', group=slGroup) * 0.01\n\nlongStop = strategy.position_avg_price * (1 - SLPercent)\nshortStop = strategy.position_avg_price * (1 + SLPercent)\n\nbought = strategy.opentrades[0] == 1 and strategy.position_size[0] > strategy.position_size[1]\nentry_price = ta.valuewhen(bought, open, 0)\n\nAvgLongTP = (longTP + entry_price) / 2\nAvgShortTP = (shortTP - entry_price) / 2\n\nTlongStop = 0.0\nTshortStop =  0.0\nTlongStop := close > AvgLongTP ? strategy.position_avg_price * (1.002) : math.max(TlongStop[1], longStop)\nTshortStop :=  close < AvgShortTP ? strategy.position_avg_price * (1 - 0.002) : math.max(TshortStop[1], shortStop)\n\nexitLong2 = close > close[1] and close[1] > close[2] and close[2] > close[3] and close > strategy.position_avg_price * (1.004)\nexitShort2 = close < close[1] and close[1] < close[2] and close[2] < close[3] and close < strategy.position_avg_price * (1 - 0.004)\n\nif showLong\n    strategy.entry('Long', strategy.long, when=entryLong)\n    strategy.close('Long', when=close < TlongStop or exitLong2)\n    strategy.exit('TP', 'Long', limit=longTP, stop=longStop)\nif showShort\n    strategy.entry('Short', strategy.short, when=entryShort)\n    strategy.close('Short', when=close > TshortStop or exitShort2)\n    strategy.exit('TP', 'Short', limit=shortTP, stop=shortStop)"};
