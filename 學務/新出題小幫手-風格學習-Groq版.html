<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-lang-key="pageTitle">📝 出題小幫手</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
    </script>
    <style>
        :root {
            --bg-grad-start: #2e3440; --bg-grad-end: #1e22a; --text-main: #eceff4;
            --text-light: #d8dee9; --header-bg: rgba(20, 24, 30, 0.8);
            --card-bg: rgba(30, 35, 43, 0.8); --input-bg: rgba(13, 17, 23, 0.7);
            --border-main: #4c566a; --border-light: rgba(129, 161, 193, 0.2);
            --primary: #d1b48c; --primary-light: rgba(209, 180, 140, 0.6);
            --primary-focus-shadow: rgba(209, 180, 140, 0.2);
            --success: #8fbc8f; --danger: #bf616a; --info: #81a1c1;
            --shadow-color: rgba(0, 0, 0, 0.6);
        }
        body.light-theme {
            --bg-grad-start: #f8f9fa; --bg-grad-end: #e9ecef; --text-main: #212529;
            --text-light: #495057; --header-bg: rgba(255, 255, 255, 0.8);
            --card-bg: rgba(255, 255, 255, 0.9); --input-bg: rgba(233, 236, 239, 0.7);
            --border-main: #ced4da; --border-light: rgba(0, 0, 0, 0.1);
            --primary: #856404; --primary-light: rgba(133, 100, 4, 0.6);
            --primary-focus-shadow: rgba(133, 100, 4, 0.2);
            --success: #28a745; --danger: #dc3545; --info: #007bff;
            --shadow-color: rgba(0, 0, 0, 0.15);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100vh; overflow: hidden; }
        body {
            font-family: 'Microsoft JhengHei UI', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(145deg, var(--bg-grad-start), var(--bg-grad-end));
            color: var(--text-main); display: flex; flex-direction: column; transition: background 0.5s, color 0.5s;
        }
        ::-webkit-scrollbar { width: 12px; height: 12px; }
        ::-webkit-scrollbar-track { background: var(--bg-grad-end); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--primary-light); border-radius: 10px; border: 2px solid var(--bg-grad-end); }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }
        .container { max-width: 1800px; width: 100%; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; flex-grow: 1; min-height: 0; }
        .header { text-align: center; margin-bottom: 15px; background: var(--header-bg); backdrop-filter: blur(20px); border-radius: 25px; padding: 15px 30px; border: 1px solid var(--primary-light); box-shadow: 0 20px 60px var(--shadow-color); flex-shrink: 0; position: relative; }
        .header h1 { font-size: 2.2rem; color: var(--primary); margin-bottom: 8px; font-weight: 800; }
        .header h1::before { content: "📝 "; }
        .header p { color: var(--text-light); font-size: 1rem; opacity: 0.9; }
        .layout-container { display: flex; gap: 30px; flex-grow: 1; min-height: 0; overflow: hidden; }
        .left-column { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 30px; overflow-y: auto; padding-right: 15px; }
        .main-content { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .card { background: var(--card-bg); backdrop-filter: blur(20px); border-radius: 25px; padding: 30px; border: 1px solid var(--border-light); box-shadow: 0 20px 60px var(--shadow-color); }
        .card h3 { color: var(--primary); margin-bottom: 25px; font-size: 1.4rem; font-weight: 700; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 10px; color: var(--text-light); font-weight: 600; font-size: 18px; }
        .form-control { width: 100%; padding: 20px 24px; background: var(--input-bg); border: 1px solid var(--border-main); border-radius: 15px; color: var(--text-main); font-size: 1rem; transition: all 0.3s ease; }
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-focus-shadow); }
        select.form-control option { color: #212529; }
        #quizDifficulty.difficulty-easy { background-color: rgba(143, 188, 143, 0.2); border-color: var(--success); }
        #quizDifficulty.difficulty-medium { background-color: rgba(129, 161, 193, 0.2); border-color: var(--info); }
        #quizDifficulty.difficulty-hard { background-color: rgba(191, 97, 106, 0.2); border-color: var(--danger); }
        .btn { background: linear-gradient(45deg, var(--primary), #b99867); color: #2e3440; border: none; padding: 18px 35px; border-radius: 15px; cursor: pointer; font-size: 18px; font-weight: 700; transition: all 0.4s ease; margin: 5px; }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(209, 180, 140, 0.4); }
        .btn-secondary { background: linear-gradient(45deg, #4c566a, #3b4252); color: #eceff4; }
        .btn-success { background: linear-gradient(45deg, var(--success), #79a879); color: #2e3440; }
        .btn-danger { background: linear-gradient(45deg, var(--danger), #a94b54); color: #eceff4; }
        .api-status { display: flex; align-items: center; gap: 10px; margin-top: 15px; padding: 12px 18px; border-radius: 15px; font-size: 16px; font-weight: 600; }
        .api-status.connected { background: rgba(143, 188, 143, 0.15); color: var(--success); border: 1px solid rgba(143, 188, 143, 0.5); }
        .api-status.disconnected { background: rgba(191, 97, 106, 0.15); color: var(--danger); border: 1px solid rgba(191, 97, 106, 0.5); }
        .file-upload { border: 3px dashed var(--primary-light); border-radius: 20px; padding: 30px; text-align: center; cursor: pointer; background: rgba(13, 17, 23, 0.05); transition: all 0.4s ease; margin-top: 10px; }
        .file-upload:hover { border-color: var(--primary); background: var(--primary-focus-shadow); }
        .file-upload.dragover { border-color: var(--primary); background: rgba(209, 180, 140, 0.1); }
        .file-list { margin-top: 15px; max-height: 150px; overflow-y: auto; }
        .file-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; background: rgba(46, 52, 64, 0.8); border-radius: 12px; margin-bottom: 10px; border: 1px solid var(--border-light); }
        body.light-theme .file-item { background: #e9ecef; }
        .file-info { color: var(--text-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1; min-width: 0; padding-right: 10px; }
        .file-item .btn-danger { padding: 8px 16px; font-size: 14px; margin-left: 10px; flex-shrink: 0; }
        .quiz-settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; }
        .number-input { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 15px; background: var(--input-bg); border-radius: 20px; border: 1px solid var(--border-main); }
        .number-input input { width: 80px; height: 50px; text-align: center; font-size: 20px; font-weight: 800; background: rgba(13, 17, 23, 0.8); border: 2px solid var(--primary-light); border-radius: 15px; color: var(--primary); }
        body.light-theme .number-input input { background: #fff; }
        .number-input span { color: var(--primary); font-weight: 600; font-size: 1rem; }
        .preview-area { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
        .preview-area .card { flex-grow: 1; display: flex; flex-direction: column; min-height: 0; }
        .preview-content { background: var(--input-bg); border-radius: 12px; padding: 20px; white-space: pre-wrap; font-size: 1rem; line-height: 1.6; border: 1px solid var(--primary-light); color: var(--text-main); flex-grow: 1; overflow-y: auto; min-height: 200px; }
        .loading { display: flex; align-items: center; gap: 10px; color: var(--primary); }
        .spinner { width: 20px; height: 20px; border: 2px solid var(--primary-light); border-top: 2px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn-group { margin-top: 20px; text-align: center; }
        .theme-toggle-btn { position: fixed; top: 25px; right: 25px; background: var(--card-bg); border: 1px solid var(--border-light); border-radius: 50%; width: 50px; height: 50px; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        #audioPlayerContainer { margin-top: 20px; }
        #audioPlayer { width: 100%; }
        .hidden { display: none !important; }
        #qaContainer { border-top: 2px solid var(--primary-light); margin-top: 30px; padding-top: 30px; }
        #chatBox { height: 300px; overflow-y: auto; background: var(--input-bg); border-radius: 12px; padding: 20px; border: 1px solid var(--border-main); margin-bottom: 20px; }
        .chat-message { max-width: 85%; padding: 12px 18px; border-radius: 20px; margin-bottom: 12px; line-height: 1.6; }
        .user-message { background: var(--primary); color: #2e3440; margin-left: auto; border-bottom-right-radius: 5px; }
        .bot-message { background-color: #4c566a; color: var(--text-main); margin-right: auto; border-bottom-left-radius: 5px; }
        body.light-theme .bot-message { background-color: #e9ecef; color: var(--text-main); }
        .chat-input-area { display: flex; gap: 15px; align-items: center; }
        .chat-input-area input[type="text"] { flex-grow: 1; padding: 15px 20px; }
        .chat-input-area .btn { padding: 15px 25px; font-size: 16px; margin: 0; }
        .web-search-toggle { display: flex; align-items: center; gap: 8px; color: var(--text-light); margin-top: 10px; cursor: pointer; }
        .language-selector { position: absolute; top: 15px; right: 80px; }
        .language-selector select { background: var(--input-bg); color: var(--text-main); border: 1px solid var(--border-main); border-radius: 8px; padding: 5px 10px; }
        @media (max-width: 1024px) {
            html, body { height: auto; overflow: auto; }
            .layout-container { flex-direction: column; }
            .left-column { overflow-y: visible; padding-right: 0; }
            .preview-area { min-height: 80vh; }
            .preview-content { min-height: 30vh; }
            #chatBox { height: 40vh; }
            .main-content { grid-template-columns: 1fr; }
            .language-selector { position: static; margin: 10px auto 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <button id="themeToggleBtn" class="theme-toggle-btn" onclick="toggleTheme()">🌙</button>
        <div class="header">
             <div class="language-selector">
                <select id="uiLanguageSelector" onchange="setLanguage(this.value)"></select>
            </div>
            <h1 data-lang-key="headerTitle">出題小幫手</h1>
            <p data-lang-key="headerSubtitle">智能考題生成系統 - 搭載 Groq AI 技術</p>
        </div>
        <div class="layout-container">
            <div class="left-column">
                <div class="main-content">
                    <div class="card">
                        <h3 data-lang-key="apiSettingsTitle">🔧 API 設定</h3>

                            <input type="password" id="apiKey" class="form-control" data-lang-key-placeholder="apiKeyPlaceholder">
                            <div style="margin-top: 10px;"><button class="btn btn-success" onclick="testApiConnection()" data-lang-key="testConnectionBtn">連線測試</button></div>
                            <div id="apiStatus" class="api-status disconnected"><span data-lang-key="statusNotConnected"⚠️ 未連線</span></div>
                        </div>
                    </div>
                    <div class="card">
                        <h3 data-lang-key="dataSourceTitle">📚 資料來源</h3>
                        <!-- Content File Upload -->
                        <div class="form-group">
                            <label data-lang-key="fileUploadLabel">內容來源 (TXT, PDF, JPG, PNG, MP3, WAV)</label>
                            <div class="file-upload" id="contentFileUploadZone" onclick="document.getElementById('contentFileInput').click()">
                                <p data-lang-key="fileUploadPrompt">📄 點擊或拖拽 內容 文件到此處</p>
                            </div>
                            <input type="file" id="contentFileInput" multiple style="display: none;" accept=".txt,.pdf,.jpg,.jpeg,.png,.mp3,.wav,.m4a">
                            <div id="contentFileList" class="file-list"></div>
                        </div>
                        <!-- Style File Upload -->

                            <label data-lang-key="styleRefLabel">風格參考 (PDF, TXT)</label>
                            <div class="file-upload" id="styleFileUploadZone" onclick="document.getElementById('styleFileInput').click()">
                                <p data-lang-key="styleRefPrompt">🎨 點擊或拖拽 語氣/風格 範例文件</p>
                            </div>
                            <input type="file" id="styleFileInput" multiple style="display: none;" accept=".txt,.pdf">
                            <div id="styleFileList" class="file-list"></div>
                        </div>
                        <!-- Text Input -->
                        <div class="form-group">
                            <label for="textInput" data-lang-key="pasteTextLabel">直接貼上文字 (內容來源)</label>
                            <textarea id="textInput" class="form-control" rows="4" data-lang-key-placeholder="pasteTextPlaceholder"></textarea>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <h3 data-lang-key="quizSettingsTitle">⚙️ 考題設定</h3>
                    <div class="form-group">
                        <label for="quizLanguage" data-lang-key="quizLanguageLabel">出題語言</label>
                        <select id="quizLanguage" class="form-control"></select>
                    </div>
                    <div class="form-group">
                        <label for="quizMode" data-lang-key="quizModeLabel">選擇出題模式</label>
                        <select id="quizMode" class="form-control">
                            <option value="school" data-lang-key="modeSchool">學校出題 (素養導向)</option>
                            <option value="education" data-lang-key="modeEducation">教育補習 (重點複習)</option>
                            <option value="corporate" data-lang-key="modeCorporate">企業內訓 (實務應用)</option>
                            <option value="certification" data-lang-key="modeCertification">專業證照 (精準測驗)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="quizDifficulty" data-lang-key="quizDifficultyLabel">選擇題目難易度 (若無風格參考)</label>
                        <select id="quizDifficulty" class="form-control">
                            <option value="easy" data-lang-key="difficultyEasy">簡單</option>
                            <option value="medium" data-lang-key="difficultyMedium">中等</option>
                            <option value="hard" data-lang-key="difficultyHard">困難</option>
                        </select>
                    </div>
                     <div class="form-group">
                        <label for="voiceSelect" data-lang-key="voiceSelectLabel">選擇口音</label>
                        <select id="voiceSelect" class="form-control"></select>

                    <div class="quiz-settings">

                        <div class="form-group"><div class="number-input"><span data-lang-key="qFillBlank">填空題</span><input type="number" id="fillBlankCount" value="0" min="0" max="50"></div></div>
                        <div class="form-group"><div class="number-input"><span data-lang-key="qEssay">問答題</span><input type="number" id="essayCount" value="0" min="0" max="20"></div></div>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-success" onclick="generateQuiz()" data-lang-key="generateQuizBtn">🎯 生成考題</button>
                        <button class="btn btn-secondary" onclick="document.getElementById('previewContent').contentEditable = 'true';" data-lang-key="editResultBtn">✏️ 編輯結果</button>
                    </div>
                    <div class="btn-group">
                        <button class="btn" onclick="downloadFile('questions_txt')" data-lang-key="downloadQuestionsBtn">📥 下載題目(TXT)</button>

            <div class="preview-area">

                    <div id="audioPlayerContainer" class="hidden">
                        <div id="ttsControls" class="hidden" style="margin-top: 15px;">
                            <div id="ttsNowPlaying" style="margin-bottom: 10px; font-size: 0.9em; opacity: 0.85;"></div>
                            <div class="btn-group">
                                <button id="ttsPrevBtn" class="btn" data-lang-key="ttsPrevBtn">⏮ 上一題</button>
                                <button id="ttsPauseBtn" class="btn" data-lang-key="ttsPauseBtn">⏸ 暫停</button>
                                <button id="ttsStopBtn" class="btn" data-lang-key="ttsStopBtn">⏹ 停止</button>
                                <button id="ttsNextBtn" class="btn" data-lang-key="ttsNextBtn">⏭ 下一題</button>
                            </div>
                        </div>

                            <input type="text" id="questionInput" class="form-control" data-lang-key-placeholder="qaPlaceholder">

                        </div>

                            <input type="checkbox" id="webSearchCheckbox" style="transform: scale(1.2); margin-right: 8px;">

                        </div>

                </div>
            </div>

    </div>

    <script>
        let contentFiles = [];
        let styleFiles = [];
        let apiKey = '';
        let generatedQuizText = '';
        let sourceContentText = ''; 

        // ===== Groq API 設定 =====
        const GROQ_CHAT_URL = 'https://api.groq.com/openai/v1/chat/completions';
        const GROQ_WHISPER_URL = 'https://api.groq.com/openai/v1/audio/transcriptions';
        // 2026-08-16 Groq 已下架 llama-3.3-70b-versatile / llama-3.1-8b-instant；2026-07-17 下架 llama-4-scout
        const GROQ_TEXT_MODEL = 'openai/gpt-oss-120b';
        // 備援模型鏈：額度用盡(429)或模型下架(404)時依序自動切換（各模型為獨立額度）
        const GROQ_TEXT_FALLBACKS = ['openai/gpt-oss-120b', 'qwen/qwen3.6-27b', 'openai/gpt-oss-20b'];
        const GROQ_VISION_MODEL = 'qwen/qwen3.6-27b';
        // gpt-oss 為推理模型，推理會吃 max_tokens；出題用 low 即可
        function modelExtras(m) { return m.startsWith('openai/gpt-oss') ? { reasoning_effort: 'low' } : {}; }
        const GROQ_COMPOUND_MODEL = 'groq/compound'; // 內建網路搜尋
        // 免費層 TPM = 12000（輸入 + max_tokens 一起計算），保留緩衝
        const GROQ_TPM_BUDGET = 11500;
        const MAX_INPUT_TOKENS = 6000; // 來源資料上限（超過自動截斷），保留至少 5000+ tokens 給輸出以撰寫完整長題幹

        // 粗估 token 數：中日韓字 ≈ 1.6 token/字，其他 ≈ 3.5 字元/token
        function estimateTokens(text) {
            let cjk = 0, other = 0;
            for (const ch of text) {
                if (/[\u3000-\u9fff\uf900-\ufaff\u3040-\u30ff\uff00-\uffef]/.test(ch)) cjk++;
                else other++;
            }
            return Math.ceil(cjk * 1.6 + other / 3.5);
        }

        // 將文字截斷至指定 token 預算內（保留前段內容）
        function truncateToTokens(text, budget) {
            if (estimateTokens(text) <= budget) return text;
            let lo = 0, hi = text.length;
            while (lo < hi) {
                const mid = Math.ceil((lo + hi) / 2);
                if (estimateTokens(text.slice(0, mid)) <= budget) lo = mid; else hi = mid - 1;
            }
            return text.slice(0, lo) + '\n\n（※ 內容過長，已自動截斷以符合 API 限制）';
        }

        // 共用：Groq Chat Completions（模型備援鏈 + TPM 預算管理 + 413 自動縮減）
        async function groqChat(messages, { maxTokens = 2048, model = null, onRetry = null } = {}) {
            // 指定 model 時只用該模型；否則走備援鏈
            const modelChain = model ? [model] : GROQ_TEXT_FALLBACKS;
            const inputTokens = estimateTokens(messages.map(x => typeof x.content === 'string' ? x.content : '').join(''));
            let outTokens = Math.min(maxTokens, Math.max(1500, GROQ_TPM_BUDGET - inputTokens));
            let lastError = null;

            for (let mi = 0; mi < modelChain.length; mi++) {
                const m = modelChain[mi];
                for (let attempt = 0; attempt < 3; attempt++) {
                    try {
                        const response = await fetchWithRetry(GROQ_CHAT_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                            body: JSON.stringify({ model: m, messages, max_tokens: outTokens, temperature: 0.7, ...modelExtras(m) })
                        }, onRetry);
                        const data = await response.json();
                        const text = data.choices?.[0]?.message?.content;
                        if (text) return text;
                        throw new Error('Empty response from model ' + m);
                    } catch (err) {
                        lastError = err;
                        const isRate = err.message.includes('429');
                        const isTooLarge = err.message.includes('413');
                        const isGone = /\((404|400)\)/.test(err.message) && /does not exist|decommission|not found|no access|do not have access/i.test(err.message);
                        // 404 / 模型下架 → 換下一個模型
                        if (isGone && mi < modelChain.length - 1) { if (onRetry) onRetry(0, 0, 0); break; }
                        const match = err.message.match(/Limit (\d+),? (?:Used \d+,? )?Requested (\d+)/i);

                        // 429 額度用盡（每日或每分鐘）→ 直接跳下一個模型（各模型獨立額度）
                        if (isRate && mi < modelChain.length - 1) {
                            if (onRetry) onRetry(0, 0, 0); // 觸發 UI 更新（切換模型中）
                            break; // 跳出 attempt 迴圈，換下一個模型
                        }
                        // 413 請求過大 → 縮 token 後於同模型重試
                        if (isTooLarge && match) {
                            const over = parseInt(match[2]) - parseInt(match[1]);
                            outTokens = outTokens - over - 300;
                            if (outTokens < 1200) {
                                if (mi < modelChain.length - 1) break; // 縮無可縮，換下一個模型
                                throw new Error('來源資料過多，超出模型限制。請減少上傳內容或題數，或至 console.groq.com 升級 Dev Tier。');
                            }
                            continue;
                        }
                        // 其他非額度錯誤：不換模型，直接拋出
                        if (!isRate) throw err;
                        // 已是最後一個模型的 429：交由 fetchWithRetry 的退避處理已結束，往下拋
                        if (attempt + 1 >= 3) break;
                    }
                }
            }
            throw lastError;
        }

        async function fetchWithRetry(url, options, onRetry, maxRetries = 3, baseDelay = 1000) {
            for (let attempt = 0; attempt < maxRetries; attempt++) {
                let suggestedDelay = 0;
                try {
                    const response = await fetch(url, options);
                    if (response.ok) return response;
                    const errorData = await response.json().catch(() => ({ error: { message: response.statusText } }));
                    const msg = errorData.error?.message || response.statusText;
                    if (response.status === 429) {
                        // Groq 429 會附帶 "Please try again in X.XXs / XmX.Xs"，依建議秒數等待
                        const mSec = msg.match(/try again in ([\d.]+)s/i);
                        const mMin = msg.match(/try again in (\d+)m([\d.]+)s/i);
                        if (mMin) suggestedDelay = (parseInt(mMin[1]) * 60 + parseFloat(mMin[2])) * 1000;
                        else if (mSec) suggestedDelay = parseFloat(mSec[1]) * 1000;
                        throw new Error(`API Error (429): ${msg}`);
                    }
                    if (response.status >= 400 && response.status < 500) {
                        // 其他 4xx（含 413）為請求本身問題，重送相同請求無意義，立即拋出交由上層處理
                        const err = new Error(`API Error (${response.status}): ${msg}`);
                        err.noRetry = true;
                        throw err;
                    }
                    throw new Error(`Server Error: ${response.status} - The service is currently unavailable.`);
                } catch (error) {
                    if (error.noRetry || attempt + 1 >= maxRetries) throw error;
                    const delay = Math.min(Math.max(suggestedDelay + 500, baseDelay * Math.pow(2, attempt)), 65000);
                    if (onRetry) onRetry(attempt + 1, delay, maxRetries);
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }
        }

        function formatFileSize(bytes, decimals = 2) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024; const dm = decimals < 0 ? 0 : decimals; const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        // ===== 題目長度自動檢核（跨語系）=====
        function findShortQuestions(quizText) {
            const questionsPart = quizText.split('=== 答案 ===')[0];
            const items = questionsPart.split(/\n(?=\d+[\.、])/).map(t => t.trim()).filter(t => /^\d+[\.、]/.test(t));
            const short = [];
            items.forEach(item => {
                const numMatch = item.match(/^(\d+)[\.、]/);
                if (!numMatch) return;
                // 題幹 = 選項行（(A)/A./（A））出現前的內容
                const stem = item.split(/\n\s*[\(（]?[A-DＡ-Ｄ][\)）\.、]/)[0].replace(/^\d+[\.、]\s*/, '').trim();
                const cjkCount = (stem.match(/[\u3000-\u9fff\uf900-\ufaff\u3040-\u30ff]/g) || []).length;
                const isCjk = cjkCount > stem.length * 0.3;
                const tooShort = isCjk ? cjkCount < 35 : stem.split(/\s+/).filter(Boolean).length < 25;
                if (tooShort) short.push(numMatch[1]);
            });
            return short;
        }

        async function generateQuiz() {
            if (!apiKey) return alert(translations[currentLang].alert_noApiKey);
            const counts = { trueFalse: parseInt(document.getElementById('trueFalseCount').value) || 0, multipleChoice: parseInt(document.getElementById('multipleChoiceCount').value) || 0, fillBlank: parseInt(document.getElementById('fillBlankCount').value) || 0, essay: parseInt(document.getElementById('essayCount').value) || 0 };
            if (Object.values(counts).reduce((a, b) => a + b) === 0) return alert(translations[currentLang].alert_noQuizContent);
            
            saveSettings();
            const previewContent = document.getElementById('previewContent');
            previewContent.innerHTML = `<div class="loading"><div class="spinner"></div>${translations[currentLang].alert_generating}</div>`;
            stopTts();
            document.getElementById('audioPlayerContainer').classList.add('hidden');
            document.getElementById('qaContainer').classList.add('hidden');

            try {
                // 1. Process Content
                let contentText = document.getElementById('textInput').value.trim();
                for (const file of contentFiles) {
                    let fileContent = '';
                    if (file.type.startsWith('image/')) fileContent = await extractTextFromImage(file);
                    else if (file.type === 'application/pdf') fileContent = await extractPdfText(file);
                    else if (file.type.startsWith('audio/')) fileContent = await transcribeAudioToText(file);
                    else fileContent = await file.text();
                    contentText += `\n\n[Content Source: ${file.name}]\n${fileContent}`;
                }

                if (!contentText.trim()) throw new Error(translations[currentLang].alert_noDataSource);
                contentText = truncateToTokens(contentText, MAX_INPUT_TOKENS);
                sourceContentText = contentText;

                // 2. Process Style References
                let styleReferenceText = '';
                for (const file of styleFiles) {
                    let fileContent = '';
                    if (file.type === 'application/pdf') fileContent = await extractPdfText(file);
                    else fileContent = await file.text();
                    styleReferenceText += `\n\n[Style Example from: ${file.name}]\n${fileContent}`;
                }
                
                // 3. Get Prompt
                const targetLanguage = document.getElementById('quizLanguage').value;
                const prompt = getPromptForMode(
                    document.getElementById('quizMode').value, 
                    document.getElementById('quizDifficulty').value, 
                    contentText, 
                    counts, 
                    targetLanguage, 
                    styleReferenceText
                );
                
                // 4. Fetch API (Groq)
                const systemPrompt = `The ENTIRE output MUST be written exclusively in ${targetLanguage}; every question, option, answer and explanation must be in ${targetLanguage} with no language mixing, regardless of the language of the source material. ` + 'You are a senior professional exam-question writer for formal assessments. Non-negotiable requirements: (1) Every question stem must be scenario-based and detailed: true/false and multiple-choice stems at least 40 characters (CJK) or 30 words, essay stems at least 60 characters or 45 words. Never output one-line fragment questions. (2) Each multiple-choice option must be a complete statement of at least 12 characters, with plausible distractors reflecting common misconceptions. (3) Generate the EXACT number of questions requested for each type. (4) Provide detailed answer explanations. (5) Use formal, discipline-appropriate terminology in the target language specified by the user. Longer, richer, more professional questions are always preferred over short ones.';
                const resultText = await groqChat([
                    { role: 'system', content: systemPrompt },
                    { role: 'user', content: prompt }
                ], {
                    maxTokens: 8000,
                    onRetry: (attempt, delay, max) => {
                        const msg = (attempt === 0)
                            ? translations[currentLang].switchingModel
                            : translations[currentLang].statusRetry.replace('{delay}', delay / 1000).replace('{attempt}', attempt).replace('{max}', max);
                        previewContent.innerHTML = `<div class="loading"><div class="spinner"></div>${msg}</div>`;
                    }
                });

                // 長度檢核：偵測到過短題目時，自動帶回饋重生一次
                let finalText = resultText;
                const shortQs = findShortQuestions(finalText);
                if (shortQs.length > 0) {
                    previewContent.innerHTML = `<div class="loading"><div class="spinner"></div>偵測到 ${shortQs.length} 題題幹過短（第 ${shortQs.join('、')} 題），自動補強中...</div>`;
                    try {
                        const feedback = `\n\n[QUALITY FEEDBACK — MUST FIX] In your previous output, question(s) ${shortQs.join(', ')} had stems that were too short, violating the minimum-length rule. Regenerate ALL questions now: every stem must include a concrete scenario/case/conditions and meet the minimum length (CJK: stem >=40 chars, essay >=60; alphabetic languages: stem >=30 words, essay >=45). Longer is required. IMPORTANT: keep the entire output strictly in ${targetLanguage}.`;
                        const retryText = await groqChat([
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: prompt + feedback }
                        ], { maxTokens: 8000 });
                        // 取兩次結果中過短題數較少者
                        if (retryText && findShortQuestions(retryText).length < shortQs.length) finalText = retryText;
                    } catch (e) {
                        console.warn('補強重試失敗，沿用第一次結果:', e.message);
                    }
                }

                if (finalText) {
                    generatedQuizText = finalText;
                    previewContent.textContent = generatedQuizText;
                    previewContent.contentEditable = 'false';
                    document.getElementById('audioPlayerContainer').classList.remove('hidden');
                    document.getElementById('qaContainer').classList.remove('hidden');
                } else {
                    throw new Error(translations[currentLang].alert_apiError);
                }
            } catch (error) {
                previewContent.innerHTML = `<div style="color: var(--danger);"><strong>${translations[currentLang].alert_generationFailed}</strong><p>${error.message}</p></div>`;
            }
        }

        function fileToBase64(file) { return new Promise((resolve, reject) => { const reader = new FileReader(); reader.readAsDataURL(file); reader.onload = () => resolve(reader.result.split(',')[1]); reader.onerror = error => reject(error); }); }
        async function extractTextFromImage(file) {
            const base64Data = await fileToBase64(file);
            const response = await fetchWithRetry(GROQ_CHAT_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` }, body: JSON.stringify({ model: GROQ_VISION_MODEL, max_tokens: 4096, messages: [{ role: 'user', content: [{ type: 'text', text: 'Extract all text from this image as plain text.' }, { type: 'image_url', image_url: { url: `data:${file.type};base64,${base64Data}` } }] }] }) });
            const data = await response.json(); return data.choices?.[0]?.message?.content || 'Cannot recognize text from image.';
        }
        async function transcribeAudioToText(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('model', 'whisper-large-v3');
            formData.append('response_format', 'json');
            const response = await fetchWithRetry(GROQ_WHISPER_URL, { method: 'POST', headers: { 'Authorization': `Bearer ${apiKey}` }, body: formData });
            const data = await response.json(); return data.text || 'Cannot recognize content from audio.';
        }
        async function extractPdfText(file) {
            const arrayBuffer = await file.arrayBuffer(); const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise; let fullText = '';
            for (let i = 1; i <= pdf.numPages; i++) { const page = await pdf.getPage(i); const textContent = await page.getTextContent(); fullText += textContent.items.map(item => item.str).join(' '); }
            return fullText;
        }

        function downloadFile(type) {
            const currentText = document.getElementById('previewContent').isContentEditable ? document.getElementById('previewContent').innerText : generatedQuizText;
            if (!currentText) return alert('No content to download');
            const separator = '=== 答案 ===';
            const hasAnswers = currentText.includes(separator);
            const questions = hasAnswers ? currentText.split(separator)[0].trim() : currentText;
            const answers = hasAnswers ? currentText.split(separator)[1].trim() : 'N/A';
            if (type === 'questions_txt') downloadBlob(new Blob([questions], { type: 'text/plain;charset=utf-8' }), 'Questions.txt');
            else if (type === 'answers_txt') downloadBlob(new Blob([separator + '\n' + answers], { type: 'text/plain;charset=utf-8' }), 'Answers.txt');
        }

        function downloadBlob(blob, filename) { const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); }

        
        // ===== 語音唸題：逐題播放器（瀏覽器 Web Speech API，免 API、支援中文）=====
        let ttsQueue = [];        // 每題一段
        let ttsIndex = 0;         // 目前題號索引
        let ttsSession = 0;       // 世代計數，避免 cancel 後殘留的 onend 干擾
        let ttsPausedFallback = false; // 部分行動瀏覽器不支援 pause，改用「取消+記住題號」

        function buildTtsQueue() {
            const currentText = document.getElementById('previewContent').isContentEditable ? document.getElementById('previewContent').innerText : generatedQuizText;
            if (!currentText) return [];
            let questions = currentText.split('=== 答案 ===')[0].trim();
            if (!questions) return [];
            let processed = questions.replace(/(True\/False|Multiple Choice|Fill-in-the-Blank|Essay|是非題|選擇題|填空題|問答題|正誤問題|選択問題|穴埋め問題|記述問題)\s*/gi, '');
            const parts = processed.split(/\n(?=\d+[\.、])/).map(t => t.trim()).filter(Boolean);
            return parts.length ? parts : [processed.trim()];
        }

        function updateTtsUi(speaking) {
            const controls = document.getElementById('ttsControls');
            const nowPlaying = document.getElementById('ttsNowPlaying');
            const pauseBtn = document.getElementById('ttsPauseBtn');
            const t = translations[currentLang];
            if (speaking && ttsQueue.length) {
                controls.classList.remove('hidden');
                nowPlaying.textContent = t.ttsProgress.replace('{n}', ttsIndex + 1).replace('{total}', ttsQueue.length);
                const paused = ttsPausedFallback || (window.speechSynthesis && speechSynthesis.paused);
                pauseBtn.textContent = paused ? t.ttsResumeBtn : t.ttsPauseBtn;
            } else {
                controls.classList.add('hidden');
                nowPlaying.textContent = '';
            }
        }

        function speakIndex(i) {
            if (!window.speechSynthesis) { alert('此瀏覽器不支援語音合成。'); return; }
            if (i < 0) i = 0;
            if (i >= ttsQueue.length) { stopTts(); return; }
            ttsIndex = i;
            ttsPausedFallback = false;
            const session = ++ttsSession;
            speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(ttsQueue[i]);
            const voiceName = document.getElementById('voiceSelect').value;
            const voice = speechSynthesis.getVoices().find(v => v.name === voiceName);
            if (voice) { utter.voice = voice; utter.lang = voice.lang; }
            utter.rate = 0.95;
            utter.onend = () => {
                if (session !== ttsSession) return; // 已被停止/切題，忽略
                if (ttsIndex + 1 < ttsQueue.length) speakIndex(ttsIndex + 1);
                else stopTts();
            };
            utter.onerror = (e) => {
                if (session !== ttsSession || e.error === 'canceled' || e.error === 'interrupted') return;
                console.error('Speech error:', e.error);
                stopTts();
            };
            speechSynthesis.speak(utter);
            updateTtsUi(true);
        }

        function togglePauseTts() {
            if (!window.speechSynthesis) return;
            if (ttsPausedFallback) {
                // 行動裝置備援：從目前題目重新播放
                speakIndex(ttsIndex);
                return;
            }
            if (speechSynthesis.paused) {
                speechSynthesis.resume();
            } else if (speechSynthesis.speaking) {
                speechSynthesis.pause();
                // 部分 Android 瀏覽器 pause 無效：改為取消並記住題號
                setTimeout(() => {
                    if (!speechSynthesis.paused && speechSynthesis.speaking) {
                        ttsSession++;
                        speechSynthesis.cancel();
                        ttsPausedFallback = true;
                        updateTtsUi(true);
                    }
                }, 100);
            }
            updateTtsUi(true);
        }

        function stopTts() {
            ttsSession++;
            ttsPausedFallback = false;
            if (window.speechSynthesis) speechSynthesis.cancel();
            updateTtsUi(false);
        }

        function readQuestionsAloud() {
            ttsQueue = buildTtsQueue();
            if (!ttsQueue.length) { alert('Please generate a quiz first.'); return; }
            speakIndex(0);
        }

        async function askQuestion() {
            const questionInput = document.getElementById('questionInput');
            const question = questionInput.value.trim();
            if (!question) return;
            if (!apiKey) { alert(translations[currentLang].alert_noApiKey); return; }
            if (!sourceContentText && !generatedQuizText) { alert('Please generate a quiz first to start asking questions.'); return; }

            appendChatMessage(question, 'user-message');
            questionInput.value = '';

            const chatBox = document.getElementById('chatBox');
            const loadingIndicator = document.createElement('div');
            loadingIndicator.className = 'bot-message chat-message';
            loadingIndicator.innerHTML = `<div class="loading"><div class="spinner"></div>${translations[currentLang].thinking}</div>`;
            chatBox.appendChild(loadingIndicator);
            chatBox.scrollTop = chatBox.scrollHeight;
            
            const useWebSearch = document.getElementById('webSearchCheckbox').checked;
            let groundingInstruction = useWebSearch 
                ? "You can combine real-time information from the web to provide a more comprehensive and in-depth answer." 
                : "Your answer must be strictly based on the 'source material' and 'generated quiz' I provided. You are strictly forbidden from using any information outside of these two sources.";
            const targetLanguage = supportedUiLanguages[currentLang] || '繁體中文';

            const prompt = `You are a professional subject matter expert assistant. Your task is to answer follow-up questions from the user based on the provided source material and the already generated quiz.
Please follow these rules:
1. **Role**: You are a friendly, professional, and patient assistant.
2. **Basis for Answers**: ${groundingInstruction}
3. **Tone and Language**: Respond clearly, concisely, and in an easy-to-understand manner using **${targetLanguage}**.

---
[Source Material]
${sourceContentText}
---
[Generated Quiz]
${generatedQuizText}
---

[User's Question]
${question}
`;
            try {
                // 勾選網路查詢時改用 groq/compound（內建網路搜尋）
                const answer = await groqChat([{ role: 'user', content: prompt }], {
                    maxTokens: 2048,
                    model: useWebSearch ? GROQ_COMPOUND_MODEL : null
                });
                chatBox.removeChild(loadingIndicator);

                if (answer) {
                    appendChatMessage(answer, 'bot-message');
                } else {
                    appendChatMessage('Sorry, I could not process your request. The API may not have returned a valid answer.', 'bot-message');
                }

        function appendChatMessage(message, className) {
            const chatBox = document.getElementById('chatBox');
            const messageDiv = document.createElement('div');
            messageDiv.className = `chat-message ${className}`;
            messageDiv.textContent = message;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        
    </script>
</body>
</html>
