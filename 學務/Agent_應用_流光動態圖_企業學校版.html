<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent 應用｜流光動態圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dde5f0; --panel:#e6ecf5; --panel2:#eef2f8; --line:#c3cfe0;
  --text:#1f2a3d; --muted:#5b6a82; --faint:#8a97ab;
  --gold:#a8781c; --jade:#2f8f78; --blue:#3f7fc2; --violet:#7a5fc8; --coral:#d24a4a; --io:#4b5a72;
  --edge:#b4c2d6; --nodebg:#fbf5e4; --stagebg:#e9eef6; --grid:rgba(31,42,61,.06); --field:#f7f9fc;
  --serif:"Noto Serif TC","Songti TC",serif; --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1424; --panel:rgba(20,32,55,.72); --panel2:rgba(26,40,66,.6); --line:#24365a;
    --text:#e8ecf3; --muted:#9aa7bd; --faint:#64738d;
    --gold:#e0c074; --jade:#52d3b6; --blue:#74a9ff; --violet:#b49cff; --coral:#f08a7c; --io:#c9d2e0;
    --edge:#26385a; --nodebg:#101b30; --stagebg:#0a1120; --grid:rgba(120,150,200,.07); --field:#0f1a2e;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1424; --panel:rgba(20,32,55,.72); --panel2:rgba(26,40,66,.6); --line:#24365a;
  --text:#e8ecf3; --muted:#9aa7bd; --faint:#64738d;
  --gold:#e0c074; --jade:#52d3b6; --blue:#74a9ff; --violet:#b49cff; --coral:#f08a7c; --io:#c9d2e0;
  --edge:#26385a; --nodebg:#101b30; --stagebg:#0a1120; --grid:rgba(120,150,200,.07); --field:#0f1a2e;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

header{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;padding:16px 22px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-family:var(--serif);font-weight:900;font-size:24px;letter-spacing:.04em}
header h1 small{display:block;font-family:var(--sans);font-weight:400;font-size:13px;color:var(--muted);letter-spacing:0}
.spacer{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;padding:7px 14px;font-size:14px;color:var(--muted)}
.seg button.sel{background:var(--panel2);color:var(--text);box-shadow:inset 0 -2px 0 var(--gold)}
.icon-btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:14px}
.icon-btn:disabled{opacity:.4;cursor:default}
.icon-btn.on{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:700}

#focus{display:grid;grid-template-columns:220px minmax(0,1fr) 340px;gap:18px;padding:18px 22px}
#list{display:flex;flex-direction:column;gap:4px}
#list button{display:flex;gap:10px;align-items:baseline;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:8px 10px}
#list button .n{font-family:var(--mono);font-size:12px;color:var(--faint);min-width:20px}
#list button b{font-weight:500;font-size:15px;display:block}
#list button em{font-style:normal;font-size:12px;color:var(--muted)}
#list button:hover{background:var(--panel2)}
#list button.sel{background:var(--panel);border-color:var(--line)}
#list button.sel .n{color:var(--gold)}

.stage-wrap{min-width:0}
.stage{background:var(--stagebg);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:40px 40px}
.stage svg{display:block;width:100%;height:auto}
.stage .ptitle{position:absolute;left:20px;top:14px;font-family:var(--serif);font-size:22px;font-weight:900;pointer-events:none}
.stage .ptitle b{pointer-events:auto}
.stage .ptitle span{pointer-events:auto;display:block;width:max-content;font-family:var(--mono);font-size:12px;font-weight:400;color:var(--muted)}
.caption{display:flex;gap:14px;align-items:center;min-height:56px;margin-top:12px;padding:10px 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.caption .cnt{font-family:var(--mono);font-size:13px;color:var(--gold);white-space:nowrap}
.caption .txt{font-size:16px;transition:opacity .25s}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.controls button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 14px;font-size:14px}
.controls button.primary{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:700}
.controls label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-left:6px}
.controls input[type=range]{width:110px;accent-color:var(--gold)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:2px solid;margin-right:6px;vertical-align:-1px}

#info{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;align-self:start}
#info h2{margin:0 0 4px;font-family:var(--serif);font-size:22px}
#info .en{font-family:var(--mono);font-size:12px;color:var(--muted)}
#info .lead{margin:10px 0 0;font-size:15px}
#info h3{margin:18px 0 6px;font-size:13px;color:var(--gold);font-weight:700;padding-bottom:4px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
#info ol{margin:0;padding-left:22px;font-size:14px}
#info ol li{padding:3px 0;color:var(--muted);transition:color .2s}
#info ol li.cur{color:var(--text);font-weight:500}
#info ol li.cur::marker{color:var(--gold)}
#info ul{margin:0;padding-left:18px;font-size:14px}
#info ul li{padding:2px 0}
#info .pc{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px}
#info .pc div b{display:block;font-size:12px;margin-bottom:2px}
#info .pc .p b{color:var(--jade)} #info .pc .c b{color:var(--coral)}

/* 編輯模式 */
body.editing #info{max-height:calc(100vh - 36px);overflow:auto;position:sticky;top:18px}
body.editing .stage .node{cursor:pointer}
.ed .hint{margin:6px 0 0;font-size:12px;color:var(--muted)}
.ed label{display:block;margin-top:8px;font-size:12px;color:var(--muted)}
.ed input,.ed textarea{display:block;width:100%;margin-top:3px;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:inherit;font-size:14px;color:var(--text);resize:vertical}
.ed input:focus,.ed textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 25%,transparent)}
.ed .nhead,.ed .nrow{display:grid;grid-template-columns:1fr 1fr 28px 28px;gap:6px;align-items:center}
.ed .nrow input[type=color]{padding:2px;height:30px;cursor:pointer}
.ed .nhead{font-size:11px;color:var(--faint);margin-bottom:2px}
.ed .nrow{margin-top:6px;padding-left:8px;border-left:3px solid var(--kc)}
.ed .nrow input{margin-top:0}
.ed .caps{padding-left:24px!important}
.ed .caps li{padding:3px 0!important}
.ed .caps li.cur textarea{border-color:var(--gold)}
.ed .vsel{display:flex;gap:4px}
.ed .vsel button{background:none;border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-size:12px;color:var(--muted);font-weight:400}
.ed .vsel button.sel{border-color:var(--gold);color:var(--text)}
.ed .ebtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.ed .ebtns button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
.ed .ebtns button.warn{color:var(--coral)}
.ed .saved{font-size:12px;color:var(--jade);min-height:18px;margin-top:6px}

#grid{display:none;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px;padding:18px 22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;text-align:left}
.card:hover{border-color:var(--gold)}
.card h4{margin:0 0 8px;font-family:var(--serif);font-size:17px;display:flex;justify-content:space-between;align-items:baseline}
.card h4 span{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--muted)}
.card .stage{border-radius:10px}
.card .mini-cap{font-size:13px;color:var(--muted);margin-top:8px;min-height:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.grid #focus{display:none} body.grid #grid{display:grid}

.edge-base{fill:none;stroke:var(--edge);stroke-width:2}
.edge-hot{fill:none;stroke:var(--gold);stroke-width:3;opacity:0}
.arrow{fill:var(--edge)}
.edge.hidden,.node.hidden{opacity:0;pointer-events:none}
.edge,.node{transition:opacity .45s}
.node .body{fill:var(--nodebg);stroke:var(--kc);stroke-width:1.6;transition:stroke-width .3s}
.node .lbl{fill:var(--text);font-family:var(--sans);font-weight:700;text-anchor:middle;dominant-baseline:central}
.node .sub{fill:var(--muted);font-family:var(--mono);text-anchor:middle;dominant-baseline:central}
.node .ring{fill:none;stroke:var(--kc);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
.node.on .body{stroke-width:3}
.node.on{filter:drop-shadow(0 0 10px var(--kc))}
.node.on .ring{animation:ring 1.4s ease-out infinite}
.node.on .sub{fill:var(--kc)}
.node.done .body{stroke-width:2.2}
@keyframes ring{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.35)}}
.k-llm{--kc:var(--gold)} .k-tool{--kc:var(--jade)} .k-data{--kc:var(--blue)} .k-gate{--kc:var(--violet)} .k-human{--kc:var(--coral)} .k-io{--kc:var(--io)}
.particle{filter:drop-shadow(0 0 6px currentColor)}

@media (prefers-reduced-motion: reduce){.node.on .ring{animation:none}}
@media (max-width:1180px){#focus{grid-template-columns:200px minmax(0,1fr)} #info{grid-column:1/-1} body.editing #info{position:static;max-height:none}}
@media (max-width:760px){
  header{padding:12px 14px} header h1{font-size:20px}
  #focus{grid-template-columns:1fr;padding:12px 14px;gap:12px}
  #list{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  #list button{flex:0 0 auto} #list button em{display:none}
  .stage .ptitle{font-size:16px;left:12px;top:8px}
  #grid{grid-template-columns:1fr;padding:12px 14px}
}
/* 圖上直接編輯 */
.stage .ptitle b{font-weight:900}
#mainStage .node{cursor:move;touch-action:none}
#mainStage .node text{cursor:text}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none}
#mainStage .node.drag-node{filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
#mainStage .node.drag-node .body{stroke-dasharray:6 3}
#mainStage .node text:hover{fill:var(--gold)!important}
#mainStage .node.editing-node .body{stroke-dasharray:6 3;stroke-width:2.6}
#ptName,#ptEn,#cap,#hTitle,#hSub{cursor:text;border-radius:4px}
#ptName:hover,#ptEn:hover,#cap:hover,#hTitle:hover,#hSub:hover{background:color-mix(in srgb,var(--gold) 14%,transparent)}
.ie-html{outline:1.5px dashed var(--gold);outline-offset:3px;background:color-mix(in srgb,var(--gold) 8%,transparent);caret-color:var(--gold)}
.ie-svg{position:fixed;z-index:50;text-align:center;padding:0 4px;margin:0;background:var(--nodebg);color:var(--text);border:1.5px dashed var(--gold);border-radius:6px;outline:none;font-family:var(--sans);font-weight:700;caret-color:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 18%,transparent)}
.ie-svg.sub{font-family:var(--mono);font-weight:400;color:var(--muted)}
.ie-bar{position:fixed;z-index:51;display:flex;flex-direction:column;gap:6px;padding:8px 10px;background:var(--panel2);background:color-mix(in srgb,var(--bg) 94%,var(--gold));border:1px solid var(--gold);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.3)}
.cb-row{display:flex;align-items:center;gap:5px}
.cb-row>span{font-size:12px;color:var(--muted);width:30px}
.sw{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);background:var(--c);padding:0;flex:none;cursor:pointer;position:relative}
.sw.sel{outline:2px solid var(--gold);outline-offset:1px}
.sw.none{background:none;font-size:13px;line-height:1;color:var(--muted)}
.sw.pick{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);overflow:hidden}
.sw.pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.edit-hint{font-size:12px;color:var(--faint);margin-left:auto}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--jade);color:#fff;padding:7px 16px;border-radius:999px;font-size:13px;pointer-events:none;transition:.25s;z-index:60}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header>
  <h1><span id="hTitle"></span><small id="hSub"></small></h1>
  <div class="spacer"></div>
  <div class="seg" id="setSeg" aria-label="版本">
    <button data-set="biz">企業版</button>
    <button data-set="edu">學校版</button>
  </div>
  <div class="seg" role="tablist">
    <button id="vFocus" class="sel">單一情境</button>
    <button id="vGrid">全部總覽</button>
  </div>
  <button class="icon-btn" id="undoBtn" title="復原（Ctrl+Z）" disabled>↶</button>
  <button class="icon-btn" id="redoBtn" title="重做（Ctrl+Y／Ctrl+Shift+Z）" disabled>↷</button>
  <button class="icon-btn" id="editBtn" title="編輯節點、字幕與說明文字">✎ 編輯文字</button>
  <button class="icon-btn" id="themeBtn" title="切換深淺色">◐</button>
</header>

<main>
  <section id="focus">
    <nav id="list" aria-label="情境清單"></nav>
    <div class="stage-wrap">
      <div class="stage" id="mainStage"><div class="ptitle" id="ptitle"></div></div>
      <div class="caption"><span class="cnt" id="cnt">1／1</span><span class="txt" id="cap"></span></div>
      <div class="controls">
        <button class="primary" id="playBtn">暫停</button>
        <button id="prevBtn">上一步</button>
        <button id="nextBtn">下一步</button>
        <button id="restartBtn">重播</button>
        <label>速度 <input type="range" id="speed" min="0.4" max="2.5" step="0.1" value="1"><span id="spdV">1.0×</span></label>
        <label><input type="checkbox" id="auto"> 播完自動換下一個情境</label>
      </div>
      <div class="legend">
        <span><i style="border-color:var(--gold)"></i>LLM／Agent</span>
        <span><i style="border-color:var(--jade)"></i>工具</span>
        <span><i style="border-color:var(--blue)"></i>資料／記憶</span>
        <span><i style="border-color:var(--violet);transform:rotate(45deg) scale(.8)"></i>判斷閘門</span>
        <span><i style="border-color:var(--coral);border-radius:6px"></i>人</span>
        <span><i style="border-color:var(--io);border-radius:6px"></i>輸入／輸出</span>
        <span class="edit-hint">✎ 點文字可修改與配色・拖拉節點可移動位置（Alt 微調）・Ctrl+Z 復原</span>
      </div>
    </div>
    <aside id="info"></aside>
  </section>
  <section id="grid"></section>
</main>
<div id="toast" role="status"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
/* ========== 情境資料 ========== */
const S=(e,cap,o={})=>Object.assign({e:e.map(x=>x.split('>')),cap},o);

const SETS={
 biz:{label:'企業版',title:'職場 Agent 應用',sub:'流光動態圖：看 Email、行事曆、報表與簽核如何由 Agent 串起來',

 nodes:[['inbox','io',80,280,'收件匣','Gmail／Outlook'],['cls','gate',275,280,'分類 Agent','判讀意圖'],['urg','llm',515,100,'急件 Agent','摘要重點'],['quo','llm',515,280,'回信 Agent','草擬回覆'],['arc','tool',515,460,'自動封存','電子報／廣告'],['ntf','tool',770,100,'LINE 通知','推播給你'],['crm','data',770,450,'客戶資料','CRM'],['hm','human',745,280,'你確認','待審'],['send','tool',915,280,'寄出','Gmail']],
 edges:[['inbox','cls'],['cls','urg'],['cls','quo'],['cls','arc'],['urg','ntf'],['quo','crm',22],['crm','quo',22],['quo','hm'],['hm','send']],

      else{const r=(k==='io'||k==='human')?hh:12;shape=['rect',{x:-hw,y:-hh,width:hw*2,height:hh*2,rx:r}];}
      el(shape[0],Object.assign({class:'ring'},shape[1]),g);
      el(shape[0],Object.assign({class:'body'},shape[1]),g);
      const lb=el('text',{class:'lbl',y:this.mini?0:-9,'font-size':fs},g);lb.textContent=label;
      const sb=el('text',{class:'sub',y:13,'font-size':11},g);sb.textContent=sub||'';if(this.mini)sb.style.display='none';

      const base=el('path',{class:'edge-base'},g),hot=el('path',{class:'edge-hot'},g);

  }
  layoutEdge(E){
    const A=this.N[E.a],B=this.N[E.b],dx=B.x-A.x,dy=B.y-A.y,len=Math.hypot(dx,dy)||1;
    const nx=-dy/len,ny=dx/len,cx=(A.x+B.x)/2+nx*E.bend,cy=(A.y+B.y)/2+ny*E.bend;
    const P=[];for(let i=0;i<=90;i++){const t=i/90,u=1-t;P.push([u*u*A.x+2*u*t*cx+t*t*B.x,u*u*A.y+2*u*t*cy+t*t*B.y]);}
    const inside=(n,p)=>{const ax=Math.abs(p[0]-n.x),ay=Math.abs(p[1]-n.y);return n.k==='gate'?(ax/(n.hw+4)+ay/(n.hh+4)<=1):(ax<=n.hw+5&&ay<=n.hh+5);};
    let s=0,e=P.length-1;while(s<e&&inside(A,P[s]))s++;while(e>s&&inside(B,P[e]))e--;
    if(e-s<2){s=0;e=P.length-1;}
    const pts=P.slice(s,e+1),cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
    const d='M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L');
    E.base.setAttribute('d',d);E.hot.setAttribute('d',d);
    const pe=pts[pts.length-1],pb=pts[Math.max(0,pts.length-4)],ang=Math.atan2(pe[1]-pb[1],pe[0]-pb[0])*180/Math.PI;
    E.ar.setAttribute('transform',`translate(${pe[0]},${pe[1]}) rotate(${ang})`);
    E.pts=pts;E.cum=cum;E.L=cum[cum.length-1]||1;
  }
  moveNode(id,x,y){
    const n=this.N[id];n.x=x;n.y=y;n.g.setAttribute('transform',`translate(${x},${y})`);

  at(E,u){const d=u*E.L,c=E.cum;let i=1;while(i<c.length-1&&c[i]<d)i++;const f=(d-c[i-1])/((c[i]-c[i-1])||1),p=E.pts[i-1],q=E.pts[i];return[p[0]+(q[0]-p[0])*f,p[1]+(q[1]-p[1])*f];}

    this.setVis();this.clearP();
    for(const [a,b] of s.e){const E=this.E[a+'>'+b];if(!E){console.warn('缺邊',a,b);continue;}
      E.active=true;E.heat=1;this.N[a].g.classList.add('on');this.N[a].g.classList.remove('done');
      if(!instant){const col=KCOL[this.N[a].k],grp=el('g',{class:'particle',style:`color:${col}`},this.gP),cs=[];
        for(let k=0;k<10;k++)cs.push(el('circle',{r:Math.max(1.2,(this.mini?7:5.5)-k*.5),fill:col,opacity:(1-k/10).toFixed(2)},grp));

  arrive(){
    const s=this.steps[this.si],tg=new Set(s.e.map(x=>x[1]));

    tg.forEach(id=>{this.N[id].g.classList.add('on');this.N[id].g.classList.remove('done');});
    for(const [a,b] of s.e){const E=this.E[a+'>'+b];if(E){E.active=false;E.ar.style.fill=KCOL[this.N[a].k];}}

    if(this.phase==='travel'){
      const p=Math.min(1,this.t/TRAVEL);
      for(const P of this.parts){P.cs.forEach((c,k)=>{const u=Math.max(0,ease(Math.max(0,p-k*.018)));const q=this.at(P.E,u);c.setAttribute('cx',q[0]);c.setAttribute('cy',q[1]);});}

    }else if(this.phase==='end'){
      if(this.t>=ENDWAIT){this.loop++;if(this.onLoop)this.onLoop(this);this.reset();this.start(0);}
    }
  }
}

  const w=Math.max(br.width*.86,r.width+24,60),h=fsz*1.7;
  const syncInp=()=>{inp.style.background=st.bg||'';inp.style.color=st.tc||(st.bg?autoText(st.bg):'');};
  Object.assign(inp.style,{left:(br.left+br.width/2-w/2)+'px',top:(r.top+r.height/2-h/2)+'px',width:w+'px',height:h+'px',fontSize:fsz+'px'});
  syncInp();document.body.appendChild(inp);tx.style.visibility='hidden';g.classList.add('editing-node');
  const bar=colorBar(g,id,(prop,c)=>{if(c)st[prop]=c;else delete st[prop];colorChanged=true;paintNode(g,st);syncInp();inp.focus();});
  const ac=new AbortController();
  ie={finish(save){ac.abort();const nv=inp.value;inp.remove();bar.remove();tx.style.visibility='';g.classList.remove('editing-node');
    const list=[];
    if(save&&nv!==val)list.push([key,nv]);
    if(save&&colorChanged)list.push([`style:${id}`,st]);
    if(!save&&colorChanged)paintNode(g,st0);
    if(list.length)applyFields(list);setPlaying(wasP);}};
  bindIE(inp,ac,bar);inp.focus();inp.select();
}
/* HTML 文字：直接變成可編輯 */
function editHtml(el,key,val){
  endIE(true);
  const wasP=playing;setPlaying(false);
  if(el.id==='cap'){clearTimeout(el._tm);el.style.opacity=1;}
  const orig=el.textContent;el.textContent=val;el.setAttribute('contenteditable','true');el.spellcheck=false;el.classList.add('ie-html');
  const ac=new AbortController();
  el.addEventListener('paste',e=>{e.preventDefault();document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text/plain').replace(/\s*\n\s*/g,' '));},{signal:ac.signal});
  ie={finish(save){ac.abort();const nv=el.textContent.replace(/\s*\n\s*/g,' ').trim();el.removeAttribute('contenteditable');el.classList.remove('ie-html');
    if(save&&nv&&nv!==val)applyFields([[key,nv]]);else el.textContent=orig;setPlaying(wasP);}};
  bindIE(el,ac);el.focus();
  const rg=document.createRange();rg.selectNodeContents(el);const sel=getSelection();sel.removeAllRanges();sel.addRange(rg);
}

function exportJSON(){
  const blob=new Blob([JSON.stringify({app:'agent-flow',v:1,edits:OV},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Agent流光圖_文字修改.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
$('#importFile').onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||d.app!=='agent-flow'||typeof d.edits!=='object')throw 0;
    pushUndo();OV=d.edits||{};saveOV();renderHeader();dirtyGrid();remount(0,0);renderList();renderSide();flash('已匯入 ✓');}
    catch(err){alert('檔案格式不符，請選擇本工具匯出的 JSON。');}};
  r.readAsText(file,'utf-8');e.target.value='';};

function remount(loop=0,si=0){
  const p=PAT(),host=$('#mainStage');host.querySelectorAll('svg').forEach(s=>s.remove());
  $('#ptitle').innerHTML=`<b id="ptName">${esc(p.name)}</b><span id="ptEn">${esc(p.en)}</span>`;
  main=new Stage(host,p);
  main.onStep=(st,i,n,cap)=>{$('#cnt').textContent=`${i+1}／${n}`;const t=$('#cap');t.style.opacity=0;clearTimeout(t._tm);t._tm=setTimeout(()=>{t.textContent=cap;t.style.opacity=1;},120);
    document.querySelectorAll('#stepList li, .ed .caps li').forEach((li,k)=>li.classList.toggle('cur',k===i));};
  main.onLoop=st=>{if($('#auto').checked){setTimeout(()=>select(cur+1),0);return;}
    if(editing&&$('#info').contains(document.activeElement))return;renderSide();};
  main.loop=loop;main.jump(si);
}
function select(i){cur=(i+RAW().length)%RAW().length;remount();renderSide();renderList();}
function dirtyGrid(){minis=[];$('#grid').innerHTML='';if(view==='grid')buildGrid();}
function buildGrid(){
  const g=$('#grid');g.innerHTML='';minis=[];
  RAW().forEach((_,i)=>{const p=PAT(i);
    const c=document.createElement('div');c.className='card';c.tabIndex=0;
    c.innerHTML=`<h4>${esc(p.name)}<span>${esc(p.en)}</span></h4><div class="stage"></div><div class="mini-cap"></div>`;
    g.appendChild(c);const st=new Stage(c.querySelector('.stage'),p,true),mc=c.querySelector('.mini-cap');
    st.onStep=(s,si,n,cap)=>mc.textContent=cap;st.onStep(st,0,st.steps.length,st.steps[0].cap);
    const go=()=>{setView('focus');select(i);};c.onclick=go;c.onkeydown=e=>{if(e.key==='Enter')go();};
    minis.push(st);});
}
function setView(v){view=v;document.body.classList.toggle('grid',v==='grid');$('#vFocus').classList.toggle('sel',v==='focus');$('#vGrid').classList.toggle('sel',v==='grid');
  if(v==='grid'&&!minis.length)buildGrid();}
function setSet(s){if(!SETS[s])return;SET=s;try{localStorage.setItem('agentFlowSet',s);}catch(e){}
  renderHeader();dirtyGrid();select(0);}
function setPlaying(v){playing=v;$('#playBtn').textContent=playing?'暫停':'播放';}
function setEditing(v){editing=v;document.body.classList.toggle('editing',v);$('#editBtn').classList.toggle('on',v);
  $('#editBtn').textContent=v?'✓ 完成編輯':'✎ 編輯文字';
  if(v){setView('focus');setPlaying(false);}renderSide();}

document.querySelectorAll('#setSeg button').forEach(b=>b.onclick=()=>setSet(b.dataset.set));
$('#vFocus').onclick=()=>setView('focus');$('#vGrid').onclick=()=>setView('grid');
$('#editBtn').onclick=()=>setEditing(!editing);
$('#playBtn').onclick=()=>setPlaying(!playing);
$('#nextBtn').onclick=()=>main.next();
$('#prevBtn').onclick=()=>main.jump(main.si-1);
$('#restartBtn').onclick=()=>{main.loop=0;main.jump(0);renderSide();};
$('#speed').oninput=e=>{SPEED=+e.target.value;$('#spdV').textContent=SPEED.toFixed(1)+'×';};
/* ========== 拖拉節點位置 ========== */
let drag=null,suppressClick=false;
function toSvg(e){const pt=main.svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(main.svg.getScreenCTM().inverse());}
$('#mainStage').addEventListener('pointerdown',e=>{
  if(e.button!==0||ie)return;const g=e.target.closest('.node');if(!g||!main.N[g.dataset.id])return;
  const n=main.N[g.dataset.id],p=toSvg(e);
  drag={id:n.id,n,ox:p.x-n.x,oy:p.y-n.y,sx:e.clientX,sy:e.clientY,x0:n.x,y0:n.y,moved:false};
});
addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.moved){if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<5)return;drag.moved=true;document.body.classList.add('dragging');drag.n.g.classList.add('drag-node');}
  e.preventDefault();
  const p=toSvg(e),n=drag.n,snap=e.altKey?1:10;
  const x=Math.max(n.hw+4,Math.min(1000-n.hw-4,Math.round((p.x-drag.ox)/snap)*snap));
  const y=Math.max(n.hh+4,Math.min(556-n.hh,Math.round((p.y-drag.oy)/snap)*snap));
  main.moveNode(n.id,x,y);
});
addEventListener('pointerup',()=>{
  if(!drag)return;const d=drag;drag=null;
  if(!d.moved)return;
  document.body.classList.remove('dragging');d.n.g.classList.remove('drag-node');
  suppressClick=true;setTimeout(()=>suppressClick=false,0);
  if(d.n.x!==d.x0||d.n.y!==d.y0)applyFields([[`pos:${d.id}`,[d.n.x,d.n.y]]]);
});
$('#mainStage').addEventListener('click',e=>{
  if(suppressClick){e.stopPropagation();return;}
  const tx=e.target.closest('.node text');if(tx){e.preventDefault();editSvgText(tx);return;}
  if(e.target.id==='ptName')editHtml(e.target,'name',main.pat.name);
  else if(e.target.id==='ptEn')editHtml(e.target,'en',main.pat.en);});
$('#cap').addEventListener('click',()=>{if(ie)return;editHtml($('#cap'),`cap:${main.loop%main.pat.V}-${main.si}`,main.steps[main.si].cap);});
$('#hTitle').addEventListener('click',()=>{if(!ie)editHtml($('#hTitle'),'meta:title',meta().title);});
$('#hSub').addEventListener('click',()=>{if(!ie)editHtml($('#hSub'),'meta:sub',meta().sub);});
addEventListener('resize',()=>endIE(true));
$('#themeBtn').onclick=()=>{const r=document.documentElement,dark=getComputedStyle(r).getPropertyValue('--bg').trim()==='#0c1424';
  r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('agentFlowTheme',r.dataset.theme);}catch(e){}};
try{const t=localStorage.getItem('agentFlowTheme');if(t)document.documentElement.dataset.theme=t;}catch(e){}
$('#undoBtn').onclick=undo;$('#redoBtn').onclick=redo;
document.addEventListener('keydown',e=>{
  if(!(e.ctrlKey||e.metaKey)||e.altKey)return;
  const k=e.key.toLowerCase();if(k!=='z'&&k!=='y')return;
  const tg=e.target,typing=/INPUT|TEXTAREA/.test(tg.tagName)&&tg.type!=='color'||tg.isContentEditable;
  if(typing)return;                       /* 輸入中：交給瀏覽器原生的文字復原 */
  e.preventDefault();
  if(k==='y'||e.shiftKey)redo();else undo();
},true);
document.addEventListener('keydown',e=>{if(view!=='focus'||/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key===' '){e.preventDefault();$('#playBtn').click();}
  else if(e.key==='ArrowRight')main.next();else if(e.key==='ArrowLeft')main.jump(main.si-1);
  else if(e.key==='ArrowDown'){e.preventDefault();select(cur+1);}else if(e.key==='ArrowUp'){e.preventDefault();select(cur-1);}});

let last=performance.now();
function frame(now){const dt=Math.min(64,now-last);last=now;
  if(playing){if(view==='focus'&&main)main.tick(dt);if(view==='grid')minis.forEach(s=>s.tick(dt));}
  requestAnimationFrame(frame);}
renderHeader();select(0);requestAnimationFrame(frame);
</script>
</body>
</html>
