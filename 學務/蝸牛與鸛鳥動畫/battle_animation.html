<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />

  <title>《鸛鳥與蝸牛爭戰》原畫水墨動畫｜2026.11.29 主日學</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at center, #2b2118 0%, #140f0a 100%);
      font-family: "Noto Serif TC", "PingFang TC", "Microsoft JhengHei", serif;
      color: #f5efe6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 14px;
      overflow-x: hidden;
    }
    .frame-wrap {
      position: relative;
      width: min(940px, 96vw);
      aspect-ratio: 1024 / 741;
      padding: 14px;
      background: linear-gradient(135deg, #b8844c, #7c4f24 45%, #a5723d 75%, #653d18);
      border-radius: 8px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.72), inset 0 0 0 2px rgba(255, 232, 196, 0.25);
    }
    .paper-stage {
      position: relative;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 30% 25%, rgba(255, 253, 248, 0.99), rgba(246, 242, 234, 0.99)),
        #f8f5ef;
      overflow: hidden;
      border-radius: 3px;
      box-shadow: inset 0 0 32px rgba(102, 74, 42, 0.14);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .title-badge {
      position: absolute;
      top: 12px;
      left: 14px;
      padding: 5px 14px;
      background: rgba(30, 22, 14, 0.80);
      color: #fef3c7;
      border: 1px solid rgba(253, 230, 138, 0.4);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      pointer-events: none;
    }
    .sequel-badge {
      position: absolute;
      top: 12px;
      right: 14px;
      padding: 6px 14px;
      background: linear-gradient(135deg, rgba(21, 128, 61, 0.92), rgba(20, 83, 45, 0.92));
      color: #dcfce7;
      border: 1px solid rgba(134, 239, 172, 0.65);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.32);
      pointer-events: none;
    }
    .start-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 18px;
      background: linear-gradient(to top, rgba(20, 15, 10, 0.36) 0%, transparent 40%);
      transition: opacity 0.35s ease;
    }
    .start-overlay.hidden { opacity: 0; pointer-events: none; }
    .start-hero-btn {
      padding: 12px 28px;
      border-radius: 999px;
      border: 2px solid #fde68a;
      background: linear-gradient(135deg, #d97706, #b45309);
      color: #fff;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
      font-family: inherit;
    }
    .subtitle-box {
      margin-top: 12px;
      width: min(940px, 96vw);
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 24px;
      background: rgba(24, 18, 12, 0.92);
      border: 1px solid rgba(255, 243, 214, 0.28);
      border-radius: 12px;
      text-align: center;
      font-size: clamp(19px, 2.5vw, 28px);
      font-weight: 700;
      line-height: 1.5;
      color: #fffbeb;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.75);
    }
    .controls {
      margin-top: 10px;
      width: min(940px, 96vw);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
    }
    .btn {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 236, 200, 0.28);
      background: rgba(45, 34, 24, 0.85);
      color: #fef3c7;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
      font-family: inherit;
      text-decoration: none;
    }
    .btn:hover { background: rgba(120, 82, 42, 0.9); }
    .btn.active {
      background: #d97706;
      border-color: #fde68a;
      color: #fff;
    }
    .progress-bar {
      width: min(940px, 96vw);
      height: 6px;
      margin-top: 10px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      overflow: hidden;
      cursor: pointer;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22c55e, #fde68a);
    }
    .guide-modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(10, 8, 6, 0.76);
      backdrop-filter: blur(6px);
      padding: 16px;
    }
    .guide-modal.open { display: flex; }
    .guide-card {
      width: min(680px, 95vw);
      max-height: 86vh;
      overflow-y: auto;
      background: #1f1812;
      border: 1px solid rgba(253, 230, 138, 0.4);
      border-radius: 14px;
      padding: 22px 24px;
      color: #fef3c7;
      line-height: 1.8;
      font-size: 17px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.72);
    }
    .guide-card h3 { color: #fde047; margin-bottom: 12px; font-size: 21px; }
    .guide-card ul { padding-left: 22px; margin: 10px 0 16px; color: #f5efe6; }
    .guide-card li { margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="frame-wrap">
    <div class="paper-stage">
      <canvas id="ink-canvas" width="1024" height="741"></canvas>
      <div class="title-badge">《命運》續集｜鸛鳥與蝸牛爭戰</div>
      <div class="sequel-badge">🛡️ 倚靠神・得勝敵人</div>
      <div class="start-overlay" id="start-overlay">
        <button class="start-hero-btn" id="hero-start-btn">▶ 開始播放續集有聲動畫</button>
      </div>
    </div>
  </div>

  <div class="subtitle-box" id="subtitle">《鸛鳥與蝸牛爭戰》— 微弱的我們只要與神同在、倚靠神，就能斥退一切惡人與敵人！</div>

  <div class="progress-bar" id="progress-bar" title="點擊跳轉進度">
    <div class="progress-fill" id="progress-fill"></div>
  </div>

  <div class="controls">
    <button class="btn" id="play-btn">▶ 開始播放</button>
    <button class="btn" id="replay-btn">↺ 從頭重播</button>
    <button class="btn" data-seek="0">0. 原畫展示</button>
    <button class="btn" data-seek="10.2">1. 惡人逼近</button>
    <button class="btn" data-seek="18.8">2. 呼喚神斥退</button>
    <button class="btn" data-seek="24.9">3. 噴毒落荒而逃</button>
    <button class="btn" id="guide-btn">📖 打開解析</button>
    <button class="btn active" id="sound-btn">🔊 旁白：開</button>
    <a class="btn" href="./destiny_animation.html">⏮ 回到前篇《命運》</a>
  </div>

  <div class="guide-modal" id="guide-modal">
    <div class="guide-card">
      <h3>📖 《鸛鳥與蝸牛爭戰》原畫解析</h3>
      <ul>
        <li><strong>微弱的蝸牛代表我們：</strong>我們本身如同微弱、軟弱的小蝸牛；而傷害生命的<strong>鸛鳥</strong>，則象徵著敵人、惡人與撒但。</li>
        <li><strong>與神同行就有力量：</strong>當再次遇到惡人鸛鳥時，因為平時總是與神同在一起生活，蝸牛在危急時刻<strong>內心呼喚神</strong>，並大聲斥退：「你這個惡人，退去吧！」</li>
        <li><strong>倚靠神戰勝強敵：</strong>蝸牛噴出毒液擊退敵人，讓兇惡的鸛鳥嚇得落荒而逃。只要倚靠神並得勝到底，我們也能戰勝一切患難！</li>
      </ul>
      <div style="text-align:right;display:flex;gap:10px;justify-content:flex-end;">
        <button class="btn" id="replay-from-guide">↺ 再看一次</button>
        <button class="btn active" id="close-guide-btn">關閉解析</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('ink-canvas');
    const ctx = canvas.getContext('2d');
    const subtitleEl = document.getElementById('subtitle');
    const playBtn = document.getElementById('play-btn');
    const replayBtn = document.getElementById('replay-btn');
    const soundBtn = document.getElementById('sound-btn');
    const startOverlay = document.getElementById('start-overlay');
    const progressBar = document.getElementById('progress-bar');
    const progressFill = document.getElementById('progress-fill');
    const guideModal = document.getElementById('guide-modal');

    const W = 1024;
    const H = 741;
    const DURATION = 35.8;
    let time = 0;
    let playing = false;
    let soundOn = true;
    let lastTs = performance.now();
    let activeSegIdx = -1;
    let analysisShownAtEnd = false;

    const layers = {};
    const layerNames = ['rock', 'snail_hero', 'crane_enemy', 'seals_sig'];
    const origPaintingImg = new Image();
    let loadedCount = 0;
    const totalImgs = layerNames.length + 1;
    origPaintingImg.onload = () => {
      loadedCount++;
      if (loadedCount === totalImgs) renderFrame(time);
    };
    origPaintingImg.src = './assets/battle/original_painting.jpg?v=1';
    layerNames.forEach((name) => {
      const img = new Image();
      img.onload = () => {
        loadedCount++;
        if (loadedCount === totalImgs) renderFrame(time);
      };
      img.src = `./assets/battle/${name}.png?v=2`;
      layers[name] = img;
    });

    const AUDIO_CUES = [
      { start: 0.1, end: 10.0, src: './assets/battle/audio/bseg_0.mp3' },
      { start: 10.2, end: 18.7, src: './assets/battle/audio/bseg_1.mp3' },
      { start: 18.8, end: 24.7, src: './assets/battle/audio/bseg_2.mp3?v=2' },
      { start: 24.9, end: 35.5, src: './assets/battle/audio/bseg_3.mp3' },
    ];
    const audioEls = AUDIO_CUES.map((c) => {
      const a = new Audio(c.src);
      a.preload = 'auto';
      return a;
    });

    function stopAllAudio() {
      audioEls.forEach((a) => { try { a.pause(); a.currentTime = 0; } catch {} });
      activeSegIdx = -1;
    }

    function syncAudioForTime(t) {
      if (!playing || !soundOn) return;
      const idx = AUDIO_CUES.findIndex((c) => t >= c.start && t < c.end);
      if (idx !== -1 && idx !== activeSegIdx) {
        // 若上一段旁白/口白還在播放中，讓它自然講完再切換，避免聲音被硬生生切斷
        if (activeSegIdx !== -1 && idx > activeSegIdx) {
          const prevA = audioEls[activeSegIdx];
          if (prevA && !prevA.paused && !prevA.ended) return;
        }
        stopAllAudio();
        activeSegIdx = idx;
        const a = audioEls[idx];
        try {
          a.currentTime = Math.max(0, t - AUDIO_CUES[idx].start);
          a.play().catch(() => {});
        } catch {}
      }
    }

    function clamp01(v) { return Math.max(0, Math.min(1, v)); }
    function smooth(v) { v = clamp01(v); return v * v * (3 - 2 * v); }

    function getSubtitle(t) {
      if (t < 10.2) return '這幅《鸛鳥與蝸牛爭戰》的畫作中，微弱的蝸牛象徵著我們，而傷害生命的鸛鳥，則象徵著敵人與撒但。';
      if (t < 18.8) return '有一天，蝸牛再次遇到另一隻惡人鸛鳥。但因為牠總是與神同在一起生活、時時倚靠神——';
      if (t < 24.9) return '蝸牛：「神啊！你與我同在，你這個惡人退去吧！」';
      return '蝸牛隨即噴出毒液擊退敵人，惡人鸛鳥嚇得落荒而逃！只要倚靠神並得勝到底，微弱的我們也能戰勝一切！';
    }

    function drawGoldenAura(x, y, intensity, t) {
      if (intensity <= 0) return;
      ctx.save();
      const grad = ctx.createRadialGradient(x, y, 10, x, y, 125);
      grad.addColorStop(0, `rgba(253, 224, 71, ${0.62 * intensity})`);
      grad.addColorStop(0.5, `rgba(250, 204, 21, ${0.32 * intensity})`);
      grad.addColorStop(1, 'rgba(250, 204, 21, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, 125, 0, Math.PI * 2);
      ctx.fill();

      // 呼喚神時緩緩往天上飄升的祈禱光點
      for (let i = 0; i < 6; i++) {
        const p = (t * 0.55 + i * 0.17) % 1;
        const px = x + Math.sin(t * 2.4 + i * 1.9) * 38;
        const py = y + 18 - p * 115;
        ctx.globalAlpha = Math.sin(p * Math.PI) * intensity * 0.85;
        ctx.fillStyle = '#fef08a';
        ctx.beginPath();
        ctx.arc(px, py, 3.2 + (i % 2) * 1.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawShoutRipples(x, y, t) {
      if (t < 18.8 || t >= 24.7) return;
      ctx.save();
      for (let r = 0; r < 3; r++) {
        const p = ((t - 18.8) * 0.85 + r * 0.33) % 1;
        const rad = 28 + p * 195;
        ctx.globalAlpha = (1 - p) * 0.55;
        ctx.strokeStyle = r % 2 === 0 ? '#d97706' : '#181410';
        ctx.lineWidth = 3.5 * (1 - p * 0.6);
        ctx.beginPath();
        ctx.arc(x, y, rad, -0.65, 0.55);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawVenomSpray(prog, t) {
      if (prog <= 0 || prog >= 1) return;
      ctx.save();
      const startX = 538;
      const startY = 398;
      const endX = startX + prog * 195;
      const endY = startY + prog * 18;

      // 翡翠金色神力毒液主水柱
      const grad = ctx.createLinearGradient(startX, startY, endX, endY);
      grad.addColorStop(0, 'rgba(250, 204, 21, 0.95)');
      grad.addColorStop(0.5, 'rgba(34, 197, 94, 0.92)');
      grad.addColorStop(1, 'rgba(16, 185, 129, 0.25)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 14 * (1 - prog * 0.35);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.quadraticCurveTo((startX + endX) * 0.5, startY - 10, endX, endY);
      ctx.stroke();

      // 噴濺飛沫粒子
      for (let i = 0; i < 12; i++) {
        const u = ((prog * 2.2 + i * 0.08) % 1);
        const px = startX + u * 210;
        const py = startY + Math.sin(i * 2.3 + t * 18) * (10 + u * 28);
        ctx.fillStyle = i % 2 === 0 ? '#4ade80' : '#fde047';
        ctx.globalAlpha = (1 - u) * 0.9;
        ctx.beginPath();
        ctx.arc(px, py, 4.5 - u * 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function renderFrame(t) {
      ctx.clearRect(0, 0, W, H);
      if (loadedCount < totalImgs) return;

      // 序幕 (t < 10.2s)：100% 完整展示未經任何切割修飾的原始畫作
      if (t < 10.2) {
        ctx.drawImage(origPaintingImg, 0, 0, W, H);
      } else {
        const ta = t - 10.2;
        // 1. 山崖由左下向右上斜向水墨揮毫出現（動畫過程中隱藏印章與簽名）
        const rockProg = smooth(ta / 1.8);
        ctx.save();
        if (rockProg < 0.99) {
          // 沿左下 (0, H) -> 右上 (W, 0) 對角線法線掃描裁切
          const d = rockProg * (W + H);
          ctx.beginPath();
          ctx.moveTo(0, H);
          ctx.lineTo(d, H);
          ctx.lineTo(0, H - d);
          ctx.closePath();
          ctx.clip();
        }
        ctx.globalAlpha = Math.min(1, rockProg * 1.4);
        ctx.drawImage(layers.rock, 0, 0);
        ctx.restore();

        // 2. 蝸牛倚靠神的神聖金光與祈禱光點 (13.5s 起亮起)
        const aura = t < 13.5 ? 0 : t < 25.0 ? smooth((t - 13.5) / 3.5) : 0.45 + 0.18 * Math.sin(t * 3);
        drawGoldenAura(500, 385, aura, t);

        // 3. 蝸牛等到岩石出現完畢 (ta >= 1.5s) 才漸顯登場，避免一開始懸在半空中
        if (ta >= 1.5) {
          const snailAlpha = smooth((ta - 1.5) / 0.8);
          let snailDx = 0;
          let snailDy = 0;
          let snailRot = 0;
          if (t >= 15.0 && t < 18.8) {
            const charge = smooth((t - 15.0) / 3.2);
            snailDx = -6 * charge;
            snailRot = -0.05 * charge;
          } else if (t >= 18.8 && t < 24.6) {
            snailDx = Math.sin(t * 28) * 2.2;
            snailDy = -3 + Math.sin(t * 16) * 1.2;
            snailRot = 0.04;
          }
          ctx.save();
          ctx.globalAlpha = snailAlpha;
          ctx.translate(505 + snailDx, 405 + snailDy);
          ctx.rotate(snailRot);
          ctx.drawImage(layers.snail_hero, -505, -405);
          ctx.restore();
        }

        drawShoutRipples(555, 395, t);

        // 4. 惡人鸛鳥動畫：威嚇逼近 -> 擊中震退 -> 驚慌振翅掉毛落荒而逃
        if (t < 30.8) {
          ctx.save();
          if (t < 25.1) {
            const approach = smooth(ta / 4.8);
            const bobY = Math.sin(t * 5.2) * 3.5;
            const peckRot = t > 14.5 ? Math.sin(t * 6.5) * 0.045 : 0;
            const dx = (1 - approach) * 65 - (t > 18.8 ? Math.sin(t * 15) * 3 : 0);
            ctx.translate(665 + dx, 635 + bobY);
            ctx.rotate(peckRot);
            ctx.drawImage(layers.crane_enemy, -665, -635);
          } else {
            const flee = smooth((t - 25.1) / 4.2);
            const cx = 665;
            const cy = 510;
            const flapY = 0.90 + 0.14 * Math.sin(t * 28); // 急促拍翅感
            ctx.translate(cx + flee * 480, cy - flee * 210 + Math.sin(t * 24) * 14);
            ctx.scale(-1, flapY); // 轉身向右拍翅落荒而逃
            ctx.rotate(-0.24 * flee);
            ctx.globalAlpha = Math.max(0, 1 - Math.max(0, (flee - 0.72) / 0.28));
            ctx.drawImage(layers.crane_enemy, -cx, -cy);
          }
          ctx.restore();

          // 落荒而逃時驚慌掉落的幾根水墨小羽毛
          if (t >= 25.3 && t < 29.8) {
            ctx.save();
            ctx.strokeStyle = '#181410';
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            for (let f = 0; f < 4; f++) {
              const fp = clamp01((t - 25.3 - f * 0.25) / 2.2);
              if (fp <= 0 || fp >= 1) continue;
              const fx = 685 + f * 48 + fp * 55;
              const fy = 490 - f * 18 + fp * 75 + Math.sin(fp * 8 + f) * 8;
              ctx.globalAlpha = (1 - fp) * 0.75;
              ctx.beginPath();
              ctx.moveTo(fx, fy);
              ctx.lineTo(fx - 14, fy + 6);
              ctx.stroke();
            }
            ctx.restore();
          }
        }

        // 5. 噴出毒液／神力水柱 (24.8 ~ 28.0s)
        if (t >= 24.8 && t < 28.0) {
          drawVenomSpray((t - 24.8) / 2.8, t);
        }

        // 6. 大聲斥退水墨文字氣勢波 (19.0 ~ 24.8s)
        if (t >= 19.0 && t < 24.8) {
          const p = (t - 19.0) / 5.8;
          ctx.save();
          ctx.globalAlpha = Math.sin(clamp01(p) * Math.PI);
          ctx.font = 'bold 30px "Noto Serif TC", serif';
          ctx.fillStyle = '#92400e';
          ctx.fillText('「神啊！你與我同在！」', 270, 222 - p * 18);
          ctx.font = 'bold 34px "Noto Serif TC", serif';
          ctx.fillStyle = '#b45309';
          ctx.fillText('「你這個惡人，退去吧！」', 255, 270 - p * 18);
          ctx.restore();
        }

        // 7. 動畫結束後才浮現紅印與落款簽名 (t >= 29.8s)
        if (t >= 29.8) {
          ctx.save();
          ctx.globalAlpha = smooth((t - 29.8) / 2.2);
          ctx.drawImage(layers.seals_sig, 0, 0);
          ctx.restore();
        }
      }

      subtitleEl.textContent = getSubtitle(t);
      progressFill.style.width = `${(t / DURATION) * 100}%`;
    }

    function startPlaybackFrom(startSec) {
      time = startSec;
      playing = true;
      analysisShownAtEnd = startSec >= DURATION;
      startOverlay.classList.add('hidden');
      playBtn.textContent = '⏸ 暫停播放';
      playBtn.classList.add('active');
      stopAllAudio();
      syncAudioForTime(time);
    }

    function loop(now) {
      requestAnimationFrame(loop);
      const dt = Math.min((now - lastTs) / 1000, 0.05);
      lastTs = now;
      if (playing) {
        time += dt;
        syncAudioForTime(time);
        if (time >= DURATION) {
          time = DURATION;
          playing = false;
          playBtn.textContent = '▶ 重播動畫';
          playBtn.classList.remove('active');
          if (!analysisShownAtEnd) {
            analysisShownAtEnd = true;
            guideModal.classList.add('open');
          }
        }
      }
      renderFrame(time);
    }

    document.getElementById('hero-start-btn').onclick = () => startPlaybackFrom(0);
    playBtn.onclick = () => {
      if (time >= DURATION) { startPlaybackFrom(0); return; }
      playing = !playing;
      startOverlay.classList.add('hidden');
      playBtn.textContent = playing ? '⏸ 暫停播放' : '▶ 繼續播放';
      playBtn.classList.toggle('active', playing);
      if (playing) syncAudioForTime(time);
      else stopAllAudio();
    };
    replayBtn.onclick = () => { guideModal.classList.remove('open'); startPlaybackFrom(0); };
    document.querySelectorAll('[data-seek]').forEach((btn) => {
      btn.onclick = () => { guideModal.classList.remove('open'); startPlaybackFrom(Number(btn.dataset.seek)); };
    });
    soundBtn.onclick = () => {
      soundOn = !soundOn;
      soundBtn.textContent = soundOn ? '🔊 旁白：開' : '🔇 旁白：關';
      soundBtn.classList.toggle('active', soundOn);
      if (!soundOn) stopAllAudio();
      else if (playing) syncAudioForTime(time);
    };
    document.getElementById('guide-btn').onclick = () => guideModal.classList.add('open');
    document.getElementById('close-guide-btn').onclick = () => guideModal.classList.remove('open');
    document.getElementById('replay-from-guide').onclick = () => { guideModal.classList.remove('open'); startPlaybackFrom(0); };
    guideModal.onclick = (e) => { if (e.target === guideModal) guideModal.classList.remove('open'); };
    progressBar.onclick = (e) => {
      const rect = progressBar.getBoundingClientRect();
      startPlaybackFrom(clamp01((e.clientX - rect.left) / rect.width) * DURATION);
    };

    requestAnimationFrame(loop);
  </script>
</body>
</html>
