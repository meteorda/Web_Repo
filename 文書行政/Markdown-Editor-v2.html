<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown 編輯器 v2</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root,[data-theme=dark]{--bg:#1e1e2e;--bg2:#181825;--bg3:#11111b;--text:#cdd6f4;--text2:#a6adc8;--muted:#6c7086;--accent:#89b4fa;--border:#313244;--green:#a6e3a1;--yellow:#f9e2af;--red:#f38ba8;--pink:#f5c2e7;--peach:#fab387;--mauve:#cba6f7;--lavender:#b4befe;--teal:#94e2d5;--sky:#89dceb;--onaccent:#1e1e2e;--shadow:0 10px 36px rgba(0,0,0,.5);--efs:14px}
[data-theme=light]{--bg:#eff1f5;--bg2:#e6e9ef;--bg3:#dce0e8;--text:#4c4f69;--text2:#5c5f77;--muted:#8c8fa1;--accent:#1e66f5;--border:#ccd0da;--green:#40a02b;--yellow:#df8e1d;--red:#d20f39;--pink:#ea76cb;--peach:#fe640b;--mauve:#8839ef;--lavender:#7287fd;--teal:#179299;--sky:#04a5e5;--onaccent:#fff;--shadow:0 10px 36px rgba(0,0,0,.18)}
body{font-family:'Segoe UI','Microsoft JhengHei',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}::-webkit-scrollbar-track{background:transparent}
.toolbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:4px 8px;display:flex;gap:2px;flex-wrap:wrap;align-items:center}
.tg{display:flex;gap:1px;padding-right:5px;margin-right:3px;border-right:1px solid var(--border)}
.tg:last-child{border-right:none}
.btn{background:transparent;border:none;color:var(--text);padding:5px 8px;border-radius:6px;cursor:pointer;font-size:13px;white-space:nowrap;line-height:1.25}
.btn:hover{background:var(--bg3)}
.btn.active{background:var(--accent);color:var(--onaccent)}
.btn.primary{background:var(--accent);color:var(--onaccent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.outline{border:1px solid var(--border)}
.btn:disabled{opacity:.45;cursor:default}
.main{flex:1;display:flex;overflow:hidden;min-height:0}
/* 專案側欄 */
.side{width:240px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
body.no-side .side{display:none}
.side-head{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--border);align-items:center}
.side-head select{flex:1;min-width:0}
.pdot{width:10px;height:10px;border-radius:50%;flex-shrink:0;display:inline-block}
.proj-meta{padding:6px 10px 8px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--border)}
.pm-bar{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;margin:4px 0}
.pm-bar i{display:block;height:100%;background:var(--green);transition:width .3s}
.pm-bar.big{height:9px;flex:1}
.side-tools{display:flex;gap:2px;padding:6px 6px 4px;align-items:center}
.side-tools input{flex:1;min-width:0}
.tree{flex:1;overflow-y:auto;padding:2px 4px 30px}
.tree.drop{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.tr-row{display:flex;align-items:center;gap:4px;padding:4px 6px;border-radius:5px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.tr-row:hover{background:var(--bg3)}
.tr-row .tn{overflow:hidden;text-overflow:ellipsis;flex:1}
.tr-doc.active{background:color-mix(in srgb,var(--accent) 24%,transparent)}
.tr-folder{color:var(--text2);font-weight:600}
.tr-row.drop{outline:2px dashed var(--accent)}
.tw{width:10px;font-size:10px;color:var(--muted)}
.tr-acts{display:none;gap:1px}
.tr-row:hover .tr-acts{display:flex}
.tr-acts button{background:none;border:none;cursor:pointer;font-size:11px;padding:1px 3px;border-radius:3px;color:var(--text2)}
.tr-acts button:hover{background:var(--bg)}
.tr-empty{padding:14px;color:var(--muted);font-size:12px;text-align:center}
/* 編輯器 */
.editor-pane{display:flex;flex-direction:column;min-width:250px;flex-shrink:0;width:50%}
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;min-height:33px;scrollbar-width:thin}
.tab{display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:12px;color:var(--text2);border-right:1px solid var(--border);cursor:pointer;white-space:nowrap;max-width:210px}
.tab .nm{overflow:hidden;text-overflow:ellipsis}
.tab.active{background:var(--bg);color:var(--text);box-shadow:inset 0 2px 0 var(--accent)}
.tab .x{opacity:.45;border-radius:3px;padding:0 4px}
.tab .x:hover{opacity:1;background:var(--bg3)}
.editor-wrap{flex:1;display:flex;min-height:0}
.gutter{width:48px;flex-shrink:0;overflow:hidden;background:var(--bg);border-right:1px solid var(--border);color:var(--muted);font-family:Consolas,monospace;font-size:12px;text-align:right;user-select:none}
.gutter #gutterInner>div{padding-right:8px}
.gutter .cur{color:var(--accent);font-weight:700}
body.no-ln .gutter{display:none}
#editor{flex:1;width:100%;background:var(--bg);color:var(--text);border:none;outline:none;resize:none;padding:16px;font-family:Consolas,'Microsoft JhengHei',monospace;font-size:var(--efs);line-height:1.7;tab-size:4;white-space:pre-wrap;overflow-wrap:break-word}
#mirror{position:absolute;left:-99999px;top:0;visibility:hidden;white-space:pre-wrap;overflow-wrap:break-word;tab-size:4}
.resizer{width:6px;background:var(--bg2);cursor:col-resize;flex-shrink:0;border-left:1px solid var(--border);border-right:1px solid var(--border)}
.resizer:hover,.resizer.drag{background:var(--accent)}
.preview-pane{flex:1;display:flex;flex-direction:column;min-width:250px;overflow:hidden}
.pane-header{background:var(--bg2);padding:3px 10px;font-size:12px;color:var(--text2);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;min-height:33px}
#preview{flex:1;overflow-y:auto;position:relative}
#pv{padding:20px 28px 45vh}
.view-edit .preview-pane,.view-edit #resizer{display:none!important}
.view-edit .editor-pane{flex:1;width:auto!important}
.view-preview .editor-pane,.view-preview #resizer{display:none!important}
/* Markdown 排版 */
.md{line-height:1.75;font-size:15px;word-wrap:break-word}
.md h1,.md h2,.md h3,.md h4{margin:22px 0 12px;line-height:1.35}
.md h1{font-size:1.8em;border-bottom:2px solid var(--accent);padding-bottom:8px}
.md h2{font-size:1.42em;border-bottom:1px solid var(--border);padding-bottom:6px}
.md h3{font-size:1.2em;color:var(--accent)}
.md h4{font-size:1.05em;color:var(--lavender)}
.md p{margin-bottom:14px}
.md a{color:var(--accent)}
.md code{background:var(--bg2);padding:2px 6px;border-radius:4px;color:var(--green);font-family:Consolas,monospace;font-size:.9em}
.md pre{background:var(--bg3);padding:14px;border-radius:8px;overflow-x:auto;margin:14px 0;position:relative;border:1px solid var(--border)}
.md pre code{background:none;color:var(--text);padding:0;font-size:13px;line-height:1.6}
.md blockquote{border-left:4px solid var(--accent);padding:10px 14px;margin:14px 0;background:var(--bg2);border-radius:0 8px 8px 0}
.md blockquote p:last-child{margin-bottom:0}
.md ul,.md ol{margin:0 0 14px 22px}
.md li{margin-bottom:5px}
.md li.task-li{list-style:none;margin-left:-20px}
.md li.task-li input{margin-right:8px;transform:scale(1.15);cursor:pointer;accent-color:var(--green)}
.md table{border-collapse:collapse;width:100%;margin:14px 0;font-size:14px}
.md th,.md td{border:1px solid var(--border);padding:8px 10px;text-align:left}
.md th{background:var(--bg2)}
.md tr:nth-child(even) td{background:color-mix(in srgb,var(--bg2) 50%,transparent)}
.md hr{border:none;border-top:2px solid var(--border);margin:22px 0}
.md mark{background:#f9e2af;color:#1e1e2e;padding:1px 4px;border-radius:3px}
.md mark.hl{background:var(--peach);color:#1e1e2e;padding:0;border-radius:2px}
.md img{max-width:100%;border-radius:8px}
.md .math-block{overflow-x:auto;margin:14px 0;text-align:center}
.md .fn-ref a{text-decoration:none;font-size:.8em}
.md .footnotes{font-size:13px;color:var(--text2);margin-top:30px}
.md .footnotes hr{margin:12px 0}
.md .toc{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin:14px 0}
.md .toc b{display:block;margin-bottom:6px}
.md .toc a{display:block;text-decoration:none;color:var(--text2);padding:2px 0;font-size:14px}
.md .toc a:hover{color:var(--accent)}
.md .alert{border-left-width:4px}
.md .alert-title{font-weight:700;margin-bottom:6px}
.md .alert-note{border-color:var(--accent)}.md .alert-note .alert-title{color:var(--accent)}
.md .alert-tip{border-color:var(--green)}.md .alert-tip .alert-title{color:var(--green)}
.md .alert-important{border-color:var(--mauve)}.md .alert-important .alert-title{color:var(--mauve)}
.md .alert-warning{border-color:var(--yellow)}.md .alert-warning .alert-title{color:var(--yellow)}
.md .alert-caution{border-color:var(--red)}.md .alert-caution .alert-title{color:var(--red)}
.code-copy{position:absolute;top:6px;right:6px;background:var(--bg2);border:1px solid var(--border);color:var(--text2);border-radius:5px;font-size:11px;padding:2px 8px;cursor:pointer;opacity:0;transition:.15s}
.md pre:hover .code-copy{opacity:1}
.code-lang{position:absolute;top:6px;right:62px;font-size:10px;color:var(--muted);opacity:0}
.md pre:hover .code-lang{opacity:1}
.hljs-keyword,.hljs-selector-tag,.hljs-built_in{color:var(--mauve)}
.hljs-string,.hljs-attr-value,.hljs-regexp,.hljs-addition{color:var(--green)}
.hljs-number,.hljs-literal{color:var(--peach)}
.hljs-comment,.hljs-quote{color:var(--muted);font-style:italic}
.hljs-title,.hljs-section,.hljs-title.function_{color:var(--accent)}
.hljs-type,.hljs-class .hljs-title,.hljs-title.class_{color:var(--yellow)}
.hljs-attr,.hljs-attribute,.hljs-variable,.hljs-template-variable,.hljs-property{color:var(--sky)}
.hljs-tag,.hljs-name,.hljs-selector-id,.hljs-selector-class{color:var(--pink)}
.hljs-meta,.hljs-symbol,.hljs-bullet{color:var(--teal)}
.hljs-deletion{color:var(--red)}
/* 圖表 */
.dg{background:var(--bg2);border:1px solid var(--border);border-radius:8px;margin:14px 0;overflow:hidden}
.dg-bar{display:flex;gap:2px;padding:5px 8px;background:var(--bg3);border-bottom:1px solid var(--border);align-items:center;flex-wrap:wrap}
.dg-bar button{background:none;border:none;color:var(--text);padding:3px 7px;border-radius:5px;cursor:pointer;font-size:12px}
.dg-bar button:hover{background:var(--bg2)}
.dg-label{font-size:11px;padding:1px 8px;border-radius:4px;margin-right:6px}
.dg-label.mermaid{color:var(--pink);border:1px solid var(--pink)}
.dg-label.plantuml{color:var(--sky);border:1px solid var(--sky)}
.dg-label.markmap{color:var(--green);border:1px solid var(--green)}
.zinfo{font-size:11px;color:var(--muted);margin-left:4px;min-width:36px}
.dg-body{overflow:hidden;padding:16px;min-height:90px;max-height:560px;display:flex;justify-content:center;align-items:flex-start;cursor:grab}
.dg-body.panning{cursor:grabbing}
.dg-plantuml .dg-body{background:#fff}
.dg-markmap .dg-body{padding:0;cursor:default;display:block}
.dg-stage{transform-origin:top center;transition:transform .12s ease;max-width:100%}
.dg-stage svg{display:block;max-width:none!important;height:auto}
.dg-stage img{display:block;max-width:100%}
.dg-markmap .dg-stage{max-width:none;transition:none}
.mm-svg{width:100%;height:380px;display:block;color:var(--text)}
.dg:fullscreen{display:flex;flex-direction:column;border-radius:0}
.dg:fullscreen .dg-body{max-height:none;flex:1;align-items:center}
.dg:fullscreen .mm-svg{height:calc(100vh - 42px)}
.dg-loading,.dg-err{padding:24px;color:var(--muted);font-size:13px;text-align:center}
.dg-err{color:var(--red);white-space:pre-wrap;text-align:left}
.dg-err button{margin-top:10px}
/* 大綱 */
.outline-side{width:200px;background:var(--bg2);border-left:1px solid var(--border);display:none;flex-direction:column}
body.show-outline .outline-side{display:flex}
.outline-side .hd{padding:9px 10px;font-size:12px;border-bottom:1px solid var(--border)}
#outline{flex:1;overflow-y:auto;padding:6px}
.ol-item{padding:4px 8px;cursor:pointer;border-radius:4px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ol-item:hover{background:var(--bg3)}
.ol-h1{font-weight:700;color:var(--mauve)}.ol-h2{padding-left:16px;color:var(--lavender)}.ol-h3{padding-left:28px;color:var(--text2)}.ol-h4{padding-left:40px;color:var(--muted)}
/* 搜尋列 */
.search-bar{background:var(--bg2);border-bottom:1px solid var(--border);padding:6px 10px;display:none;gap:6px;align-items:center;flex-wrap:wrap}
.search-bar.show{display:flex}
.si{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:5px 9px;border-radius:5px;font-size:13px;outline:none;width:180px}
.si:focus{border-color:var(--accent)}
/* 狀態列 */
.status-bar{background:var(--bg2);border-top:1px solid var(--border);padding:3px 12px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.status-bar .grp{display:flex;gap:14px;white-space:nowrap;overflow:hidden}
/* 表單 / 對話框 */
.form-input,.form-select{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:6px;font-size:13px;outline:none}
.form-input:focus{border-color:var(--accent)}
.form-input.sm{width:auto;padding:4px 8px;font-size:12px}
textarea.form-input{resize:vertical;line-height:1.6}
.form-group{margin-bottom:12px}
.form-label{display:block;margin-bottom:5px;font-size:12.5px;color:var(--text2)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px 20px;min-width:420px;max-width:94vw;max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.modal.wide{width:860px}.modal.xwide{width:1160px}
.modal-title{font-size:16px;font-weight:600;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.sub-title{font-size:13px;font-weight:600;margin:16px 0 8px;color:var(--text2)}
.muted{color:var(--muted);font-size:12px}
.row{display:flex;gap:8px;align-items:center}
.template-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.template-card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:14px 8px;cursor:pointer;text-align:center}
.template-card:hover{border-color:var(--accent)}
.template-icon{font-size:24px;margin-bottom:6px}
.template-name{font-size:12px}
.syntax-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.syntax-item{background:var(--bg3);padding:10px;border-radius:6px}
.syntax-title{color:var(--accent);font-size:12px;margin-bottom:6px}
.syntax-code{font-family:monospace;font-size:11.5px;color:var(--green);white-space:pre-wrap}
.help-tabs{display:flex;gap:4px;margin-bottom:12px}
.help-tab{padding:7px 14px;background:var(--bg3);border:none;color:var(--text2);border-radius:6px;cursor:pointer;font-size:13px}
.help-tab.active{background:var(--accent);color:var(--onaccent)}
.help-content{display:none;max-height:430px;overflow-y:auto}
.help-content.active{display:block}
.help-content pre{background:var(--bg3);padding:10px;border-radius:6px;font-size:12px;white-space:pre-wrap}
.help-content h4{margin:10px 0 6px}
/* 專案卡片 */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pcard{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 14px;border-top:4px solid var(--accent)}
.pcard.cur{box-shadow:0 0 0 2px var(--accent)}
.pcard h4{font-size:15px;margin-bottom:4px;display:flex;gap:6px;align-items:center}
.pcard .desc{font-size:12px;color:var(--text2);margin-bottom:8px;min-height:16px}
.pcard .stats{font-size:11.5px;color:var(--muted);line-height:1.7}
.pcard .acts{display:flex;flex-wrap:wrap;gap:2px;margin-top:8px}
.recent{display:flex;flex-direction:column;gap:2px}
.recent div{padding:5px 8px;border-radius:5px;cursor:pointer;font-size:12.5px}
.recent div:hover{background:var(--bg3)}
.color-row{display:flex;gap:8px;flex-wrap:wrap}
.color-row span{width:26px;height:26px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.color-row span.sel{border-color:var(--text)}
/* 任務看板 */
.tb-add{display:flex;gap:8px;margin-bottom:10px}
.tb-stats{display:flex;gap:12px;align-items:center;font-size:12.5px;color:var(--text2);margin-bottom:12px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.bcol{background:var(--bg3);border-radius:10px;padding:10px;min-height:200px;max-height:56vh;overflow-y:auto}
.bcol h5{font-size:13px;margin-bottom:8px;display:flex;justify-content:space-between}
.tcard{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:8px;display:flex;gap:8px;align-items:flex-start}
.tcard.hi{border-left:3px solid var(--red)}
.tcard input{margin-top:3px;accent-color:var(--green);cursor:pointer}
.tc-title{font-size:13px;cursor:pointer;line-height:1.5}
.tc-title:hover{color:var(--accent)}
.tcard.done .tc-title{text-decoration:line-through;color:var(--muted)}
.tc-meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-size:10.5px;padding:1px 6px;border-radius:10px;background:var(--bg3);color:var(--text2)}
.chip.over{background:var(--red);color:#1e1e2e}
.chip.who{color:var(--sky)}.chip.tag{color:var(--mauve)}
/* 歷史 */
.hist{display:grid;grid-template-columns:280px 1fr;gap:12px;height:60vh}
.hist-list{overflow-y:auto;border:1px solid var(--border);border-radius:8px}
.hist-item{padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer;font-size:12.5px}
.hist-item:hover,.hist-item.active{background:var(--bg3)}
.tag{font-size:10.5px;padding:1px 6px;border-radius:8px;background:var(--bg3);color:var(--accent)}
.hist-view{display:flex;flex-direction:column;min-height:0}
.hist-view pre{flex:1;overflow:auto;background:var(--bg3);border-radius:8px;padding:12px;font-size:12.5px;white-space:pre-wrap;font-family:Consolas,monospace}
.hist-acts{display:flex;gap:6px;margin-top:8px}
/* 全域搜尋 */
.gs-res{margin-top:12px;max-height:58vh;overflow-y:auto}
.gs-doc{font-size:12px;font-weight:700;color:var(--accent);margin:10px 0 4px}
.gs-item{padding:5px 10px;border-radius:5px;cursor:pointer;font-size:12.5px;font-family:Consolas,'Microsoft JhengHei',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs-item:hover{background:var(--bg3)}
.gs-item mark{background:var(--peach);color:#1e1e2e}
.gs-item .ln{color:var(--muted);margin-right:8px}
/* AI */
.ai-acts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.ai-acts .btn{border:1px solid var(--border)}
.ai-out{min-height:200px;font-family:Consolas,'Microsoft JhengHei',monospace}
/* 簡報 */
.slideshow{position:fixed;inset:0;background:var(--bg);z-index:3000;display:none;flex-direction:column}
.slideshow.show{display:flex}
.slide-stage{flex:1;overflow:auto;display:flex;padding:40px 30px}
.slide{width:min(1150px,94vw);margin:auto;font-size:22px}
.slide h1{font-size:2.2em}.slide h2{font-size:1.7em}
.slide .dg-body{max-height:62vh}
.slide-bar{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px;background:var(--bg2);border-top:1px solid var(--border);font-size:13px}
.slide-prog{height:3px;background:var(--bg3)}
.slide-prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
/* 提示 */

<script>
'use strict';
// ================= 基礎工具 =================
const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const unesc = s => String(s ?? '').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&');
function hash(s){ let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
const fmtDT = t => t ? new Date(t).toLocaleString('zh-TW', {hour12:false, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'}) : '';
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const safeName = s => String(s).replace(/[\\/:*?"<>|]/g, '_').trim() || '未命名';
const baseName = n => String(n).replace(/\.(md|markdown|txt)$/i, '');
const mdName = n => /\.md$/i.test(n) ? n : n + '.md';
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const slugId = s => String(s).trim().toLowerCase().replace(/[^\w\u3400-\u9fff\u3040-\u30ff\uac00-\ud7af-]+/g, '-').replace(/^-+|-+$/g, '') || 'sec';
function download(name, data, type){
  const blob = data instanceof Blob ? data : new Blob([data], {type: type || 'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function toast(msg, type){
  const t = document.createElement('div'); t.className = 'toast ' + (type || 'info'); t.textContent = msg;
  $('#toastBox').appendChild(t); setTimeout(() => t.remove(), 3200);
}
const editor = $('#editor');

// ================= 儲存（IndexedDB，失敗退回 localStorage） =================
const DB = {
  db: null, failed: false,
  open(){ return new Promise((res, rej) => { const r = indexedDB.open('md-editor-v2', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => rej(r.error); }); },
  get(k){ if (this.failed) { try { return Promise.resolve(JSON.parse(localStorage.getItem('mdv2_' + k) || 'null')); } catch(e) { return Promise.resolve(null); } }
    return new Promise((res, rej) => { const q = this.db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  set(k, v){ if (this.failed) { localStorage.setItem('mdv2_' + k, JSON.stringify(v)); return Promise.resolve(); }
    return new Promise((res, rej) => { const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
};

// ================= 狀態 =================
const DEF_SETTINGS = {theme:'dark', lineNo:true, sync:true, outline:false, side:true, groqModel:'llama-3.3-70b-versatile', puml:'https://www.plantuml.com/plantuml', snapMin:5, fontSize:14, sort:'updated'};
const COLORS = ['#89b4fa','#a6e3a1','#f9e2af','#fab387','#f38ba8','#cba6f7','#94e2d5','#f5c2e7','#89dceb','#b4befe'];
let S = null;
const viewState = new Map();
function mkProject(name, color){ return {id:uid(), name, color:color || COLORS[0], desc:'', created:Date.now(), updated:Date.now(), docs:[], folders:[], assets:{}, tabs:[], lastDoc:null}; }
function mkDoc(name, content, folder){ return {id:uid(), name:mdName(name), folder:folder || '', content:content || '', created:Date.now(), updated:Date.now(), history:[]}; }
const P = () => S.projects.find(p => p.id === S.curProject);
const D = () => { const p = P(); return p && p.docs.find(d => d.id === S.curDoc); };
function findDoc(id){ for (const p of S.projects) { const d = p.docs.find(x => x.id === id); if (d) return {p, d}; } return null; }
function uniqueName(p, name, folder, exceptId){
  name = mdName(safeName(name)); let n = name, i = 2;
  while (p.docs.some(d => d.id !== exceptId && d.name === n && (d.folder || '') === (folder || ''))) n = baseName(name) + ' (' + (i++) + ').md';
  return n;
}
let saveT = null;
function persist(){
  clearTimeout(saveT);
  saveT = setTimeout(async () => {
    try { await DB.set('state', S); $('#statSave').textContent = '💾 已自動儲存 ' + new Date().toLocaleTimeString('zh-TW', {hour12:false}); }
    catch(e) { $('#statSave').textContent = '⚠ 儲存失敗'; toast('儲存失敗：' + e.message, 'error'); }
  }, 500);
}
function snapshot(d, label){
  if (d.history.length && d.history[0].content === d.content) return false;
  d.history.unshift({t:Date.now(), label:label || '自動', content:d.content});
  if (d.history.length > 30) d.history.length = 30;
  persist(); return true;
}
function autoSnapshot(d){
  const last = d.history[0] ? d.history[0].t : 0;
  if (Date.now() - last > (S.settings.snapMin || 5) * 60000) snapshot(d, '自動');
}

// ================= 編輯器操作（保留復原紀錄） =================
function replaceRange(s, e, txt){
  const top = editor.scrollTop;
  editor.focus(); editor.setSelectionRange(s, e);
  const before = editor.value;
  let ok = txt === '' ? document.execCommand('delete') : document.execCommand('insertText', false, txt);
  if (!ok || editor.value === before && (txt !== '' || s !== e)) {
    editor.setRangeText(txt, s, e, 'end');
    editor.dispatchEvent(new Event('input'));
  }
  editor.scrollTop = top;
}
const lineStart = (v, i) => v.lastIndexOf('\n', i - 1) + 1;
const lineEnd = (v, i) => { const k = v.indexOf('\n', i); return k < 0 ? v.length : k; };
function lineOffset(v, n){ let off = 0; for (let i = 0; i < n; i++) { const k = v.indexOf('\n', off); if (k < 0) return v.length; off = k + 1; } return off; }
function insertAtCursor(txt){ replaceRange(editor.selectionStart, editor.selectionEnd, txt); }
function insertBlock(txt){
  const v = editor.value, s = editor.selectionStart;
  const pre = s === 0 || v[s-1] === '\n' ? (s > 1 && v[s-2] !== '\n' ? '\n' : '') : '\n\n';
  replaceRange(s, editor.selectionEnd, pre + txt.replace(/^\n+/, '').replace(/\n*$/, '\n'));
}
function setDocContent(d, content){
  const cur = D();
  if (cur && cur.id === d.id) replaceRange(0, editor.value.length, content);
  else { d.content = content; d.updated = Date.now(); persist(); renderSide(); }
}

// ================= Markdown 管線 =================
const PAIRS_FENCE = /^[ \t]*(`{3,}|~{3,})[^\n]*\n[\s\S]*?^[ \t]*\1[ \t]*$/gm;
function outsideFences(src, fn){
  let out = '', last = 0, m; PAIRS_FENCE.lastIndex = 0;
  while ((m = PAIRS_FENCE.exec(src))) { out += fn(src.slice(last, m.index)) + m[0]; last = m.index + m[0].length; }
  return out + fn(src.slice(last));
}
const keepLines = m => '\n'.repeat((m.match(/\n/g) || []).length);
function prepare(raw, assets){
  const dgs = [], fn = {defs:{}, order:[]};
  let src = raw.replace(/^[ \t]*(`{3,}|~{3,})[ \t]*(mermaid|plantuml|puml|markmap)[^\n]*\n([\s\S]*?)^[ \t]*\1[ \t]*$/gim, (m, f, type, code) => {
    type = type.toLowerCase(); if (type === 'puml') type = 'plantuml';
    dgs.push({type, code:code.replace(/\s+$/, '')});
    return '<div data-dg="' + (dgs.length - 1) + '"></div>' + keepLines(m);
  });
  src = outsideFences(src, seg => seg
    .replace(/^@start(uml|mindmap|gantt|wbs|json|yaml|salt)\b[^\n]*\n[\s\S]*?^@end\1[ \t]*$/gim, m => { dgs.push({type:'plantuml', code:m.trim()}); return '<div data-dg="' + (dgs.length - 1) + '"></div>' + keepLines(m); })
    .replace(/^\[\^([^\]\s]+)\]:[ \t]+(.+)$/gm, (m, id, txt) => { fn.defs[id] = txt; return ''; })
    .replace(/^[ \t]*\[TOC\][ \t]*$/gmi, '<div class="toc-ph"></div>'));
  src = outsideFences(src, seg => seg.replace(/\[\^([^\]\s]+)\](?!:)/g, (m, id) => {
    if (!(id in fn.defs)) return m;
    let n = fn.order.indexOf(id); if (n < 0) { fn.order.push(id); n = fn.order.length - 1; }
    return '<sup class="fn-ref"><a href="#fn-' + slugId(id) + '">' + (n + 1) + '</a></sup>';
  }));
  if (assets) src = src.replace(/asset:\/\/([\w-]+)/g, (m, id) => assets[id] ? assets[id].data : m);
  return {src, dgs, fn};
}
function katexRender(tex, display){
  if (!window.katex) return '<code>' + esc(tex) + '</code>';
  try { return katex.renderToString(tex, {displayMode:display, throwOnError:false}); } catch(e) { return '<code>' + esc(tex) + '</code>'; }
}
function setupMarked(){
  marked.use({gfm:true, breaks:true, extensions:[
    {name:'mathBlock', level:'block', start(src){ const i = src.indexOf('$$'); return i < 0 ? undefined : i; },
      tokenizer(src){ const m = /^\$\$([\s\S]+?)\$\$[ \t]*(?:\n|$)/.exec(src); if (m) return {type:'mathBlock', raw:m[0], text:m[1].trim()}; },
      renderer(t){ return '<div class="math-block">' + katexRender(t.text, true) + '</div>'; }},
    {name:'mathInline', level:'inline', start(src){ const i = src.indexOf('$'); return i < 0 ? undefined : i; },
      tokenizer(src){
        let m = /^\$\$([^$]+?)\$\$/.exec(src); if (m) return {type:'mathInline', raw:m[0], text:m[1], display:true};
        m = /^\$(?!\s)((?:\\\$|[^$\n])+?)(?<!\s)\$(?!\d)/.exec(src); if (m) return {type:'mathInline', raw:m[0], text:m[1]};
      },
      renderer(t){ return katexRender(t.text, !!t.display); }},
    {name:'mark', level:'inline', start(src){ const i = src.indexOf('=='); return i < 0 ? undefined : i; },
      tokenizer(src){ const m = /^==(?!\s)([^=\n]+?)==/.exec(src); if (m) return {type:'mark', raw:m[0], text:m[1], tokens:this.lexer.inlineTokens(m[1])}; },
      renderer(t){ return '<mark>' + this.parser.parseInline(t.tokens) + '</mark>'; }}
  ]});
}
const ALERTS = {note:'ℹ️ 注意', tip:'💡 提示', important:'❗ 重要', warning:'⚠️ 警告', caution:'🛑 小心'};
async function renderInto(box, raw, opts){
  opts = opts || {};
  const {src, dgs, fn} = prepare(raw, opts.assets);
  let html = '';
  try {
    const tokens = marked.lexer(src); let line = 0;
    for (const tok of tokens) {
      const n = (tok.raw.match(/\n/g) || []).length;
      if (tok.type !== 'space') { const arr = [tok]; arr.links = tokens.links; html += '<div class="blk" data-line="' + line + '">' + marked.parser(arr) + '</div>'; }
      line += n;
    }
  } catch(e) { html = '<pre>' + esc(e.message) + '</pre>'; }
  if (fn.order.length) html += '<section class="footnotes"><hr><ol>' + fn.order.map(id => '<li id="fn-' + slugId(id) + '">' + marked.parseInline(fn.defs[id]) + '</li>').join('') + '</ol></section>';
  html = window.DOMPurify ? DOMPurify.sanitize(html, {ADD_ATTR:['target'], FORBID_TAGS:['style','script']}) : html;
  const old = new Map();
  if (opts.reuse) box.querySelectorAll('.dg[data-key]').forEach(el => { const k = el.dataset.key; if (!old.has(k)) old.set(k, []); old.get(k).push(el); });

function parseTasks(content){
  const res = []; let inF = null;
  content.split('\n').forEach((l, i) => {
    const f = l.match(/^\s*(`{3,}|~{3,})/);
    if (f) { if (!inF) inF = f[1][0]; else if (f[1][0] === inF) inF = null; return; }
    if (inF) return;
    const m = l.match(/^(\s*(?:>\s*)*)(?:[-*+]|\d+[.)])\s+\[([ xX])\]\s+(.*)$/); if (!m) return;
    const text = m[3];
    const due = (text.match(/(?:📅|due:)\s*(\d{4}-\d{2}-\d{2})/) || [])[1] || '';
    const start = (text.match(/(?:🛫|start:)\s*(\d{4}-\d{2}-\d{2})/) || [])[1] || '';
    const who = [...text.matchAll(/(?:^|\s)@([^\s@#]+)/g)].map(x => x[1]);
    const tags = [...text.matchAll(/(?:^|\s)#([^\s#]+)/g)].map(x => x[1]);
    const pri = (text.match(/(?:^|\s)!(高|中|低)/) || [])[1] || '';
    const title = text.replace(/(?:📅|🛫|due:|start:)\s*\d{4}-\d{2}-\d{2}/g, '').replace(/(^|\s)[@#][^\s@#]+/g, '$1').replace(/(^|\s)!(高|中|低)/g, '$1').trim() || text;
    res.push({line:i, done:m[2] !== ' ', text, title, due, start, who, tags, pri});
  });
  return res;
}

  refreshSideSoon();
}

async function importZip(file){
  if (!window.JSZip) throw new Error('JSZip 未載入');
  const zip = await JSZip.loadAsync(file);
  if (zip.file('_project.json')) return importJSON(JSON.parse(await zip.file('_project.json').async('string')));
  const p = mkProject(baseName(file.name.replace(/\.zip$/i, '')), COLORS[S.projects.length % COLORS.length]);
  const assetMap = {};
  const entries = Object.values(zip.files).filter(f => !f.dir);
  for (const f of entries) {
    if (/\.(png|jpe?g|gif|webp|svg)$/i.test(f.name)) {
      const ext = f.name.split('.').pop().toLowerCase(), mime = ext === 'svg' ? 'image/svg+xml' : 'image/' + (ext === 'jpg' ? 'jpeg' : ext);
      const id = uid(); p.assets[id] = {name:f.name.split('/').pop(), data:'data:' + mime + ';base64,' + await f.async('base64')}; assetMap[f.name.split('/').pop()] = id;
    }

  for (const f of entries) {
    if (!/\.(md|markdown|txt)$/i.test(f.name)) continue;
    const parts = f.name.split('/'); const name = parts.pop(); const folder = parts.join('/');
    let c = await f.async('string');
    c = c.replace(/\]\(((?:\.\.?\/)*(?:[^)\s]*\/)?([^)\/\s]+\.(?:png|jpe?g|gif|webp|svg)))\)/gi, (m, path, fn) => assetMap[fn] ? '](asset://' + assetMap[fn] + ')' : m);
    p.docs.push(mkDoc(name, c, folder)); if (folder) p.folders.push(folder);
  }

  S.projects.push(p); return p;
}
async function handleImport(files, folder){
  let lastDoc = null, lastProj = null, n = 0;
  for (const f of files) {
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    try {
      if (['md', 'markdown', 'txt'].includes(ext)) { const p = P(); const d = mkDoc(uniqueName(p, baseName(f.name), folder || ''), await f.text(), folder || ''); p.docs.push(d); lastDoc = d; n++; }
      else if (ext === 'json') { lastProj = await importJSON(JSON.parse(await f.text())); n++; }
      else if (ext === 'zip') { lastProj = await importZip(f); n++; }
      else if (f.type.startsWith('image/')) { await addImageFile(f); n++; }
    } catch(e) { toast(f.name + ' 匯入失敗：' + e.message, 'error'); }
  }
  if (lastDoc) openDoc(lastDoc.id); else if (lastProj) switchProject(lastProj.id); else renderSide();
  fillProjects(); persist(); if (n) toast('已匯入 ' + n + ' 個檔案', 'success');

// 圖片素材
function compressImage(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const data = r.result;
      if (file.type === 'image/svg+xml' || file.type === 'image/gif') return res(data);
      const img = new Image();
      img.onload = () => {
        const max = 1920; if (img.width <= max && data.length < 1.6e6) return res(data);
        const sc = Math.min(1, max / img.width), cv = document.createElement('canvas');
        cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        res(file.type === 'image/png' && data.length < 3e6 ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg', 0.88));
      };
      img.onerror = () => res(data); img.src = data;
    };
    r.onerror = () => rej(r.error); r.readAsDataURL(file);
  });
}
async function addImageFile(file){
  if (!file) return;
  const data = await compressImage(file), id = uid(), p = P();
  p.assets = p.assets || {}; p.assets[id] = {name:file.name || 'image.png', data};
  insertAtCursor('![' + baseName((file.name || '圖片').replace(/\.\w+$/, '')) + '](asset://' + id + ')');
  persist();
}

  let del = 0; cnt.forEach(c => del += c); return {add, del};
}

  const td = today(), cols = {over:[], todo:[], done:[]};
  ts.forEach(t => { if (t.done) cols.done.push(t); else if (t.due && t.due < td) cols.over.push(t); else cols.todo.push(t); });
  const byDue = (a, b) => (a.due || '9999') < (b.due || '9999') ? -1 : (a.due || '9999') > (b.due || '9999') ? 1 : ({'高':0, '中':1, '低':2}[a.pri] ?? 1) - ({'高':0, '中':1, '低':2}[b.pri] ?? 1);

    const i = tbList.push(t) - 1, over = !t.done && t.due && t.due < td;

  };
  const col = (title, color, list) => '<div class="bcol"><h5><span style="color:' + color + '">' + title + '</span><span class="muted">' + list.length + '</span></h5>' + (list.map(card).join('') || '<div class="muted">—</div>') + '</div>';

  const total = ts.length, done = cols.done.length, pct = total ? Math.round(done / total * 100) : 0;
  $('#tbStats').innerHTML = '<div class="pm-bar big"><i style="width:' + pct + '%"></i></div><span>完成 ' + done + '/' + total + '（' + pct + '%）· 逾期 ' + cols.over.length + '</span>';
}

function imgToPng(src){
  return new Promise((res, rej) => {
    const img = new Image(); img.crossOrigin = 'anonymous';
    img.onload = () => { const cv = document.createElement('canvas'); cv.width = img.naturalWidth || 600; cv.height = img.naturalHeight || 400; const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(img, 0, 0); try { cv.toBlob(b => b ? b.arrayBuffer().then(buf => res({buf, w:cv.width, h:cv.height})) : rej(new Error('x')), 'image/png'); } catch(e) { rej(e); } };
    img.onerror = () => rej(new Error('圖片載入失敗')); img.src = src;
  });
}
async function exportDocx(){
  if (!window.docx) return toast('docx 函式庫未載入', 'error');
  toast('產生 Word 中…');
  const X = window.docx, d = D();
  await renderPreview();
  const {src, dgs} = prepare(editor.value, P().assets);
  const liveByKey = {}; $$('#pv .dg').forEach(el => liveByKey[el.dataset.key] = el);
  const tokens = marked.lexer(src);
  const fit = (w, h) => { const mw = 600; return w > mw ? {width:mw, height:Math.round(h * mw / w)} : {width:Math.round(w), height:Math.round(h)}; };
  const imgPara = (buf, w, h) => new X.Paragraph({alignment:X.AlignmentType.CENTER, children:[new X.ImageRun({data:buf, transformation:fit(w, h)})]});
  const inl = async (toks, st) => {
    st = st || {}; const runs = [];
    for (const t of toks || []) {
      switch (t.type) {
        case 'strong': runs.push(...await inl(t.tokens, Object.assign({}, st, {bold:true}))); break;
        case 'em': runs.push(...await inl(t.tokens, Object.assign({}, st, {italics:true}))); break;
        case 'del': runs.push(...await inl(t.tokens, Object.assign({}, st, {strike:true}))); break;
        case 'mark': runs.push(...await inl(t.tokens, Object.assign({}, st, {highlight:'yellow'}))); break;
        case 'codespan': runs.push(new X.TextRun(Object.assign({}, st, {text:unesc(t.text), font:'Consolas', shading:{type:X.ShadingType.CLEAR, fill:'EEEEEE', color:'auto'}}))); break;
        case 'link': runs.push(new X.ExternalHyperlink({link:t.href, children:[new X.TextRun(Object.assign({}, st, {text:unesc(t.text), style:'Hyperlink'}))]})); break;
        case 'br': runs.push(new X.TextRun({break:1})); break;
        case 'image': runs.push(new X.TextRun(Object.assign({}, st, {text:'[' + (t.text || '圖片') + ']'}))); break;
        case 'mathInline': runs.push(new X.TextRun(Object.assign({}, st, {text:t.text, italics:true, font:'Cambria Math'}))); break;
        case 'html': { const tx = t.raw.replace(/<sup class="fn-ref"><a[^>]*>(\d+)<\/a><\/sup>/g, '[$1]').replace(/<[^>]+>/g, ''); if (tx) runs.push(new X.TextRun(Object.assign({}, st, {text:unesc(tx)}))); break; }
        case 'text': if (t.tokens && t.tokens.length) runs.push(...await inl(t.tokens, st)); else runs.push(new X.TextRun(Object.assign({}, st, {text:unesc(t.text)}))); break;
        default: if (t.text) runs.push(new X.TextRun(Object.assign({}, st, {text:unesc(t.text)})));
      }
    }
    return runs;
  };
  const out = [];
  const blocks = async (toks, level, quote) => {
    for (const t of toks) {
      const ind = quote ? {left:600} : undefined;
      switch (t.type) {
        case 'heading': out.push(new X.Paragraph({heading:X.HeadingLevel['HEADING_' + Math.min(6, t.depth)], children:await inl(t.tokens)})); break;
        case 'paragraph': {
          const imgs = t.tokens.filter(x => x.type === 'image');
          if (imgs.length && t.tokens.every(x => x.type === 'image' || x.type === 'br' || (x.type === 'text' && !x.text.trim()))) {
            for (const im of imgs) { try { const r = await imgToPng(im.href); out.push(imgPara(r.buf, r.w, r.h)); } catch(e) { out.push(new X.Paragraph({children:[new X.TextRun('[圖片：' + (im.text || im.href) + ']')]})); } }
          } else out.push(new X.Paragraph({children:await inl(t.tokens), indent:ind}));
          break;
        }
        case 'text': out.push(new X.Paragraph({children:await inl(t.tokens || [{type:'text', text:t.text}]), indent:ind})); break;
        case 'list':
          for (let k = 0; k < t.items.length; k++) {
            const it = t.items[k]; let first = true;
            for (const sub of it.tokens) {
              if (first && (sub.type === 'text' || sub.type === 'paragraph')) {
                const runs = await inl(sub.tokens || [{type:'text', text:sub.text}]);
                if (it.task) runs.unshift(new X.TextRun(it.checked ? '☑ ' : '☐ '));
                if (t.ordered) { runs.unshift(new X.TextRun(((+t.start || 1) + k) + '. ')); out.push(new X.Paragraph({children:runs, indent:{left:360 * (level + 1)}})); }
                else out.push(new X.Paragraph({children:runs, bullet:{level:Math.min(level, 8)}}));
                first = false;
              } else if (sub.type === 'list') await blocks([sub], level + 1, quote);
              else if (sub.type !== 'space') await blocks([sub], level, quote);
            }
          }
          break;
        case 'code': t.text.split('\n').forEach(l => out.push(new X.Paragraph({spacing:{after:0}, shading:{type:X.ShadingType.CLEAR, fill:'F3F4F6', color:'auto'}, children:[new X.TextRun({text:l || ' ', font:'Consolas', size:19})]}))); out.push(new X.Paragraph('')); break;
        case 'blockquote': await blocks(t.tokens, level, true); break;
        case 'table': {
          const cell = async (c, head) => new X.TableCell({children:[new X.Paragraph({children:await inl(c.tokens, head ? {bold:true} : {})})], shading:head ? {type:X.ShadingType.CLEAR, fill:'E8EEF7', color:'auto'} : undefined});
          const rows = [new X.TableRow({tableHeader:true, children:await Promise.all(t.header.map(c => cell(c, true)))})];
          for (const r of t.rows) rows.push(new X.TableRow({children:await Promise.all(r.map(c => cell(c, false)))}));
          out.push(new X.Table({width:{size:100, type:X.WidthType.PERCENTAGE}, rows})); out.push(new X.Paragraph('')); break;
        }
        case 'hr': out.push(new X.Paragraph({border:{bottom:{style:X.BorderStyle.SINGLE, size:6, color:'999999', space:1}}})); break;
        case 'mathBlock': out.push(new X.Paragraph({alignment:X.AlignmentType.CENTER, children:[new X.TextRun({text:t.text, italics:true, font:'Cambria Math'})]})); break;
        case 'html': {
          const m = t.raw.match(/data-dg="(\d+)"/);
          if (m) {
            const dg = dgs[+m[1]], el = dg && liveByKey[dg.type + ':' + hash(dg.code) + ':' + S.settings.theme];

          } else if (!/toc-ph/.test(t.raw)) { const tx = t.raw.replace(/<[^>]+>/g, '').trim(); if (tx) out.push(new X.Paragraph(unesc(tx))); }
          break;
        }
        case 'space': break;
        default: if (t.text) out.push(new X.Paragraph(unesc(t.text)));
      }
    }
  };
  try {
    await blocks(tokens, 0, false);
    const doc = new X.Document({creator:'Markdown 編輯器 v2', title:baseName(d.name), styles:{default:{document:{run:{font:'Microsoft JhengHei', size:22}}}}, sections:[{children:out}]});
    download(safeName(baseName(d.name)) + '.docx', await X.Packer.toBlob(doc)); toast('已匯出 Word', 'success');

}

    '<div class="ai-acts">' + Object.entries(AI_ACTIONS).map(([k, a]) => '<button class="btn sm" data-ai="' + k + '">' + a.label + '</button>').join('') + '</div>' +

      try {

        if (fence) out = '```' + fence + '\n' + stripFence(out) + '\n```';
        else if (/^```(markdown|md)?\n[\s\S]*```$/.test(out.trim())) out = stripFence(out);

async function aiFixDiagram(el){

// ================= 簡報模式 =================
let slides = [], slideIdx = 0;
function splitSlides(src){
  const out = []; let cur = [], inF = null;
  src.split('\n').forEach(l => {
    const f = l.match(/^\s*(`{3,}|~{3,})/);
    if (f) { if (!inF) inF = f[1][0]; else if (f[1][0] === inF) inF = null; }
    if (!inF && !f && /^---\s*$/.test(l)) { out.push(cur.join('\n')); cur = []; } else cur.push(l);
  });
  out.push(cur.join('\n')); return out.filter(s => s.trim());
}
function startSlides(){
  slides = splitSlides(editor.value); if (!slides.length) return toast('文件是空的', 'error');
  slideIdx = 0; $('#slideshow').classList.add('show'); renderSlide();
  if (slides.length === 1) toast('提示：用單獨一行 --- 分隔每一頁');
}
async function renderSlide(){
  $('#slideNo').textContent = (slideIdx + 1) + ' / ' + slides.length;
  $('#slideProg').style.width = ((slideIdx + 1) / slides.length * 100) + '%';
  await renderInto($('#slide'), slides[slideIdx], {assets:P().assets});
  $('#slideStage').scrollTop = 0;
}
function slideGo(d){ const n = slideIdx + d; if (n < 0 || n >= slides.length) return; slideIdx = n; renderSlide(); }
function slideFull(){ if (document.fullscreenElement) document.exitFullscreen(); else $('#slideshow').requestFullscreen && $('#slideshow').requestFullscreen(); }
function stopSlides(){ $('#slideshow').classList.remove('show'); if (document.fullscreenElement) document.exitFullscreen(); }

// ================= 設定 / 主題 / 檢視 =================
async function openSettings(){
  const v = await ask('⚙ 設定', [
    {id:'key', label:'Groq API Key（只存在本機瀏覽器）', type:'password', value:getKey(), ph:'gsk_…'},
    {id:'model', label:'Groq 模型', value:S.settings.groqModel, ph:'llama-3.3-70b-versatile / openai/gpt-oss-120b / moonshotai/kimi-k2-instruct'},
    {id:'puml', label:'PlantUML 伺服器', value:S.settings.puml},
    {id:'snap', label:'自動快照間隔（分鐘）', type:'number', value:String(S.settings.snapMin)},
    {id:'fs', label:'編輯器字級（px）', type:'number', value:String(S.settings.fontSize)}
  ], '儲存');
  if (!v) return;
  try { localStorage.setItem('mdv2_groq', v.key.trim()); } catch(e) {}
  S.settings.groqModel = v.model.trim() || 'llama-3.3-70b-versatile';
  const pumlChanged = S.settings.puml !== v.puml.trim();
  S.settings.puml = v.puml.trim() || DEF_SETTINGS.puml;
  S.settings.snapMin = Math.max(1, +v.snap || 5);
  S.settings.fontSize = Math.min(28, Math.max(10, +v.fs || 14));
  applySettings(); computeLines(); persist();
  if (pumlChanged) { $('#pv').innerHTML = ''; renderPreview(); }
  toast('設定已儲存', 'success');
}
function applySettings(){
  const st = S.settings, b = document.body;
  b.classList.toggle('no-ln', !st.lineNo); b.classList.toggle('no-side', !st.side); b.classList.toggle('show-outline', !!st.outline);
  $('#bLn').classList.toggle('active', !!st.lineNo); $('#bSync').classList.toggle('active', !!st.sync);
  $('#bOutline').classList.toggle('active', !!st.outline); $('#bSide').classList.toggle('active', !!st.side);
  document.documentElement.style.setProperty('--efs', st.fontSize + 'px');
}
function toggleSetting(k){ S.settings[k] = !S.settings[k]; applySettings(); persist(); if (k === 'lineNo' || k === 'side' || k === 'outline') setTimeout(computeLines, 30); if (k === 'sync' && S.settings.sync) syncFromEditor(); }
function applyTheme(){ document.documentElement.dataset.theme = S.settings.theme; initMermaid(); }
function toggleTheme(){ S.settings.theme = S.settings.theme === 'light' ? 'dark' : 'light'; applyTheme(); persist(); renderPreview(); }
function setView(mode){
  document.body.classList.remove('view-edit', 'view-preview');
  if (mode === 'edit') document.body.classList.add('view-edit'); else if (mode === 'preview') document.body.classList.add('view-preview');
  ['Split', 'Edit', 'Preview'].forEach(n => $('#btn' + n).classList.toggle('active', n.toLowerCase() === mode));
  setTimeout(computeLines, 30);
}

// ================= 全域事件 =================
function bindGlobal(){
  // 分隔線 + 圖表平移
  let dragging = false, pan = null;
  $('#resizer').addEventListener('mousedown', e => { e.preventDefault(); dragging = true; $('#resizer').classList.add('drag'); document.body.style.cursor = 'col-resize'; document.body.style.userSelect = 'none'; });
  document.addEventListener('mousedown', e => {
    const body = e.target.closest && e.target.closest('.dg-body'); if (!body || e.button !== 0 || e.target.closest('button')) return;
    const dg = body.closest('.dg'); if (dg.dataset.type === 'markmap') return;
    const z = getZ(dg); pan = {dg, body, x:e.clientX - z.x, y:e.clientY - z.y}; body.classList.add('panning'); dg.querySelector('.dg-stage').style.transition = 'none'; e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (dragging) { const left = $('#editorPane').getBoundingClientRect().left, total = $('#main').getBoundingClientRect().right; $('#editorPane').style.width = Math.max(250, Math.min(e.clientX - left, total - left - 260)) + 'px'; }
    if (pan) { const z = getZ(pan.dg); z.x = e.clientX - pan.x; z.y = e.clientY - pan.y; applyZ(pan.dg); }
  });
  document.addEventListener('mouseup', () => {
    if (dragging) { dragging = false; $('#resizer').classList.remove('drag'); document.body.style.cursor = ''; document.body.style.userSelect = ''; computeLines(); }
    if (pan) { pan.body.classList.remove('panning'); pan.dg.querySelector('.dg-stage').style.transition = ''; pan = null; }
  });
  document.addEventListener('wheel', e => {
    const body = e.target.closest && e.target.closest('.dg-body'); if (!body || !e.ctrlKey) return;
    const dg = body.closest('.dg'); if (dg.dataset.type === 'markmap') return;
    e.preventDefault(); zoomBy(dg, e.deltaY < 0 ? 0.1 : -0.1);
  }, {passive:false});
  // 圖表按鈕 / 預覽互動
  document.addEventListener('click', e => {
    const a = e.target.closest('.dg [data-a]'); if (a) { e.preventDefault(); return diagramAction(a.closest('.dg'), a.dataset.a); }
    const cp = e.target.closest('.code-copy');
    if (cp) { const code = cp.parentElement.querySelector('code'); navigator.clipboard.writeText(code ? code.innerText : '').then(() => { cp.textContent = '已複製'; setTimeout(() => cp.textContent = '複製', 1200); }); }
  });
  $('#pv').addEventListener('click', e => {
    const cb = e.target.closest('input[type=checkbox][data-ti]');
    if (cb) { const t = parseTasks(editor.value)[+cb.dataset.ti]; if (t) toggleTaskLine(D(), t.line); return; }
    const a = e.target.closest('a[href^="#"]');
    if (a) { e.preventDefault(); const id = decodeURIComponent(a.getAttribute('href').slice(1)); const el = id && document.getElementById(id); el && el.scrollIntoView({behavior:'smooth', block:'start'}); }
  });
  $('#pv').addEventListener('dblclick', e => {
    if (e.target.closest('.dg-bar,input,a')) return;
    const b = e.target.closest('.blk'); if (!b) return;
    lockPv = Date.now() + 300; gotoLine(+b.dataset.line);
  });
  // 拖放匯入
  let dragDepth = 0;
  window.addEventListener('dragenter', e => { if (e.dataTransfer.types.includes('Files')) { dragDepth++; $('#dropMask').classList.add('show'); } });
  window.addEventListener('dragleave', e => { if (e.dataTransfer.types.includes('Files') && --dragDepth <= 0) { dragDepth = 0; $('#dropMask').classList.remove('show'); } });
  window.addEventListener('dragover', e => { if (e.dataTransfer.types.includes('Files')) e.preventDefault(); });
  window.addEventListener('drop', e => {
    if (!e.dataTransfer.types.includes('Files')) return;
    e.preventDefault(); dragDepth = 0; $('#dropMask').classList.remove('show');
    const files = [...e.dataTransfer.files]; if (!files.length) return;
    const imgs = files.filter(f => f.type.startsWith('image/')), others = files.filter(f => !f.type.startsWith('image/'));
    if (imgs.length) { if (e.target === editor) { const pos = editor.selectionStart; editor.setSelectionRange(pos, pos); } imgs.forEach(f => addImageFile(f)); }
    if (others.length) { const fRow = e.target.closest && e.target.closest('.tr-folder'); handleImport(others, fRow ? fRow.dataset.folder : ''); }
  });
  $('#importInput').addEventListener('change', e => { const fs = [...e.target.files]; e.target.value = ''; if (fs.length) handleImport(fs); });
  $('#imageInput').addEventListener('change', e => { const fs = [...e.target.files]; e.target.value = ''; fs.forEach(f => addImageFile(f)); });
  $('#projSel').addEventListener('change', e => switchProject(e.target.value));
  $('#docFilter').addEventListener('input', debounce(renderTree, 150));
  // 搜尋列
  $('#searchInput').addEventListener('input', () => doSearch());
  $('#searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); e.shiftKey ? findPrev() : findNext(); setTimeout(() => $('#searchInput').focus(), 0); } if (e.key === 'Escape') toggleSearch(); });
  $('#replaceInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); replaceOne(); } });
  // 快捷鍵
  document.addEventListener('keydown', e => {
    const slideOn = $('#slideshow').classList.contains('show');
    if (slideOn) {
      if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); slideGo(1); }
      else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); slideGo(-1); }
      else if (e.key === 'Home') { slideIdx = 0; renderSlide(); }
      else if (e.key === 'End') { slideIdx = slides.length - 1; renderSlide(); }
      else if (e.key === 'Escape' && !document.fullscreenElement) stopSlides();
      else if (e.key.toLowerCase() === 'f') slideFull();
      return;
    }
    if (e.key === 'Escape' && modalStack.length) { closeModal(); return; }
    const mod = e.ctrlKey || e.metaKey; if (!mod) return;
    const k = e.key.toLowerCase();
    if (k === 's') { e.preventDefault(); const d = D(); if (d) { snapshot(d, '手動'); persist(); toast('💾 已儲存並建立快照', 'success'); } }
    else if (k === 'o') { e.preventDefault(); openImport(); }
    else if (k === 'f' && e.shiftKey) { e.preventDefault(); openGSearch(); }
    else if (k === 'f') { e.preventDefault(); if (!$('#searchBar').classList.contains('show')) toggleSearch(); else { $('#searchInput').focus(); $('#searchInput').select(); } }
  });
  window.addEventListener('beforeunload', () => { clearTimeout(saveT); if (S) DB.set('state', S); });
  window.addEventListener('resize', debounce(computeLines, 120));
}
